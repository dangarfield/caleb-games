<head>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  %%FONTS_LINK%%
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { min-height: 100vh; background: #f3ecdf; color: #1f1a14; font-family: 'Bricolage Grotesque', system-ui, sans-serif; padding: 40px clamp(16px, 4vw, 56px) 32px; overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }

    .hub-head { max-width: 1240px; margin: 0 auto 30px; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
    h1 { font-weight: 800; font-size: clamp(2.4rem, 5vw, 3.5rem); line-height: .95; letter-spacing: -.035em; }
    .subtitle { font-weight: 500; font-size: 1.25rem; color: #7a6e5e; margin-top: 6px; }
    .count { font-weight: 800; font-size: 15px; background: #e7dcc8; border-radius: 999px; padding: 10px 18px; }

    .game-grid { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px; }
    .gc { position: relative; height: 210px; border-radius: 24px; overflow: hidden; background: var(--bg); padding: 20px 22px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; box-shadow: 0 8px 30px var(--glow), 0 2px 8px rgba(0,0,0,.2); transition: transform .2s ease, box-shadow .2s ease; user-select: none; -webkit-user-select: none; }
    .gc:hover, .gc:focus-visible { transform: translateY(-4px) scale(1.03); box-shadow: 0 12px 40px var(--glow-hover), 0 4px 12px rgba(0,0,0,.3); }
    .gc:active { transform: scale(.97); }
    .gc-icon { position: absolute; right: -12px; top: -14px; font-size: 104px; line-height: 1; transform: rotate(-10deg); filter: drop-shadow(0 6px 10px rgba(0,0,0,.3)); }
    .gc-icon img { display: block; width: 118px; height: 118px; object-fit: contain; }
    .gc-new { position: absolute; top: 14px; left: 14px; font-weight: 800; font-size: 12px; letter-spacing: .08em; background: #fff; color: #1f1a14; padding: 5px 11px; border-radius: 999px; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
    .gc-new[hidden] { display: none; }
    .gc-title { position: relative; line-height: 1.05; max-width: 88%; }
    .gc-wordmark { display: block; max-width: 100%; max-height: 64px; }
    .gc-blurb { position: relative; font-weight: 500; font-size: 14px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .footer {
      margin-top: 3rem;
      color: rgba(255,255,255,0.3);
      font-size: 0.85rem;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .settings-icon {
      cursor: pointer;
      opacity: 0.4;
      transition: opacity 0.2s;
      font-size: 1rem;
    }
    .settings-icon:hover { opacity: 0.8; }
    #settingsPanel {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,0.85);
      padding: 1.5rem;
      overflow-y: auto;
      flex-direction: column;
      align-items: center;
    }
    #settingsPanel.active { display: flex; }
    .settings-box {
      background: #1e2a3a;
      border-radius: 12px;

      max-width: 700px;
      width: 100%;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .settings-header h2 { color: #fff; font-size: 1.2rem; }
    .settings-close {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
      opacity: 0.6;
    }
    .settings-close:hover { opacity: 1; }
    .data-section {
      margin-bottom: 1rem;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      overflow: hidden;
    }
    .data-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(255,255,255,0.05);
      cursor: pointer;
    }
    .data-section-header:hover { background: rgba(255,255,255,0.08); }
    .data-section-title {
      color: #a0c4ff;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .data-section-actions { display: flex; gap: 8px; align-items: center; }
    .data-clear-btn {
      background: #e74c3c;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
    }
    .data-clear-btn:hover { background: #c0392b; }
    .data-clear-btn.confirm { background: #c0392b; animation: pulse 0.5s ease-in-out infinite alternate; }
    @keyframes pulse { to { transform: scale(1.05); } }
    .data-section-body {
      display: none;
      padding: 10px 14px;
      max-height: 400px;
      overflow-y: auto;
    }
    .data-section.expanded .data-section-body { display: block; }
    .json-tree { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.75rem; color: #ddd; }
    .json-key { color: #a0c4ff; }
    .json-string { color: #a6e3a1; }
    .json-number { color: #f9e2af; }
    .json-bool { color: #f38ba8; }
    .json-null { color: #6c7086; }
    .json-toggle { cursor: pointer; user-select: none; color: #888; margin-right: 4px; }
    .json-toggle:hover { color: #fff; }
    .json-nested { margin-left: 1.2rem; }
    .json-nested.collapsed { display: none; }
    .json-line { line-height: 1.6; white-space: nowrap; }
    .no-data { color: rgba(255,255,255,0.4); font-style: italic; padding: 1rem; text-align: center; }

    .footer { color: #9a8e7c; justify-content: center; max-width: 1240px; margin: 3rem auto 0; }

    @media (max-width: 600px) {
      .game-grid { grid-template-columns: 1fr; gap: 18px; }
    }
  </style>
</head>
<body>
  <header class="hub-head">
    <div>
      <h1>Garfield Boys' Arcade</h1>
      <p class="subtitle">Pick a game and have fun!</p>
    </div>
    <div class="count">%%COUNT%% games</div>
  </header>

  <main class="game-grid">
%%CARDS%%
  </main>

  <div class="footer">Made with love for Caleb and Ezra <span class="settings-icon" onclick="openSettings()">&#9881;</span></div>

  <div id="settingsPanel">
    <div class="settings-box">
      <div class="settings-header">
        <h2>Game Data</h2>
        <button class="settings-close" onclick="closeSettings()">&times;</button>
      </div>
      <div id="settingsContent"></div>
    </div>
  </div>

  <script>
    // NEW badge: shown for games added in the last %%NEW_DAYS%% days. Worked out on the device, so it expires on its own.
    (function () {
      var ms = %%NEW_DAYS%% * 864e5, now = Date.now();
      document.querySelectorAll('.gc[data-added]').forEach(function (a) {
        var t = Date.parse(a.getAttribute('data-added'));
        if (!isNaN(t) && now - t < ms) a.querySelector('.gc-new').hidden = false;
      });
    })();
  </script>
  <script>
// Port 3000 is shared with whatever else is being worked on, and a service
// worker registered there by another project keeps control of this origin —
// including the arcade. It intercepts every request and throws on the 206
// Partial Content responses the browser asks for when it streams audio
// ("Failed to execute 'put' on 'Cache'"). No arcade page registers a worker,
// so any worker controlling this one is foreign: retire it and reload, once.
(function () {
    var sw = navigator.serviceWorker;
    if (!sw || !sw.controller) return;
    try {
        if (sessionStorage.getItem('arcadeSwRetired')) return;
        sessionStorage.setItem('arcadeSwRetired', '1');
    } catch (e) { return; }
    sw.getRegistrations()
        .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
        .then(function () { location.reload(); })
        .catch(function () {});
})();

    // Settings panel
    function openSettings() {
      document.getElementById('settingsPanel').classList.add('active');
      renderSettings();
    }
    function closeSettings() {
      document.getElementById('settingsPanel').classList.remove('active');
    }
    var keyLabels = {
      'calebArcadeData': 'Arcade Shared Data',
      'raceMaker_savedTracks': 'Race Maker — Saved Tracks',
      '2048_best': '2048 — Best Score',
      'archers-map-last': 'Archers — Last Map',
      'bubbleshooter_played': 'Bubble Shooter — Play Count',
      'driftRacerData': 'Drift Racer — Save Data',
      'happyglass-levels': 'Happy Glass — Custom Levels',
      'happyglass-lastEditLevel': 'Happy Glass — Last Edited',
      'maze-completed': 'Maze — Completed Levels',
      'racer13_diff': 'Racer 13 — Difficulty',
      'rps-custom-sets': 'RPS — Custom Icon Sets',
      'cameraIndex': 'Camera Index',
    };
    // localStorage is ONE quota (~5 MB of UTF-16 characters) for the whole site, shared by
    // every game, and when it fills up NOTHING can save — Domino Rally reported exactly that.
    // So this panel shows what each game is using: without the sizes, "clear an old game to
    // make room" is advice you cannot act on.
    // In CHARACTERS, the unit the browser quotes its own limit in: "5 MB" of localStorage is
    // ~5 million characters, so counting characters is what makes this comparable to it.
    function fmtSize(chars) {
      var kb = chars / 1024;
      return kb >= 1024 ? (kb / 1024).toFixed(1) + ' MB' : Math.max(1, Math.round(kb)) + ' KB';
    }
    function sizeTag(chars) {
      return '<span style="margin-left:8px;font-size:0.7rem;color:rgba(255,255,255,0.4);">' +
        fmtSize(chars) + '</span>';
    }
    /* A readable name for a key: the shared-object sub-keys already read well; per-game items are
       "calebArcadeData:<game>[:<sub>]" in both localStorage and the IndexedDB store. */
    function prettyKey(key) {
      if (keyLabels[key]) return keyLabels[key];
      var m = /^calebArcadeData:([^:]+)(?::(.+))?$/.exec(key);
      return m ? m[1] + (m[2] ? ' — ' + m[2] : '') : key;
    }
    function groupHead(text, note) {
      return '<div style="margin:14px 0 4px;padding:6px 8px;color:rgba(255,255,255,0.5);font-size:0.75rem;text-transform:uppercase;letter-spacing:0.5px;">' +
        text + (note ? '<span style="text-transform:none;letter-spacing:0;margin-left:8px;color:rgba(255,255,255,0.35);">' + note + '</span>' : '') + '</div>';
    }
    function sectionHtml(id, title, key, size, clearCall, body) {
      var h = '<div class="data-section" id="section-' + id + '">';
      h += '<div class="data-section-header" onclick="toggleSection(\'' + id + '\')">';
      h += '<span class="data-section-title">' + escHtml(title) + '</span>';
      if (key && key !== title) h += '<span style="margin-left:8px;font-size:0.7rem;color:rgba(255,255,255,0.3);">' + escHtml(key) + '</span>';
      h += sizeTag(size);
      h += '<div class="data-section-actions"><button class="data-clear-btn" onclick="event.stopPropagation();' + clearCall + '">Clear</button></div></div>';
      h += '<div class="data-section-body"><div class="json-tree">' + body + '</div></div></div>';
      return h;
    }
    function jsArg(s) { return escHtml(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

    function renderSettings() {
      var content = document.getElementById('settingsContent');
      var used = 0;
      for (var u = 0; u < localStorage.length; u++) {
        var uk = localStorage.key(u);
        used += uk.length + (localStorage.getItem(uk) || '').length;
      }
      var html = '<div style="margin-bottom:10px;padding:8px 10px;border-radius:8px;' +
        'background:rgba(108,92,231,0.18);font-size:0.8rem;color:rgba(255,255,255,0.75);">' +
        'localStorage: <b>' + fmtSize(used) + '</b> of about 5 MB — the browser\'s limit ' +
        'for the whole arcade. When it is full, no game can save; clear one below to make room. ' +
        'Newer games save to the arcade database (IndexedDB) instead, which has far more room.' +
        '</div>';

      var allKeys = [];
      for (var i = 0; i < localStorage.length; i++) allKeys.push(localStorage.key(i));
      var shared = allKeys.filter(function (k) { return k === 'calebArcadeData'; });
      var perGame = allKeys.filter(function (k) { return k.indexOf('calebArcadeData:') === 0; }).sort();
      var other = allKeys.filter(function (k) { return k !== 'calebArcadeData' && k.indexOf('calebArcadeData:') !== 0; })
        .sort(function (a, b) { return prettyKey(a).localeCompare(prettyKey(b)); });

      // 1. The legacy shared object: one section per game inside it
      shared.forEach(function (key) {
        var raw = localStorage.getItem(key), val;
        try { val = JSON.parse(raw); } catch (e) { val = raw; }
        if (val && typeof val === 'object' && !Array.isArray(val)) {
          var subKeys = Object.keys(val).sort();
          if (!subKeys.length) return;
          html += groupHead('Arcade shared data (legacy)', 'localStorage · calebArcadeData · ' + fmtSize(raw.length));
          subKeys.forEach(function (sk) {
            html += sectionHtml('arcade_' + sk.replace(/[^a-zA-Z0-9]/g, '_'), sk, '',
              JSON.stringify(val[sk] === undefined ? null : val[sk]).length,
              "confirmClearSubKey('" + jsArg(sk) + "', this)", renderJson(val[sk]));
          });
        } else {
          html += groupHead('Arcade shared data (legacy)');
          html += sectionHtml('ls_calebArcadeData', 'Arcade Shared Data', key, key.length + (raw || '').length,
            "confirmClearKey('calebArcadeData', this)", renderJson(val));
        }
      });
      // 2. Per-game localStorage items and 3. everything else in localStorage
      [[perGame, 'Per-game saves', 'localStorage · calebArcadeData:&lt;game&gt;'], [other, 'Other localStorage keys', '']].forEach(function (g) {
        if (!g[0].length) return;
        html += groupHead(g[1], g[2]);
        g[0].forEach(function (key) {
          var raw = localStorage.getItem(key), val;
          try { val = JSON.parse(raw); } catch (e) { val = raw; }
          html += sectionHtml('ls_' + key.replace(/[^a-zA-Z0-9]/g, '_'), prettyKey(key), key, key.length + (raw || '').length,
            "confirmClearKey('" + jsArg(key) + "', this)", renderJson(val));
        });
      });
      // 4. The IndexedDB arcade store — filled in once the database answers
      html += '<div id="idbSettings">' + groupHead('Arcade database (IndexedDB)', 'loading…') + '</div>';
      content.innerHTML = html;
      renderIdbSettings();
    }

    /* The IndexedDB side: database "arcade", object store "kv" — the same one every game's
       arcade-store.js uses (games/dragonseed/js/store.js is the reference copy). Opened here
       directly and closed straight after, so the hub never holds a connection a game waits on. */
    var idbValues = {};
    function idbOpen(cb) {
      var req;
      try { req = indexedDB.open('arcade', 1); } catch (e) { return cb(null); }
      req.onupgradeneeded = function () { try { req.result.createObjectStore('kv'); } catch (e) {} };
      req.onsuccess = function () { cb(req.result); };
      req.onerror = req.onblocked = function () { cb(null); };
    }
    function idbAll(cb) {
      idbOpen(function (db) {
        if (!db) return cb(null);
        var out = [], r;
        try { r = db.transaction('kv', 'readonly').objectStore('kv').openCursor(); }
        catch (e) { db.close(); return cb([]); }
        r.onsuccess = function () {
          var c = r.result;
          if (c) { out.push({ key: String(c.key), value: c.value }); c.continue(); return; }
          db.close(); cb(out);
        };
        r.onerror = function () { db.close(); cb(out); };
      });
    }
    function idbDelete(key, cb) {
      idbOpen(function (db) {
        if (!db) return cb(false);
        try {
          var tx = db.transaction('kv', 'readwrite');
          tx.objectStore('kv').delete(key);
          tx.oncomplete = function () { db.close(); cb(true); };
          tx.onerror = function () { db.close(); cb(false); };
        } catch (e) { db.close(); cb(false); }
      });
    }
    function renderIdbSettings() {
      var box = document.getElementById('idbSettings');
      idbAll(function (items) {
        if (!box) return;
        if (items === null) { box.innerHTML = groupHead('Arcade database (IndexedDB)', 'not available in this browser window'); return; }
        idbValues = {};
        var total = 0, h = '';
        items.sort(function (a, b) { return prettyKey(a.key).localeCompare(prettyKey(b.key)); });
        items.forEach(function (it, n) {
          var size = -1;
          try { size = JSON.stringify(it.value).length; } catch (e) {}
          total += Math.max(0, size);
          idbValues[it.key] = it.value;
          var id = 'idb_' + n;
          // bodies can be big (whole replays, ship designs): render the tree only when opened
          h += sectionHtml(id, prettyKey(it.key), it.key, Math.max(0, size),
            "confirmClearIdb('" + jsArg(it.key) + "', this)",
            '<span class="json-null" data-idb="' + escHtml(it.key) + '">…</span>');
        });
        box.innerHTML = groupHead('Arcade database (IndexedDB)', items.length ? fmtSize(total) + ' · a game left open in another tab can write its save back after you clear it' : '') +
          (h || '<div class="no-data">Nothing saved in the arcade database yet.</div>');
      });
    }
    function confirmClearIdb(key, btn) {
      if (btn.classList.contains('confirm')) {
        idbDelete(key, function () { renderSettings(); });
      } else {
        btn.classList.add('confirm');
        btn.textContent = 'Confirm?';
        setTimeout(function() { btn.classList.remove('confirm'); btn.textContent = 'Clear'; }, 3000);
      }
    }
    function toggleSection(sectionId) {
      var sec = document.getElementById('section-' + sectionId);
      sec.classList.toggle('expanded');
      var lazy = sec.querySelector('[data-idb]');
      if (lazy && sec.classList.contains('expanded')) {
        var k = lazy.getAttribute('data-idb');
        lazy.parentNode.innerHTML = renderJson(idbValues[k] === undefined ? null : idbValues[k]);
      }
    }
    function confirmClearKey(key, btn) {
      if (btn.classList.contains('confirm')) {
        localStorage.removeItem(key);
        renderSettings();
      } else {
        btn.classList.add('confirm');
        btn.textContent = 'Confirm?';
        setTimeout(function() { btn.classList.remove('confirm'); btn.textContent = 'Clear'; }, 3000);
      }
    }
    function confirmClearSubKey(subKey, btn) {
      if (btn.classList.contains('confirm')) {
        var data = JSON.parse(localStorage.getItem('calebArcadeData') || '{}');
        delete data[subKey];
        localStorage.setItem('calebArcadeData', JSON.stringify(data));
        renderSettings();
      } else {
        btn.classList.add('confirm');
        btn.textContent = 'Confirm?';
        setTimeout(function() { btn.classList.remove('confirm'); btn.textContent = 'Clear'; }, 3000);
      }
    }
    function renderJson(val, depth) {
      depth = depth || 0;
      if (val === null) return '<span class="json-null">null</span>';
      if (typeof val === 'boolean') return '<span class="json-bool">' + val + '</span>';
      if (typeof val === 'number') return '<span class="json-number">' + val + '</span>';
      if (typeof val === 'string') return '<span class="json-string">"' + escHtml(val) + '"</span>';
      if (Array.isArray(val)) {
        if (val.length === 0) return '<span>[]</span>';
        var id = 'jt' + Math.random().toString(36).substr(2,8);
        var out = '<span class="json-toggle" onclick="this.textContent=this.textContent===\'▸\'?\'▾\':\'▸\';document.getElementById(\'' + id + '\').classList.toggle(\'collapsed\')">▾</span>[';
        out += '<div class="json-nested" id="' + id + '">';
        val.forEach(function(item, i) {
          out += '<div class="json-line">' + renderJson(item, depth+1) + (i < val.length-1 ? ',' : '') + '</div>';
        });
        out += '</div>]';
        return out;
      }
      if (typeof val === 'object') {
        var ks = Object.keys(val);
        if (ks.length === 0) return '<span>{}</span>';
        var id = 'jt' + Math.random().toString(36).substr(2,8);
        var collapsed = depth > 1 ? ' collapsed' : '';
        var arrow = depth > 1 ? '▸' : '▾';
        var out = '<span class="json-toggle" onclick="this.textContent=this.textContent===\'▸\'?\'▾\':\'▸\';document.getElementById(\'' + id + '\').classList.toggle(\'collapsed\')">' + arrow + '</span>{';
        out += '<div class="json-nested' + collapsed + '" id="' + id + '">';
        ks.forEach(function(k, i) {
          out += '<div class="json-line"><span class="json-key">"' + escHtml(k) + '"</span>: ' + renderJson(val[k], depth+1) + (i < ks.length-1 ? ',' : '') + '</div>';
        });
        out += '</div>}';
        return out;
      }
      return String(val);
    }
    function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  </script>
</body>
</html>
