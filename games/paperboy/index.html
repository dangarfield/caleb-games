<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Paperboy - Garfield Boys' Arcade</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anta&display=swap" rel="stylesheet">
<style>
/* One typeface, and the boy's own colours: cap yellow, shirt blue, bike red,
   basket orange, newsprint. Every block on screen is made of these. */
:root {
    --yellow: #ffed00;
    --blue: #6c9ee6;
    --red: #d94242;
    --orange: #ffba00;
    --paper: #f2efe4;
    --ink: #14161a;
    --font: 'Anta', system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
/* Black until there is something to look at. The scene renders from the first
   frame — sky-blue clear colour, the fallback ground, the planner's boxes —
   long before the level lands, so the canvas is held invisible over the black
   body and faded in once the boy, the street and the week are all in. It still
   renders underneath, which warms the shaders up before anyone sees it. */
body { background: #000; overflow: hidden; font-family: var(--font); touch-action: none; }
canvas { display: block; opacity: 0; transition: opacity .7s ease; }
canvas.ready { opacity: 1; }
.off { display: none !important; }

/* --- chips: back to the arcade, pause, quit --- */
.chip {
    font: 15px/1 var(--font); letter-spacing: .06em; color: var(--ink);
    background: var(--paper); border: none; border-radius: 10px;
    padding: 9px 16px; cursor: pointer; text-decoration: none;
    box-shadow: 0 3px 0 rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.3);
}
.chip:hover { background: #fff; }
.chip.icon { padding: 9px 14px; font-size: 16px; }
/* Above the overlays: the way out of the game is always there to click. */
#backBtn { position: fixed; top: 14px; left: 14px; z-index: 80; }
#topRight { position: fixed; top: 14px; right: 14px; z-index: 60; display: flex; gap: 8px; }

/* --- the corner blocks: square to the left edge, rounded away from it --- */
#hud {
    position: fixed; left: 0; top: 62px; z-index: 55;
    display: flex; flex-direction: column; align-items: flex-start; gap: 7px;
    pointer-events: none;
}
.blk {
    display: flex; align-items: center; gap: 10px;
    background: var(--yellow); color: var(--ink);
    padding: 8px 18px 8px 14px; border-radius: 0 12px 12px 0;
    box-shadow: 0 4px 0 rgba(0,0,0,.28), 0 8px 20px rgba(0,0,0,.28);
    letter-spacing: .08em; line-height: 1;
}
.blk .lbl { font-size: 12px; opacity: .72; }
.blk .val { font-size: 26px; }
.blk-day { background: var(--blue); color: #fff; font-size: 17px; padding: 7px 18px 7px 14px; }
.blk-lives { background: var(--red); padding: 9px 18px 9px 14px; }
/* Lives are his caps, not a number. A spent one stays as a dark ghost so the
   row does not jump about as they go. */
.hats { display: flex; gap: 6px; align-items: center; }
.hat { display: block; width: 20px; height: 12px; color: var(--yellow); }
.hat svg { display: block; width: 100%; height: 100%; }
.hat.gone { color: rgba(0, 0, 0, .3); }
.blk-papers { background: var(--orange); padding: 8px 16px 8px 14px; }
.pips { display: grid; grid-template-columns: repeat(4, 12px); gap: 4px; }
.pip {
    width: 12px; height: 8px; border-radius: 2px; background: var(--paper);
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.18);
}
.pip.spent { background: rgba(0,0,0,.22); box-shadow: none; }

/* --- "NO PAPERS!", beside the bag --- */
#hud .row { display: flex; align-items: center; gap: 8px; }
.tag {
    font-size: 13px; letter-spacing: .08em; color: #fff;
    background: var(--red); padding: 6px 12px; border-radius: 8px;
    box-shadow: 0 3px 0 rgba(0,0,0,.28);
    opacity: 0; visibility: hidden;
}
.tag.show { visibility: visible; animation: flash 0.38s steps(1, end) 4; }
@keyframes flash { 0%, 60% { opacity: 1; } 61%, 100% { opacity: 0; } }

/* --- touch pads: steering bottom left, speed bottom right ---
   Above the black curtain, so they can ease in over the GET READY. Each side
   comes in from its own edge, and a beat after the banner, so the three arrive
   in sequence rather than together. */
#pads {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 59;
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: clamp(12px, 3vw, 24px); pointer-events: none;
}
.pad {
    display: flex; gap: 18px; opacity: 0;
    transition: transform .5s cubic-bezier(.55, -.3, .8, .4), opacity .3s ease;
}
.pad-l { transform: translateX(-170%); }
.pad-r { flex-direction: column; transform: translateX(170%); }
#pads.in .pad {
    opacity: 1; transform: none;
    transition: transform .6s cubic-bezier(.28, 1.6, .5, 1), opacity .3s ease;
}
#pads.in .pad-l { transition-delay: .18s; }
#pads.in .pad-r { transition-delay: .34s; }
.padBtn {
    /* Twice the size they were: thumbs on a tablet, not a mouse. The vw term
       grows more slowly than the doubled floor so the left pair and the right
       column still clear each other on a narrow phone. */
    width: clamp(116px, 22vw, 152px);
    /* Three of these stack on the right, so the height also yields to a short
       viewport — a phone in landscape would otherwise push the last one off. */
    height: min(clamp(108px, 19vw, 136px), 26vh);
    display: flex; align-items: center; justify-content: center;
    font: 34px/1 var(--font); color: var(--ink); border: none; cursor: pointer;
    background: var(--paper); border-radius: 20px;
    box-shadow: 0 6px 0 rgba(0,0,0,.35), 0 10px 24px rgba(0,0,0,.28);
    pointer-events: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent; touch-action: none;
    /* Half transparent so they sit over the street without blocking it. */
    opacity: .5;
}
.padBtn-icon { padding: 0 8px; }
.padBtn svg { width: 60%; height: 60%; display: block; }
#pads.in .padBtn { pointer-events: auto; }
.padBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.35); background: #fff; opacity: 1; }

/* --- GET READY / GO: in from the left with a bounce, out to the right --- */
#banner {
    position: fixed; inset: 0; z-index: 58; display: flex;
    align-items: center; justify-content: center; pointer-events: none;
    visibility: hidden;
}
#banner.on { visibility: visible; }
.bannerBox {
    background: var(--yellow); color: var(--ink);
    font-size: clamp(30px, 7vw, 66px); letter-spacing: .07em;
    padding: 16px 44px; border-radius: 16px;
    box-shadow: 0 8px 0 rgba(0,0,0,.3), 0 18px 44px rgba(0,0,0,.45);
    transform: translateX(-140vw);
    transition: transform .6s cubic-bezier(.28, 1.6, .5, 1);
}
#banner.in .bannerBox { transform: translateX(0); }
#banner.out .bannerBox {
    transform: translateX(140vw);
    transition: transform .5s cubic-bezier(.55, -.3, .8, .4);
}

/* --- the black curtain, under the banner so it reads over it --- */
#fade {
    position: fixed; inset: 0; z-index: 56; background: #000;
    opacity: 0; pointer-events: none; transition: opacity .8s ease;
}
#fade.on { opacity: 1; }

/* --- overlays: the same blocks, stacked --- */
/* Panels arrive and leave like the banner: in from the left with a bounce,
   out to the right. The backdrop just fades, no bounce. */
#overlay {
    position: fixed; inset: 0; z-index: 70; display: flex;
    align-items: center; justify-content: center; padding: 20px;
    visibility: hidden; background: rgba(8, 10, 20, 0); backdrop-filter: blur(0);
    transition: background .45s ease, backdrop-filter .45s ease;
}
#overlay.on { visibility: visible; }
/* The finish card lines up with the corner blocks instead of the middle. */
#overlay.flush { justify-content: flex-start; padding-left: 0; }
.panel.flush { width: min(420px, 92%); border-radius: 0 16px 16px 0; }
#overlay.dim.in { background: rgba(8, 10, 20, .42); backdrop-filter: blur(1.5px); }
.panel {
    width: min(460px, 100%); overflow: hidden; border-radius: 16px;
    background: var(--paper); color: var(--ink);
    box-shadow: 0 10px 0 rgba(0,0,0,.3), 0 24px 60px rgba(0,0,0,.5);
    transform: translateX(-140vw);
    transition: transform .6s cubic-bezier(.28, 1.6, .5, 1);
}
#overlay.in .panel { transform: translateX(0); }
#overlay.out .panel {
    transform: translateX(140vw);
    transition: transform .5s cubic-bezier(.55, -.3, .8, .4);
}
.panel-title {
    padding: 16px 22px; font-size: clamp(24px, 5vw, 38px); letter-spacing: .08em;
}
.tone-yellow { background: var(--yellow); color: var(--ink); }
.tone-blue { background: var(--blue); color: #fff; }
.tone-red { background: var(--red); color: #fff; }
.panel-body { padding: 16px 22px 4px; font-size: 15px; letter-spacing: .04em; }
.panel-body p { margin-bottom: 8px; opacity: .8; }
/* The finish card is a headline and a number, so the number carries weight. */
.panel-body.big { padding: 14px 22px 18px; font-size: clamp(20px, 4vw, 28px); }
.panel-body.big p { margin-bottom: 0; opacity: 1; }
.panel-actions { display: flex; gap: 10px; padding: 16px 22px 22px; flex-wrap: wrap; }
.btn {
    flex: 1 1 140px; font: 17px/1 var(--font); letter-spacing: .07em;
    padding: 14px 18px; border: none; border-radius: 10px; cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,.3);
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.3); }

/* --- home menu: pick a boy --- */
.players { display: flex; gap: 10px; padding: 4px 22px 22px; flex-wrap: wrap; }
.player {
    flex: 1 1 150px; display: flex; flex-direction: column; gap: 6px;
    text-align: left; cursor: pointer; border: none; border-radius: 12px;
    padding: 14px 16px; background: var(--blue); color: #fff;
    font-family: var(--font); box-shadow: 0 4px 0 rgba(0,0,0,.3);
}
.player:nth-child(2) { background: var(--red); }
.player:hover { filter: brightness(1.08); }
.player:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.3); }
.player-name { font-size: 24px; letter-spacing: .08em; }
.player-stat, .player-score { font-size: 12px; letter-spacing: .06em; opacity: .85; }
</style>
</head>
<body>


<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
}
</script>
<script>
// Port 3000 is shared with whatever else is being worked on, and a service
// worker registered there by another project keeps control of this origin —
// including the arcade. It intercepts every request and throws on the 206
// Partial Content responses the browser asks for when it streams audio
// ("Failed to execute 'put' on 'Cache'"). No arcade page registers a worker,
// so any worker controlling this one is foreign: retire it and reload, once.
(function () {
    var sw = navigator.serviceWorker;
    if (!sw || !sw.controller) return;
    try {
        if (sessionStorage.getItem('arcadeSwRetired')) return;
        sessionStorage.setItem('arcadeSwRetired', '1');
    } catch (e) { return; }
    sw.getRegistrations()
        .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
        .then(function () { location.reload(); })
        .catch(function () {});
})();

// Served as /games/paperboy with NO trailing slash, the document base is
// /games/, so every relative URL on this page is wrong by one directory:
// "./src/main.js" becomes /games/src/main.js (404), and the back button's
// "../../index.html" climbs one level too far. Asset URLs inside the modules
// are safe either way — they resolve against import.meta.url — but the page's
// own links are not, so normalise the URL to the directory form first.
//
// GitHub Pages redirects the directory form itself; a dev server may not.
// The module is injected rather than written as a tag so the parser cannot
// preload it against the wrong base while the redirect is in flight.
(function () {
    var path = location.pathname;
    if (!/\/$|\.html?$/.test(path)) {
        location.replace(path + '/' + location.search + location.hash);
        return;
    }
    var base = /\/$/.test(path) ? path : path.replace(/[^/]*$/, '');
    var script = document.createElement('script');
    script.type = 'module';
    script.src = base + 'src/main.js';
    document.head.appendChild(script);
})();
</script>
</body>
</html>
