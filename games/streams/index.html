<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Streams - Garfield Boys' Arcade</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#1a1a2e; overflow:hidden; touch-action:none;
  font-family:'Segoe UI',system-ui,sans-serif; color:#fff; }
#backBtn { position:fixed; top:12px; left:12px; z-index:9999;
  background:rgba(0,0,0,0.55); color:#fff; text-decoration:none;
  padding:6px 18px; border-radius:20px;
  font:bold 15px/1.4 'Segoe UI',system-ui,sans-serif;
  border:1px solid rgba(255,255,255,0.18);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
#backBtn:hover { background:rgba(0,0,0,0.75); }
canvas { display:block; width:100%; height:100%; }
.hidden { display:none !important; }
</style>
</head>
<body>
<a id="backBtn" href="../../index.html">&larr; Games</a>
<canvas id="c"></canvas>
</body>
</html>
<script>
// === STREAMS - Grid Path Puzzle ===
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let _initialized = false;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; if (_initialized) draw(); }
resize(); window.addEventListener('resize', resize);

// === LEVELS ===
// Loaded from currents-source.json
let LEVELS = [];

// Convert JSON puzzle format to internal level format
function convertPuzzle(data, idx) {
  const g = data.grid;
  const walls = [];
  if (g.walls.horizontal) {
    for (const [row, col] of g.walls.horizontal) {
      walls.push({ r1: row, c1: col, r2: row + 1, c2: col });
    }
  }
  if (g.walls.vertical) {
    for (const [row, col] of g.walls.vertical) {
      walls.push({ r1: row, c1: col, r2: row, c2: col + 1 });
    }
  }
  const waypoints = g.gates.map(gate => ({ n: gate.order, r: gate.row, c: gate.col }));
  return {
    size: Math.max(g.width, g.height),
    width: g.width,
    height: g.height,
    title: data.title || `Puzzle ${idx + 1}`,
    waypoints,
    walls,
    solution: g.solutions && g.solutions[0] ? g.solutions[0].map(s => ({ r: s.row, c: s.col })) : null,
  };
}

async function loadPuzzles() {
  try {
    const resp = await fetch('currents-source.json');
    if (!resp.ok) return;
    const data = await resp.json();
    LEVELS = data.map((p, i) => convertPuzzle(p, i));
  } catch (e) { console.warn('Failed to load puzzles:', e); }
  if (_initialized) draw();
}
loadPuzzles();

// === STATE ===
let state = 'menu'; // menu, levelSelect, playing, won
let currentPlayer = null;
let currentLevel = 0;
let level = null;
let path = []; // [{r,c}, ...]
let dragging = false;
let nextWaypoint = 1;
let hintCell = null;
let hintTimer = 0;
let hintCooldown = 0;
const HINT_COOLDOWN_MS = 15000;
let pointerX = 0, pointerY = 0; // current pointer position for goo stretch
let winAnim = 0; // 0 = not animating, >0 = timestamp started
let streamPhase = 0; // for flowing animation

// === PERSISTENCE ===
function loadArcadeData() {
  try { return JSON.parse(localStorage.getItem('calebArcadeData'))||{}; } catch(e) { return {}; }
}
function saveArcadeData(d) { localStorage.setItem('calebArcadeData', JSON.stringify(d)); }
function getPlayerData(name) {
  const d = loadArcadeData();
  if (!d.streams) d.streams = {};
  if (!d.streams[name]) { d.streams[name] = { highest: 1 }; saveArcadeData(d); }
  return d.streams[name];
}
function savePlayerData(name, pd) {
  const d = loadArcadeData(); if (!d.streams) d.streams = {};
  d.streams[name] = pd; saveArcadeData(d);
}

// === AUDIO ===
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if (audioCtx.state==='suspended') audioCtx.resume(); return audioCtx;
}
function playTone(f,dur,type,vol) {
  const ctx=ensureAudio(),o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type||'sine'; o.frequency.value=f;
  g.gain.setValueAtTime(vol||0.08,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
  o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
}
function sfxMove() { playTone(400+path.length*20, 0.06, 'sine', 0.06); }
function sfxWaypoint() { playTone(800,0.15,'triangle',0.1); setTimeout(()=>playTone(1000,0.1,'triangle',0.08),80); }
function sfxWin() { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,0.2,'triangle',0.1),i*100)); }
function sfxUndo() { playTone(250,0.05,'square',0.04); }
function sfxError() { playTone(150,0.2,'sawtooth',0.08); setTimeout(()=>playTone(120,0.15,'sawtooth',0.06),100); }

let errorFlash = 0; // timestamp when error started

// === GRID HELPERS ===
function isWall(r1,c1,r2,c2) {
  if (!level) return false;
  return level.walls.some(w =>
    (w.r1===r1&&w.c1===c1&&w.r2===r2&&w.c2===c2)||
    (w.r1===r2&&w.c1===c2&&w.r2===r1&&w.c2===c1)
  );
}
function isAdjacent(r1,c1,r2,c2) {
  return (Math.abs(r1-r2)+Math.abs(c1-c2))===1;
}
function inPath(r,c) { return path.some(p=>p.r===r&&p.c===c); }
function pathIndex(r,c) { return path.findIndex(p=>p.r===r&&p.c===c); }
function getWaypointAt(r,c) {
  return level ? level.waypoints.find(w=>w.r===r&&w.c===c) : null;
}

// === GRID GEOMETRY ===
let gridX, gridY, cellSize;
function calcGrid() {
  if (!level) return;
  const cols = level.width || level.size;
  const rows = level.height || level.size;
  const maxW = W * 0.85;
  const maxH = H * 0.7; // leave room for HUD top area
  cellSize = Math.floor(Math.min(maxW / cols, maxH / rows));
  const gridW = cellSize * cols;
  const gridH = cellSize * rows;
  gridX = Math.floor((W - gridW) / 2);
  gridY = Math.floor((H - gridH) / 2) + 30; // offset down to avoid back button
}
function cellCenter(r, c) {
  return { x: gridX + c*cellSize + cellSize/2, y: gridY + r*cellSize + cellSize/2 };
}
function cellFromPos(px, py) {
  const cols = level.width || level.size;
  const rows = level.height || level.size;
  const c = Math.floor((px - gridX) / cellSize);
  const r = Math.floor((py - gridY) / cellSize);
  if (r<0||r>=rows||c<0||c>=cols) return null;
  return {r, c};
}

// === DRAWING ===
function draw() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);
  if (state === 'menu') drawMenu();
  else if (state === 'levelSelect') drawLevelSelect();
  else if (state === 'playing' || state === 'won') drawGame();
}

function drawMenu() {
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.min(60, W*0.1)}px 'Segoe UI',sans-serif`;
  ctx.fillText('Streams', W/2, H*0.25);
  ctx.font = `${Math.min(22, W*0.04)}px sans-serif`;
  ctx.fillStyle = '#a0c4ff';
  ctx.fillText('Connect the flow', W/2, H*0.32);

  // Player buttons
  const bw = Math.min(180, W*0.35), bh = 60, gap = 20;
  const bx1 = W/2 - bw - gap/2, bx2 = W/2 + gap/2, by = H*0.45;
  ['Caleb','Ezra'].forEach((name, i) => {
    const bx = i===0 ? bx1 : bx2;
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    roundRect(ctx, bx, by, bw, bh, 12);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = `bold 20px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(name, bx+bw/2, by+28);
    const pd = getPlayerData(name);
    ctx.font = '12px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText(`Level ${pd.highest}`, bx+bw/2, by+48);
  });
  // Store button rects for click
  window._menuBtns = [
    {x:bx1,y:by,w:bw,h:bh,player:'Caleb'},
    {x:bx2,y:by,w:bw,h:bh,player:'Ezra'},
  ];
}

function drawLevelSelect() {
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd32a';
  ctx.font = 'bold 24px sans-serif';
  ctx.fillText(currentPlayer, W/2, 50);
  ctx.fillStyle = '#a0c4ff';
  ctx.font = '16px sans-serif';
  ctx.fillText('Select Level', W/2, 75);

  const pd = getPlayerData(currentPlayer);
  const cols = Math.min(5, Math.floor((W-40)/70));
  const btnSize = 55, gap = 10;
  const totalW = cols*(btnSize+gap)-gap;
  const startX = (W-totalW)/2;
  const startY = 100;
  window._levelBtns = [];
  for (let i=0; i<LEVELS.length; i++) {
    const col = i%cols, row = Math.floor(i/cols);
    const x = startX + col*(btnSize+gap);
    const y = startY + row*(btnSize+gap);
    const unlocked = i < pd.highest;
    ctx.fillStyle = unlocked ? '#6c5ce7' : 'rgba(255,255,255,0.1)';
    ctx.beginPath(); roundRect(ctx, x, y, btnSize, btnSize, 10); ctx.fill();
    ctx.fillStyle = unlocked ? '#fff' : 'rgba(255,255,255,0.3)';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(i+1, x+btnSize/2, y+btnSize/2+7);
    if (unlocked) window._levelBtns.push({x,y,w:btnSize,h:btnSize,level:i});
  }
  // Back button
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.beginPath(); roundRect(ctx, 15, 15, 60, 32, 8); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center'; ctx.fillText('← Back', 45, 36);
  window._lsBack = {x:15,y:15,w:60,h:32};
}

function drawGame() {
  if (!level) return;
  calcGrid();
  const cols = level.width || level.size;
  const rows = level.height || level.size;

  // Grid background
  ctx.fillStyle = '#222236';
  ctx.beginPath(); roundRect(ctx, gridX-8, gridY-8, cols*cellSize+16, rows*cellSize+16, 12); ctx.fill();

  // Cell borders
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  for (let r=0; r<=rows; r++) {
    ctx.beginPath(); ctx.moveTo(gridX, gridY+r*cellSize); ctx.lineTo(gridX+cols*cellSize, gridY+r*cellSize); ctx.stroke();
  }
  for (let c=0; c<=cols; c++) {
    ctx.beginPath(); ctx.moveTo(gridX+c*cellSize, gridY); ctx.lineTo(gridX+c*cellSize, gridY+rows*cellSize); ctx.stroke();
  }

  // Walls
  ctx.strokeStyle = '#4488cc';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  for (const w of level.walls) {
    drawWall(w);
  }

  // Draw the path (globule stream)
  if (path.length > 0) drawPath();

  // Empty cell dots (not in path)
  for (let r=0; r<rows; r++) {
    for (let c=0; c<cols; c++) {
      if (!inPath(r,c)) {
        const {x,y} = cellCenter(r,c);
        ctx.strokeStyle = 'rgba(255,255,255,0.25)';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(x, y, cellSize*0.15, 0, Math.PI*2); ctx.stroke();
      }
    }
  }

  // Waypoints
  for (const wp of level.waypoints) {
    const {x,y} = cellCenter(wp.r, wp.c);
    const reached = inPath(wp.r, wp.c) && isWaypointReached(wp);
    const radius = cellSize * 0.28;
    if (reached) {
      ctx.fillStyle = '#2196F3';
      ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
    }
    ctx.font = `bold ${Math.floor(cellSize*0.3)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(wp.n, x, y + cellSize*0.1);
  }

  // Hint highlight
  if (hintCell && performance.now() - hintTimer < 2000) {
    const {x,y} = cellCenter(hintCell.r, hintCell.c);
    const alpha = 0.5 + 0.3*Math.sin(performance.now()*0.01);
    ctx.fillStyle = `rgba(46,204,113,${alpha})`;
    ctx.beginPath(); ctx.arc(x, y, cellSize*0.25, 0, Math.PI*2); ctx.fill();
  }

  // HUD (centered to avoid back button overlap)
  ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
  const hudTitle = level.title ? `${currentLevel+1}. ${level.title}` : `Level ${currentLevel+1}`;
  ctx.fillText(hudTitle, W/2, 30);
  // Hint button with cooldown ring
  const hintX = W-110, hintY = 10, hintW = 45, hintH = 35;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); roundRect(ctx, hintX, hintY, hintW, hintH, 8); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '20px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('💡', hintX+hintW/2, hintY+24);
  // Cooldown ring
  const now = performance.now();
  if (hintCooldown > now) {
    const remaining = (hintCooldown - now) / HINT_COOLDOWN_MS;
    const cx = hintX + hintW/2, cy = hintY + hintH/2;
    const radius = Math.min(hintW, hintH)/2 + 2;
    ctx.strokeStyle = '#ffd32a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, -Math.PI/2, -Math.PI/2 + (1-remaining)*Math.PI*2);
    ctx.stroke();
  }
  // Reset button
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); roundRect(ctx, W-55, 10, 45, 35, 8); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '20px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('↺', W-33, 34);
  // Levels button
  const lvlX = W-165, lvlY = 10, lvlW = 45, lvlH = 35;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); roundRect(ctx, lvlX, lvlY, lvlW, lvlH, 8); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '16px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('☰', lvlX+lvlW/2, lvlY+24);
  window._hudBtns = [
    {x:lvlX,y:lvlY,w:lvlW,h:lvlH,action:'levels'},
    {x:hintX,y:hintY,w:hintW,h:hintH,action:'hint'},
    {x:W-55,y:10,w:45,h:35,action:'reset'},
  ];

  // Error flash (red border when grid full but wrong)
  if (errorFlash && performance.now() - errorFlash < 1000) {
    const t = (performance.now() - errorFlash) / 1000;
    const alpha = (1 - t) * 0.7;
    ctx.strokeStyle = `rgba(231,76,60,${alpha})`;
    ctx.lineWidth = 5;
    ctx.beginPath();
    roundRect(ctx, gridX-12, gridY-12, cols*cellSize+24, rows*cellSize+24, 14);
    ctx.stroke();
    // Shake offset
    const shake = Math.sin(t * 30) * (1 - t) * 4;
    canvas.style.transform = `translateX(${shake}px)`;
    if (t >= 1) canvas.style.transform = '';
  }

  // Win overlay
  if (state === 'won') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#2ecc71';
    ctx.font = `bold ${Math.min(48,W*0.08)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('✓ Complete!', W/2, H/2 - 30);
    ctx.fillStyle = '#6c5ce7';
    ctx.beginPath(); roundRect(ctx, W/2-80, H/2+10, 160, 50, 12); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 18px sans-serif';
    ctx.fillText('Next Level', W/2, H/2+42);
    window._winBtn = {x:W/2-80, y:H/2+10, w:160, h:50};
  }
}

function drawWall(w) {
  // Wall between two adjacent cells — draw thick line on the shared edge
  const {r1,c1,r2,c2} = w;
  let x1,y1,x2,y2;
  if (r1===r2) { // horizontal neighbors — vertical wall
    const wallC = Math.max(c1,c2);
    x1 = gridX + wallC*cellSize;
    y1 = gridY + r1*cellSize + 2;
    x2 = x1;
    y2 = y1 + cellSize - 4;
  } else { // vertical neighbors — horizontal wall
    const wallR = Math.max(r1,r2);
    x1 = gridX + c1*cellSize + 2;
    y1 = gridY + wallR*cellSize;
    x2 = x1 + cellSize - 4;
    y2 = y1;
  }
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
}

function drawPath() {
  if (path.length < 1) return;
  const blobR = cellSize * 0.28;
  const lineW = cellSize * 0.35; // thinner connections
  const time = performance.now() * 0.003;
  streamPhase = time;

  // Get color for a path position
  function getColor(t) {
    const r = Math.floor(30 + t * 10);
    const g = Math.floor(140 + t * 70);
    const b = Math.floor(240 - t * 30);
    return `rgb(${r},${g},${b})`;
  }

  // Draw connections (thinner, with subtle wave)
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (let i = 0; i < path.length - 1; i++) {
    const a = cellCenter(path[i].r, path[i].c);
    const b = cellCenter(path[i + 1].r, path[i + 1].c);
    const t = path.length > 2 ? i / (path.length - 2) : 0;
    ctx.strokeStyle = getColor(t);
    ctx.lineWidth = lineW;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  // Draw blobs at each node (with subtle pulsing for stream feel)
  for (let i = 0; i < path.length; i++) {
    const { x, y } = cellCenter(path[i].r, path[i].c);
    const t = path.length > 1 ? i / (path.length - 1) : 0;
    // Subtle pulse based on position in path (wave traveling along stream)
    const pulse = 1 + 0.06 * Math.sin(streamPhase - i * 0.5);
    const r = blobR * pulse;
    ctx.fillStyle = getColor(t);
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Goo stretch: if dragging, draw a stretchy tendril from last node toward pointer
  if (dragging && path.length > 0) {
    const last = cellCenter(path[path.length - 1].r, path[path.length - 1].c);
    const dx = pointerX - last.x;
    const dy = pointerY - last.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const maxStretch = cellSize * 0.8;
    if (dist > 10 && dist < maxStretch * 1.5) {
      const stretch = Math.min(dist, maxStretch);
      const t = path.length > 1 ? 1 : 0;
      const nx = last.x + (dx / dist) * stretch;
      const ny = last.y + (dy / dist) * stretch;
      // Taper the goo
      const startR = lineW * 0.45;
      const endR = startR * (1 - stretch / (maxStretch * 1.8));
      ctx.strokeStyle = getColor(t);
      ctx.lineWidth = Math.max(4, endR * 2);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(last.x, last.y);
      // Slight curve for organic feel
      const cx1 = last.x + dx * 0.3 + Math.sin(time * 2) * 3;
      const cy1 = last.y + dy * 0.3 + Math.cos(time * 2) * 3;
      ctx.quadraticCurveTo(cx1, cy1, nx, ny);
      ctx.stroke();
      // Blob at tip
      ctx.fillStyle = getColor(t);
      ctx.globalAlpha = 0.6;
      ctx.beginPath();
      ctx.arc(nx, ny, Math.max(3, endR), 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // Win celebration: animate a glow traveling from start to end
  if (winAnim > 0) {
    const elapsed = (performance.now() - winAnim) / 1500; // 1.5s animation
    if (elapsed <= 1) {
      const glowIdx = Math.floor(elapsed * path.length);
      for (let i = Math.max(0, glowIdx - 3); i <= Math.min(path.length - 1, glowIdx + 1); i++) {
        const { x, y } = cellCenter(path[i].r, path[i].c);
        const proximity = 1 - Math.abs(i - glowIdx) / 4;
        ctx.fillStyle = `rgba(255,255,255,${proximity * 0.5})`;
        ctx.beginPath();
        ctx.arc(x, y, blobR * 1.3 * proximity, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
}

function isWaypointReached(wp) {
  // A waypoint is reached if it's in the path at the right sequence position
  const idx = pathIndex(wp.r, wp.c);
  if (idx < 0) return false;
  // Check all waypoints with lower n are earlier in path
  for (const other of level.waypoints) {
    if (other.n < wp.n) {
      const oi = pathIndex(other.r, other.c);
      if (oi < 0 || oi >= idx) return false;
    }
  }
  return true;
}

function checkWin() {
  if (!level) return false;
  const totalCells = (level.width || level.size) * (level.height || level.size);
  // All cells covered
  if (path.length !== totalCells) return false;
  // All waypoints reached in order
  for (const wp of level.waypoints) {
    if (!isWaypointReached(wp)) return false;
  }
  // Path must end at the highest numbered waypoint
  const maxWp = level.waypoints.reduce((a, b) => a.n > b.n ? a : b);
  const last = path[path.length - 1];
  if (last.r !== maxWp.r || last.c !== maxWp.c) return false;
  return true;
}

// === INPUT ===
function handlePointerDown(px, py) {
  if (state === 'menu') {
    for (const b of (window._menuBtns||[])) {
      if (px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h) {
        ensureAudio(); currentPlayer = b.player;
        state = 'levelSelect'; draw(); return;
      }
    }
  } else if (state === 'levelSelect') {
    const lb = window._lsBack;
    if (lb && px>=lb.x&&px<=lb.x+lb.w&&py>=lb.y&&py<=lb.y+lb.h) {
      state = 'menu'; draw(); return;
    }
    for (const b of (window._levelBtns||[])) {
      if (px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h) {
        startLevel(b.level); return;
      }
    }
  } else if (state === 'won') {
    const wb = window._winBtn;
    if (wb && px>=wb.x&&px<=wb.x+wb.w&&py>=wb.y&&py<=wb.y+wb.h) {
      const next = currentLevel + 1;
      if (next < LEVELS.length) startLevel(next);
      else { state = 'levelSelect'; draw(); }
      return;
    }
  } else if (state === 'playing') {
    // HUD buttons
    for (const b of (window._hudBtns||[])) {
      if (px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h) {
        if (b.action==='reset') { path=[]; nextWaypoint=1; hintCell=null; draw(); sfxUndo(); }
        if (b.action==='hint') showHint();
        if (b.action==='levels') { state='levelSelect'; draw(); }
        return;
      }
    }
    // Start or continue drawing
    const cell = cellFromPos(px, py);
    if (!cell) return;
    if (path.length === 0) {
      // Must start at waypoint 1
      const wp1 = level.waypoints.find(w=>w.n===1);
      if (cell.r===wp1.r && cell.c===wp1.c) {
        path.push(cell); nextWaypoint=2; dragging=true; sfxMove(); draw();
      }
    } else {
      // Tapping on existing path cell = undo to that point
      const idx = pathIndex(cell.r, cell.c);
      if (idx >= 0 && idx < path.length-1) {
        path = path.slice(0, idx+1);
        recalcWaypoints();
        sfxUndo(); dragging=true; draw();
      } else if (idx === path.length-1) {
        dragging = true; // continue from end
      }
    }
  }
}

function handlePointerMove(px, py) {
  if (!dragging || state !== 'playing') return;
  const cell = cellFromPos(px, py);
  if (!cell) return;
  const last = path[path.length-1];
  if (!last) return;
  if (cell.r===last.r && cell.c===last.c) return;

  // Check if tracing backward (undo)
  if (path.length >= 2) {
    const prev = path[path.length-2];
    if (cell.r===prev.r && cell.c===prev.c) {
      path.pop();
      recalcWaypoints();
      sfxUndo(); draw(); return;
    }
  }

  // Check valid move: adjacent, no wall, not already in path
  if (!isAdjacent(last.r, last.c, cell.r, cell.c)) return;
  if (isWall(last.r, last.c, cell.r, cell.c)) return;
  if (inPath(cell.r, cell.c)) return;

  // Check waypoint order: if this cell has a waypoint, it must be the next one
  const wp = getWaypointAt(cell.r, cell.c);
  if (wp && wp.n !== nextWaypoint) return;

  path.push(cell);
  if (wp) { nextWaypoint = wp.n + 1; sfxWaypoint(); }
  else sfxMove();
  hintCell = null;
  draw();

  // Check if grid is full
  const totalCells = (level.width || level.size) * (level.height || level.size);
  if (path.length === totalCells) {
    if (checkWin()) {
      state = 'won';
      winAnim = performance.now();
      sfxWin();
      const pd = getPlayerData(currentPlayer);
      if (currentLevel + 1 >= pd.highest) { pd.highest = currentLevel + 2; savePlayerData(currentPlayer, pd); }
      draw();
    } else {
      // Grid full but wrong — flash red and shake
      showError();
    }
  }
}

function handlePointerUp() { dragging = false; }

function recalcWaypoints() {
  nextWaypoint = 1;
  for (const wp of level.waypoints.sort((a,b)=>a.n-b.n)) {
    if (inPath(wp.r, wp.c) && isWaypointReached(wp)) nextWaypoint = wp.n + 1;
  }
}

function showError() {
  sfxError();
  errorFlash = performance.now();
  draw();
}

function showHint() {
  // Check cooldown
  if (performance.now() < hintCooldown) return;
  hintCooldown = performance.now() + HINT_COOLDOWN_MS;

  // Hint follows the stored solution path (the level's true Hamiltonian route),
  // NOT a random open neighbour — a greedy neighbour dead-ends almost immediately
  // on a fill-every-cell puzzle. Find how far the player's path matches the
  // solution as a prefix; then either point at the next correct cell or, if the
  // player has strayed off the true route, point at the cell to trace back to.
  const sol = level.solution;
  if (sol && sol.length) {
    let k = 0; // length of the correct prefix the player has drawn so far
    while (k < path.length && k < sol.length &&
           path[k].r === sol[k].r && path[k].c === sol[k].c) k++;
    if (k === path.length) {
      // On track: highlight the next cell of the solution.
      hintCell = k < sol.length ? { r: sol[k].r, c: sol[k].c } : null;
    } else {
      // Strayed off the solution at index k: highlight the last correct cell so
      // the player traces back to it (tap it to undo to that point).
      hintCell = { r: sol[k - 1].r, c: sol[k - 1].c };
    }
  } else {
    // No solution data (shouldn't happen): fall back to highlighting waypoint 1.
    const wp1 = level.waypoints.find(w=>w.n===1);
    hintCell = wp1 ? { r: wp1.r, c: wp1.c } : null;
  }
  hintTimer = performance.now();
  draw();
}

function startLevel(idx) {
  currentLevel = idx;
  level = LEVELS[idx];
  path = [];
  nextWaypoint = 1;
  dragging = false;
  hintCell = null;
  winAnim = 0;
  state = 'playing';
  calcGrid();
  draw();
}

// === EVENTS ===
canvas.addEventListener('pointerdown', e => { handlePointerDown(e.clientX, e.clientY); });
canvas.addEventListener('pointermove', e => { pointerX=e.clientX; pointerY=e.clientY; handlePointerMove(e.clientX, e.clientY); });
canvas.addEventListener('pointerup', handlePointerUp);
canvas.addEventListener('pointerleave', handlePointerUp);

// === UTIL ===
function roundRect(ctx, x, y, w, h, r) {
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// === ANIMATION LOOP ===
function loop() {
  const now = performance.now();
  // Always redraw during play (stream animation + goo), win animation, hints, cooldown, error
  if (state === 'playing' || state === 'won' ||
      (hintCell && now - hintTimer < 2000) ||
      (hintCooldown > now) ||
      (errorFlash && now - errorFlash < 1000)) {
    draw();
  }
  requestAnimationFrame(loop);
}
loop();

// Initial draw
_initialized = true;
draw();
</script>
