<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Linky - Garfield Boys' Arcade</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    background:linear-gradient(180deg,#0a0a2e 0%,#141452 55%,#1a1a6e 100%);
    overflow:hidden; touch-action:none;
    font-family:'Segoe UI',system-ui,sans-serif; color:#fff;
    user-select:none; -webkit-user-select:none;
  }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  .hidden { display:none !important; }

  #backBtn { position:fixed; top:12px; left:12px; z-index:9999;
    background:rgba(0,0,0,0.55); color:#fff; text-decoration:none;
    padding:6px 18px; border-radius:20px;
    font:bold 15px/1.4 'Segoe UI',system-ui,sans-serif;
    border:1px solid rgba(255,255,255,0.18);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    transition:background 0.2s; }
  #backBtn:hover { background:rgba(0,0,0,0.75); }

  /* Player badge (top-right, tap to switch) */
  #playerBadge { position:fixed; top:12px; right:12px; z-index:9998;
    background:rgba(108,92,231,0.55); color:#fff;
    padding:6px 16px; border-radius:20px; font:bold 14px 'Segoe UI',system-ui,sans-serif;
    border:1px solid rgba(255,255,255,0.2); cursor:pointer;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }

  /* overlay screens */
  .screen { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:rgba(6,6,30,0.82); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
    padding:20px; }
  .screen h1 { font-size:clamp(2.4rem,10vw,4.5rem); margin-bottom:0.3rem;
    text-shadow:0 0 30px rgba(162,155,254,0.7); letter-spacing:2px; }
  .screen .sub { font-size:clamp(1rem,3.4vw,1.4rem); color:#a0c4ff; margin-bottom:1.6rem; }
  .screen .info { font-size:clamp(0.85rem,2.5vw,1.05rem); color:rgba(255,255,255,0.72);
    margin-bottom:1.8rem; max-width:480px; line-height:1.55; }

  .btn { padding:14px 40px; font-size:1.2rem; border:none; border-radius:12px;
    background:linear-gradient(135deg,#6c5ce7,#a29bfe); color:#fff;
    cursor:pointer; font-weight:700; box-shadow:0 4px 20px rgba(108,92,231,0.4);
    transition:transform 0.12s; }
  .btn:hover { transform:scale(1.05); }
  .btn:active { transform:scale(0.95); }

  /* player select */
  .players { display:flex; gap:26px; flex-wrap:wrap; justify-content:center; }
  .btn-player { display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:26px 40px; border-radius:20px; border:3px solid rgba(255,255,255,0.2);
    background:rgba(255,255,255,0.05); cursor:pointer; transition:all 0.18s; color:#fff; }
  .btn-player:hover { transform:scale(1.07); border-color:rgba(108,92,231,0.7);
    background:rgba(108,92,231,0.16); }
  .btn-player:active { transform:scale(0.95); }
  .pa-avatar { font-size:3.4rem; }
  .pa-name { font-size:1.5rem; font-weight:700; }
  .pa-prog { font-size:0.82rem; color:rgba(255,255,255,0.55); }

  /* level map */
  #levelMap .maptitle { font-size:clamp(1.6rem,6vw,2.6rem); margin-bottom:0.2rem;
    text-shadow:0 0 24px rgba(162,155,254,0.6); }
  #levelMap .mapsub { color:#a0c4ff; margin-bottom:1rem; font-size:0.95rem; }
  .levelgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(54px,1fr));
    gap:10px; width:min(560px,92vw); max-height:60vh; overflow-y:auto;
    padding:6px; }
  .lvl { aspect-ratio:1; border-radius:12px; border:2px solid rgba(255,255,255,0.16);
    background:rgba(255,255,255,0.06); color:#fff; font-weight:800; font-size:1.05rem;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    position:relative; transition:transform 0.1s; }
  .lvl.unlocked { background:linear-gradient(135deg,#6c5ce7,#8e7bff);
    box-shadow:0 3px 12px rgba(108,92,231,0.4); }
  .lvl.done { background:linear-gradient(135deg,#2ecc71,#27ae60); }
  .lvl.locked { opacity:0.4; cursor:not-allowed; }
  .lvl:not(.locked):hover { transform:scale(1.08); }
  .lvl:not(.locked):active { transform:scale(0.92); }
  .lvl .star { position:absolute; top:-6px; right:-4px; font-size:0.8rem; }

  /* in-game control bar */
  #controls { position:fixed; left:0; right:0; bottom:0; z-index:15;
    display:flex; gap:8px; justify-content:center; align-items:center;
    padding:10px 8px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,rgba(6,6,30,0.9),rgba(6,6,30,0)); }
  .ctrl { flex:0 0 auto; min-width:64px; padding:12px 14px; border-radius:14px;
    border:1px solid rgba(255,255,255,0.16); background:rgba(255,255,255,0.08);
    color:#fff; font-weight:700; font-size:0.95rem; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:2px; }
  .ctrl:active { transform:scale(0.92); background:rgba(108,92,231,0.3); }
  .ctrl .ci { font-size:1.4rem; }
  .ctrl.hint { background:linear-gradient(135deg,#ffb02a,#ffd32a); color:#4a2c00; border:none; }

  /* win buttons */
  #winButtons { position:fixed; left:0; right:0; bottom:8vh; z-index:25;
    display:flex; gap:14px; justify-content:center; }

  /* selftest output */
  #selftest { position:fixed; inset:0; z-index:99; overflow:auto;
    background:#05061a; color:#cfe; font:12px/1.4 monospace; padding:16px; }
  #selftest h2 { color:#a29bfe; margin-bottom:8px; font-size:16px; }
  #selftest .pass { color:#2ecc71; }
  #selftest .fail { color:#e74c3c; font-weight:bold; }
</style>
</head>
<body>
<a id="backBtn" href="../../index.html">&larr; Games</a>
<div id="playerBadge" class="hidden" onclick="switchPlayer()"></div>
<canvas id="c"></canvas>

<!-- Player select -->
<div id="playerSelect" class="screen">
  <h1>🔗 Linky</h1>
  <div class="sub">Connect the dots. Fill the board.</div>
  <div class="info">Drag from a coloured dot to its twin. Pipes can't cross, and you win only when every dot is joined AND every square is covered!</div>
  <div class="players">
    <button class="btn-player" onclick="pickPlayer('caleb')">
      <span class="pa-avatar">🧢</span>
      <span class="pa-name">Caleb</span>
      <span class="pa-prog" id="progCaleb"></span>
    </button>
    <button class="btn-player" onclick="pickPlayer('ezra')">
      <span class="pa-avatar">⭐</span>
      <span class="pa-name">Ezra</span>
      <span class="pa-prog" id="progEzra"></span>
    </button>
  </div>
</div>

<!-- Level map -->
<div id="levelMap" class="screen hidden">
  <div class="maptitle">Choose a Level</div>
  <div class="mapsub" id="mapSub"></div>
  <div class="levelgrid" id="levelGrid"></div>
</div>

<!-- in-game controls -->
<div id="controls" class="hidden">
  <button class="ctrl hint" onclick="doHint()"><span class="ci">💡</span>Hint</button>
  <button class="ctrl" onclick="doUndo()"><span class="ci">↩️</span>Undo</button>
  <button class="ctrl" onclick="doClear()"><span class="ci">🧹</span>Clear</button>
  <button class="ctrl" onclick="openMap()"><span class="ci">🗺️</span>Levels</button>
</div>

<!-- win buttons -->
<div id="winButtons" class="hidden">
  <button class="btn" id="nextBtn" onclick="doNext()">Next ▶</button>
  <button class="btn" onclick="openMap()" style="background:linear-gradient(135deg,#555,#888)">Levels</button>
</div>

<script src="levels.js"></script>
<script>
// ============================================================ setup
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
window.addEventListener('resize', resize);

const LEVELS = window.LINKY_LEVELS || [];

// ============================================================ audio
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, dur, type, vol, endFreq) {
  try {
    const c = ensureAudio(), o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, c.currentTime);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(Math.max(endFreq, 20), c.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.08, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + dur);
  } catch (e) {}
}
function sfxBlip() { tone(520, 0.06, 'sine', 0.06); }
function sfxConnect() { tone(660, 0.09, 'triangle', 0.09); tone(990, 0.09, 'triangle', 0.05); }
function sfxError() { tone(180, 0.12, 'sawtooth', 0.05, 90); }
function sfxHint() { tone(880, 0.1, 'triangle', 0.08); tone(1320, 0.12, 'triangle', 0.05); }
function sfxWin() {
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.22, 'triangle', 0.09), i * 120));
}

// ============================================================ persistence
function loadArcadeData() {
  try { return JSON.parse(localStorage.getItem('calebArcadeData')) || {}; }
  catch (e) { return {}; }
}
function saveArcadeData(d) { localStorage.setItem('calebArcadeData', JSON.stringify(d)); }
const UNLOCK_ALL = new URLSearchParams(location.search).has('unlock');
function getPlayerData(name) {
  const d = loadArcadeData();
  const l = d.linky || {};
  const p = l[name] || {};
  const unlocked = UNLOCK_ALL ? LEVELS.length : (p.unlocked || 1);
  return { unlocked, completed: p.completed || 0 };
}
function savePlayerData(name, pd) {
  if (UNLOCK_ALL) return; // browsing all levels: don't pollute real progress
  const d = loadArcadeData();
  if (!d.linky) d.linky = {};
  d.linky[name] = pd;
  saveArcadeData(d);
}

// ============================================================ game state
let mode = 'select';        // 'select' | 'map' | 'play' | 'win'
let player = null;
let levelIndex = 0;
let level = null;
let size = 5;
let dotColor = [];          // size x size : color index or -1
let owner = [];             // size x size : color index or -1 (pipe/dot ownership)
let paths = [];             // paths[i] = ordered [ [r,c], ... ] for color i, starts at a dot
let history = [];
let dragging = false;
let dragStart = null;       // {color, cell, kind:'dot'|'mid'}
let pendingInit = false;
let activeColor = -1;
let confetti = [];
let winFlash = 0;

// board layout (recomputed each frame)
let ox = 0, oy = 0, cell = 0;

const key = (r, c) => r * 100 + c;
function grid(fill) { const g = []; for (let r = 0; r < size; r++) { g.push(new Array(size).fill(fill)); } return g; }
function inBounds(r, c) { return r >= 0 && c >= 0 && r < size && c < size; }
function eqCell(a, b) { return a[0] === b[0] && a[1] === b[1]; }
function idxInPath(p, cellRC) { for (let i = 0; i < p.length; i++) if (p[i][0] === cellRC[0] && p[i][1] === cellRC[1]) return i; return -1; }

function recomputeOwner() {
  owner = grid(-1);
  for (let i = 0; i < paths.length; i++) {
    for (const c of paths[i]) owner[c[0]][c[1]] = i;
  }
}
function isComplete(i) {
  const p = paths[i];
  if (p.length < 2) return false;
  const last = p[p.length - 1], first = p[0];
  return dotColor[last[0]][last[1]] === i && !eqCell(last, first);
}
function connectedCount() { let n = 0; for (let i = 0; i < paths.length; i++) if (isComplete(i)) n++; return n; }
function coveredCount() { let n = 0; for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) if (owner[r][c] !== -1) n++; return n; }

// ============================================================ level loading
function loadLevel(idx) {
  levelIndex = idx;
  level = LEVELS[idx];
  size = level.size;
  dotColor = grid(-1);
  level.pairs.forEach((p, i) => {
    dotColor[p.a[0]][p.a[1]] = i;
    dotColor[p.b[0]][p.b[1]] = i;
  });
  paths = level.pairs.map(p => [[p.a[0], p.a[1]]]); // begin at dot A only
  history = [];
  dragging = false; dragStart = null; pendingInit = false; activeColor = -1;
  confetti = []; winFlash = 0;
  recomputeOwner();
  mode = 'play';
  document.getElementById('controls').classList.remove('hidden');
  document.getElementById('winButtons').classList.add('hidden');
}

function pushHistory() {
  history.push(paths.map(p => p.map(c => [c[0], c[1]])));
  if (history.length > 60) history.shift();
}

// ============================================================ drag logic
function cellFromXY(x, y) {
  if (cell <= 0) return null;
  const c = Math.floor((x - ox) / cell), r = Math.floor((y - oy) / cell);
  if (!inBounds(r, c)) return null;
  return [r, c];
}

function startDrag(cellRC) {
  const dc = dotColor[cellRC[0]][cellRC[1]];
  if (dc !== -1) {
    dragStart = { color: dc, cell: cellRC, kind: 'dot' };
    dragging = true; pendingInit = true; activeColor = dc;
    return;
  }
  const o = owner[cellRC[0]][cellRC[1]];
  if (o !== -1) {
    dragStart = { color: o, cell: cellRC, kind: 'mid' };
    dragging = true; pendingInit = true; activeColor = o;
  }
}

function doInit() {
  pushHistory();
  const { color, cell: startCell, kind } = dragStart;
  if (kind === 'dot') {
    paths[color] = [[startCell[0], startCell[1]]];
  } else {
    const p = paths[color];
    const i = idxInPath(p, startCell);
    if (i !== -1) p.length = i + 1;
  }
  recomputeOwner();
  pendingInit = false;
}

// apply a single orthogonal step to `target` (adjacent to active path end)
function applyStep(target) {
  const p = paths[activeColor];
  // retract over own path
  const li = idxInPath(p, target);
  if (li !== -1) {
    if (li === p.length - 1) return true; // same cell
    p.length = li + 1;
    recomputeOwner();
    return true;
  }
  const dc = dotColor[target[0]][target[1]];
  if (dc !== -1 && dc !== activeColor) return false;       // another color's dot: block
  if (isComplete(activeColor)) return false;               // already reached our far dot
  const o = owner[target[0]][target[1]];
  if (o !== -1 && o !== activeColor) {                     // overtake another pipe -> truncate it
    const op = paths[o];
    const oi = idxInPath(op, target);
    if (oi > 0) op.length = oi;
  }
  p.push([target[0], target[1]]);
  recomputeOwner();
  if (isComplete(activeColor)) sfxConnect(); else sfxBlip();
  return true;
}

function walk(a, b) {
  const cells = []; let cur = [a[0], a[1]]; let guard = 0;
  while (!(cur[0] === b[0] && cur[1] === b[1]) && guard++ < 300) {
    if (cur[0] !== b[0]) cur = [cur[0] + Math.sign(b[0] - cur[0]), cur[1]];
    else cur = [cur[0], cur[1] + Math.sign(b[1] - cur[1])];
    cells.push([cur[0], cur[1]]);
  }
  return cells;
}

function handleHover(cellRC) {
  if (!dragging || !cellRC) return;
  if (pendingInit) {
    doInit();
    if (eqCell(cellRC, dragStart.cell)) return;
  }
  const p = paths[activeColor];
  const last = p[p.length - 1];
  if (eqCell(cellRC, last)) return;
  const steps = walk(last, cellRC);
  for (const s of steps) { if (!applyStep(s)) break; }
}

function endDrag() {
  dragging = false; dragStart = null; pendingInit = false;
  checkWin();
}

// ============================================================ controls
function doUndo() {
  if (mode !== 'play') return;
  if (history.length) { paths = history.pop(); recomputeOwner(); sfxBlip(); }
}
function doClear() {
  if (mode !== 'play') return;
  pushHistory();
  paths = level.pairs.map(p => [[p.a[0], p.a[1]]]);
  recomputeOwner(); sfxBlip();
}
function doHint() {
  if (mode !== 'play') return;
  const sol = level.solution;
  let target = -1;
  for (let i = 0; i < paths.length; i++) {
    const same = paths[i].length === sol[i].length &&
      paths[i].every((c, k) => c[0] === sol[i][k][0] && c[1] === sol[i][k][1]);
    if (!same) { target = i; break; }
  }
  if (target === -1) return;
  pushHistory();
  const solSet = new Set(sol[target].map(c => key(c[0], c[1])));
  for (let j = 0; j < paths.length; j++) {
    if (j === target) continue;
    const pj = paths[j];
    for (let k = 0; k < pj.length; k++) {
      if (solSet.has(key(pj[k][0], pj[k][1]))) { pj.length = k; break; }
    }
  }
  paths[target] = sol[target].map(c => [c[0], c[1]]);
  recomputeOwner(); sfxHint(); checkWin();
}

function checkWin() {
  if (mode !== 'play') return;
  const allConnected = paths.every((p, i) => isComplete(i));
  const full = coveredCount() === size * size;
  if (allConnected && full) win();
}

function win() {
  mode = 'win'; winFlash = 1; sfxWin();
  spawnConfetti();
  // progress
  const pd = getPlayerData(player);
  if (levelIndex + 1 > pd.completed) pd.completed = levelIndex + 1;
  if (levelIndex + 1 === pd.unlocked && pd.unlocked < LEVELS.length) pd.unlocked++;
  savePlayerData(player, pd);
  const wb = document.getElementById('winButtons');
  wb.classList.remove('hidden');
  document.getElementById('nextBtn').style.display =
    (levelIndex + 1 < LEVELS.length) ? '' : 'none';
  document.getElementById('controls').classList.add('hidden');
}

function doNext() {
  if (levelIndex + 1 < LEVELS.length) loadLevel(levelIndex + 1);
  else openMap();
}

function spawnConfetti() {
  confetti = [];
  const cols = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#ff2fd0', '#00e5ff', '#a3ff2f', '#ffd32a'];
  for (let i = 0; i < 140; i++) {
    confetti.push({
      x: W / 2 + (Math.random() - 0.5) * 60,
      y: H * 0.4,
      vx: (Math.random() - 0.5) * 9,
      vy: -Math.random() * 12 - 3,
      g: 0.35 + Math.random() * 0.2,
      size: 4 + Math.random() * 6,
      col: cols[(Math.random() * cols.length) | 0],
      rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4
    });
  }
}

// ============================================================ player / navigation
function refreshProgressLabels() {
  const c = getPlayerData('caleb'), e = getPlayerData('ezra');
  document.getElementById('progCaleb').textContent = 'Level ' + c.unlocked + ' / ' + LEVELS.length;
  document.getElementById('progEzra').textContent = 'Level ' + e.unlocked + ' / ' + LEVELS.length;
}
function pickPlayer(name) {
  ensureAudio();
  player = name;
  document.getElementById('playerSelect').classList.add('hidden');
  const badge = document.getElementById('playerBadge');
  badge.textContent = name.charAt(0).toUpperCase() + name.slice(1);
  badge.classList.remove('hidden');
  openMap();
}
function switchPlayer() {
  mode = 'select';
  document.getElementById('controls').classList.add('hidden');
  document.getElementById('winButtons').classList.add('hidden');
  document.getElementById('levelMap').classList.add('hidden');
  document.getElementById('playerBadge').classList.add('hidden');
  refreshProgressLabels();
  document.getElementById('playerSelect').classList.remove('hidden');
}
function openMap() {
  mode = 'map';
  document.getElementById('controls').classList.add('hidden');
  document.getElementById('winButtons').classList.add('hidden');
  buildLevelGrid();
  document.getElementById('levelMap').classList.remove('hidden');
}
function buildLevelGrid() {
  const pd = getPlayerData(player);
  document.getElementById('mapSub').textContent =
    player.charAt(0).toUpperCase() + player.slice(1) + ' — ' + pd.completed + ' solved';
  const g = document.getElementById('levelGrid');
  g.innerHTML = '';
  for (let i = 0; i < LEVELS.length; i++) {
    const n = i + 1;
    const b = document.createElement('button');
    b.className = 'lvl';
    b.textContent = n;
    const done = n <= pd.completed;
    const unlocked = n <= pd.unlocked;
    if (done) b.classList.add('done');
    else if (unlocked) b.classList.add('unlocked');
    else b.classList.add('locked');
    if (done) { const s = document.createElement('span'); s.className = 'star'; s.textContent = '⭐'; b.appendChild(s); }
    if (unlocked) b.onclick = () => { document.getElementById('levelMap').classList.add('hidden'); loadLevel(i); };
    g.appendChild(b);
  }
}

// ============================================================ input events
function evtXY(e) {
  const r = canvas.getBoundingClientRect();
  const pt = (e.touches && e.touches[0]) || e;
  return [pt.clientX - r.left, pt.clientY - r.top];
}
canvas.addEventListener('pointerdown', (e) => {
  if (mode !== 'play') return;
  ensureAudio();
  const [x, y] = evtXY(e);
  const c = cellFromXY(x, y);
  if (c) { startDrag(c); if (canvas.setPointerCapture) try { canvas.setPointerCapture(e.pointerId); } catch (er) {} }
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('pointermove', (e) => {
  if (mode !== 'play' || !dragging) return;
  const [x, y] = evtXY(e);
  handleHover(cellFromXY(x, y));
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('pointerup', (e) => { if (dragging) endDrag(); e.preventDefault(); }, { passive: false });
canvas.addEventListener('pointercancel', () => { if (dragging) endDrag(); });

// ============================================================ rendering
function computeLayout() {
  const topPad = 84, botPad = 104;
  const availH = H - topPad - botPad;
  const board = Math.min(W * 0.94, availH);
  cell = Math.floor(board / size);
  const bw = cell * size;
  ox = Math.floor((W - bw) / 2);
  oy = Math.floor(topPad + (availH - bw) / 2);
}
function centerX(c) { return ox + (c + 0.5) * cell; }
function centerY(r) { return oy + (r + 0.5) * cell; }

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBoard() {
  computeLayout();
  const gap = Math.max(2, cell * 0.06);
  // cells + colour wash
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      const x = ox + c * cell + gap / 2, y = oy + r * cell + gap / 2;
      const s = cell - gap;
      roundRect(x, y, s, s, Math.max(4, cell * 0.14));
      ctx.fillStyle = 'rgba(255,255,255,0.045)';
      ctx.fill();
      const o = owner[r][c];
      if (o !== -1) { ctx.fillStyle = hexA(level.pairs[o].color, 0.22); ctx.fill(); }
      ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.stroke();
    }
  }
  // pipes
  const lw = Math.max(6, cell * 0.32);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let i = 0; i < paths.length; i++) {
    const p = paths[i];
    if (p.length < 2) continue;
    ctx.strokeStyle = level.pairs[i].color;
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.moveTo(centerX(p[0][1]), centerY(p[0][0]));
    for (let k = 1; k < p.length; k++) ctx.lineTo(centerX(p[k][1]), centerY(p[k][0]));
    ctx.stroke();
  }
  // active loose-end nub
  if (dragging && !pendingInit && activeColor !== -1) {
    const p = paths[activeColor];
    const last = p[p.length - 1];
    if (!isComplete(activeColor)) {
      ctx.fillStyle = hexA(level.pairs[activeColor].color, 0.9);
      ctx.beginPath();
      ctx.arc(centerX(last[1]), centerY(last[0]), lw * 0.55, 0, 6.2832);
      ctx.fill();
    }
  }
  // dots
  const dr = cell * 0.3;
  for (let i = 0; i < level.pairs.length; i++) {
    const pr = level.pairs[i];
    [pr.a, pr.b].forEach(d => {
      const cx = centerX(d[1]), cy = centerY(d[0]);
      ctx.beginPath(); ctx.arc(cx, cy, dr, 0, 6.2832);
      ctx.fillStyle = pr.color; ctx.fill();
      ctx.lineWidth = Math.max(2, cell * 0.05);
      ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.stroke();
      if (isComplete(i)) {
        ctx.beginPath(); ctx.arc(cx, cy, dr * 0.5, 0, 6.2832);
        ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fill();
      }
    });
  }
}

function drawHUD() {
  const connected = connectedCount(), tot = level.pairs.length;
  const covered = coveredCount(), total = size * size;
  const pct = Math.round((covered / total) * 100);
  const label = 'LEVEL ' + (levelIndex + 1);
  const midTxt = connected + '/' + tot + ' linked';
  const rightTxt = pct + '%';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const pw = Math.min(W * 0.9, 360), ph = 54, px = (W - pw) / 2, py = 14;
  roundRect(px, py, pw, ph, 16);
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.stroke();
  const cy = py + ph / 2 - 6;
  ctx.fillStyle = '#ffd32a'; ctx.font = 'bold 20px Segoe UI,system-ui,sans-serif';
  ctx.fillText(label, px + pw * 0.2, cy);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 18px Segoe UI,system-ui,sans-serif';
  ctx.fillText(midTxt, px + pw * 0.55, cy);
  ctx.fillStyle = (pct === 100 ? '#2ecc71' : '#a0c4ff');
  ctx.fillText(rightTxt, px + pw * 0.87, cy);
  // coverage bar
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  roundRect(px + 16, py + ph - 12, pw - 32, 4, 2); ctx.fill();
  ctx.fillStyle = pct === 100 ? '#2ecc71' : '#a29bfe';
  roundRect(px + 16, py + ph - 12, (pw - 32) * (covered / total), 4, 2); ctx.fill();
}

function drawWin() {
  ctx.fillStyle = 'rgba(6,6,30,0.55)'; ctx.fillRect(0, 0, W, H);
  // confetti
  for (const p of confetti) {
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.col; ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
    ctx.restore();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.save();
  ctx.shadowColor = '#ffd32a'; ctx.shadowBlur = 30;
  ctx.fillStyle = '#ffd32a';
  ctx.font = 'bold ' + Math.min(64, W * 0.14) + 'px Segoe UI,system-ui,sans-serif';
  ctx.fillText('Solved!', W / 2, H * 0.34);
  ctx.restore();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 22px Segoe UI,system-ui,sans-serif';
  ctx.fillText('Level ' + (levelIndex + 1) + ' complete', W / 2, H * 0.44);
}

function hexA(hex, a) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

function frame() {
  ctx.clearRect(0, 0, W, H);
  if (mode === 'play' || mode === 'win') {
    if (level) { drawBoard(); drawHUD(); }
    if (mode === 'win') drawWin();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ============================================================ self-test
function verifyLevelRuntime(lv) {
  const errs = [];
  const s = lv.size, pairs = lv.pairs, sol = lv.solution, total = s * s;
  if (!Array.isArray(pairs) || !Array.isArray(sol)) return { ok: false, errs: ['missing pairs/solution'] };
  if (pairs.length !== sol.length) errs.push('pairs/solution length mismatch');
  if (pairs.length < 3) errs.push('too few pairs');
  const used = new Map();
  for (let i = 0; i < sol.length; i++) {
    const chain = sol[i], p = pairs[i];
    if (!Array.isArray(chain) || chain.length < 2) { errs.push('pair ' + i + ': chain too short'); continue; }
    for (let k = 0; k < chain.length; k++) {
      const [r, c] = chain[k];
      if (r < 0 || c < 0 || r >= s || c >= s) errs.push('pair ' + i + ': out of bounds');
      if (k > 0) { const d = Math.abs(chain[k - 1][0] - r) + Math.abs(chain[k - 1][1] - c); if (d !== 1) errs.push('pair ' + i + ': non-adjacent step'); }
      const kk = r * 100 + c;
      if (used.has(kk)) errs.push('pair ' + i + ': overlap with ' + used.get(kk)); else used.set(kk, i);
    }
    const head = chain[0], tail = chain[chain.length - 1];
    if (head[0] !== p.a[0] || head[1] !== p.a[1]) errs.push('pair ' + i + ': head != dot a');
    if (tail[0] !== p.b[0] || tail[1] !== p.b[1]) errs.push('pair ' + i + ': tail != dot b');
  }
  if (used.size !== total) errs.push('coverage ' + used.size + '/' + total);
  return { ok: errs.length === 0, errs, coverage: used.size, total };
}
function runSelfTest() {
  document.getElementById('playerSelect').classList.add('hidden');
  const el = document.createElement('div'); el.id = 'selftest';
  let html = '<h2>Linky self-test — ' + LEVELS.length + ' levels</h2>';
  let allOk = true;
  console.log('Linky self-test: verifying', LEVELS.length, 'levels');
  for (let i = 0; i < LEVELS.length; i++) {
    const v = verifyLevelRuntime(LEVELS[i]);
    if (!v.ok) allOk = false;
    const line = 'L' + String(i + 1).padStart(2, '0') + '  ' +
      LEVELS[i].size + 'x' + LEVELS[i].size + '  pairs=' + LEVELS[i].pairs.length +
      '  coverage=' + v.coverage + '/' + v.total + '  ' + (v.ok ? 'PASS' : 'FAIL ' + v.errs.join('; '));
    console.log(line);
    html += '<div class="' + (v.ok ? 'pass' : 'fail') + '">' + line + '</div>';
  }
  const summary = allOk ? ('ALL ' + LEVELS.length + ' LEVELS PASS ✓') : 'SOME LEVELS FAILED ✗';
  console.log(summary);
  html = '<div class="' + (allOk ? 'pass' : 'fail') + '" style="font-size:16px;margin-bottom:8px">' + summary + '</div>' + html;
  el.innerHTML = html;
  document.body.appendChild(el);
}

// ============================================================ boot
if (LEVELS.length === 0) {
  document.getElementById('playerSelect').innerHTML =
    '<h1>Linky</h1><div class="sub">levels.js failed to load</div>';
} else if (new URLSearchParams(location.search).has('selftest')) {
  runSelfTest();
} else {
  refreshProgressLabels();
}
</script>
</body>
