<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deja Vroom</title>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chicle&family=Pacifico&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------------
   1974, after dark. Chicle does the shouting, Pacifico does the talking,
   and everything glows slightly more than it strictly needs to. The
   fallbacks are real cursive faces, so a tablet with no internet still
   reads as the same poster rather than as a spreadsheet.
   --------------------------------------------------------------------- */
:root{
  --ink:#fff4e6;  --dim:#c9a9d6;
  --hot:#ff2e88;  --amber:#ffb03a;  --gold:#ffd964;
  --aqua:#3fe0d0; --grape:#7b3ff2;  --night:#1a0b2e;
  --disp:'Chicle',Georgia,'Times New Roman',serif;
  --hand:'Pacifico','Brush Script MT',cursive;
}
.neon{text-shadow:0 0 6px rgba(255,46,136,.9),0 0 18px rgba(255,46,136,.55),0 2px 0 rgba(0,0,0,.6)}
.neonA{text-shadow:0 0 6px rgba(63,224,208,.9),0 0 18px rgba(63,224,208,.5),0 2px 0 rgba(0,0,0,.6)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#0a0a22;
  font:14px/1.45 var(--hand);
  color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;touch-action:none}
canvas{display:block;width:100%;height:100%}

/* ---- HUD ---- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#clock{position:absolute;top:10px;left:50%;transform:translateX(-50%);
  font:400 44px/1 var(--disp);letter-spacing:1px;color:var(--gold);
  text-shadow:0 0 8px rgba(255,217,100,.85),0 0 26px rgba(255,176,58,.6),0 3px 0 rgba(0,0,0,.55)}
#clock.low{color:#ff6b6b;text-shadow:0 2px 14px rgba(0,0,0,.8),0 0 34px rgba(255,80,80,.6)}
#clock small{font-size:22px;opacity:.85}
/* Where you are, bottom right. The top left is left clear on purpose - the
   arcade's own "< Games" button lives there. */
#lvlTag{position:absolute;right:16px;bottom:14px;text-align:right;
  font:14px/1.5 var(--hand);letter-spacing:.6px;color:var(--dim);
  text-shadow:0 2px 10px rgba(0,0,0,.8)}
#lvlTag b{display:block;font:400 20px/1.1 var(--disp);color:var(--ink)}
#lvlTag i{font-style:normal;color:var(--gold);
  text-shadow:0 0 8px rgba(255,217,100,.7)}

/* Every arcade game has this, and the href is exactly ../../index.html -
   GitHub Pages 404s the trailing-slash form in production. */
/* NB the font is named, not inherited. `font: 700 13px/1 inherit` is an invalid
   shorthand - `inherit` is only legal as a whole property value, never as the
   family - so the browser threw the whole declaration away. An <a> then falls
   back to the body font and looks right by accident; a <button> does not
   inherit font at all, so the two chips on the right came out in the browser's
   own UI font. This is the body face, written down. */
#back{position:absolute;top:14px;left:16px;pointer-events:auto;z-index:9;
  text-decoration:none;font:700 13px/1 var(--hand);letter-spacing:1px;color:#cdd5f6;
  background:rgba(12,12,40,.85);border:1px solid rgba(162,155,254,.32);
  border-radius:9px;padding:10px 13px;transition:background .15s,color .15s}
#back:hover{background:rgba(108,92,231,.5);color:#fff}
/* POWER. A bolt and a number, not a percent sign: the figure is how much of the
   car's top speed you have left, and after a few crashes it is the thing you
   want back. Gold while it is whole, hot pink the moment a crash has taken a
   notch off - and pink is the one you can click to have it back. */
#spd{position:absolute;top:14px;right:66px;pointer-events:auto;cursor:default;
  display:flex;align-items:center;gap:7px;
  font:400 19px/1 var(--disp);letter-spacing:.5px;color:var(--gold);
  background:rgba(12,12,40,.85);border:1px solid rgba(255,217,100,.3);
  border-radius:9px;padding:7px 12px;transition:background .15s,color .15s,border-color .15s}
#spd svg{width:15px;height:15px;flex:0 0 auto;fill:currentColor;
  filter:drop-shadow(0 0 5px rgba(255,217,100,.65))}
#spd i{font-style:normal;text-shadow:0 0 9px rgba(255,217,100,.5)}
#spd{cursor:pointer}
#spd .lk{width:12px;height:12px;opacity:.85;filter:none}
#spd.lock{color:var(--aqua);border-color:rgba(63,224,208,.5)}
#spd.lock svg{filter:drop-shadow(0 0 5px rgba(63,224,208,.7))}
#spd.lock i{text-shadow:0 0 9px rgba(63,224,208,.5)}
#spd.lock:hover{background:rgba(63,224,208,.18)}
#spd.cut{color:var(--hot);border-color:rgba(255,46,136,.6);cursor:pointer}
#spd.cut svg{filter:drop-shadow(0 0 6px rgba(255,46,136,.8))}
#spd.cut i{text-shadow:0 0 10px rgba(255,46,136,.7)}
#spd.cut:hover{background:rgba(255,46,136,.22);color:#fff}
#pause{position:absolute;top:14px;right:16px;pointer-events:auto;cursor:pointer;
  font:700 15px/1 var(--hand);letter-spacing:2px;color:#cdd5f6;
  background:rgba(12,12,40,.85);border:1px solid rgba(162,155,254,.32);
  border-radius:9px;padding:9px 12px;transition:background .15s,color .15s}
#pause:hover{background:rgba(108,92,231,.5);color:#fff}
#pause.on{color:#ffd32a;border-color:rgba(255,211,42,.5)}
#paused{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(8,8,26,.55);backdrop-filter:blur(2px);z-index:7}
#paused.on{display:flex}
#paused b{font:400 44px/1 var(--disp);letter-spacing:3px;color:var(--hot);
  text-shadow:0 0 10px rgba(255,46,136,.9),0 0 30px rgba(255,46,136,.5)}

/* ---- testing strip: scene jump and a quick save slot ---- */
#dev{position:absolute;bottom:12px;left:14px;pointer-events:auto;z-index:8;display:flex;align-items:center;gap:8px;
  font-size:11px;letter-spacing:.4px;color:#8e98c8;opacity:.55;transition:opacity .2s}
#dev:hover{opacity:1}
#dev select{font:600 11px/1 var(--hand);color:#cdd5f6;background:rgba(12,12,40,.9);
  border:1px solid rgba(162,155,254,.3);border-radius:6px;padding:4px 6px;max-width:190px}
#dev .k{display:inline-block;min-width:15px;text-align:center;padding:2px 4px;border-radius:4px;
  background:rgba(162,155,254,.2);border:1px solid rgba(162,155,254,.3);color:#cdd5f6;
  font-weight:700}
#dev i{font-style:normal;color:#ffd32a;min-width:90px}

/* ---- story card ---- */
#card{position:absolute;right:26px;bottom:26px;transform:translateY(0);
  width:min(400px,calc(100% - 32px));background:rgba(12,12,40,.93);
  border:1px solid rgba(162,155,254,.35);border-radius:14px;padding:16px 20px 18px;
  box-shadow:0 18px 50px rgba(0,0,0,.6);transition:opacity .35s,transform .35s;
  backdrop-filter:blur(8px)}
#card.out{opacity:0;transform:translateY(22px);pointer-events:none}
#card{display:flex;gap:18px;align-items:flex-start;
  border-color:rgba(255,46,136,.35);background:rgba(26,11,46,.93);
  width:min(450px,calc(100% - 32px))}
#card .side{flex:0 0 150px;text-align:center}
#card .txt{flex:1;min-width:0}
/* The driver's portrait: a 150px tile, which is what the generated portraits
   are cropped to fill. Until a file exists it is the initial on a warm tile,
   and the img hides itself when there is nothing there. */
#card .mug{position:relative;width:150px;height:150px;border-radius:18px;
  background:linear-gradient(150deg,var(--grape),var(--hot));
  border:1px solid rgba(255,217,100,.45);overflow:hidden;
  display:flex;align-items:center;justify-content:center}
#card .mug span{font:400 72px/1 var(--disp);color:var(--gold);
  text-shadow:0 2px 6px rgba(0,0,0,.5)}
#card .mug img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#card .where{font:400 13px/1 var(--disp);letter-spacing:1.2px;
  color:var(--aqua);margin-bottom:6px;text-shadow:0 0 8px rgba(63,224,208,.5)}
#card .who{margin-top:7px;font:400 19px/1.15 var(--disp);color:var(--gold);
  text-shadow:0 0 9px rgba(255,217,100,.6)}
#card .blurb{font-size:18px;color:#fff;line-height:1.55}
/* the reel-complete card: the same frame in the winning colour, with a tick
   where the driver's face goes and the place name as the headline */
#card.done{border-color:rgba(63,224,208,.5);background:rgba(8,30,44,.94)}
#card.done .mug{background:linear-gradient(150deg,#0b3b4a,var(--aqua));
  border-color:rgba(63,224,208,.6)}
#card.done .mug span{color:#06202b;font-size:86px;text-shadow:none}
#card.done .who{color:var(--aqua);text-shadow:0 0 9px rgba(63,224,208,.6)}
#card.done .blurb{font:400 27px/1.2 var(--disp);color:#fff;
  text-shadow:0 0 14px rgba(63,224,208,.45)}
#card.done .blurb i{display:block;margin-top:8px;font:400 15px/1.4 var(--hand);
  font-style:normal;color:var(--dim);text-shadow:none}
/* the reel-opening card: the place announced, in gold */
#card.place{border-color:rgba(255,217,100,.45);background:rgba(34,16,8,.94)}
#card.place .mug{background:linear-gradient(150deg,var(--grape),var(--amber))}
#card.place .mug span{color:#2b1400;font-size:76px;text-shadow:none}
#card.place .who{color:var(--amber);font-size:15px;letter-spacing:.5px}
#card.place .blurb{font:400 27px/1.15 var(--disp);color:var(--gold);
  text-shadow:0 0 14px rgba(255,217,100,.4)}
#card.place .blurb i{display:block;margin-top:9px;font:400 15px/1.45 var(--hand);
  font-style:normal;color:var(--ink);text-shadow:none}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

/* ---- the tape being wound back ----
   Scanlines, a tracking bar crawling up the picture, a shivering frame and a
   washed-out tint. All CSS, so it costs nothing per frame. */
#vhs{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:6;
  transition:opacity .18s}
#vhs.on{opacity:1}
#vhs::before{content:'';position:absolute;inset:-2%;
  background:repeating-linear-gradient(to bottom,
    rgba(255,255,255,.055) 0 1px, rgba(0,0,0,.13) 1px 3px);
  animation:vhsRoll .22s linear infinite}
#vhs::after{content:'';position:absolute;left:0;right:0;height:13%;
  background:linear-gradient(to bottom, rgba(255,255,255,0),
    rgba(255,255,255,.16) 40%, rgba(120,190,255,.1) 60%, rgba(255,255,255,0));
  filter:blur(1px);animation:vhsTrack 1.15s linear infinite}
#vhs .rew{position:absolute;left:22px;top:18px;font:700 15px/1 var(--hand);
  font-style:normal;letter-spacing:3px;color:#fff;text-shadow:0 2px 10px #000;
  animation:vhsBlink .5s steps(1) infinite}
@keyframes vhsRoll{from{transform:translateY(0)}to{transform:translateY(3px)}}
@keyframes vhsTrack{from{top:104%}to{top:-16%}}
@keyframes vhsBlink{0%,49%{opacity:1}50%,100%{opacity:.25}}
#stage.rew #cv{filter:saturate(1.5) contrast(1.16) brightness(1.04) hue-rotate(-7deg);
  animation:vhsShake .09s steps(2) infinite}
@keyframes vhsShake{0%{transform:translateX(0)}50%{transform:translateX(1.5px)}
  100%{transform:translateX(-1px)}}

/* ---- centre banner ---- */
#banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
  text-align:center;transition:opacity .3s;opacity:0}
#banner.on{opacity:1}
#banner b{display:block;font:400 54px/1.1 var(--disp);letter-spacing:.5px;
  text-shadow:0 0 12px rgba(255,46,136,.7),0 4px 24px rgba(0,0,0,.75)}
#banner span{display:block;margin-top:8px;font-size:15px;color:var(--dim);letter-spacing:.8px}
#banner.win b{color:var(--aqua);text-shadow:0 0 12px rgba(63,224,208,.8),0 4px 24px rgba(0,0,0,.7)}
#banner.lose b{color:var(--hot)}

/* ---- boot / error ---- */
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;background:#0a0a22;z-index:20;text-align:center;padding:30px}
#boot h1{font:400 40px/1 var(--disp);letter-spacing:.5px;margin:0;color:var(--hot);
  text-shadow:0 0 10px rgba(255,46,136,.8),0 0 28px rgba(255,46,136,.4)}
#boot h1 i{color:var(--gold);font-style:normal;
  text-shadow:0 0 10px rgba(255,217,100,.8)}
#boot p{margin:0;color:var(--dim);font-size:14px;max-width:480px;line-height:1.7}
#boot a{color:#a29bfe}
#boot.gone{display:none}
.bar{width:220px;height:4px;border-radius:3px;background:#1c1c4a;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#6c5ce7;transition:width .2s}
/* ---- the title screen, and the pause menu that borrows its furniture ---- */
.sheet{position:fixed;inset:0;z-index:15;display:none;overflow:auto;
  background:radial-gradient(120% 80% at 50% 0%,#3b1055 0%,#1a0b2e 55%,#0a0520 100%)}
.sheet.on{display:flex;align-items:center;justify-content:center}
/* the road stripes running off the bottom of the sunset */
.sheet .in:after{content:'';position:absolute;left:50%;bottom:-40px;width:140%;height:120px;
  transform:translateX(-50%);pointer-events:none;
  background:repeating-linear-gradient(90deg,
    rgba(255,46,136,.30) 0 6%, transparent 6% 12%);
  -webkit-mask-image:linear-gradient(180deg,transparent,#000);
  mask-image:linear-gradient(180deg,transparent,#000)}
/* the sunset: three fat bands behind everything, because it is 1974 */
.sheet:before{content:'';position:absolute;left:50%;top:6%;width:min(620px,92vw);
  aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
  background:linear-gradient(180deg,var(--gold) 0%,var(--amber) 38%,var(--hot) 72%,transparent 73%);
  opacity:.22;filter:blur(1px)}
.sheet:after{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.20) 0 2px,transparent 2px 4px);
  opacity:.5}
.sheet .in{position:relative;z-index:2;max-width:860px;margin:0 auto;padding:30px 24px 46px;
  text-align:center}
.sheet h1{margin:0;font:400 clamp(52px,10vw,104px)/1 var(--disp);color:var(--hot);
  text-shadow:0 0 12px rgba(255,46,136,.85),0 0 40px rgba(255,46,136,.45),0 5px 0 rgba(0,0,0,.35)}
.sheet h1 i{font-style:normal;color:var(--gold);
  text-shadow:0 0 12px rgba(255,217,100,.9),0 0 40px rgba(255,176,58,.5),0 5px 0 rgba(0,0,0,.35)}
.sheet h2{margin:0 0 16px;font:400 30px/1.2 var(--disp);color:var(--aqua);
  text-shadow:0 0 10px rgba(63,224,208,.6)}
.sheet .story{margin:6px auto 22px;max-width:660px;font-size:20px;line-height:1.65;color:var(--ink)}
/* every game in the arcade has this in the same corner */
.homeback{position:absolute;left:22px;top:22px;z-index:4;text-decoration:none;
  font:400 20px/1 var(--disp);color:var(--ink);padding:11px 18px;border-radius:12px;
  border:1px solid rgba(255,46,136,.5);background:rgba(0,0,0,.25)}
.homeback:hover{background:rgba(255,46,136,.22)}
/* who is driving */
.pickrow{display:flex;gap:12px;justify-content:center;margin-bottom:24px}
.pick{pointer-events:auto;cursor:pointer;font:400 26px/1 var(--disp);
  padding:13px 30px;border-radius:14px;color:var(--dim);
  background:rgba(255,255,255,.05);border:2px solid rgba(255,46,136,.3)}
.pick.on{color:#fff;border-color:var(--hot);background:rgba(255,46,136,.28);
  box-shadow:0 0 22px rgba(255,46,136,.5)}
/* Best times: the eight places you play, four to a row, always all eight. A
   board with gaps in it is a to-do list - it says which ones you have not done
   yet, which is the point. The ninth reel is the ending and is not timed. */
.scores{max-width:900px;margin:26px auto 0;
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.hs{padding:10px 12px 11px;border-radius:11px;background:rgba(255,255,255,.05);
  border:1px solid rgba(162,155,254,.14);text-align:left}
.hs b{display:block;font:400 17px/1.15 var(--disp);color:var(--ink);
  margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs i{display:flex;justify-content:space-between;gap:8px;font-style:normal;
  color:var(--dim);font-size:15px;line-height:1.5}
.hs i em{font-style:normal;opacity:.75}
.hs i.me{color:var(--gold);text-shadow:0 0 9px rgba(255,217,100,.45)}
.hs i.me em{opacity:1}
@media (max-width:720px){ .scores{grid-template-columns:repeat(2,1fr)} }
/* a reel you have a time on can be played again straight from the board */
.hs.done{cursor:pointer;transition:border-color .12s,background .12s}
.hs.done:hover{border-color:rgba(255,46,136,.55);background:rgba(255,255,255,.09)}
.hs.done b:after{content:' \25B8';color:var(--hot)}
/* the big button, what it will pick up, and the way back to the top */
.go{display:flex;flex-direction:column;align-items:center;gap:11px}
.gosub{margin:0;font-size:14.5px;color:var(--dim);letter-spacing:.3px}
.ask{display:none;max-width:580px;margin:0 auto}
.ask.on{display:block}
.ask p{margin:0 0 15px;font-size:16.5px;line-height:1.55;color:var(--ink)}
.ask .btn.ghost{margin:0 5px}
.btn{display:inline-block;cursor:pointer;pointer-events:auto;border:none;
  font:400 34px/1 var(--disp);letter-spacing:1px;color:#2b0a1c;
  background:linear-gradient(180deg,var(--gold),var(--amber));
  padding:17px 52px;border-radius:16px;
  box-shadow:0 0 22px rgba(255,176,58,.55),0 6px 0 rgba(0,0,0,.35);
  transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 30px rgba(255,176,58,.8),0 8px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(2px);box-shadow:0 0 18px rgba(255,176,58,.5),0 3px 0 rgba(0,0,0,.35)}
.btn.ghost{background:none;color:var(--ink);border:1px solid rgba(255,46,136,.5);
  font-size:19px;padding:11px 22px;box-shadow:none}
.btn.ghost:hover{background:rgba(255,46,136,.18);box-shadow:none;transform:none}
.quitrow{margin-top:15px}
.sheet .foot{margin-top:18px;font-size:12.5px;color:var(--dim);line-height:1.8}
/* the row of switches the pause menu is made of */
.rows{max-width:430px;margin:0 auto 18px;text-align:left}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;margin-bottom:9px;
  border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,46,136,.22)}
.row .lab{flex:1}
.row .lab b{display:block;font:400 19px/1.2 var(--disp);color:var(--ink)}
.row .lab span{font-size:13.5px;color:var(--dim)}
.seg{display:flex;gap:4px;background:rgba(0,0,0,.35);padding:3px;border-radius:10px}
.seg button{pointer-events:auto;cursor:pointer;border:none;background:none;color:var(--dim);
  font:400 17px/1 var(--disp);padding:9px 15px;border-radius:8px;transition:.12s}
.seg button.on{background:linear-gradient(180deg,var(--hot),#c4176b);color:#fff;
  box-shadow:0 0 14px rgba(255,46,136,.55)}
#touchL,#touchR{position:absolute;top:0;bottom:0;width:50%;pointer-events:none}
#touchL{left:0} #touchR{right:0}
/* Shown on the first run of the first reel and never again: a quarter of the
   screen down each side, with the turn it makes. No words - an eight-year-old
   with a thumb on it works this out in about a second. */
#teach{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s;z-index:6}
#teach.on{opacity:1}
#teach div{position:absolute;top:0;bottom:0;width:25%;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:14px}
#teach .l{left:0} #teach .r{right:0}
/* The wash behind each side breathes as well as the arrow. It is on its own
   layer rather than on the panel so the two can pulse independently - the
   panel carries the flex layout, and animating its opacity would have dragged
   the arrow and the label along with it. */
#teach div:before{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(255,46,136,.34),transparent);
  animation:teachBg 1.6s ease-in-out infinite}
#teach .r:before{background:linear-gradient(270deg,rgba(255,46,136,.34),transparent)}
#teach .r:before,#teach .r b{animation-delay:.8s}
#teach b{position:relative;z-index:1;font:400 111px/1 var(--disp);color:var(--gold);
  text-shadow:0 0 18px rgba(255,217,100,.95),0 0 54px rgba(255,176,58,.55);
  animation:teach 1.6s ease-in-out infinite}
#teach span{position:relative;z-index:1;font:400 26px/1 var(--disp);color:#fff;
  letter-spacing:1px;text-shadow:0 2px 10px rgba(0,0,0,.8)}
@keyframes teach{0%,100%{transform:translateY(0);opacity:.7}50%{transform:translateY(-11px);opacity:1}}
@keyframes teachBg{0%,100%{opacity:.45}50%{opacity:1}}
#touchL.lit,#touchR.lit{background:radial-gradient(ellipse at center,rgba(162,155,254,.16),transparent 70%)}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="hud">
  <div id="touchL"></div><div id="touchR"></div>
  <div id="teach">
    <div class="l"><b>&#8634;</b><span>hold this side</span></div>
    <div class="r"><b>&#8635;</b><span>hold this side</span></div>
  </div>
  <div id="paused"><b>Paused</b></div>
  <div id="clock">60<small>.0</small></div>
  <a id="back" href="../../index.html">&larr; Games</a>

<script src="js/arcade-store.js"></script>
<script src="lib/three.min.js"></script>
<script src="lib/GLTFLoader.js"></script>
<script src="lib/ConvexHull.js"></script>
<script src="lib/cannon.js"></script>
<script>
'use strict';
/* ==========================================================================
   DEJA VROOM

   Everything the game needs was authored in mapper.html and lives in the same
   IndexedDB this page can open (same origin): the city under the key `city`,
   the routes under `routes`. Nothing here is generated.

   World: Y-up, ground is XZ, 1 unit = 1 Kenney road tile. A heading of 0
   degrees faces +X, exactly as the mapper's arrows do.
   ========================================================================== */

/* The models the game actually uses, cut out of the 87MB of Kenney kits in
   research/ (which is gitignored) and committed next to the game. The mapper
   still browses the full kits from research/ - it is an authoring tool and
   lives on the machine that has them. */
var MODEL_ROOT='models/';
function glbUrl(kit,name){ return encodeURI(MODEL_ROOT+kit+'/'+name+'.glb'); }
var TINTS={grass:'#5f9e3f', sand:'#d9c089', water:'#3f7fa6'};

var STAGE_SECONDS=60;
/* Everything the mapper's Config tab can move. Defaults here are what the game
   uses when nothing has been configured. */
var GCFG={rewind:1.4,        // the wind-back after a crash
          winRewind:1.6,     // the wind-back after finishing a level
          crashCool:0.8, crashDrop:0.6, stallFor:1.0, rollFor:0.6,
          gravity:24};
/* 120Hz, not 60. A 0.3-unit car needs a stiff suspension to stand up in a
   world with 1-unit road tiles, and at 60Hz that spring is numerically
   unstable: it rings at twice its own frequency, the wheels skip, and the car
   never gets traction. Measured on Dan's city: 1/60 gives 0.043 of height
   wobble and zero forward speed, 1/120 gives 0.000 and full speed. */
var TICK=1/120;
var REC_HZ=30;                       // path samples per second for the replays

/* Per-vehicle handling. Every entry is the same for now, on purpose - the
   game already reads them, so tuning one car never means touching the loop. */
/* Lengths here are multiples of the car's own length, not world units. The
   mapper scales vehicles independently of the city - Dan's world runs at 0.125,
   so a sedan is 0.32 units long on 1-unit road tiles - and every hard-coded
   constant written for a 2.5-unit car falls apart at that size. */
var STEER_MIN=0.10, STEER_MAX=0.30;   // radians of wheel lock, for the look of it
var YAW_MIN=0.9, YAW_MAX=3.2;         // radians a second the 0-1 dial spans
var MAX_SLIP=0.78;                    // 45 degrees, past which it is a spin
/* Grip drives the tyres as well as the slip control. Measured: below about
   0.35 of tyre friction the wheels can no longer put the power down either -
   0 to full speed goes from 1.4 seconds to 8 - so the mapping keeps enough
   bite to drive while a low grip still lets the back move around. */
function tyreOf(s){ return Math.max(0.35, Math.min(6, 0.35+s.grip*2)); }
var BASE={ lift:0,        // VISUAL only: raise or drop the model on screen
          mass:380, grip:0.8, accel:1, turn:1, maxYaw:2.6, scrub:0.45,
          yawSnap:26,
          topSpeedPerLen:7,    // car lengths per second at full chat
          reachTopIn:7.0,      // seconds from a standstill
          brakePerLen:6,
          steer:0.7, steerFloor:0.45,
          wheelOfHeight:0.23,  // wheel radius as a fraction of car height
          restOfWheel:1.6};    // suspension travel relative to the wheel
var VSTATS={};
/* The mapper's Config tab writes three layers: stage-wide settings, the
   defaults every vehicle inherits, and a sparse per-vehicle override. Anything
   it has not set keeps the built-in value above. */
function applyConfig(c){
  if(!c) return;
  if(c.global){
    ['rewind','winRewind','crashCool','crashDrop','stallFor','rollFor','gravity'].forEach(function(k){
      if(typeof c.global[k]==='number') GCFG[k]=c.global[k]; });
    if(typeof c.global.stageSeconds==='number') STAGE_SECONDS=c.global.stageSeconds;
    var m={camHeight:'height', camBack:'back', camSide:'side', camLag:'lag'};
    for(var k in m) if(typeof c.global[k]==='number') CHASE[m[k]]=c.global[k];
    if(typeof c.global.camTween==='number') TWEEN_SECS=Math.max(0.05,c.global.camTween);
    var sm={grassGrip:['grass','grip'], grassSpeed:['grass','speed'],
            sandGrip:['sand','grip'],  sandSpeed:['sand','speed'],
            waterGrip:['water','grip'], waterSpeed:['water','speed']};
    for(var q in sm) if(typeof c.global[q]==='number')
      SURFACE[sm[q][0]][sm[q][1]]=c.global[q];
  }
  if(c.base) for(var b in c.base) if(typeof c.base[b]==='number') BASE[b]=c.base[b];
  if(c.cars) for(var v in c.cars) VSTATS[v]=c.cars[v];
  if(c.abase) for(var ab in c.abase) if(typeof c.abase[ab]==='number') ABASE[ab]=c.abase[ab];
  if(c.acars) for(var av in c.acars) AVSTATS[av]=c.acars[av];
  if(c.global&&(c.global.model==='arcade'||c.global.model==='sim')){
    DRIVE_MODEL=c.global.model;
    try{ localStorage.setItem('dejavroom-model',DRIVE_MODEL); }catch(e){}
  }
}
/* How far this vehicle's MODEL is nudged up or down on screen. Nothing else
   sees it: the body, the rays, the collisions and the recorded path are all
   exactly where they were. It is there because some models - the karts - sit
   a shade low in their own file, and the fix belongs in the picture, not in
   the physics. */
function liftFor(model){
  var v=(DRIVE_MODEL==='arcade') ? arcStatsFor(model) : statsFor(model);
  return v.lift||0;
}
/* What fraction of its normal top speed the car is allowed right now. One
   number, so both models and the badge in the corner agree. */
function speedFactor(){
  var base=(DRIVE_MODEL==='arcade') ? arcStatsFor(G.car?G.car.model:'sedan').maxSpeed : ABASE.maxSpeed;
  if(!base) return easyFactor();
  return easyFactor()*Math.max(HANDICAP.floor, base-(G.slow||0))/base;
}
function statsFor(model){
  var s=VSTATS[model]||{}, out={};
  for(var k in BASE) out[k]=(s[k]!==undefined)?s[k]:BASE[k];
  return out;
}


/* ==========================================================================
   The tape: story, sound and the two sheets of UI

   Everything in here is presentation. It reads the game's state and never
   changes it, apart from the three switches at the bottom - and those are
   plain numbers the driving code already understood.
   ========================================================================== */
var STORY=null;
function loadStory(){
  return fetch('data/story.json',{cache:'no-cache'})
    .then(function(r){ return r.ok?r.json():null; })
    .catch(function(){ return null; });
}
/* what this reel is called, and what this driver is doing in it */
function placeOf(i){
  if(!STORY||!STORY.locations) return null;
  return STORY.locations[i] || null;
}
function reelWord(){ return (STORY&&STORY.sceneWord)||'Reel'; }
function runWord(){ return (STORY&&STORY.levelWord)||'Run'; }
function driverOf(model){
  var d=STORY&&STORY.drivers&&STORY.drivers[model];
  return d || {name:model.replace(/-/g,' '), persona:'', img:''};
}
function taskOf(model, sceneIdx){
  var pl=placeOf(sceneIdx);
  var t=STORY&&STORY.tasks&&STORY.tasks[model];
  return (t && pl && t[pl.key]) || '';
}
/* THE SPINE. Every reel opens and closes with the sedan, because the sedan is
   how you get from one place to the next - so Margo gets two lines a reel
   instead of one, and hers run in sequence across the whole tape: arriving
   somewhere, then setting off for wherever the next reel is. Her closing line
   in one reel sets up the next place and her opening line there picks the
   thread up, which is why they are written as pairs and never repeat each
   other. Everyone else has one line per place and no idea they are in a story.
*/
function arcOf(sceneIdx){
  var pl=placeOf(sceneIdx);
  return (STORY&&STORY.arc&&pl&&STORY.arc[pl.key]) || null;
}
/* Which line belongs on the card for this run: Margo's thread if she is
   opening or closing the reel, then anything Dan has written on the Routes tab
   (real prose only - a row of keyboard mash is not a story), then the driver's
   own line for this place. */
function lineFor(sceneIdx, levelIdx){
  var sc=ROUTES&&ROUTES.scenes&&ROUTES.scenes[sceneIdx];
  var lv=sc&&sc.levels[levelIdx]; if(!lv) return '';
  var model=lv.veh.model, a=arcOf(sceneIdx), last=sc.levels.length-1;
  if(a && model==='sedan'){
    if(levelIdx===0 && a['in']) return a['in'];
    if(levelIdx===last && a.out) return a.out;
  }
  var own=(lv.blurb||'').trim();
  if(own.length>12 && own.indexOf(' ')>0) return own;
  return taskOf(model, sceneIdx) || own;
}

/* ---- sound: one small synth, no files, deliberately quiet ---- */
var SND={ac:null, on:true, music:true, gain:null, engine:null, engGain:null};
function audioUp(){
  if(SND.ac) return SND.ac;
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return null;
  SND.ac=new AC();
  SND.gain=SND.ac.createGain(); SND.gain.gain.value=0.55; SND.gain.connect(SND.ac.destination);
  return SND.ac;
}
function blip(freq, len, type, vol, slideTo){
  if(!SND.on) return;
  var ac=audioUp(); if(!ac) return;
  var o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq, ac.currentTime);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, ac.currentTime+len);
  g.gain.setValueAtTime(0.0001, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(vol||0.06, ac.currentTime+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+len);
  o.connect(g); g.connect(SND.gain); o.start(); o.stop(ac.currentTime+len+0.02);
}
function noise(len, vol, cut){
  if(!SND.on) return;
  var ac=audioUp(); if(!ac) return;
  var n=Math.floor(ac.sampleRate*len), buf=ac.createBuffer(1,n,ac.sampleRate), d=buf.getChannelData(0);
  for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  var src=ac.createBufferSource(); src.buffer=buf;
  var f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||900;
  var g=ac.createGain(); g.gain.value=vol||0.05;
  src.connect(f); f.connect(g); g.connect(SND.gain); src.start();
}
var SFX={
  go:     function(){ blip(420,0.10,'triangle',0.05); setTimeout(function(){ blip(660,0.14,'triangle',0.05); },90); },
  win:    function(){ [523,659,784,1047].forEach(function(f,i){
            setTimeout(function(){ blip(f,0.16,'triangle',0.05); }, i*85); }); },
  crash:  function(){ noise(0.26,0.07,500); blip(90,0.22,'sawtooth',0.045,55); },
  splash: function(){ noise(0.45,0.05,1600); blip(260,0.3,'sine',0.03,120); },
  rewind: function(){ blip(1200,0.42,'sawtooth',0.022,220); noise(0.42,0.02,2600); },
  tap:    function(){ blip(880,0.05,'square',0.035); },
  stage:  function(){ [392,523,659,784,1047].forEach(function(f,i){
            setTimeout(function(){ blip(f,0.2,'triangle',0.055); }, i*110); }); }
};
/* the engine: one quiet sawtooth whose pitch follows the car, started on the
   first run and left running - it is cheaper than making one per level and it
   never gets loud enough to notice until you listen for it */
function engineUp(){
  if(SND.engine||!SND.on) return;
  var ac=audioUp(); if(!ac) return;
  var o=ac.createOscillator(), g=ac.createGain(), f=ac.createBiquadFilter();
  o.type='sawtooth'; o.frequency.value=70;
  f.type='lowpass'; f.frequency.value=420;
  g.gain.value=0;
  o.connect(f); f.connect(g); g.connect(SND.gain); o.start();
  SND.engine=o; SND.engGain=g;
}
function engineAt(sp, top){
  if(!SND.engine) return;
  var k=Math.max(0,Math.min(1, sp/Math.max(0.001,top)));
  SND.engine.frequency.value = 62 + k*135;
  SND.engGain.gain.value = (SND.on && G.phase==='driving') ? 0.006+k*0.030 : 0;
}
function musicGo(){
  var el=document.getElementById('music');
  if(!el||!SND.music) return;
  el.volume=0.32;
  var pr=el.play();
  if(pr&&pr.catch) pr.catch(function(){});   /* a browser may still say no */
}
function musicSet(on){
  SND.music=on;
  var el=document.getElementById('music'); if(!el) return;
  if(on) musicGo(); else el.pause();
}

/* ---- who is driving, and their best times ----
   IndexedDB through arcade-store, not localStorage: the arcade shares one
   five-megabyte localStorage quota across seventy games and it has run out
   before now. Key: calebArcadeData:dejavroom. */
var PLAYERS=[{id:'caleb',name:'Caleb'},{id:'ezra',name:'Ezra'}];
var Store=(typeof ArcadeStore==='function') ? ArcadeStore('dejavroom') : null;
var SAVE={who:'caleb', best:{}};          // best[player][reel] = seconds
function saveLoad(cb){
  if(!Store) return cb();
  Store.ready(function(){
    var s=Store.get();
    if(s&&typeof s==='object'){ SAVE.who=s.who||SAVE.who; SAVE.best=s.best||{}; }
    var r=Store.get('resume');
    RESUME=(r&&typeof r==='object')?r:{};
    cb();
  });
}
function savePut(){ if(Store) Store.set(null, {who:SAVE.who, best:SAVE.best}); }

/* ---- where you got to ----
   One slot per driver and it holds ONE reel: which reel, which run, the clock
   so far, and the runs already banked here as traffic. Earlier reels' traffic
   is not kept - it is hundreds of kilobytes a reel and nothing ever replays it
   again. The slot is written when a run LANDS rather than every frame, so the
   worst a shut laptop costs you is the run you were on, and no amount of
   quitting can undo a crash you have already had.
   It lives in the store next to the best times rather than in localStorage
   because a fifteen-run reel of paths is bigger than the whole arcade's
   localStorage budget divided seventy ways. */
var RESUME={};                            // RESUME[player] = slot, or nothing
function resumeFor(who){ var r=RESUME[who]; return (r&&typeof r==='object')?r:null; }
/* Flushed rather than left to the store's own 120ms timer: this is written the
   moment a run lands, which is exactly when somebody shuts the lid. */
function resumeWrite(){
  if(!Store) return;
  Store.set('resume', RESUME);
  if(Store.flush) Store.flush();
}
/* `runs` is COPIED. Handing the slot the live G.runs array would leave the
   store holding a window onto a list that keeps growing: bank another run and
   the slot silently reads one run further on than the index saved beside it,
   so a flush at the wrong moment writes a run number and a set of ghosts that
   disagree - which puts you back on a run whose ghost is already out there. */
function resumeSet(reel, level, clock, runs){
  if(!ROUTES||!ROUTES.scenes[reel]) return;
  RESUME[SAVE.who]={reel:reel, level:level||0, clock:clock||0,
                    runs:Array.isArray(runs)?runs.slice():[]};
  resumeWrite();
}
function resumeClear(){ delete RESUME[SAVE.who]; resumeWrite(); }
function bestFor(who,reel){
  var b=SAVE.best[who], v=b&&b[reel];
  return (typeof v==='number')?v:null;
}
function recordTime(reel, secs){
  var who=SAVE.who;
  if(!SAVE.best[who]) SAVE.best[who]={};
  var b=SAVE.best[who][reel], beat=(typeof b!=='number')||secs<b;
  if(beat){ SAVE.best[who][reel]=+secs.toFixed(1); savePut(); }
  return beat;
}
function whoName(){
  for(var i=0;i<PLAYERS.length;i++) if(PLAYERS[i].id===SAVE.who) return PLAYERS[i].name;
  return 'Player';
}

/* ---- the switches ---- */
/* Difficulty is a level, not a flag: 0 normal, 1 easy, 2 easiest. The others
   are plain switches. */
var OPT={diff:0, perf:false, debug:false, lock:false};
var OPT_KEY='dejavroom-opt';
/* THE SWITCHES BELONG TO WHOEVER IS DRIVING. One boy wants the music on and
   easy mode, the other does not, and neither should have to set it back every
   time. So the file holds one set per player, plus `who` - the last player to
   touch anything. That last bit is not bookkeeping: the real choice of driver
   lives in the arcade store, which is read asynchronously, long after the debug
   switch has had to decide where the city is loaded from. `who` is what boot
   goes on, and the answer from the store is applied the moment it arrives.

   A file written before this change is one flat set of switches. It becomes the
   starting point for both of them rather than being thrown away. */
function optBlob(){
  try{ var b=JSON.parse(localStorage.getItem(OPT_KEY)||'{}');
       return (b&&typeof b==='object')?b:{}; }catch(e){ return {}; }
}
function optSet(b, who){
  if(b.players && b.players[who]) return b.players[who];
  var old={}, any=false;                       // the pre-per-player file
  for(var k in OPT) if(typeof b[k]==='boolean'){ old[k]=b[k]; any=true; }
  if(typeof b.sound==='boolean'){ old.sound=b.sound; any=true; }
  if(typeof b.music==='boolean'){ old.music=b.music; any=true; }
  return any?old:{};
}
function optLoad(who){
  var b=optBlob(), o=optSet(b, who||b.who||SAVE.who);
  for(var k in OPT) if(typeof OPT[k]==='boolean')
    OPT[k]=(typeof o[k]==='boolean')?o[k]:false;
  /* difficulty was a boolean before there were three of them */
  OPT.diff=(typeof o.diff==='number') ? Math.max(0,Math.min(2,o.diff|0))
                                      : (o.easy===true?1:0);
  SND.on   =(typeof o.sound==='boolean')?o.sound:true;
  SND.music=(typeof o.music==='boolean')?o.music:true;
}
function optSave(){
  var b=optBlob(), keep=(b.players&&typeof b.players==='object')?b.players:{};
  keep[SAVE.who]={diff:OPT.diff, perf:OPT.perf, debug:OPT.debug,
                  lock:OPT.lock, sound:SND.on, music:SND.music};
  try{ localStorage.setItem(OPT_KEY, JSON.stringify({who:SAVE.who, players:keep})); }catch(e){}
}
/* Put the loaded switches into effect. Called on a driver change and once the
   arcade store has said who is actually driving. */
function optApply(){
  applyPerf(); applyDebug();
  musicSet(SND.music);
  if(!SND.on && SND.engGain) SND.engGain.gain.value=0;
}
/* EASY is simply a slower car - the same handicap the crash counter uses, so
   there is only ever one place that decides how fast the thing goes. Both eased
   levels drive at four fifths; what separates them is the slide. */
function easyFactor(){ return OPT.diff?0.8:1; }
/* EASIEST also QUADRUPLES the lateral drag, which is the one knob that decides
   how long a slide lasts: the sideways part of the velocity is what a slide is,
   and drag is how fast it dies. Four times the drag kills it in about a third
   of the time, so the car simply goes where it is pointed and a corner taken
   badly still comes back. Nothing else changes - same top speed as easy, same
   steering, same everything.

   It is deliberately a big multiplier. Most of the fleet is already glued down
   at 0.06 and doubling that is barely felt; the four karts sit at 0.0001 with a
   road grip of 0.005, so their slide is governed by road grip rather than drag
   and this knob will not tame the boats however far it is pushed. */
function slideFactor(){ return OPT.diff>=2 ? 4 : 1; }
/* PERFORMANCE MODE. Shadows are the expensive part of this scene by a mile:
   turning them off takes the whole shadow pass out, and dropping to one
   device pixel quarters the fill. The see-through buildings STAY: they are a
   handful of objects a frame, and a tablet that needs performance mode is
   exactly the one you do not want losing the car behind a tree. */
function applyPerf(){
  if(!ren) return;
  ren.shadowMap.enabled=!OPT.perf;
  if(SUN) SUN.castShadow=!OPT.perf;
  ren.setPixelRatio(OPT.perf?1:Math.min(devicePixelRatio,1.75));
  resize();
}
function applyDebug(){
  var d=document.getElementById('dev');
  if(d) d.style.display=OPT.debug?'flex':'none';
}

/* ---- the two sheets ---- */
function sheet(id,on){ var e=document.getElementById(id); if(e) e.classList.toggle('on',!!on); }
function buildHome(){
  if(STORY) document.getElementById('homeStory').textContent=STORY.premise||'';
  /* who is driving */
  var pick=document.getElementById('homeWho'); pick.innerHTML='';
  PLAYERS.forEach(function(P){
    var b=document.createElement('button');
    b.className='pick'+(SAVE.who===P.id?' on':'');
    b.textContent=P.name;
    b.onclick=function(){ SFX.tap(); SAVE.who=P.id; savePut();
      optLoad(P.id); optSave(); optApply();   // this driver's switches, and they are now the last to pick
      buildHome(); };
    pick.appendChild(b);
  });
  /* Best times: every reel you can score, in the order you drive them, whether
     anybody has finished it or not. An empty slot is a dash - the board is the
     same shape on day one as it is when the pair of them have filled it in. */
  var hs=document.getElementById('homeScores'); hs.innerHTML='';
  var scenes=(ROUTES?ROUTES.scenes:[]);
  scenes.forEach(function(sc,i){
    if(i===scenes.length-1) return;             // the last reel is the ending
    var row=document.createElement('div'); row.className='hs';
    row.innerHTML='<b>'+esc(reelTitle(i))+'</b>';
    PLAYERS.forEach(function(P){
      var t=bestFor(P.id,i);
      var e=document.createElement('i');
      if(P.id===SAVE.who) e.className='me';

                  (t===null ? '\u2014' : t.toFixed(1)+'s')+'</span>';

       the board. One they have never finished cannot - the tape is meant to be

/* ==========================================================================
   Where the city and the routes come from

   Two sources, on purpose, and the DEBUG SWITCH picks between them.

   Switch off - the arcade. The files in data/ are what ships: they travel with
   the game, they are the same on every machine, and nothing a browser happens
   to be holding can change what the boys sit down to play.

   Switch on - the workshop. The city, the routes and the handling come from the
   mapper's own IndexedDB instead, so the tab just saved next door is the one
   being driven. An empty store falls back to the files, so turning the switch
   on in a fresh browser still gives a game.

   Either way the dev strip names what is actually loaded.
   ========================================================================== */
var DATA_SRC='files', CFG_SRC='none';
/* The exported file is loaded first either way, so the game always has Dan's
   tuning wherever it runs. With the debug switch on, the mapper's own copy then
   goes on top of it, field by field, so the number changed a minute ago is the
   number being driven. With the switch off nothing overrides the file. */
function loadConfig(){
  return fetch('data/deja-vroom-config.json',{cache:'no-cache'})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(c){
      c=cfgFromExport(c);
      if(c){ applyConfig(c); CFG_SRC='data/'; }
    })
    .catch(function(){});
}
function loadFiles(){
  function grab(u){ return fetch(u,{cache:'no-cache'}).then(function(r){
    if(!r.ok) throw new Error(u+' '+r.status); return r.json(); }); }
  return Promise.all([grab('data/deja-vroom-city.json'),
                      grab('data/deja-vroom-routes.json')])
    .then(function(a){ return fromExport(a[0],a[1]); });
}
/* The config export spells its sections out in full; inside, they are the same
   four short names the game has always used. */
function cfgFromExport(c){
  if(!c) return null;
  return {global:Object.assign({}, c.global||{}, c.model?{model:c.model}:{}),
          base:c.vehicleDefaults||{}, cars:c.vehicles||{},
          abase:c.arcadeDefaults||{}, acars:c.arcadeVehicles||{}};
}
/* The mapper's export is a tidied, self-describing shape - full words, nested
   objects, the model paths spelled out. Inside, everything is short and flat.
   This is the one place that knows both. */
function fromExport(city, routes){
  var placed=(city.placements||[]).map(function(q,i){
    var sc=q.scale||{};
    return {id:i+1, kit:q.kit, name:q.model, tint:q.tint||'',
            x:q.position.x, y:q.position.y||0, z:q.position.z,
            rot:q.rotationY||0,
            sx:sc.x===undefined?1:sc.x, sy:sc.y===undefined?1:sc.y,
            sz:sc.z===undefined?1:sc.z};
  });
  var scenes=(routes.scenes||[]).map(function(s,si){
    return {id:si+1, name:s.name||('Scene '+(si+1)),
            cam:s.camera?{x:s.camera.x, z:s.camera.z, w:s.camera.width}:null,
            levels:(s.levels||[]).map(function(l,li){
              return {id:li+1, who:l.character||'', blurb:l.blurb||'',
                      offset:l.startOffset||0, water:!!l.onWater,
                      veh:{model:l.vehicle.model, x:l.vehicle.x, z:l.vehicle.z,
                           rot:l.vehicle.headingDeg||0},
                      goal:{x:l.goal.x, z:l.goal.z, rot:l.goal.headingDeg||0}};
            })};
  });
  return {city:{placed:placed},
          routes:{scenes:scenes,
                  vehScale:(typeof routes.vehicleScale==='number')?routes.vehicleScale:1}};
}
/* ==========================================================================
   the mapper's store
   ========================================================================== */
/* Read-only, and careful about it. Opening a database that is not there
   CREATES it - empty, at version 1 - and an empty version 1 is poison for the
   mapper: the mapper opens version 1 too, so it never gets the upgrade event
   it would have created its 'kv' store in, and every save silently fails
   afterwards. Playing the game must not be able to break the mapper, so if
   this open turns out to have been a creation it is torn straight back down
   and reported as what it is: nothing saved yet. */
function kvAll(){
  return new Promise(function(res,rej){
    var rq=indexedDB.open('dejavroom-mapper'), mine=false;
    rq.onupgradeneeded=function(){ mine=true; };   // fires only when WE made it
    rq.onerror=function(){ rej(rq.error); };
    rq.onsuccess=function(){
      var db=rq.result;
      if(mine || !db.objectStoreNames.contains('kv')){
        db.close();
        if(mine) try{ indexedDB.deleteDatabase('dejavroom-mapper'); }catch(e){}
        return rej(new Error('no kv store'));
      }
      var keys=['city','routes','config'];
      var t=db.transaction('kv','readonly').objectStore('kv'), out={}, left=keys.length;
      keys.forEach(function(k){
        var g=t.get(k);
        g.onsuccess=function(){ out[k]=g.result; if(!--left) res(out); };
        g.onerror=function(){ if(!--left) res(out); };
      });
    };
  });
}

/* ==========================================================================
   scene, physics world
   ========================================================================== */
var scene,cam,ren,world,clockEl=document.getElementById('clock');
var GROUND_MAT,CAR_MAT;

function initWorld(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x1a0b2e);
  scene.fog=new THREE.Fog(0x2a1140, 70, 260);

  /* near/far are sized to the world, not guessed: the whole map is about 70
     units across and the camera never sits more than ~20 above it, so a ratio
     of ~1300 leaves plenty of depth precision. The logarithmic depth buffer
     that used to be here was the cause of the shimmering on the road: three
     r128 computes it per-VERTEX unless EXT_frag_depth is present, and the road
     tiles are huge two-triangle quads, so the depth across them was wrong
     between the corners and the surfaces fought each other. */
  cam=new THREE.PerspectiveCamera(42,1,0.3,400);
  ren=new THREE.WebGLRenderer({canvas:document.getElementById('cv'),antialias:true,
                               powerPreference:'high-performance'});
  ren.setPixelRatio(Math.min(devicePixelRatio,1.75));
  ren.outputEncoding=THREE.sRGBEncoding;
  ren.shadowMap.enabled=true; ren.shadowMap.type=THREE.PCFSoftShadowMap;

  scene.add(new THREE.HemisphereLight(0xffe8cf,0x3a2340,0.85));
  /* A 70s look without a post-processing pass: the sun is warmed towards
     late afternoon and the sky cooled a touch behind it, which is the golden
     hour every film from 1974 was shot in. It costs nothing - the colours are
     constants - and unlike a colour grade it cannot slow the tablet down. */
  var key=new THREE.DirectionalLight(0xffd9a0,0.95);
  key.position.set(-60,90,40); key.castShadow=true;
  /* The old box was 68 units across - most of the map - for a car a third of a
     unit long, so 1024 pixels of shadow map worked out at about 15 texels per
     car and everything in it was re-rendered every frame. Sized to what the
     chase camera can actually see instead: sharper, and far less to draw. */
  key.shadow.mapSize.set(1024,1024);
  var d=13;
  key.shadow.camera.left=-d; key.shadow.camera.right=d;
  key.shadow.camera.top=d;  key.shadow.camera.bottom=-d;
  key.shadow.camera.near=40; key.shadow.camera.far=170;
  key.shadow.bias=-0.0004; key.shadow.normalBias=0.02;
  scene.add(key); scene.add(key.target);
  SUN=key;
  var fill=new THREE.DirectionalLight(0x93a9ff,0.25);
  fill.position.set(45,30,-50); scene.add(fill);

  world=new CANNON.World();
  world.gravity.set(0,-GCFG.gravity,0);
  world.broadphase=new CANNON.SAPBroadphase(world);
  world.defaultContactMaterial.friction=0.35;
  world.solver.iterations=7;
  world.allowSleep=true;

  GROUND_MAT=new CANNON.Material('ground');
  CAR_MAT=new CANNON.Material('car');
  world.addContactMaterial(new CANNON.ContactMaterial(GROUND_MAT,CAR_MAT,
    {friction:0.28, restitution:0.08}));

  var g=new CANNON.Body({mass:0, material:GROUND_MAT,
        shape:new CANNON.Box(new CANNON.Vec3(2000,1,2000))});
  g.position.set(0,-1,0);
  world.addBody(g);

var SUN=null, GROUND_BODY=null;

/* ==========================================================================
   loading models
   ========================================================================== */
THREE.Cache.enabled=true;
var LOADER=new THREE.GLTFLoader(), MCACHE={};
/* Every model in a Kenney kit paints from the same colormap image, but each GLB
   arrives with its own copy of it - 54 models meant 54 texture objects that the
   renderer could not tell apart, so nothing could be batched together. One
   texture per image, shared, and the city collapses into a handful of draws. */
var TEXCACHE={};
function shareTextures(root,kit){
  root.traverse(function(m){
    if(!m.isMesh||!m.material) return;
    var mats=Array.isArray(m.material)?m.material:[m.material];
    mats.forEach(function(mat){
      if(!mat.map||!mat.map.image) return;
      /* A texture out of a GLB has no src - the image arrives as raw bytes - so
         it is keyed by the kit and the image's dimensions instead. Each Kenney
         kit ships exactly one colormap, so that is enough to tell them apart
         while letting every model in a kit share one texture object. */
      var im=mat.map.image;
      var key=kit+'|'+(im.width||0)+'x'+(im.height||0)+'|'+
              mat.map.encoding+'|'+mat.map.flipY;
      var have=TEXCACHE[key];
      if(!have){ TEXCACHE[key]=mat.map; return; }
      if(have!==mat.map){ mat.map.dispose(); mat.map=have; mat.needsUpdate=true; }
    });
  });
}
function loadModel(kit,name){
  var k=kit+'/'+name;
  if(MCACHE[k]) return MCACHE[k];
  MCACHE[k]=new Promise(function(res,rej){
    LOADER.load(glbUrl(kit,name),function(g){
      shareTextures(g.scene,kit);
      res(g.scene);
    },null,rej);
  });
  return MCACHE[k];
}

/* A flat piece is scenery you drive over - the ground plane already holds the
   car up, so giving it a collider only creates a lip to trip on. Everything
   else collides on its real geometry, as a convex hull. */
var RAMP=/ramp|slant|bridge/, RAMP_GROUP=4, RAMP_BODIES=[], DECK_BODIES=[];
function colliderKind(name, size, high){
  /* A bridge carries a road over a road: its own deck on top, another way
     through underneath, the two at right angles. Both are surfaces to drive
     on, so it collides as its real triangles like a ramp does - a hull would
     seal the underpass, and nothing at all left the deck with no floor, which
     is why a car that got up there dropped straight through to the road below. */
  if(/bridge/.test(name)) return 'ramp';
  /* A flat piece on the ground needs no collider - the floor under the whole
     map already holds the car up at zero. A flat piece laid ON something,
     though, is the top of a bridge, and without a collider of its own there is
     nothing there to drive on: the car stays at ground level while the road
     sits half a unit over its head. Those get a deck. */
  if(size.y<0.22) return high ? 'deck' : 'none';
  /* Things you pass UNDER. A convex hull cannot have a hole in it, so a sign
     gantry on legs or a bridge deck on piers comes out as a solid wall across
     the road. Those are scenery. Ramps and slants keep their hull, because the
     point of them is driving UP. */
  if(/sign/.test(name)) return 'none';
  return 'hull';
}
/* Why a hull and not the triangle mesh: cannon 0.6.2 never registers the
   CONVEXPOLYHEDRON|TRIMESH narrowphase pair - it is commented out in the
   library - so a Trimesh produces ZERO contacts against the car's box chassis
   and the car sails straight through it. Measured: 0 contacts on a trimesh
   wall, 20 on the same wall as a convex hull. A hull is the most faithful
   shape cannon will actually collide with, and it follows the real silhouette
   - roof slopes, setbacks, spires - rather than squaring the model off. It
   does fill in concave detail, so anything you are meant to drive THROUGH or
   UNDER needs splitting into parts in the kit. */
function pointsOf(root){
  var pts=[];
  root.updateMatrixWorld(true);
  root.traverse(function(m){
    if(!m.isMesh||!m.geometry||!m.geometry.attributes.position) return;
    var P=m.geometry.attributes.position, v=new THREE.Vector3();
    for(var i=0;i<P.count;i++)
      pts.push(v.fromBufferAttribute(P,i).applyMatrix4(m.matrixWorld).clone());
  });
  return pts;
}
function hullOfPoints(pts){
  if(pts.length<4) return null;
  /* how big this point set is, so "zero area" means zero at ITS scale - a thin
     slab's real faces are small and must not be mistaken for slivers */
  var ex=0, mnp=[1e9,1e9,1e9], mxp=[-1e9,-1e9,-1e9];
  pts.forEach(function(q){
    mnp[0]=Math.min(mnp[0],q.x); mxp[0]=Math.max(mxp[0],q.x);
    mnp[1]=Math.min(mnp[1],q.y); mxp[1]=Math.max(mxp[1],q.y);
    mnp[2]=Math.min(mnp[2],q.z); mxp[2]=Math.max(mxp[2],q.z); });
  ex=Math.max(mxp[0]-mnp[0], mxp[1]-mnp[1], mxp[2]-mnp[2]);
  var epsA=Math.max(1e-12, ex*ex*1e-6);
  var hull;
  try{ hull=new THREE.ConvexHull().setFromPoints(pts); }catch(e){ return null; }
  if(!hull||!hull.faces||hull.faces.length<4) return null;
  /* three's hull walks each face's edge loop counter-clockwise seen from
     outside, which is exactly the winding cannon wants. */
  var verts=[], faces=[], seen={};
  for(var f=0;f<hull.faces.length;f++){
    var face=[], e=hull.faces[f].edge, guard=0, q, A, B, C;
    do{
      var q=e.head().point;
      var k=q.x.toFixed(4)+'|'+q.y.toFixed(4)+'|'+q.z.toFixed(4);
      if(!(k in seen)){ seen[k]=verts.length; verts.push(new CANNON.Vec3(q.x,q.y,q.z)); }
      if(face.indexOf(seen[k])<0) face.push(seen[k]);
      e=e.next;
    } while(e!==hull.faces[f].edge && ++guard<64);
    if(face.length<3) continue;
    /* cannon takes each face's normal from its FIRST THREE vertices only, so a
       sliver triangle (three points in a line) hands it a garbage axis - and a
       garbage separating axis is a contact it can get wrong. Quickhull leaves a
       few of these on almost every building. Rotate each loop so it starts on
       its widest corner, and drop any face that has no non-degenerate corner at
       all: a zero-area face adds nothing to a convex shape. */
    var bestK=-1, bestA=0;
    for(var q=0;q<face.length;q++){
      var A=verts[face[q]], B=verts[face[(q+1)%face.length]], C=verts[face[(q+2)%face.length]];
      var ux=B.x-A.x, uy=B.y-A.y, uz=B.z-A.z, vx=C.x-A.x, vy=C.y-A.y, vz=C.z-A.z;
      var a=Math.sqrt(Math.pow(uy*vz-uz*vy,2)+Math.pow(uz*vx-ux*vz,2)+Math.pow(ux*vy-uy*vx,2));
      if(a>bestA){ bestA=a; bestK=q; }
    }
    if(bestA<epsA) continue;                       // a face with no area at all
    if(bestK>0) face=face.slice(bestK).concat(face.slice(0,bestK));
    faces.push(face);
  }
  if(verts.length<4||faces.length<4) return null;
  /* Centre the hull on its own middle and hand the offset back. cannon assumes
     a convex shape straddles its body's origin: it measures the boundingSphere
     from there (so an off-centre hull gets a sphere big enough to reach the
     world origin, and broadphase then pairs it with half the map), and its
     normal check tests against the origin too. */
  /* the average of the hull's own vertices, which is a convex combination of
     them and so is always strictly inside - a bounding-box centre is not. */
  var off=new CANNON.Vec3(0,0,0);
  verts.forEach(function(v){ off.x+=v.x/verts.length; off.y+=v.y/verts.length;
                             off.z+=v.z/verts.length; });
  verts.forEach(function(v){ v.x-=off.x; v.y-=off.y; v.z-=off.z; });
  try{ return {shape:new CANNON.ConvexPolyhedron(verts,faces), at:off}; }
  catch(e){ return null; }
}
/* One convex hull per piece. A hull cannot have a hole in it, so anything you
   are meant to drive UNDER - a bridge deck on piers, a sign gantry on legs -
   comes out solid. Splitting such a piece into slabs was tried and made things
   worse: the slabs are thin enough for the car to tunnel through, and the
   bridge stayed sealed anyway. The honest fix is in the kit, not the physics -
   author a drive-under piece as separate deck and pier models and the hulls
   follow. Everything else, buildings included, is close enough to convex that
   one hull is the real silhouette. */
function hullsOf(root){
  var h=hullOfPoints(pointsOf(root));
  return h? [h] : [];
}
function trimeshOf(root){
  var verts=[], idx=[], base=0;
  root.updateMatrixWorld(true);
  root.traverse(function(m){
