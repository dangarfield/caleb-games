    var g=m.geometry.index?m.geometry.toNonIndexed():m.geometry;
    var P=g.attributes.position, v=new THREE.Vector3();
    for(var i=0;i<P.count;i++){
      v.fromBufferAttribute(P,i).applyMatrix4(m.matrixWorld);
      verts.push(v.x,v.y,v.z);
    }
    for(var j=0;j<P.count;j++) idx.push(base+j);
    base+=P.count;
  });
  return (verts.length&&idx.length)? new CANNON.Trimesh(verts,idx) : null;
}

var CITY=null, ROUTES=null, WORLD_BODIES=[], SOLID_BODIES=[], HULL_FAIL=0;

/* What you are driving ON. The flat pieces get no collider - you roll over the
   ground plane - so the surface is looked up from the map instead: every flat
   tile paints its footprint into a half-unit grid, and the car asks the grid
   where it is. Tinted tiles are the tell: the mapper's grass, sand and water
   variants of tile-low carry their tint through to here. */
var SURF={}, SURF_CELL=0.25;
var SURFACE={road:{grip:1, speed:1}, grass:{grip:0.45, speed:0.9},
             sand:{grip:0.75, speed:0.62},
             water:{grip:0.3, speed:0.5, hole:true, wet:true},  // drive in and you go under
             off:{grip:0.6, speed:0.9},
             /* dry land, seen from a boat */
             dryhole:{grip:0.6, speed:0.9, hole:true}};
function surfKindOf(p){
  if(p.tint&&SURFACE[p.tint]) return p.tint;
  if(/grass|park|field/.test(p.name)) return 'grass';
  if(/sand|beach|desert/.test(p.name)) return 'sand';
  if(/water|river|canal/.test(p.name)) return 'water';
  return 'road';
}
/* Tiles overlap - a road is laid on top of the ground it crosses - so the
   HIGHEST piece in a cell is the one you are driving on, not the last one
   placed. Without this the grass underneath wins and the whole map is slippery. */
function paintSurface(g,p){
  var bb=new THREE.Box3().setFromObject(g);
  var k=surfKindOf(p), top=bb.max.y;
  /* A cell counts as covered when its CENTRE falls inside the piece. Stepping
     out from the minimum and rounding, as this used to, spread every tile up to
     half a cell past its own edge - which for water meant the hole reached a
     quarter of a unit onto the road beside it and swallowed cars that were
     still on tarmac. Water is inset by a further cell on top of that, because
     falling in should need you to actually be in it. */
  var inset=(k==='water')? SURF_CELL : 0;
  /* Water is ALSO recorded over its full footprint, separately from the
     business above. That record is what a boat floats on, and it has to be
     kept apart for two reasons: the inset above would strand a boat a quarter
     of a unit from every bank, and the highest-piece rule would take the water
     away entirely wherever a bridge, a slant or a road crosses over it - so a
     boat sank every time it passed underneath one. Water is water even with
     something built above it. */
  /* A bridge takes the place of the tile it spans, so the water tiles stop at
     its edge and start again on the other side. Mark its footprint, and the
     pass below carries the river through the gap - but only where there really
     is river on either side. */
  if(/bridge/.test(p.name)){
    var bi0=Math.ceil(bb.min.x/SURF_CELL), bi1=Math.floor(bb.max.x/SURF_CELL);
    var bj0=Math.ceil(bb.min.z/SURF_CELL), bj1=Math.floor(bb.max.z/SURF_CELL);
    for(var bi=bi0;bi<=bi1;bi++) for(var bj=bj0;bj<=bj1;bj++){
      var bk=bi+','+bj;
      (SURF[bk] || (SURF[bk]={k:'road', y:top})).b=true;
    }
  }
  if(k==='water'){
    var wi0=Math.ceil(bb.min.x/SURF_CELL), wi1=Math.floor(bb.max.x/SURF_CELL);
    var wj0=Math.ceil(bb.min.z/SURF_CELL), wj1=Math.floor(bb.max.z/SURF_CELL);
    for(var wi=wi0;wi<=wi1;wi++) for(var wj=wj0;wj<=wj1;wj++){
      var wk=wi+','+wj, c=SURF[wk];
      if(!c) c=SURF[wk]={k:'water', y:top};
      c.w=true;
      if(c.wy===undefined || top>c.wy) c.wy=top;     // the water's own surface
    }
  }
  var i0=Math.ceil((bb.min.x+inset)/SURF_CELL), i1=Math.floor((bb.max.x-inset)/SURF_CELL);
  var j0=Math.ceil((bb.min.z+inset)/SURF_CELL), j1=Math.floor((bb.max.z-inset)/SURF_CELL);
  for(var i=i0;i<=i1;i++) for(var j=j0;j<=j1;j++){
    var key=i+','+j, had=SURF[key];
    /* Normally the highest piece in a cell is the one you drive on. Water is
       the exception: it is a hole, and a hole cannot be paved over by a road
       tile stacked above it. */
    /* The highest piece in a cell is the one you drive on - lay a road or a
       driveway across the water and it is road, not a hole. Water only keeps a
       cell when nothing has been built over it; on a dead heat the solid piece
       wins, because a surface drawn on top of the water is meant to be driven
       on. */
    if(!had || top>had.y+1e-4 ||
       (Math.abs(top-had.y)<=1e-4 && had.k==='water' && k!=='water')){
      if(had){ had.k=k; had.y=top; }                 // keep the water record
      else SURF[key]={k:k, y:top};
    }
  }
}
function surfCell(x,z){
  return SURF[Math.round(x/SURF_CELL)+','+Math.round(z/SURF_CELL)];
}
/* Carry the water under the bridges. A bridged cell with river on one side
   becomes river itself, and repeating that a few times walks the channel right
   through the gap - while a bridge over a road, with no water anywhere near
   it, stays dry. */
function bridgeWater(){
  for(var pass=0; pass<10; pass++){
    var grew=0;
    for(var key in SURF){
      var c=SURF[key];
      if(!c.b || c.w) continue;
      var ij=key.split(','), i=+ij[0], j=+ij[1];
      var n=SURF[(i+1)+','+j] || SURF[(i-1)+','+j] ||
            SURF[i+','+(j+1)]  || SURF[i+','+(j-1)];
      var src=[SURF[(i+1)+','+j],SURF[(i-1)+','+j],SURF[i+','+(j+1)],SURF[i+','+(j-1)]]
              .filter(function(q){ return q&&q.w; })[0];
      if(src){ c.w=true; c.wy=src.wy||0; grew++; }
    }
    if(!grew) break;
  }
}
/* the height of the water at a point, or null if there is none there */
function waterYAt(x,z){
  var c=surfCell(x,z);
  return (c&&c.w) ? (c.wy||0) : null;
}
function surfaceAt(x,z){
  var c=surfCell(x,z);
  var s=(c&&SURFACE[c.k])||SURFACE.off;
  /* A level flagged "on water" in the mapper is a boat, and the whole thing
     turns inside out: the water is the road, and everything else - tarmac,
     grass, sand, the ground itself - is the hole. So the water is handed back
     with the road's grip and speed (its own numbers are for a CAR touching
     water, which is a different thing entirely) and dry land is handed back as
     a hole to fall into. */
  if(!onWaterLevel()) return s;
  return (c&&c.w) ? SURFACE.road : SURFACE.dryhole;
}
/* is the level being played a boat level? */
function onWaterLevel(){
  var sc=G&&G.scene, lv=sc&&sc.levels&&sc.levels[G.levelIdx];
  return !!(lv&&lv.water);
}

function buildCity(placed,onProgress){
  var group=new THREE.Group(); scene.add(group);
  var keys={}; placed.forEach(function(p){ keys[p.kit+'/'+p.name]=1; });
  var names=Object.keys(keys), done=0;
  return Promise.all(names.map(function(k){
    var bits=k.split('/');
    return loadModel(bits[0],bits[1]).then(function(src){
      done++; if(onProgress) onProgress(done/names.length);
      return src;
    }).catch(function(){ done++; return null; });
  })).then(function(){
    placed.forEach(function(p){
      var src=null;
      MCACHE[p.kit+'/'+p.name].then(function(s){ src=s; });
    });
    // everything is cached now, so resolve synchronously in order
    return Promise.all(placed.map(function(p){
      return MCACHE[p.kit+'/'+p.name].then(function(src){ return {p:p,src:src}; })
                                      .catch(function(){ return null; });
    }));
  }).then(function(list){
    list.forEach(function(it){
      if(!it||!it.src) return;
      var p=it.p, o=it.src.clone(true);
      if(p.tint&&TINTS[p.tint]){
        var col=new THREE.Color(TINTS[p.tint]);
        o.traverse(function(m){ if(!m.isMesh) return;
          m.material=m.material.clone(); m.material.map=null; m.material.color=col; });
      }
      o.traverse(function(m){ if(m.isMesh){ m.castShadow=true; m.receiveShadow=true; } });
      /* Anything tall enough to stand between the camera and the car is kept
         OUT of the merge below, so it can be faded on its own when it does.
         Everything else - roads, paths, kerbs, flat scenery - merges as before,
         which is where the draw calls were saved. */
      /* Anything that STANDS UP can get between the camera and the car, so it
         stays its own object and can turn to glass on its own. The flat ground
         you drive on - roads, driveways, paths, tiles - merges, because a
         merged mesh cannot fade one piece of itself and tarmac should never
         vanish anyway. No height test: a solar panel on a pole and a tree are
         both in the way, whatever they measure. */
      var tall=!FLAT_GROUND.test(p.name);
      var g=new THREE.Group(); g.add(o);
      /* its plan position is kept on it, so the near-the-car filter is a
         distance check and never has to touch the geometry */
      if(tall){ g.userData.tall=true; g.userData.cx=p.x; g.userData.cz=p.z; TALL.push(g); }
      /* Roads draw over driveways and paths: coplanar flat pieces, so which
         one shows where they overlap is down to the depth buffer and flickers
         as the camera moves. A few thousandths of lift on anything called
         "road" settles it - well under the climb allowance and invisible. */
      g.position.set(p.x, (p.y||0)+(/road/.test(p.name)?0.004:0), p.z);
      g.rotation.y=(p.rot||0)*Math.PI/180;
      g.scale.set(p.sx===undefined?1:p.sx, p.sy===undefined?1:p.sy, p.sz===undefined?1:p.sz);
      group.add(g);
      addCollider(p,it.src);
      paintSurface(g,p);
    });
    bridgeWater();                     // the river runs on under the bridges
    mergeStatic(group);
    return group;
  });
}
/* The city never moves, so every placement sharing a material can collapse
   into one mesh. 277 pieces is 240-odd draw calls otherwise; this takes it to
   one per material. */
function mergeStatic(root){
  root.updateMatrixWorld(true);
  var byMat={}, keep=[];
  root.traverse(function(m){
    if(!m.isMesh||!m.geometry) return;
    for(var q=m; q; q=q.parent) if(q.userData&&q.userData.tall) return;   // faded on its own
    var mat=Array.isArray(m.material)?m.material[0]:m.material;
    /* Group by what the material LOOKS like, not by which instance it is.
       Every Kenney kit paints from one shared colormap, so dozens of separate
       material objects are pixel-for-pixel identical - keying on uuid left 74
       draw calls for a city that only needs a handful. */
    var key=(mat.map?mat.map.uuid:'-')+'|'+(mat.color?mat.color.getHexString():'-')+
            '|'+(mat.transparent?1:0)+'|'+(mat.opacity||1).toFixed(2)+
            '|'+mat.side+'|'+(mat.emissive?mat.emissive.getHexString():'-')+
            '|'+(mat.type||'');
    (byMat[key]||(byMat[key]={mat:mat,list:[]})).list.push(m);
  });
  var merged=new THREE.Group();
  Object.keys(byMat).forEach(function(k){
    var grp=byMat[k], pos=[], nor=[], uv=[];
    var nm=new THREE.Matrix3();
    grp.list.forEach(function(m){
      var geo=m.geometry.index?m.geometry.toNonIndexed():m.geometry;
      var P=geo.attributes.position, N=geo.attributes.normal, U=geo.attributes.uv;
      var v=new THREE.Vector3(); nm.getNormalMatrix(m.matrixWorld);
      for(var i=0;i<P.count;i++){
        v.fromBufferAttribute(P,i).applyMatrix4(m.matrixWorld);
        pos.push(v.x,v.y,v.z);
        if(N){ v.fromBufferAttribute(N,i).applyMatrix3(nm).normalize(); nor.push(v.x,v.y,v.z); }
        else nor.push(0,1,0);
        if(U) uv.push(U.getX(i),U.getY(i)); else uv.push(0,0);
      }
    });
    if(!pos.length) return;
    var g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
    g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
    g.computeBoundingSphere();
    var mesh=new THREE.Mesh(g,grp.mat);
    mesh.castShadow=true; mesh.receiveShadow=true;
    merged.add(mesh);
  });
  TALL.forEach(function(g){ if(g.parent===root) keep.push(g); });
  while(root.children.length) root.remove(root.children[0]);
  root.add(merged);
  keep.forEach(function(g){ root.add(g); });
}

/* ==========================================================================
   Seeing through the buildings

   A tower between the camera and the car is the one thing the fixed chase view
   cannot solve by moving, so anything caught in the way turns to glass while
   it is there. A ray from the camera to the car finds them; each one swaps to
   a see-through copy of its own material and swaps back a moment after it
   stops blocking, the delay being what stops a corner clipping the ray from
   flickering. Only the tall pieces are tested, and only while you are driving.
   ========================================================================== */
/* The flat ground you drive on. Everything else stands up, and anything that
   stands up can be in the way. */
var FLAT_GROUND=/^(road|driveway|path|tile|crossing|pavement)/;
/* NEAR is how far from the camera-to-car line a piece has to be before it is
   worth testing at all: 2 units in plan, which around here is six car lengths.
   Height never comes into it. An earlier version tried to decide by how tall a
   thing was and got the hospital reel wrong twice over - its 347 trees measured
   0.77 against a 0.8 line and merged away, and its solar panels are flat plates
   standing a whole unit up in the air. What a piece measures says nothing about
   whether it is between you and the camera; only the ray knows that. */
var SEE_THRU={near:2, opacity:0.05, hold:0.25}, TALL=[], GHOSTS={}, seeRay=null;
function ghostOf(mat){
  var k=mat.uuid;
  if(!GHOSTS[k]){
    var m=mat.clone();
    m.transparent=true; m.opacity=SEE_THRU.opacity; m.depthWrite=false;
    GHOSTS[k]=m;
  }
  return GHOSTS[k];
}
function seeThrough(dt){
  if(!TALL.length) return;
  if(!seeRay) seeRay=new THREE.Raycaster();
  var clear = !G.car || G.phase!=='driving';
  if(!clear){
    var p=G.car.body.position;
    var from=cam.position, dir=new THREE.Vector3(p.x,p.y,p.z).sub(from);
    var far=dir.length(); dir.normalize();
    /* Only the pieces near the line from the camera to the car are worth
       casting against - a handful out of a thousand. The measure is distance in
       plan to the SEGMENT, not to the car: the camera sits two and a half units
       behind, so a building right behind you is nowhere near the car and square
       in the way. */
    var ax=from.x, az=from.z, bx=p.x, bz=p.z;
    var dx=bx-ax, dz=bz-az, L2=(dx*dx+dz*dz)||1e-6, R=SEE_THRU.near, near=[];
    for(var i=0;i<TALL.length;i++){
      var u=TALL[i].userData;
      var t=Math.max(0,Math.min(1,((u.cx-ax)*dx+(u.cz-az)*dz)/L2));
      var ox=ax+dx*t-u.cx, oz=az+dz*t-u.cz;
      if(ox*ox+oz*oz<=R*R) near.push(TALL[i]);
    }
    if(near.length){
      seeRay.set(from, dir); seeRay.far=far; seeRay.near=0.01;
      var hits=seeRay.intersectObjects(near, true);
      for(var h=0;h<hits.length;h++){
        for(var q=hits[h].object; q; q=q.parent)
          if(q.userData&&q.userData.tall){ q.userData.fade=SEE_THRU.hold; break; }
      }
    }
  }
  for(var j=0;j<TALL.length;j++){
    var g=TALL[j], want;
    if(clear) g.userData.fade=0;
    else if(g.userData.fade>0) g.userData.fade-=dt;
    want = g.userData.fade>0;
    if(want===!!g.userData.ghosted) continue;        // already as it should be
    g.userData.ghosted=want;
    g.traverse(function(m){
      if(!m.isMesh) return;
      if(want){ m.userData.solidMat=m.material; m.material=ghostOf(m.material); }
      else if(m.userData.solidMat){ m.material=m.userData.solidMat; }
    });
  }
}
/* Colliders are built once per model-and-scale and reused: the hull of a
   5000-triangle building is not something to recompute for all 640 placements.
   Position and rotation live on the body, so one cached shape serves every
   copy of a piece. */
var SHAPE_CACHE={};
function shapesFor(p,src){
  var sx=p.sx===undefined?1:p.sx, sy=p.sy===undefined?1:p.sy, sz=p.sz===undefined?1:p.sz;
  var high=(p.y||0)>0.05;                       // laid on top of something
  var key=p.kit+'/'+p.name+'|'+sx+'|'+sy+'|'+sz+(high?'|hi':'');
  if(key in SHAPE_CACHE) return SHAPE_CACHE[key];
  var t=new THREE.Group(); t.add(src.clone(true));
  t.scale.set(sx,sy,sz); t.updateMatrixWorld(true);
  var bb=new THREE.Box3().setFromObject(t), size=bb.getSize(new THREE.Vector3());
  var out, kind=colliderKind(p.name,size,high);
  if(kind==='none') out=null;
  else if(kind==='deck') out={box:new CANNON.Vec3(size.x/2,size.y/2,size.z/2),
                              at:bb.getCenter(new THREE.Vector3()), deck:true};
  else if(RAMP.test(p.name)){
    /* A ramp is the one place a convex hull is actively wrong. These slants
       curve as they rise, so the hull cuts the corner and its surface at the
       low end sits 0.2 units up - a lip that does not exist in the model at
       all, and one the car cannot climb. Ramps therefore collide as their real
       triangles, which rise from nothing. cannon cannot push a box out of a
       trimesh, but it never has to: ramps are raycast-only, and raycasting a
       trimesh works perfectly well. */
    var tm=trimeshOf(t);
    out = tm ? {mesh:tm} : null;
  }
  else{
    var hulls=hullsOf(t);
    out = hulls.length ? {hulls:hulls}
        : {box:new CANNON.Vec3(size.x/2,size.y/2,size.z/2),
           at:bb.getCenter(new THREE.Vector3())};
  }
  SHAPE_CACHE[key]=out;
  return out;
}
function addCollider(p,src){
  var sh=shapesFor(p,src);
  if(!sh) return;
  var rot=(p.rot||0)*Math.PI/180, ca=Math.cos(rot), sa=Math.sin(rot);
  /* the model's local frame turned into the world: three's rotation.y = rot is
     Ry(rot), so local (x,z) lands at (x*cos + z*sin, -x*sin + z*cos) */
  var place=function(v){ return new CANNON.Vec3(p.x + v.x*ca + v.z*sa,
                                                (p.y||0) + v.y,
                                                p.z - v.x*sa + v.z*ca); };
  var body=new CANNON.Body({mass:0, material:GROUND_MAT});
  body.quaternion.setFromAxisAngle(new CANNON.Vec3(0,1,0), rot);
  /* A ramp is a surface, not an obstacle. Its convex hull has a vertical face
     at the bottom of the slope and the chassis box hits that before the wheels
     ever reach the incline, so you stop dead at the foot of the thing you are
     meant to drive up. A ramp is therefore put in a collision group of its own
     that nothing else shares: the narrowphase never pairs it with the car, so
     there is nothing to bump into, while the suspension rays still find it and
     carry the car up. (Turning collision response off instead does NOT work -
     cannon's rays skip those bodies, so the wheels stop seeing the ramp too.) */
  if(RAMP.test(p.name)){ body.collisionFilterGroup=RAMP_GROUP;
                         body.collisionFilterMask=RAMP_GROUP;
                         RAMP_BODIES.push(body); }
  /* a deck is a surface too: something to drive on, never something to bump
     into - otherwise the underside of a bridge is a wall across the road */
  if(sh.deck){ body.collisionFilterGroup=RAMP_GROUP;
               body.collisionFilterMask=RAMP_GROUP;
               DECK_BODIES.push(body); }
  if(sh.mesh){
    body.addShape(sh.mesh);
    body.position.set(p.x, p.y||0, p.z);
  } else if(sh.box){
    body.addShape(new CANNON.Box(sh.box));
    body.position.copy(place(sh.at));
    if(!sh.deck) HULL_FAIL++;
  } else {
    var base=sh.hulls[0].at;
    body.position.copy(place(base));
    sh.hulls.forEach(function(h){
      body.addShape(h.shape,
        new CANNON.Vec3(h.at.x-base.x, h.at.y-base.y, h.at.z-base.z));
    });
  }
  world.addBody(body); WORLD_BODIES.push(body);
  if(body.collisionFilterGroup!==RAMP_GROUP) SOLID_BODIES.push(body);
}

/* ==========================================================================
   TWO DRIVING MODELS

   'sim'    - the original: a cannon.js RaycastVehicle with springs, tyre
              friction and a rigid body. Everything below marked Car.prototype
              .drive / .hold / climbStep belongs to it.

   'arcade' - the model from the drift game, which is not a simulation at all.
              The car is a point with a heading and a 2D velocity vector, and
              the two are INDEPENDENT. Steering turns the heading directly - no
              torque, no inertia, no lag. Each frame the velocity is split into
              the part along the nose and the part across it; the forward part
              accelerates, the sideways part decays at a rate set by grip, and
              the two are put back together. Nothing creates the slide: it
              appears because the heading rotates while the velocity does not.

              Every constant below is drift's own, kept in its units (pixels
              per 60Hz frame) and converted through the car's length, so the
              feel is identical. Decays use pow(base, frames) so they behave
              the same at any frame rate.

   Drift is flat. This is not, so the arcade model adds a height channel:
   the ground under the car is sampled every step, the car rides it up and
   down slopes and bridges, and when the ground falls away faster than gravity
   the car is simply airborne until it meets it again - which is a jump.
   ========================================================================== */
var DRIVE_MODEL='arcade';
/* Pixels to a car length.  The drift game drew a 36px car, but this game ran
   the arcade move TWICE every frame and nobody noticed: driveArcade writes the
   body position itself AND hands cannon a velocity, and world.step integrated
   that same velocity a second time - position += velocity*dt, the identical
   displacement again.  So every arcade car always travelled at exactly double
   its own speed reading, and the whole 21-car table was tuned against that.
   Dropping world.step from this path (4.3ms a frame over 968 bodies, doing
   nothing else for a model that moves itself) took the doubling away with it,
   so the calibration moves here instead: 18 pixels to a car length is the same
   motion, arrived at honestly and only once.  x3.33 gives lengths a second. */
var ARC={ carPx:18, wallScrub:0.97, bogDown:0.12 };
/* Keep crashing on a level and the car gets a little slower for your next go,
   so a corner you cannot take eventually comes to you. The first few go free -
   everyone bins it now and then, and having the car change under you for one
   mistake is worse than the mistake. After that it is a tenth off the arcade
   model's own top speed each time, never below a crawl. Clear the level (or
   press the badge by the pause button) and it is back to normal. */
var HANDICAP={free:3, step:0.1, floor:1.2};     // drift's car is 36px long; ours is about 0.32 units
/* The arcade numbers, per vehicle, exactly as the drift game has them and in
   its units (pixels per 60Hz frame). The mapper's Config tab edits these when
   the handling is set to arcade; the simulated model's numbers in BASE are
   left completely alone. */
var ABASE={
  maxSpeed:6.2,           // px per frame
  accel:0.07,
  steerRate:0.045,        // radians per frame at a crawl
  steerSpeedFactor:0.45,  // how quickly steering tightens off with speed
  lateralDrag:0.0105,     // THE grip knob - how fast a slide dies away
