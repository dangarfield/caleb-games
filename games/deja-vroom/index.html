     car still creep onto a kerb instead of being welded to the spot. */
  var footY=b.position.y-this.rideH;
  var run=Math.max(Math.hypot(nx-b.position.x, nz-b.position.z), s.len*0.3);
  var rise=run*A.stepUp;

  var boat=onWaterLevel();
  var wall=sweptHit(this, b.position.x, b.position.z, nx, nz, a.ang);
  if(!wall && !a.air && !boat && stepBlocked(this, nx, nz, footY, rise)){
    /* into the side of a ramp or a deck: a face, not a climb. Stopping dead
       is what the crash detector reads as an impact, which is the point. */
    a.vx=0; a.vz=0;
  }
  else if(!wall){ b.position.x=nx; b.position.z=nz; }
  else {
    var wn=wall.x*a.vx + wall.z*a.vz;          // into the face if positive
    if(wn>0){ wall.x=-wall.x; wall.z=-wall.z; wn=-wn; }
    a.vx-=wall.x*wn; a.vz-=wall.z*wn;          // kill only the into-wall part
    a.vx*=ARC.wallScrub; a.vz*=ARC.wallScrub;
    nx=b.position.x + a.vx*PX*f; nz=b.position.z + a.vz*PX*f;
    if(sweptHit(this, b.position.x, b.position.z, nx, nz, a.ang) ||
       (!a.air && !boat && stepBlocked(this, nx, nz, footY, rise))){ a.vx=0; a.vz=0; }
    else { b.position.x=nx; b.position.z=nz; }
  }

  /* ---- height: slopes, decks and jumps ----
     The probe starts only as far above the wheels as this frame's climb
     allowance, so a road half a unit over your head is invisible to it and you
     drive under the bridge instead of being yanked onto it. In the air it
     starts at the roof, because then anything below you is somewhere to land. */
  var wet=surfaceAt(b.position.x,b.position.z).hole;
  var probe=a.air ? b.position.y+this.height : (b.position.y-this.rideH)+rise+0.01;
  /* A boat rides on the WATER, not on whatever the rays find. The river is
     flat, so there is nothing to climb, and the bridges, slants and roads
     crossing above it are things to pass under rather than obstacles or
     surfaces - it simply floats at the water's own height until it runs out of
     water, and then the hole rule takes over. */
  var gy = boat ? (wet ? null : waterYAt(b.position.x,b.position.z))
                : (wet ? null : groundAt(b.position.x, b.position.z, probe));
  var want=(gy===null)? null : gy+this.rideH;
  var maxRise=rise;
  if(want!==null && !a.air && want-b.position.y<=maxRise){
    /* on the ground: follow it. Rising is instant (that is the ramp), falling
       is instant only for small drops - a bigger one means you have left the
       ground and are in the air. */
    if(want>=b.position.y-this.height*0.35){
      b.position.y=want; a.vy=0;
    } else { a.air=true; }
  } else {
    a.air=true;
  }
  if(a.air){
    a.vy-=A.gravity*dt;
    b.position.y+=a.vy*dt;
    if(want!==null && b.position.y<=want){
      b.position.y=want; a.vy=0; a.air=false;              // landed
    }
  }

  /* ---- pitch: sit on the slope, not through it ----
     A probe under the nose and another under the tail, and the angle between
     them is how far the car should be tipped. This is what makes a slant look
     like a slant to drive up rather than a step the car floats over, and it
     costs two rays. Smoothed, so a seam between two tiles does not snap it. */
  var hl=s.len*0.5, px2=Math.cos(a.ang), pz2=-Math.sin(a.ang);
  var lift=Math.max(rise, this.height*0.6)+0.01;
  var noseY=groundAt(b.position.x+px2*hl, b.position.z+pz2*hl, b.position.y-this.rideH+lift);
  var tailY=groundAt(b.position.x-px2*hl, b.position.z-pz2*hl, b.position.y-this.rideH+lift);
  var slope=(!a.air && !boat && noseY!==null && tailY!==null)
            ? Math.atan2(noseY-tailY, s.len) : 0;   // a boat sits flat
  if(slope> 0.9) slope= 0.9;
  if(slope<-0.9) slope=-0.9;
  if(a.pitch===undefined) a.pitch=0;
  a.pitch += (slope-a.pitch)*Math.min(1, dt*12);

  /* everything else in the game reads the body, so keep it honest */
  b.velocity.set(a.vx*PX*60, a.vy, a.vz*PX*60);
  var qy=new CANNON.Quaternion(), qp=new CANNON.Quaternion();
  qy.setFromAxisAngle(new CANNON.Vec3(0,1,0), yawFromHeading(a.ang*180/Math.PI));
  qp.setFromAxisAngle(new CANNON.Vec3(1,0,0), -a.pitch);
  qy.mult(qp, b.quaternion);
  b.angularVelocity.set(0,0,0);
};
Car.prototype.arcadeSpeed=function(){
  if(!this.arc) return 0;
  return Math.hypot(this.arc.vx,this.arc.vz)*(this.stats.len/ARC.carPx)*60;
};
Car.prototype.placeArcade=function(x,z,headingDeg){
  this.arc={vx:0, vz:0, ang:headingDeg*Math.PI/180, vy:0, air:false, init:true};
};
Car.prototype.sync=function(alpha){
  if(!this.mesh) return;
  /* Position only. Slerping the rotation as well turned the whole car into NaN
     and it vanished: cannon hands back a quaternion whose length is a hair over
     1, so three's slerp took the square root of a very small negative number.
     Eight milliseconds of rotation is invisible anyway - it is the position
     that shows as judder - so the rotation is simply copied. */
  this.mesh.quaternion.copy(this.body.quaternion);
  if(this.p0 && alpha>0 && alpha<1)
    this.mesh.position.lerpVectors(this.p0, this.body.position, alpha);
  else
    this.mesh.position.copy(this.body.position);
  this.mesh.position.y += (this.lift||0);        // picture only
  /* The body rides lower as the springs compress, so a fixed offset buries the
     model in the road. Hang it off the live suspension instead. */
  var w=this.vehicle.wheelInfos, n=0, sum=0;
  for(var i=0;i<w.length;i++){ if(w[i].isInContact){ sum+=w[i].suspensionLength; n++; } }
  var len=n? sum/n : (this.rest-this.sag);
  /* Averaged, then low-passed. Taking the single most compressed corner made
     the body copy every wheel's twitch, which reads as bobbling even when the
     chassis itself is steady. */
  this.susSmooth = (this.susSmooth===undefined) ? len : this.susSmooth+(len-this.susSmooth)*0.18;
  this.model3d.position.y=this.drop-(this.wr+this.susSmooth);
};
Car.prototype.headingDeg=function(){
  if(DRIVE_MODEL==='arcade'&&this.arc&&this.arc.init)
    return this.arc.ang*180/Math.PI;
  var f=new CANNON.Vec3(0,0,1);
  this.body.quaternion.vmult(f,f);
  return Math.atan2(-f.z, f.x)*180/Math.PI;
};
Car.prototype.remove=function(){
  if(this.vehicle) this.vehicle.removeFromWorld(world);
  if(this.mesh) scene.remove(this.mesh);
};

/* ---- a finished run, replayed and solid ---- */
function Ghost(model,path,offset,scaleMul){
  this.path=path; this.offset=offset; this.model=model; this.sc=scaleMul||1;
  this.body=null; this.mesh=null; this.live=false;
}
Ghost.prototype.load=function(){
  var self=this;
  return loadModel('cars',this.model).then(function(src){
    var o=src.clone(true); o.scale.setScalar(self.sc); o.updateMatrixWorld(true);
    var pb=new THREE.Box3().setFromObject(o); o.position.y=-pb.min.y;
    o.traverse(function(m){ if(m.isMesh){ m.castShadow=true;
      m.material=m.material.clone(); m.material.transparent=true; m.material.opacity=0.92; }});
    o.updateMatrixWorld(true);
    var bb=new THREE.Box3().setFromObject(o), size=bb.getSize(new THREE.Vector3());
    var mesh=new THREE.Group(); mesh.add(o); mesh.visible=false; scene.add(mesh);
    var body=new CANNON.Body({mass:0, type:CANNON.Body.KINEMATIC, material:CAR_MAT});
    body.addShape(new CANNON.Box(new CANNON.Vec3(size.x/2,size.y/2,size.z/2)),
                  new CANNON.Vec3(0,size.y/2,0));
    body.collisionResponse=true;
    world.addBody(body);
    self.body=body; self.mesh=mesh; self.half=size.y/2;
    self.len=Math.max(size.x,size.z);       // for the nose and tail probes
    self.lift=liftFor(self.model);          // the same visual nudge as the car
    self.pitch=0;
    self.park();
    return self;
  });
};
Ghost.prototype.park=function(){ this.body.position.set(0,-500,0); this.mesh.visible=false; this.live=false; };
/* where a recorded run was at time t, interpolated between samples */
function sampleRec(p,rt){
  if(!p||!p.length) return null;
  var last=p[p.length-1], done=false;
  if(rt>last.t){ rt=last.t; done=true; }
  var i=Math.min(p.length-1, Math.max(0, Math.floor(rt*REC_HZ)));
  var a=p[i], b=p[Math.min(p.length-1,i+1)];
  var span=(b.t-a.t)||1e-6, k=Math.max(0,Math.min(1,(rt-a.t)/span));
  var d=((b.h-a.h+540)%360)-180;
  return {x:a.x+(b.x-a.x)*k, y:a.y+(b.y-a.y)*k, z:a.z+(b.z-a.z)*k,
          h:a.h+d*k, done:done};
}
/* hold: keep the car on screen at the start of its path instead of parking it
   out of sight. The rewind winds the clock back past every car's start time,
   and the point of watching it is seeing them all retrace their runs - not
   seeing them wink out one by one until only yours is left. */
Ghost.prototype.at=function(t,hold){
  var p=this.path, rt=t-this.offset;
  if(!p.length){ if(this.live) this.park(); return; }
  if(rt<0){ if(!hold){ if(this.live) this.park(); return; } rt=0; }
  var at=sampleRec(p,rt);
  var x=at.x, y=at.y, z=at.z, h=at.h;
  /* A run that has already finished is parked at its goal. It must stop being
     something to crash into, or the finish line fills up with wrecks. */
  this.body.collisionResponse=!at.done;
  this.body.collisionFilterMask=at.done?0:1;
  /* Tilt to the ground, the same way the car you are driving does - a probe
     under the nose and one under the tail. Without it the replay cars sail up
     the ramps and over the bridge perfectly level, which reads as floating.
     The probe starts just above the recorded height, so a car under a bridge
     measures the road it is on and not the deck over its head. */
  var hr=h*Math.PI/180, fx=Math.cos(hr), fz=-Math.sin(hr), hl=this.len*0.5;
  var lift=y+this.len*0.35;
  var ny=groundAt(x+fx*hl, z+fz*hl, lift), ty=groundAt(x-fx*hl, z-fz*hl, lift);
  var want=(ny!==null&&ty!==null) ? Math.atan2(ny-ty, this.len) : 0;
  if(want> 0.9) want= 0.9;
  if(want<-0.9) want=-0.9;
  /* snap on a big change - that is a rewind scrubbing, not a slope */
  this.pitch = Math.abs(want-this.pitch)>0.5 ? want : this.pitch+(want-this.pitch)*0.35;

  var qy=new CANNON.Quaternion(), qp=new CANNON.Quaternion();
  qy.setFromAxisAngle(new CANNON.Vec3(0,1,0), yawFromHeading(h));
  qp.setFromAxisAngle(new CANNON.Vec3(1,0,0), -this.pitch);
  this.body.position.set(x,y,z);
  qy.mult(qp, this.body.quaternion);
  this.mesh.position.set(x,y+(this.lift||0),z);        // picture only
  this.mesh.quaternion.copy(this.body.quaternion);
  this.mesh.visible=true; this.live=true;
};
Ghost.prototype.remove=function(){ world.removeBody(this.body); scene.remove(this.mesh); };

/* ==========================================================================
   markers - the goal plate, its chevrons, and the "go this way" arrow
   ========================================================================== */
function flat(w,d,col,y,op){
  var m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),
    new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op===undefined?1:op,
      depthWrite:false,side:THREE.DoubleSide}));
  m.rotation.x=-Math.PI/2; m.position.y=y; return m;
}
function chevron(col){
  var s=new THREE.Shape();
  s.moveTo(0,0.55); s.lineTo(0.62,-0.18); s.lineTo(0.38,-0.42);
  s.lineTo(0,0.06); s.lineTo(-0.38,-0.42); s.lineTo(-0.62,-0.18);
  s.closePath();
  var m=new THREE.Mesh(new THREE.ShapeGeometry(s),
    new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.95,depthWrite:false}));
  m.rotation.x=-Math.PI/2; return m;
}
/* The finish is the RED LINE, not the plate. The plate is 3 long by 1 wide in
   its own frame, and the red band lies across the far short end at local x =
   GOAL_LINE. You win by crossing that line, travelling the way the chevrons
   point, inside the plate's width. Drawing and detection share these numbers
   so the line you see is exactly the line you have to cross. */
var GOAL_LINE=1.4, GOAL_BAND=0.2, GOAL_HALF=0.55;
/* where the three chevrons sit along the plate, in its own frame */
var CHEV_STEP=2/3, CHEV_0=-1.5+0.5*CHEV_STEP;
function buildGoal(goal,water){
  var g=new THREE.Group();
  /* Nothing is drawn where the line is - it is invisible, and the three low
     chevrons over the approach are the only marker. The line is still exactly
     where GOAL_LINE says, and crossing it is still what wins. */
  var chevs=new THREE.Group();
  for(var i=0;i<3;i++){
    var c=chevron(0xffd32a);
    c.rotation.z=-Math.PI/2;                 // point along +X
    c.scale.setScalar(0.55);
    c.position.set(CHEV_0+i*CHEV_STEP, 0.09, 0);
    c.userData.i=i; chevs.add(c);
  }
  g.add(chevs); g.userData.chevs=chevs;
  g.position.set(goal.x,0,goal.z);
  g.rotation.y=(goal.rot||0)*Math.PI/180;
  scene.add(g);
  return g;
}
/* A point along the goal plate's own axis, in world space. 0 is the plate's
   centre, GOAL_LINE is the middle of the red line. */
function goalAxis(goal, at){
  var t=(goal.rot||0)*Math.PI/180;
  return {x:goal.x + at*Math.cos(t), z:goal.z - at*Math.sin(t)};
}
/* The middle of the red line - the point you are actually driving at. */
function goalPoint(goal){ return goalAxis(goal, GOAL_LINE); }
/* The FIRST of the three chevrons, where the approach begins. The little
   arrow by the car aims here rather than at the line itself: you want to be
   sent to the mouth of the run-in, lined up with it, not cutting across the
   scenery to the finish. */
function goalMouth(goal){ return goalAxis(goal, CHEV_0); }
/* What the little arrow by the car should be aiming at right now. Far out it
   sends you to the mouth of the run-in, so you arrive lined up with the
   chevrons rather than cutting across the scenery. Once you are there - level
   with the first chevron and roughly between its edges, or simply close to it
   - the mouth has done its job and the arrow hands over to the middle of the
   line, which is the thing you actually have to cross. */
var HINT_HANDOVER=1.2;
function hintTarget(goal, pos){
  var q=goalLocal(pos), m=goalMouth(goal);
  if((q.lx>=CHEV_0 && Math.abs(q.lz)<=GOAL_HALF+0.65) ||
     Math.hypot(pos.x-m.x, pos.z-m.z)<HINT_HANDOVER) return goalPoint(goal);
  return m;
}
/* A small chevron that hangs off the car while you drive, pointing at the goal.
   Deliberately faint - it is a glance, not a HUD. */
function buildHint(){
  var g=new THREE.Group();
  var c=chevron(0xffd32a);
  c.rotation.z=-Math.PI/2;
  c.material.opacity=0.3;
  g.add(c); g.visible=false;
  scene.add(g); return g;
}
function placeHint(g,car,goal){
  if(!g||!car) return;
  var p=car.body.position, len=car.stats.len;
  var dx=goal.x-p.x, dz=goal.z-p.z, d=Math.hypot(dx,dz);
  if(d<1e-4){ g.visible=false; return; }
  var ux=dx/d, uz=dz/d, r=len*2.4;             // just off the car's nose
  g.position.set(p.x+ux*r, len*0.55, p.z+uz*r);
  g.rotation.y=Math.atan2(-uz,ux);
  g.children[0].scale.setScalar(len*0.9);
  g.visible=true;
}
/* the intro arrow: a dashed run of chevrons from the car to the goal */
function buildGuide(from,to){
  var g=new THREE.Group(), dx=to.x-from.x, dz=to.z-from.z;
  var len=Math.hypot(dx,dz), ang=Math.atan2(-dz,dx);
  var n=Math.max(18,Math.min(156,Math.round(len/2.6)*6));
  for(var i=0;i<n;i++){
    var c=chevron(0xffd32a);
    c.scale.setScalar(0.28125);
    c.rotation.z=-Math.PI/2;
    /* the route to the goal is guidance, not scenery: draw it over everything,
       so a building or a bridge between you and the goal cannot hide it */
    c.material.depthTest=false;
    c.material.depthWrite=false;
    c.renderOrder=999;
    var k=(i+1)/(n+1);
    c.position.set(from.x+dx*k, 0.3, from.z+dz*k);
    c.rotation.y=0;
    c.userData.i=i; c.userData.n=n;
    var holder=new THREE.Group();
    holder.position.copy(c.position); c.position.set(0,0,0);
    holder.rotation.y=ang; holder.add(c); holder.userData.i=i; holder.userData.n=n;
    g.add(holder);
  }
  scene.add(g); return g;
}
function pulseChevrons(group,t,spacing){
  group.children.forEach(function(h){
    var m=h.children[0]||h;
    var ph=(t*1.6 - (h.userData.i||0)*(spacing||0.22))%1;
    if(ph<0) ph+=1;
    var a=0.25+0.75*Math.max(0,1-Math.abs(ph-0.25)*3);
    (m.material||{}).opacity=a;
    m.position.y=(m.position.y||0);
  });
}

/* ==========================================================================
   camera
   ========================================================================== */
var CAM_ASPECT=1333/690;
var VIEW={mode:'macro', x:0, y:60, z:0, tx:0, tz:0, tween:0};
/* The chase rig is a FIXED offset from the car, measured in car lengths so it
   holds at any vehicle scale. The camera never turns - it only slides - so the
   world keeps one orientation for the whole run and "up the screen" is always
   -z, exactly as in the zoomed-out view. Tilt is set by back/height alone:
   atan(8.25/9), a little over 40 degrees off vertical. */
var CHASE={height:9, back:8.25, side:0, lag:0.12};
var TWEEN_SECS=1.0;   // macro <-> micro, both ways

/* ==========================================================================
   Two views, and one rule that ties them together: the scene camera's
   rectangle is the whole of the world you are ever shown.

   MACRO sits directly over the rectangle's centre looking straight down, at
   exactly the height where its top and bottom edges land on the top and bottom
   edges of the viewport.

   MICRO holds a fixed offset from the car and never turns, and is slid along z
   until nothing above the rectangle's top edge or below its bottom edge is in
   frame - the clamp is on what the camera can SEE, not on where it sits.

   Both are described as {pos, look, up} so the switch between them is a
   one-second tween of three vectors.
   ========================================================================== */
function vfov(){ return cam.fov*Math.PI/180; }

function macroPlace(L){
  var h=L.cam.w/CAM_ASPECT;                    // the rectangle's depth in z
  /* straight down: the ground height in view is 2*d*tan(fov/2), so the height
     that puts the rectangle's two edges exactly on the viewport's two edges */
  var d=h/(2*Math.tan(vfov()/2));
  return {pos:new THREE.Vector3(L.cam.x, d, L.cam.z),
          look:new THREE.Vector3(L.cam.x, 0, L.cam.z),
          up:new THREE.Vector3(0,0,-1)};       // -z is up the screen
}

/* How far in front of and behind the camera the ground is visible, given the
   fixed tilt. A ray leaving the camera at depression angle t reaches the
   ground H/tan(t) away, so the top of the screen is the shallow ray and the
   bottom of the screen is the steep one. */
function microReach(H,B){
  var f=vfov()/2, phi=Math.atan2(H,B), lo=phi-f, hi=phi+f;
  var TOO_FAR=1e6;
  return {ahead: lo>0.02 ? H/Math.tan(lo) : TOO_FAR,   // toward -z, top of screen
          behind: H/Math.tan(Math.min(hi, Math.PI/2-0.01))};
}
function microPlace(L,car){
  var p=car.body.position, len=car.stats.len;
  var OX=CHASE.side*len, H=Math.max(2,CHASE.height*len), B=Math.max(2,CHASE.back*len);
  var r=microReach(H,B);
  /* what the camera would see if it sat straight behind the car */
  var want=p.z+B;
  /* top of screen is at (z - ahead), bottom at (z - behind); keep both inside */
  var lo=Math.min(L.zLo,L.zHi), hi=Math.max(L.zLo,L.zHi);
  var min=lo+r.ahead, max=hi+r.behind;
  var z = (min<=max) ? Math.max(min,Math.min(max,want))
                     : (min+max)/2;            // band too shallow to fit: centre it
  return {pos:new THREE.Vector3(p.x+OX, H, z),
          look:new THREE.Vector3(p.x+OX, 0, z-B),
          up:new THREE.Vector3(0,1,0)};
}

/* the smoothed camera state, so a cut never happens mid-run */
var VIEW={pos:new THREE.Vector3(), look:new THREE.Vector3(), up:new THREE.Vector3(0,1,0),
          live:false};
function applyPlace(q){
  cam.position.copy(q.pos);
  cam.up.copy(q.up).normalize();
  cam.lookAt(q.look);
}
function blendPlace(a,b,k){
  var up=new THREE.Vector3().lerpVectors(a.up,b.up,k);
  if(up.lengthSq()<1e-6) up.copy(b.up);
  return {pos:new THREE.Vector3().lerpVectors(a.pos,b.pos,k),
          look:new THREE.Vector3().lerpVectors(a.look,b.look,k),
          up:up.normalize()};
}
function ease(k){ return k<0.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2; }

/* Follow the car with a little lag, but only once the tween has landed - while
   the view is still swinging out of macro the tween owns the camera. */
function chaseCam(L,car,dt,snap){
  var want=microPlace(L,car);
  if(snap||!VIEW.live){ VIEW.pos.copy(want.pos); VIEW.look.copy(want.look); VIEW.live=true; }
  else{
    var k=1-Math.pow(0.001,dt/Math.max(0.0001,CHASE.lag));
    VIEW.pos.lerp(want.pos,k); VIEW.look.lerp(want.look,k);
  }
  VIEW.up.copy(want.up);
  return {pos:VIEW.pos.clone(), look:VIEW.look.clone(), up:VIEW.up.clone()};
}
function macroCam(L){ applyPlace(macroPlace(L)); VIEW.live=false; }

/* ==========================================================================
   game state
   ========================================================================== */
var G={
  scene:null, levelIdx:0, phase:'intro',      // intro | driving | won | lost | done
  clock:0, runT:0, slow:0, bumps:0,
  car:null, ghosts:[], goal:null, goalAt:null, guide:null, hint:null, camT:0, wonAt:0, crashFrom:0, clockAt:0, paused:false, onRamp:false, hop:null, nextScene:null,
  rec:[], recAt:0, runs:[], stall:0, roll:0, wasSp:0, cool:0, flash:0,
  steer:0, started:false, vehScale:1,
  open:false                                 // the reel's title card is waiting
};

/* One camera per SCENE, not per level: it is the opening view for every run in
   the scene, and its own top and bottom edges are how far the chase camera may
   travel. Nothing else sets the limits. */
function sceneCam(sc){
  if(sc.cam) return sc.cam;
  /* an older save: the camera lived on the levels, with separate z bounds */
  var first=(sc.levels||[]).filter(function(l){ return l.cam; })[0];
  if(first) return (sc.cam={x:first.cam.x, z:first.cam.z, w:first.cam.w});
  var top=(sc.zTop===undefined?-14:sc.zTop), bot=(sc.zBot===undefined?14:sc.zBot);
  return (sc.cam={x:0, z:(top+bot)/2, w:Math.max(4,Math.abs(bot-top)*CAM_ASPECT)});
}
function levelBounds(sc){
  var c=sceneCam(sc), h=c.w/CAM_ASPECT;
  return {zLo:c.z-h/2, zHi:c.z+h/2, cam:c};
}

/* Scene and level, written to the corner and to the card between levels */
function reelName(){
  var pl=placeOf(G.sceneIdx||0);
  return pl ? pl.name : ((G.scene&&G.scene.name)||reelWord());
}
function whereText(){
  if(!G.scene) return '';
  return reelName()+' \u00b7 '+runWord()+' '+(G.levelIdx+1)+
         ' of '+G.scene.levels.length;
}
function setWhere(){
  var e=document.getElementById('lvlTag');
  if(!e||!G.scene) return;
  e.innerHTML='<b>'+runWord()+' '+(G.levelIdx+1)+' / '+G.scene.levels.length+'</b>'+
              '<i>'+reelWord()+' '+((G.sceneIdx||0)+1)+' \u00b7 '+esc(reelName())+'</i>';
}
function showCard(){
  var c=document.getElementById('card');
  var lv=G.scene&&G.scene.levels[G.levelIdx];
  var model=(lv&&lv.veh&&lv.veh.model)||'sedan';
  var d=driverOf(model);
  c.querySelector('.where').textContent=whereText();
  c.querySelector('.who').textContent=d.name||'Someone';
  c.querySelector('.blurb').textContent=
    lineFor(G.sceneIdx||0, G.levelIdx) ||
    'No story yet \u2014 add a line for this driver in data/story.json.';
  c.querySelector('.mug span').textContent=(d.name||'?').charAt(0).toUpperCase();
  var im=c.querySelector('.mug img');
  im.onerror=function(){ this.style.display='none'; };
  im.style.display='';
  im.src=d.img||'';
  c.classList.remove('done','place'); c.classList.remove('out');
}
/* THE TITLE BEAT. A reel is a place, so it gets announced like one before the
   first driver turns up: where you are, what sort of place it is, and the one
   line the location carries. It waits. Nothing in the story moves itself on -
   every beat is a press, so a reader as slow or as quick as they like is never
   hurried and never left behind. The press that clears it does not also set the
   car off; that is the next press. */
function showPlace(){
  var c=document.getElementById('card'), pl=placeOf(G.sceneIdx||0);
  if(!pl){ G.open=false; return; }
  c.querySelector('.where').textContent=
    reelWord()+' '+((G.sceneIdx||0)+1)+' of '+ROUTES.scenes.length;
  c.querySelector('.who').textContent=pl.kind||'';
  c.querySelector('.blurb').innerHTML=esc(pl.name)+'<i>'+esc(pl.line||'')+'</i>';
  c.querySelector('.mug span').textContent=String((G.sceneIdx||0)+1);
  var im=c.querySelector('.mug img'); im.style.display='none'; im.src='';
  c.classList.remove('done'); c.classList.add('place'); c.classList.remove('out');
}
/* The same card, at the end of a reel: <place> complete, with the reel's own
   time under it and a tick instead of a face. */
/* The very end: no time, no target, no best - just how it turned out. */
function showEnd(){
  var c=document.getElementById('card'), a=arcOf(G.sceneIdx||0);
  c.querySelector('.where').textContent='The end';
  c.querySelector('.who').textContent=driverOf('sedan').name||'';
  c.querySelector('.blurb').innerHTML=
    esc((a&&a.end)||'Everybody got where they were going.')+
    '<i>press to go back to the arcade</i>';
  c.querySelector('.mug span').textContent='\u2605';
  var im=c.querySelector('.mug img'); im.style.display='none'; im.src='';
  c.classList.remove('place'); c.classList.add('done'); c.classList.remove('out');
}
function showDone(secs, pb){
  var c=document.getElementById('card');
  c.querySelector('.where').textContent=
    reelWord()+' '+((G.sceneIdx||0)+1)+' of '+ROUTES.scenes.length+
    '  \u00b7  '+G.runs.length+' '+runWord().toLowerCase()+(G.runs.length===1?'':'s');
  c.querySelector('.who').textContent=secs.toFixed(1)+'s';
  c.querySelector('.blurb').innerHTML=esc(reelName())+' complete'+
    '<i>'+(pb ? whoName()+'\u2019s best here yet' : 'watching the whole reel back')+'</i>';
  c.querySelector('.mug span').textContent='\u2713';
  var im=c.querySelector('.mug img'); im.style.display='none'; im.src='';
  c.classList.add('done'); c.classList.remove('out');
}
function hideCard(){
  var c=document.getElementById('card');
  c.classList.add('out'); c.classList.remove('done','place');
}
/* the teaching overlay: first run of the first reel, until the first steer */
function teachShow(on){
  var e=document.getElementById('teach'); if(e) e.classList.toggle('on',!!on);
}
function teachCheck(){
  teachShow(G.phase==='driving' && (G.sceneIdx||0)===0 && G.levelIdx===0 &&
            !G.steer && G.runT<6);
}
function banner(text,sub,cls){
  var b=document.getElementById('banner');
  b.querySelector('b').textContent=text;
  b.querySelector('span').textContent=sub||'';
  b.className=(cls||'')+' on';
}
function hideBanner(){ document.getElementById('banner').className=''; }
var SPD_LOCK='<svg class="lk" viewBox="0 0 24 24" aria-hidden="true">'+
  '<path d="M12 1.6a4.6 4.6 0 0 0-4.6 4.6V9H6.3A1.3 1.3 0 0 0 5 10.3v10.4A1.3 1.3 0 0 0 6.3 22h11.4a1.3 1.3 0 0 0 1.3-1.3V10.3A1.3 1.3 0 0 0 17.7 9h-1.1V6.2A4.6 4.6 0 0 0 12 1.6zm0 2.2a2.4 2.4 0 0 1 2.4 2.4V9H9.6V6.2A2.4 2.4 0 0 1 12 3.8z"/></svg>';
var SPD_BOLT='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.6 2 4.8 13.7h5.3L9.5 22l8.7-11.7h-5.3z"/></svg>';
/* The badge beside the pause button: how much of its top speed the car has
   left. Normally silent at 100%; once a crash has taken a notch off it goes
   amber and clicking it hands the speed straight back. */
/* What the badge counts is the HANDICAP, not the difficulty. Easy mode is a
   choice, not damage: with easyFactor in here the badge sat at 80 from the
   moment you picked Easy, wore the damaged colour all game and could never be
   locked, because every click read as "give me my speed back". */
function powerPct(){
  var base=(DRIVE_MODEL==='arcade') ? arcStatsFor(G.car?G.car.model:'sedan').maxSpeed : ABASE.maxSpeed;
  if(!base) return 100;
  return Math.round(Math.max(HANDICAP.floor, base-(G.slow||0))/base*100);
}
function setSpeedTag(){
  var e=document.getElementById('spd'); if(!e) return;
  var pc=powerPct(), cut=(G.slow||0)>0;
  /* lock on the left, number, bolt on the right */
  e.innerHTML=(OPT.lock?SPD_LOCK:'')+'<i>'+pc+'</i>'+SPD_BOLT;
  e.classList.toggle('cut', cut);
  e.classList.toggle('lock', !!OPT.lock && !cut);
  e.title = cut
    ? 'power '+pc+' after '+(G.bumps||0)+' crashes on this level \u2014 click to give it back'
    : OPT.lock
      ? 'power locked \u2014 crashes will not slow you down. Click to unlock.'
      : 'power'+(G.bumps ? ' \u2014 '+G.bumps+' of '+HANDICAP.free+' free crashes used' : '')+
        ' \u2014 click to lock it here';
}
function setClock(v){
  var t=Math.max(0,v);
  clockEl.innerHTML=Math.floor(t)+'<small>.'+Math.floor((t*10)%10)+'</small>';
}

function clearLevel(){
  if(G.car) G.car.remove();
  G.ghosts.forEach(function(g){ g.remove(); });
  if(G.goal) scene.remove(G.goal);
  if(G.guide) scene.remove(G.guide);
  if(G.hint) scene.remove(G.hint);
  G.car=null; G.ghosts=[]; G.goal=null; G.guide=null; G.hint=null;
}

/* `at` is a resume slot: the run to start on, the clock it was on and the
   traffic already banked. Without one the reel starts from the top. */
function startStage(sc, at){
  G.scene=sc; G.sceneIdx=ROUTES.scenes.indexOf(sc);
  G.levelIdx=at ? Math.max(0,Math.min(at.level|0, sc.levels.length-1)) : 0;
  G.clock=(at&&typeof at.clock==='number')?at.clock:0;
  G.runs=(at&&Array.isArray(at.runs))?at.runs:[];
  G.slow=0; G.bumps=0;
  setWhere();
  /* The last reel is the ending, not a stage: it is one run, it is not timed
     and nothing about it goes in the high scores. */
  document.getElementById('clock').style.display=isFinale()?'none':'';
  G.open=true; showPlace();
  var sel=document.getElementById('devScene');
  if(sel) sel.value=String(ROUTES.scenes.indexOf(sc));
  loadLevel();
}

/* ==========================================================================
   A testing strip, not a feature: jump to a scene, and one save slot on S / L
   that remembers where you were and the runs you had already banked, so a
   later level can be tried again without driving the earlier ones each time.
   ========================================================================== */
function setPaused(on){
  G.paused=!!on;
  /* Nothing should still be making a noise behind the pause menu. The engine is
     a held tone rather than a one-shot, and while paused the frame loop turns
     round before it reaches engineAt, so the last value it was given would sit
     there droning for as long as the menu is up. The bumps and blips are all
     shorter than the press that opened the menu, and the tape keeps playing on
     purpose - it is the one thing that should not stop. */
  if(G.paused && SND.engGain) SND.engGain.gain.value=0;
  if(G.paused) buildMenu();
  sheet('menu',G.paused);
  document.getElementById('paused').classList.toggle('on',false);
  document.getElementById('pause').classList.toggle('on',G.paused);
  document.getElementById('pause').innerHTML=G.paused?'&#9654;':'&#10073;&#10073;';
}

var SLOT='dejavroom-quicksave';
function devSay(t,stick){
  var e=document.getElementById('devMsg');
  e.textContent=t; clearTimeout(devSay.t);
  if(stick){ devSay.home=t; return; }      // the data-source line stays put
  devSay.t=setTimeout(function(){ e.textContent=devSay.home||''; },1800);
}
function quickSave(){
  if(!G.scene) return;
  try{
    localStorage.setItem(SLOT, JSON.stringify({
      scene:ROUTES.scenes.indexOf(G.scene),
      level:G.levelIdx,
      clock:G.clock, slow:G.slow||0, bumps:G.bumps||0,
      runs:G.runs                       // the laps already banked as traffic
    }));
    devSay('saved \u00b7 level '+(G.levelIdx+1));
  }catch(e){ devSay('save failed'); }
}
function quickLoad(){
  var raw=null;
  try{ raw=localStorage.getItem(SLOT); }catch(e){}
  if(!raw){ devSay('nothing saved'); return; }
  var d;
  try{ d=JSON.parse(raw); }catch(e){ devSay('save unreadable'); return; }
  var sc=ROUTES.scenes[d.scene];
  if(!sc){ devSay('that scene is gone'); return; }
  vhs(false);
  G.scene=sc;
  G.levelIdx=Math.min(d.level||0, sc.levels.length-1);
  G.clock=(typeof d.clock==='number')?d.clock:0;
  G.slow=d.slow||0; G.bumps=d.bumps||0;
  G.runs=Array.isArray(d.runs)?d.runs:[];
  setWhere();
  document.getElementById('devScene').value=String(d.scene);
  loadLevel();
  devSay('loaded \u00b7 level '+(G.levelIdx+1)+' \u00b7 '+G.runs.length+' cars');
}
function buildDev(){
  var md=document.getElementById('devModel');
  try{ DRIVE_MODEL=localStorage.getItem('dejavroom-model')||'arcade'; }catch(e){}
  md.value=DRIVE_MODEL;
  md.onchange=function(){
    DRIVE_MODEL=this.value;
    try{ localStorage.setItem('dejavroom-model',DRIVE_MODEL); }catch(e){}
    devSay(DRIVE_MODEL==='arcade'?'arcade handling':'simulated handling');
    this.blur();
    loadLevel();                       // restart the level on the new model
  };
  document.getElementById('pause').onclick=function(e){
    e.stopPropagation(); setPaused(!G.paused); this.blur();
  };
  /* The badge does two jobs, and which one depends on whether you have lost
     anything yet. Down on power, a click hands it back. Full, a click locks it
     there - crashes stop costing you anything at all, which is the difference
     between a corner you cannot take and an afternoon you cannot enjoy. The
     lock is one of the driver's own switches, so it stays put between goes. */
  document.getElementById('spd').onclick=function(e){
    e.stopPropagation(); this.blur();
    if(G.slow){ G.slow=0; G.bumps=0; setSpeedTag(); devSay('power restored'); return; }
    OPT.lock=!OPT.lock; optSave(); setSpeedTag();
    devSay(OPT.lock?'power locked \u2014 crashes cost nothing':'power unlocked');
  };
  /* The strip only shows with the switch on, so the mapper is what it WANTED
     to load - saying data/ here means the store was empty and it fell back. */
  devSay('city: '+(DATA_SRC==='mapper'?'mapper':'data/ \u2014 mapper store empty')+
         '  \u00b7  handling: '+CFG_SRC, true);
  var sel=document.getElementById('devScene');
  sel.innerHTML='';
  ROUTES.scenes.forEach(function(sc,i){
    var o=document.createElement('option');
    o.value=String(i);
    var pl=placeOf(i);
    o.textContent=reelWord()+' '+(i+1)+' \u00b7 '+((pl&&pl.name)||sc.name||'')+
                  '  ('+sc.levels.length+')';
    sel.appendChild(o);
  });
  sel.onchange=function(){ startStage(ROUTES.scenes[+this.value]); this.blur(); };
}
function loadLevel(){
  clearLevel();
  var sc=G.scene, lv=sc.levels[G.levelIdx];
  if(!lv){ finishStage(true); return; }
  /* A press held over from the last run does not carry into this one - the
     player has to let go and press again to steer. */
  G.phase='intro'; G.runT=0; G.rec=[]; G.recAt=0; G.started=false; G.steer=0;
  if(window.dropHeld) dropHeld();
  G.goalAt=null;
  G.stall=0; G.roll=0; G.wasSp=0; G.lastSoft=undefined; G.cool=0; G.flash=0;
  G.bounds=levelBounds(sc);
  setWhere();
  G.clockAt=G.clock;                   // what a crash on this level winds back to
  G.bumps=0; G.slow=0; setSpeedTag();  // and the handicap is per level
  G.goal=buildGoal(lv.goal, lv.water);
  /* The run of chevrons on the opening view ends at the MOUTH of the goal -
     the first of the three big arrows - not at the line itself, so it reads as
     "come in this way" rather than "cut across to the finish". The little
     arrow while you drive starts there too and hands over to the line once you
     have arrived; see hintTarget. */
  G.guide=buildGuide({x:lv.veh.x,z:lv.veh.z}, goalMouth(lv.goal));
  G.hint=buildHint();
  setClock(G.clock);
  macroCam(G.bounds);

  var jobs=[new Car(lv.veh.model, statsFor(lv.veh.model))
              .spawn(lv.veh.x, lv.veh.z, lv.veh.rot||0, G.vehScale)
              .then(function(c){ G.car=c; })];
  G.runs.forEach(function(r){
    var g=new Ghost(r.model,r.path,r.offset,G.vehScale);
    jobs.push(g.load().then(function(){ G.ghosts.push(g); }));
  });
  Promise.all(jobs).then(function(){
    /* Put the other cars on the board straight away. Nothing moves them until
       you set off, so without this the opening view of a level shows an empty
       road and the runs you banked look lost. */
    G.ghosts.forEach(function(g){ g.at(G.runT,true); });
    if(!G.open) showCard();           // the reel's title beat comes first
  });
}

function beginRun(){
  if(G.phase!=='intro'||!G.car) return;
  G.phase='driving'; G.started=true; G.runT=0;
  engineUp(); SFX.go();
  hideCard(); teachCheck();
  if(G.guide){ scene.remove(G.guide); G.guide=null; }
  VIEW.live=false;                  // the chase starts from where the tween lands
  G.camT=0;                         // 0 = macro, 1 = micro
}

/* Where a world point sits in the goal plate's own frame. The plate is drawn
   with rotation.y = t, so world = Ry(t) * local and the way back in is Ry(t)
   itself, not Ry(-t) - getting that sign wrong put the line on the far side. */
function goalLocal(p){
  var g=G.scene.levels[G.levelIdx].goal;
  var dx=p.x-g.x, dz=p.z-g.z, t=(g.rot||0)*Math.PI/180;
  return {lx:dx*Math.cos(t)-dz*Math.sin(t), lz:dx*Math.sin(t)+dz*Math.cos(t)};
}
/* Crossing, not touching. We test the line against the SEGMENT the car covered
   this step, so a fast car cannot step straight over the band, and we take the
   width at the point it actually cut the line rather than where it ended up. */
function reachedGoal(){
  var was=G.goalAt, now=goalLocal(G.car.body.position);
  G.goalAt=now;
  if(!was) return false;                               // first step, nothing to sweep
  if(was.lx>=GOAL_LINE || now.lx<GOAL_LINE) return false;   // not a forward crossing
  var k=(GOAL_LINE-was.lx)/(now.lx-was.lx);
  return Math.abs(was.lz+(now.lz-was.lz)*k)<=GOAL_HALF;
}
function levelWon(){
  G.phase='won'; SFX.win();
  var lv=G.scene.levels[G.levelIdx];
  G.runs.push({model:lv.veh.model, offset:lv.offset||0, path:G.rec});
  /* The run is in. Everything after this - the pull-out, the banner, the tape
     winding back - is a victory lap, and walking out during it should not cost
     the run: the slot moves on NOW, to the next run with this one's ghost
     already banked. The last run of a reel is left alone, because the encore
     is about to hand the whole reel over to the next one. */
  if(G.levelIdx+1 < G.scene.levels.length)
    resumeSet(G.sceneIdx||0, G.levelIdx+1, G.clock, G.runs);
  banner('Made it','','win');
  /* Your car has arrived, so it parks and stops being something to hit - the
     next run must be able to drive over the line without piling into you. */
  var b=G.car.body;
  b.velocity.set(0,0,0); b.angularVelocity.set(0,0,0);
  b.collisionResponse=false; b.collisionFilterMask=0; b.type=CANNON.Body.KINEMATIC;
  b.sleep();
  G.wonAt=G.runT;                       // the traffic carries on from here
  G.dolly={t:0, from:{pos:cam.position.clone(),
                      look:VIEW.look.clone(),
                      up:cam.up.clone()}};
}
/* ==========================================================================
   The rewind. Once the camera is back overhead, the whole scene runs
   backwards to the start of the stage - every car, yours included, retraces
   its own path - dressed up as a tape being wound back.
   ========================================================================== */

function vhs(on){
  document.getElementById('vhs').classList.toggle('on',!!on);
  document.getElementById('stage').classList.toggle('rew',!!on);
}
function playBack(t){
  G.ghosts.forEach(function(g){ g.at(t,true); });
  if(!G.car) return;
  var lv=G.scene.levels[G.levelIdx];
  var at=sampleRec(G.rec, t-(lv.offset||0));
  if(!at) return;
  G.car.body.position.set(at.x, Math.max(at.y,G.car.rideH), at.z);
  G.car.body.quaternion.setFromAxisAngle(new CANNON.Vec3(0,1,0), yawFromHeading(at.h));
  G.car.sync();
}
function rewindStage(dt){
  var span=Math.max(0.001, G.wonAt);
  G.runT=Math.max(0, G.runT - dt*(span/Math.max(0.05,GCFG.winRewind)));
  playBack(G.runT);
  applyPlace(macroPlace(G.bounds));
  if(G.runT<=0){
    vhs(false); hideBanner();
    G.levelIdx++;
    if(G.levelIdx>=G.scene.levels.length) finishStage();
    else loadLevel();                    // the slot moved on back in levelWon
  }
}
/* ==========================================================================
   THE ENCORE

   The last run of a reel is in, so every car that ever drove here is on the
   board at once - and this is the only moment you get to see that. So before
   the camera leaves for the next place it plays the lot back from above: all of
   them away from their start lines together, the whole weave of near misses
   you built one run at a time, then the tape takes the lot back and it goes
   again, and again, for as long as you let it. Nothing times out here - the tape
   goes round until somebody presses.

   The forward leg is squeezed into ENCORE.play seconds when the reel is long -
   fifteen runs can span half a minute and nobody wants that at walking pace
   every time round - but it never plays SLOWER than it happened.
   ========================================================================== */
var ENCORE={play:5};
/* How long the whole reel lasts on the shared clock: not just the last run,
   because an earlier one may have started later or gone on longer. */
function reelSpan(){
  var s=G.wonAt||0;
  (G.runs||[]).forEach(function(r){
    if(r.path&&r.path.length)
      s=Math.max(s,(r.offset||0)+r.path[r.path.length-1].t);
  });
  return Math.max(0.5,s);
}
function startEncore(){
  var t=G.clock;
  G.enc={t:0, back:false, loops:0, span:reelSpan()};
  G.phase='encore';
  hideBanner(); vhs(false);
  SFX.stage();
  if(isFinale()){ G.encPB=false; showEnd(); return; }
  /* every other reel banks its own time here, which is what the title screen's
     high scores are keyed on */
  G.encPB=recordTime(G.sceneIdx||0, t);
  /* Same again one level up: the reel is finished and its time is on the board,
     so the slot points at the next reel before the lap of honour rather than
     after it. Leave during the encore and you have still finished this place. */
  resumeSet((G.sceneIdx||0)+1, 0, 0, []);
  showDone(t, G.encPB);
}
function encore(dt){
  var e=G.enc, sp=e.span;
  if(!e.back){
    e.t+=dt*Math.max(1, sp/ENCORE.play);
    if(e.t>=sp){ e.t=sp; e.back=true; vhs(true); SFX.rewind(); }
  }else{
    e.t-=dt*(sp/Math.max(0.05,GCFG.winRewind));
    if(e.t<=0){ e.t=0; e.back=false; vhs(false); e.loops++; }
  }
  G.runT=e.t;
  playBack(e.t);
  applyPlace(macroPlace(G.bounds));
}
/* What used to happen the moment the last run landed, now that the encore has
   had its turn: on to the next place, or the end of the game. */
function encoreDone(){
  vhs(false); hideCard(); hideBanner();
  /* The tape has run out, which is the one thing that clears the slot: next
     time the big button says roll it from the top again. */
  if(isFinale()){ resumeClear(); goHome(); return; }
  var next=ROUTES.scenes[ROUTES.scenes.indexOf(G.scene)+1];
  if(!next){ finishStage(G.encPB); return; }
  G.nextScene=next;
  G.hop={t:0, from:macroPlace(G.bounds), to:macroPlace(levelBounds(next))};
  G.phase='hopping';
  banner(reelWord()+' clear',
         (placeOf(ROUTES.scenes.indexOf(next))||{}).name||next.name||'', 'win');
}
/* The last reel is the end of the story rather than another stage: one run, no
   clock, nothing scored. Keyed on being last so it stays true if Dan adds a
   reel - whatever is at the end of the tape is the ending. */
function isFinale(){
  return !!(ROUTES&&ROUTES.scenes&&ROUTES.scenes.length&&
            (G.sceneIdx||0)===ROUTES.scenes.length-1);
}
/* Out of the game and back to the title screen, with the tape rewound to the
   top so the big button starts a fresh run through. buildHome redraws the high
   scores on the way, so the times just set are already up there. */
function goHome(){
  vhs(false); hideCard(); hideBanner();
  document.getElementById('clock').style.display='';
  startStage(ROUTES.scenes[0]);
  setPaused(false);
  buildHome();
}
function levelLost(why){
  G.phase='lost';
  banner("Out of time", why||'tap to try the stage again','lose');
}
function finishStage(pb){
  G.phase='done'; SFX.stage();
  /* The clock counts up, so the number IS the score. The stage's own time is
     the target to beat rather than a limit to survive. */
  var t=G.clock, par=STAGE_SECONDS;
  /* the encore has usually banked the time already - don't score it twice */
  if(pb===undefined) pb=recordTime(G.sceneIdx||0, t);
  banner(pb ? (whoName()+'\u2019s best yet') : (reelWord()+' clear'), t.toFixed(1)+'s' +
         (par>0 ? (t<=par ? '  \u00b7  under the '+par+'s target by '+(par-t).toFixed(1)
                          : '  \u00b7  '+(t-par).toFixed(1)+'s over the '+par+'s target')
                : ''), 'win');
}

/* ==========================================================================
   input
   ========================================================================== */
(function input(){
  var st=document.getElementById('stage');
  var held={};                                   // which buttons / pointers are down

  function apply(){
    var l=false,r=false;
    for(var k in held){ if(held[k]<0) l=true; if(held[k]>0) r=true; }
    G.steer = (l&&r)?0:(l?-1:(r?1:0));
    if(G.steer) teachShow(false);
    document.getElementById('touchL').classList.toggle('lit',l);
    document.getElementById('touchR').classList.toggle('lit',r);
  }
  /* Returns false when the press was swallowed by a story beat or a restart.

     The press that SETS OFF is swallowed on purpose. It is a tap to go, not a
     tap to turn: counting it as a steer meant every run began with the car
     veering to whichever side you happened to touch. Keep holding and nothing
     happens either - let go and press again to steer.

     ONE PRESS, ONE BEAT, and the latch that guarantees it is not paranoia. A
     single touch reaches this twice: pointerdown fires, and then - unless that
     event was cancelled - the browser synthesises the compatibility mousedown
     behind it, which lands on the mouse handler and calls this again. Both
     paths are wanted (a mouse steers with its two buttons, a finger by the half
     of the screen it lands on), so the fix is here: whichever arrives first
     takes the beat and the other finds it gone. Without it, one tap ate the
     place card AND the driver's card and the run set off before you had read
     either. Released on the way back up. */
  var beatUsed=false;
  function beatFree(){ beatUsed=false; }
  function begin(){
    var beat = G.open || G.phase==='intro' || G.phase==='won' ||
               G.phase==='lost' || G.phase==='done' || G.phase==='encore';
    if(!beat) return true;              // driving, rewinding, hopping: a steer
    if(beatUsed) return false;
    beatUsed=true;
    if(G.open){ G.open=false; showCard(); return false; }   // on to the driver
    if(G.phase==='intro'){ beginRun(); return false; }
    if(G.phase==='lost'||G.phase==='done'){ startStage(G.scene); return false; }
    if(G.phase==='encore'){ encoreDone(); return false; }   // seen enough
    return false;                       // 'won': the camera is pulling out
  }

  /* A mouse steers with its own two buttons, wherever the cursor is. They go
     through mousedown/mouseup rather than pointer events: pointerdown only
     fires for the FIRST button held, so chording both would never cancel. */
  st.addEventListener('mousedown',function(e){
    if(!begin()) return;
    var d = e.button===2 ? 1 : (e.button===0 ? -1 : 0);
    if(d) held['m'+e.button]=d;
    apply(); e.preventDefault();
  });
  addEventListener('mouseup',function(e){ beatFree(); delete held['m'+e.button]; apply(); });

  /* A finger steers by the half of the screen it lands on. */
  st.addEventListener('pointerdown',function(e){
    if(e.pointerType==='mouse') return;            // handled above
    /* first, and whatever happens next: cancelling pointerdown is what stops
       the browser firing a compatibility mousedown after it */
    e.preventDefault();
    if(!begin()) return;
    var r=st.getBoundingClientRect();
    held['p'+e.pointerId]=(e.clientX-r.left)<r.width/2 ? -1 : 1;
    apply(); e.preventDefault();
  });
  function lift(e){ beatFree();
    if(e&&e.pointerType==='mouse') return;
    if(e&&e.pointerId!==undefined) delete held['p'+e.pointerId]; else held={};
    apply(); }
  addEventListener('pointerup',lift);
  addEventListener('pointercancel',lift);

  window.dropHeld=function(){ held={}; apply(); };   // a new level starts clean
  st.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  addEventListener('blur',function(){ beatFree(); held={}; apply(); });
  /* Keys go through the same held map as the mouse and the screen halves, so
     they light the same indicators, combine the same way, and a steer press is
     itself enough to set off. */
  function keyDir(k){
    if(k==='ArrowLeft'||k==='a'||k==='A') return -1;
    if(k==='ArrowRight'||k==='d'||k==='D') return 1;
    return 0;
  }
  addEventListener('keydown',function(e){
    if(e.repeat) return;
    var d=keyDir(e.key);
    if(d){ if(!begin()) return; held['k'+d]=d; apply(); e.preventDefault(); return; }
    if(e.key==='p'||e.key==='P'||e.key==='Escape'){ setPaused(!G.paused); e.preventDefault(); return; }
    if(e.key==='s'||e.key==='S'){ quickSave(); e.preventDefault(); return; }
    if(e.key==='l'||e.key==='L'){ quickLoad(); e.preventDefault(); return; }
    /* the same gate as a tap, so the keyboard cannot double up either */
    if(e.key===' '||e.key==='Enter'){ begin(); e.preventDefault(); }
  });
  addEventListener('keyup',function(e){
    beatFree();
    var d=keyDir(e.key);
    if(d){ delete held['k'+d]; apply(); }
  });
})();

/* ==========================================================================
   loop
   ========================================================================== */
var lastT=0, acc=0, animT=0;
function resize(){
  var r=document.getElementById('stage').getBoundingClientRect();
  ren.setSize(r.width,r.height,false);
  cam.aspect=r.width/Math.max(1,r.height); cam.updateProjectionMatrix();
}
addEventListener('resize',resize);

function frame(now){
  requestAnimationFrame(frame);
  /* real seconds, for the camera tween and the rewind. Clamped too, just far
     more loosely than the physics: one stalled frame - a tab switch, a garbage
     collection - must not skip an entire second-long move in a single step. */
  var raw=Math.min(0.1,(now-lastT)/1000||0);
  var dt=Math.min(0.05,raw); lastT=now;  // clamped, so one slow frame cannot
                                         // snowball the physics
  animT+=dt;

  /* Paused: keep drawing, stop everything else. */
  if(G.paused){ ren.render(scene,cam); return; }

  if(G.phase==='driving'){
    acc=Math.min(acc+dt, TICK*10);       // one slow frame must not snowball
    var steps=0;
    while(acc>=TICK && steps<10 && G.phase==='driving'){
      stepPhysics(TICK); acc-=TICK; steps++;
    }
  } else { acc=0; }

  if(G.flash>0){ G.flash-=dt; if(G.flash<=0&&G.phase==='driving') hideBanner(); }

  // chevrons breathe whatever the phase
  if(G.goal) pulseChevrons(G.goal.userData.chevs, animT, 0.18);
  if(G.guide) pulseChevrons(G.guide, animT, 0.1);
  if(G.hint){
    if(G.phase==='driving'&&G.car){
      placeHint(G.hint, G.car,
                hintTarget(G.scene.levels[G.levelIdx].goal, G.car.body.position));
      G.hint.children[0].material.opacity=0.2+0.16*(0.5+0.5*Math.sin(animT*3.4));
    } else G.hint.visible=false;
  }

  /* the other cars are placed here, on a clock that runs smoothly between
     physics steps, rather than jumping with them */
  if(G.phase==='driving') G.ghosts.forEach(function(g){ g.at(G.runT+acc); });
  if(G.car) G.car.sync(G.phase==='driving' ? acc/TICK : undefined);

  if(G.phase==='intro'&&G.bounds) macroCam(G.bounds);
  else if(G.phase==='driving'&&G.car){
    G.camT=Math.min(1, G.camT+raw/TWEEN_SECS);
    var micro=chaseCam(G.bounds,G.car,dt,G.camT<1);
    applyPlace(G.camT>=1 ? micro
             : blendPlace(macroPlace(G.bounds), micro, ease(G.camT)));
  }
  else if(G.phase==='won'&&G.car) dollyOut(raw);
  else if(G.phase==='rewinding'&&G.car) rewindStage(raw);
  else if(G.phase==='encore'&&G.car) encore(raw);
  else if(G.phase==='hopping') hopScene(raw);
  else if(G.phase==='crashback'&&G.car) crashBack(raw);

  if(SUN&&G.car){ var cp=G.car.body.position;
    SUN.position.set(cp.x-40, 60, cp.z+28);
    SUN.target.position.set(cp.x,0,cp.z); SUN.target.updateMatrixWorld();
    SUN.shadow.camera.updateProjectionMatrix(); }

  if(G.car) engineAt(G.car.speed(), G.car.stats.topSpeed);
  if(G.phase!=='driving'||G.runT>6||G.steer) teachShow(false);
  /* Runs in performance mode too. It used to be switched off with the shadows,
     on the grounds that a transparent pass costs fill - but the pass is at most
     a handful of objects a frame, and losing sight of your own car behind a
     tree is not a trade worth making on the machine that needs the help most. */
  seeThrough(dt);
  ren.render(scene,cam);
}
function stepPhysics(dt){
  G.runT+=dt;
  G.clock+=dt;                    // counts UP: the scene's time is the score
  setClock(G.clock);

  var lv=G.scene.levels[G.levelIdx], off=lv.offset||0;
  var mine=G.runT>=off;

  G.car.mark();
  if(DRIVE_MODEL==='arcade'){
    if(mine){
      G.car.driveArcade(dt, -G.steer);
      if(G.car.body.position.y<-0.35){ rewind(holeWhy()); return; }
      if(crashed(dt)) rewind(crashWhy());
    }
    /* NOT world.step(). The arcade model moves the car itself and the replay
       cars are kinematic - they are put where the recording says, frame by
       frame, and simulate nothing. Stepping the engine anyway meant a
       broadphase pass over 968 bodies for a result nobody read: 4.3 ms of a
       16.6 ms frame, thrown away, every frame. */
  } else {
    if(mine){
      G.car.drive(1, -G.steer, dt);
      if(crashed(dt)) rewind(crashWhy());
    } else {
      G.car.drive(0,0,dt);
      for(var i=0;i<4;i++) G.car.vehicle.setBrake(60,i);
    }
    world.step(dt);
    if(mine){
      G.car.hold(dt);
      climbStep(dt);
      if(sinkInWater(dt)){ rewind(holeWhy()); return; }
      catchFall();
    }
  }

  if(mine){
    G.recAt+=dt;
    if(G.recAt>=1/REC_HZ || !G.rec.length){
      G.recAt=0;
      var p=G.car.body.position;
      G.rec.push({t:+(G.runT-off).toFixed(3), x:+p.x.toFixed(3), y:+p.y.toFixed(3),
                  z:+p.z.toFixed(3), h:+G.car.headingDeg().toFixed(2)});
    }
  }

  if(G.car.body.position.y < -10*Math.max(0.2,G.car.stats.len)) respawn();
  /* The goal is checked BEFORE going off screen, so crossing the line at the
     very edge of the frame is a win rather than a crash. */
  if(reachedGoal()) return levelWon();
  if(offScreen()){ rewind('off the screen'); return; }
}
/* The crash tests compare a speed with a share of the car's top speed, and
   that share has to be read in the same units as the speed. While the
   px-per-length calibration was wrong the arcade model REPORTED half the
   speed it was really doing, so every one of these thresholds was tuned
   against a half-scale reading. Fixing the calibration doubled the reading,
   so the arcade shares double too - the levels then play exactly as they were
   tuned. The simulated model never had the problem and keeps its own. */
var CRASH_ARM={sim:0.35, arcade:0.70};   /* under this share of top, a speed loss is not an impact */
var STALL_LIM={sim:0.08, arcade:0.16};   /* under this share of top, you are not moving */
function crashShare(t){ return t[DRIVE_MODEL==='arcade'?'arcade':'sim']; }

/* A crash is a hard stop, a long stall, or ending up on your roof. */

function crashed(dt){
  var c=G.car, sp=c.speed();
  if(G.cool>0){ G.cool-=dt; G.wasSp=sp; return false; }
  var surf=surfaceAt(c.body.position.x,c.body.position.z);
  /* Speed given up because the GROUND got slower is not an impact. Crossing
     onto sand or water lowers the ceiling, and the car obediently comes down
     to meet it - that is the surface doing its job, not a collision. */
  var softer = surf.speed < (G.lastSoft===undefined?surf.speed:G.lastSoft) - 1e-6;
  G.lastSoft=surf.speed;
  var hit = !softer && G.wasSp>c.stats.topSpeed*crashShare(CRASH_ARM) &&
            (G.wasSp-sp) > G.wasSp*GCFG.crashDrop;
  G.wasSp=sp;
  /* judged against what the ground allows, not the road figure - crawling
     through sand is not the same as being stuck against a wall */
  var lim=c.stats.topSpeed*surf.speed*crashShare(STALL_LIM);
  if(sp<lim) G.stall+=dt; else G.stall=0;
  var up=new CANNON.Vec3(0,1,0); c.body.quaternion.vmult(up,up);
  if(up.y<0.4) G.roll+=dt; else G.roll=0;
  G.hitNow=hit;
  return hit || G.stall>GCFG.stallFor || G.roll>GCFG.rollFor;
}
/* falling off the drivable stuff, in words - which way round depends on
   whether this level is a boat */
function holeWhy(){ return onWaterLevel() ? 'off the water' : 'in the water'; }
/* whichever of the three tripped, in words */
function crashWhy(){
  if(G.roll>GCFG.rollFor) return 'on its roof';
  if(G.stall>GCFG.stallFor) return 'stuck';
  return 'hit something';
}
/* Wind the whole run back a beat. The ghosts are pure functions of the run
   clock, so moving it back rewinds them too - only the countdown keeps
   running, and that is the price of the crash. */
/* These ramps were modelled for a car the size of a real one. At the vehicle
   scale Dan uses, the lip where a slant begins is 0.2 units high against a car
   0.16 tall with wheels 0.037 across - the suspension ray passes clean under
   the ledge and the car drives beneath the ramp instead of onto it.

   So the car is given the step up a bigger wheel would have taken for granted.
   Every wheel looks for ramp surface ABOVE it, not just a point off the nose:
   approaching at an angle, or already wedged against the lip, only one corner
   may have anything to climb. The lift is at a constant rate, because a car
   that has stopped against a step is exactly the one that needs it most.
   Only ramp pieces are searched, so nothing else in the world is climbable. */
var STEP_ASSIST=false;   // the trimesh ramps rise from nothing, so none is needed
var STEP_UP=2.4, STEP_RATE=2.6, STEP_DOWN=3.2;
var stepRay=null, stepRes=null;
/* Once a wheel is over a ramp, the ramp IS the ground for it. Leaving that to
   the suspension does not work: the wheel ray is 0.1 long and points down, so
   over a ramp it either finds nothing (and the car drops back to the road it
   can still see underneath) or finds the road itself. The result is a car that
   hops up one step and falls off it again, over and over.

   So while any wheel is over ramp surface, the car's height is driven directly:
   it rises onto the surface at a limited rate, settles down onto it at a
   limited rate, and is not allowed to sink through it. The moment no wheel has
   ramp beneath it - off the end, off the side, airborne - control goes straight
   back to the physics, so jumps off the top still behave. */
function rampUnder(x,z,y0,maxStep){
  stepRes.reset();
  stepRay.from.set(x, y0+maxStep, z);
  stepRay.to.set(x, y0-maxStep, z);
  stepRay.intersectBodies(RAMP_BODIES, stepRes);
  return stepRes.hasHit ? stepRes.hitPointWorld.y : null;
}
function climbStep(dt){
  if(!STEP_ASSIST) return;
  var c=G.car, b=c.body;
  if(!RAMP_BODIES.length||!c.height) return;
  if(!stepRay){ stepRay=new CANNON.Ray(); stepRes=new CANNON.RaycastResult();
                stepRay.mode=CANNON.Ray.CLOSEST; }
  var maxStep=c.height*STEP_UP, v=c.vehicle, best=null;
  var lp=new CANNON.Vec3(), wp=new CANNON.Vec3(), i;
  for(i=0;i<v.wheelInfos.length;i++){
    lp.copy(v.wheelInfos[i].chassisConnectionPointLocal);
    b.quaternion.vmult(lp,wp); wp.vadd(b.position,wp);
    var y=rampUnder(wp.x, wp.z, b.position.y, maxStep);
    if(y!==null && (best===null||y>best)) best=y;
  }
  /* Only the WHEELS may raise the car. A probe off the nose seemed like a good
     idea - meet the lip rather than run into it - but it lifted the car while
     all four wheels were still on flat ground, leaving it hovering with no
     traction at all: measured, 0.12 units a second against a top speed of 2.2.
     A wheel finds the ramp at exactly the moment that wheel should be on it. */
  if(best===null){ G.onRamp=false; return; }

  G.onRamp=true;
  var want=best+c.rideH, gap=want-b.position.y;
  if(gap>0){                              // climbing onto or up the slope
    b.position.y+=Math.min(gap, dt*STEP_RATE);
    if(b.velocity.y<0) b.velocity.y=0;
  } else if(gap<-0.004){                  // following it back down
    b.position.y+=Math.max(gap, -dt*STEP_DOWN);
    if(b.velocity.y<0) b.velocity.y*=0.4;
  }
}
/* The finish corridor: lined up with the gate and close to it, either side of
   the line. The exit is deliberately set at the very edge of the scene
   rectangle, and the camera is pinned inside that same rectangle, so the car
   is ALREADY a little past the top of the picture at the moment it crosses.
   Leaving the frame here is not drifting out of the level, it is finishing it
   - so the off-screen crash does not apply while the car is in this box. Come
   through wide of the gate and the corridor runs out a few lengths later,
   which is when leaving the picture counts again. */
var GATE_BEFORE=3.5, GATE_AFTER=3, GATE_WIDE=0.35;
function atGate(){
  if(!G.scene||!G.scene.levels[G.levelIdx]) return false;
  var q=goalLocal(G.car.body.position);
  return q.lx > GOAL_LINE-GATE_BEFORE && q.lx < GOAL_LINE+GATE_AFTER &&
         Math.abs(q.lz) <= GOAL_HALF+GATE_WIDE;
}
/* Leaving the picture is a crash. The chase camera is already pinned inside
   the scene's rectangle, so anything that drifts out of frame has left the
   part of the map this level is played on. A little margin past the edge, so
   clipping a corner of the screen is forgiving - and the finish corridor is
   exempt entirely. */
function offScreen(){
  if(G.phase!=='driving'||!G.car||G.camT<1) return false;
  if(atGate()) return false;
  var p=G.car.body.position;
  cam.updateMatrixWorld();
  var v=new THREE.Vector3(p.x,p.y,p.z).project(cam);
  return v.z>1 || Math.abs(v.x)>1.08 || Math.abs(v.y)>1.08;
}
/* Nothing should ever end up under the world. If it does - a seam between
   tiles, a wheel ray that found the far face of the ground - the car is put
   back on the surface where it last was and carries on. It is emphatically NOT
   a crash: falling through the floor is the game's fault, not the driver's. */
/* Water is a hole. The ground plane holds the car up everywhere, so instead of
   cutting a gap in it the car is pulled under once it is over water - and then
   the fall IS the crash, which is the one place falling counts against you. */
/* Water is a hole, and it behaves like one: no scripted sink, no teleport
   down. The floor under the whole map is one big box, so the hole is cut where
   it matters - at the wheels. A wheel over water has its suspension ray
   shortened until it cannot reach the road, so that corner simply loses its
   support; the front wheels go over the edge first, the nose drops, and the car
   tips in under its own weight. Once the body itself is over the water it stops
   colliding with the floor too, so it keeps going down instead of bellying out
   on a surface that is not supposed to be there. */
function waterUnderWheels(){
  var c=G.car, v=c.vehicle, b=c.body, over=0;
  var lp=new CANNON.Vec3(), wp=new CANNON.Vec3();
  for(var i=0;i<v.wheelInfos.length;i++){
    var w=v.wheelInfos[i];
    if(w.keep===undefined) w.keep={st:w.suspensionStiffness, dc:w.dampingCompression,
                                   dr:w.dampingRelaxation, fs:w.frictionSlip,
                                   mf:w.maxSuspensionForce};
    lp.copy(w.chassisConnectionPointLocal);
    b.quaternion.vmult(lp,wp); wp.vadd(b.position,wp);
    if(surfaceAt(wp.x,wp.z).hole){
      over++;
      /* The ray still finds the floor - shortening it only worked until the car
         had sunk far enough for the wheel to catch it again. So the wheel is
         left to touch nothing it can push against: no spring, no damper, no
         grip. That corner carries no weight and falls. */
      w.suspensionStiffness=0; w.dampingCompression=0; w.dampingRelaxation=0;
      w.frictionSlip=0; w.maxSuspensionForce=0;
    } else if(w.suspensionStiffness===0){
      w.suspensionStiffness=w.keep.st; w.dampingCompression=w.keep.dc;
      w.dampingRelaxation=w.keep.dr; w.frictionSlip=w.keep.fs;
      w.maxSuspensionForce=w.keep.mf;
    }
  }
  return over;
}
function sinkInWater(dt){
  var c=G.car, b=c.body;
  var over=waterUnderWheels();
  var bodyOver=surfaceAt(b.position.x,b.position.z).hole;
  /* the floor stops existing for the car once it is properly over the hole */
  if(over>=3 || bodyOver){ if(b.collisionResponse){ b.collisionResponse=false; } }
  else if(!b.collisionResponse && over===0){ b.collisionResponse=true; }
  if(b.position.y<-0.35){ b.collisionResponse=true; return true; }   // in the drink
  return false;
}
function catchFall(){
  var c=G.car, b=c.body;
  if(b.position.y>-0.4) return;
  /* over water the fall is the point, and sinkInWater calls it a crash */
  if(surfaceAt(b.position.x,b.position.z).hole || !b.collisionResponse) return;
  var lv=G.scene.levels[G.levelIdx];
  var at=G.rec.length ? G.rec[G.rec.length-1]
       : {x:lv.veh.x, z:lv.veh.z, h:lv.veh.rot||0};
  b.position.set(at.x, c.rideH, at.z);
  b.quaternion.setFromAxisAngle(new CANNON.Vec3(0,1,0), yawFromHeading(at.h));
  b.velocity.set(0,0,0); b.angularVelocity.set(0,0,0); b.wakeUp();
  G.stall=0; G.roll=0; G.wasSp=0; G.lastSoft=undefined; G.cool=Math.max(G.cool,0.4);
}
/* A crash winds the whole run back to the start of the level, played backwards
   on screen so you can see it happen, then hands you the car at the start line
   again with the clock put back to what it read when the level began - the
   crash costs you the attempt, not the time. GCFG.rewind is how long the
   wind-back takes to play. */
/* Every rewind says WHY in the debug line, so a crash you did not expect can
   be told apart from one you did without guessing. */
function rewind(why){
  var c=G.car, b=c.body;
  if(why) devSay('rewind \u00b7 '+why+' \u00b7 '+(G.runT).toFixed(1)+'s');
  if(/water/.test(why||'')) SFX.splash(); else SFX.crash();
  setTimeout(function(){ SFX.rewind(); },260);
  G.bumps=(G.bumps||0)+1;                    // the first few cost nothing
  /* locked from the badge: the crash still costs you the rewind, never the car */
  G.slow=OPT.lock ? 0 : Math.max(0,(G.bumps-HANDICAP.free)*HANDICAP.step);
  setSpeedTag();
  G.crashFrom=G.runT;
  b.velocity.set(0,0,0); b.angularVelocity.set(0,0,0);
  b.collisionResponse=false; b.sleep();
  G.phase='crashback';
  G.goalAt=null;
  banner('Crashed','winding back','');
  vhs(true);
}
function crashBack(dt){
  var lv=G.scene.levels[G.levelIdx], off=lv.offset||0;
  var span=Math.max(0.001, G.crashFrom-off);
  G.runT=Math.max(off, G.runT - dt*(span/Math.max(0.05,GCFG.rewind)));
  playBack(G.runT);
  /* stay in the chase view the whole way, so you land looking at the start */
  applyPlace(chaseCam(G.bounds,G.car,dt,false));
  if(G.runT<=off) backToStart();
}
function backToStart(){
  var lv=G.scene.levels[G.levelIdx], c=G.car, b=c.body;
  vhs(false); hideBanner();
  b.position.set(lv.veh.x, c.rideH, lv.veh.z);
  b.quaternion.setFromAxisAngle(new CANNON.Vec3(0,1,0), yawFromHeading(lv.veh.rot||0));
  b.velocity.set(0,0,0); b.angularVelocity.set(0,0,0);
  b.collisionResponse=true; b.wakeUp();
  c.placeArcade(lv.veh.x, lv.veh.z, lv.veh.rot||0);
  c.vehicle.wheelInfos.forEach(function(w){
    if(w.keep){ w.suspensionStiffness=w.keep.st; w.dampingCompression=w.keep.dc;
                w.dampingRelaxation=w.keep.dr; w.frictionSlip=w.keep.fs;
                w.maxSuspensionForce=w.keep.mf; } });
  G.runT=lv.offset||0;
  G.clock=G.clockAt; setClock(G.clock);   // and the clock goes back with it
  G.rec=[]; G.recAt=0;                 // the run starts again from nothing
  G.ghosts.forEach(function(g){ g.at(G.runT); });
  G.stall=0; G.roll=0; G.wasSp=0; G.lastSoft=undefined; G.cool=GCFG.crashCool; G.flash=0;
  G.goalAt=null;
  G.phase='driving';
}
function respawn(){
  var lv=G.scene.levels[G.levelIdx];
  G.car.body.position.set(lv.veh.x, G.car.rideH, lv.veh.z);
  G.car.body.velocity.set(0,0,0); G.car.body.angularVelocity.set(0,0,0);
  G.car.body.quaternion.setFromAxisAngle(new CANNON.Vec3(0,1,0), yawFromHeading(lv.veh.rot||0));
  G.car.placeArcade(lv.veh.x, lv.veh.z, lv.veh.rot||0);
  G.goalAt=null;
}
function dollyOut(dt){
  G.dolly.t=Math.min(1,G.dolly.t+dt/TWEEN_SECS);
  applyPlace(blendPlace(G.dolly.from, macroPlace(G.bounds), ease(G.dolly.t)));
  /* the world does NOT stop while the camera pulls out - the other cars are
     still driving their runs, and you watch them from above */
  G.runT+=dt;
  playBack(G.runT);
  G.wonAt=G.runT;
  if(G.dolly.t>=1){
    /* The last level of a scene ends the scene, and there is nothing left to
       wind back for - the next scene is somewhere else on the map. So instead
       of the tape rewind, the camera simply travels to the next scene's
       opening view. */
    if(G.levelIdx+1>=G.scene.levels.length){ startEncore(); return; }
    G.phase='rewinding';
    banner('Rewinding','','');
    vhs(true);
  }
}
/* Scene to scene: one move of the camera from this scene's opening view to the
   next one's, no rewind. */
function hopScene(dt){
  G.hop.t=Math.min(1,G.hop.t+dt/(TWEEN_SECS*1.6));
  applyPlace(blendPlace(G.hop.from, G.hop.to, ease(G.hop.t)));
  if(G.hop.t>=1){
    hideBanner();
    startStage(G.nextScene);
    G.nextScene=null;
  }
}

/* ==========================================================================
   boot
   ========================================================================== */
initWorld(); resize(); requestAnimationFrame(frame);

optLoad();            /* the switches are in localStorage, and DEBUG decides
                         where everything below is read from - so it has to be
                         known before the first fetch, not after the boot bar */
loadConfig().then(function(){
  return OPT.debug ? kvAll().catch(function(){ return {}; }) : {};
}).then(function(kv){
  if(kv.config){ applyConfig(kv.config); CFG_SRC=(CFG_SRC==='data/')?'data/ + mapper':'mapper'; }
  var live = kv.city && kv.city.placed && kv.city.placed.length &&
             kv.routes && kv.routes.scenes && kv.routes.scenes.length;
  if(live){ DATA_SRC='mapper'; CITY=kv.city; ROUTES=kv.routes; return; }
  boot('Reading the city&hellip;',0.02);
  return loadFiles().then(function(d){ DATA_SRC='files'; CITY=d.city; ROUTES=d.routes; });
}).then(function(){
  if(!CITY||!CITY.placed||!CITY.placed.length) throw new Error('nocity');
  if(!ROUTES||!ROUTES.scenes||!ROUTES.scenes.length) throw new Error('noroutes');
  return loadStory().then(function(st){ STORY=st; });
}).then(function(){
  G.vehScale=(typeof ROUTES.vehScale==='number')?ROUTES.vehScale:1;
  ROUTES.scenes.forEach(function(sc){ sc.levels.forEach(function(l){
    if(typeof l.offset!=='number') l.offset=0; }); });
  boot('Building the city&hellip;',0.05);
  return buildCity(CITY.placed,function(p){ boot('Building the city&hellip;',0.05+p*0.9); });
}).then(function(){
  boot('Ready',1);
  document.getElementById('boot').classList.add('gone');
  applyPerf(); applyDebug();
  buildDev();
  startStage(ROUTES.scenes[0]);
  setPaused(false);
  /* The store knows who was driving last; boot only had localStorage's word for
     it. Re-read that player's switches now the real answer is in. */
  saveLoad(function(){ optLoad(SAVE.who); optApply(); buildHome(); });

  /* The browser will not play a note until somebody has touched the page, so
     the tape starts on the FIRST interaction of any kind - a tap anywhere on
     the title screen, picking a driver, or a key - rather than waiting for the
     button. After that this listener takes itself off. */
  ['pointerdown','keydown','touchstart'].forEach(function(ev){
    addEventListener(ev, function once(){
      audioUp(); musicGo();
      ['pointerdown','keydown','touchstart'].forEach(function(e2){
        removeEventListener(e2, once, true); });
    }, true);
  });
  document.getElementById('playBtn').onclick=function(){
    SFX.tap(); musicGo();
    var r=resumeFor(SAVE.who);
    if(r && ROUTES.scenes[r.reel]){
      sheet('home',false);
      startStage(ROUTES.scenes[r.reel], r);    // the run it was left on, with its traffic
      return;
    }
    playFrom(0);
  };
  /* Winding the whole thing back to the top is a decision, so it asks - but
     only when there is something in the slot worth losing. */
  document.getElementById('freshBtn').onclick=function(){
    SFX.tap();
    var r=partWay();
    if(r){
      homeAsk('You are on '+esc(reelAt(r))+
              '. Starting over winds the tape right back to the top.',
              'Wind it back', function(){ playFrom(0); });
      return;
    }
    playFrom(0);
  };
  document.getElementById('resumeBtn').onclick=function(){ SFX.tap(); setPaused(false); };
  /* Out of the reel and back to the title screen. The slot is on the last run
     that landed, so this costs you the run you were on and nothing else. */
  document.getElementById('quitBtn').onclick=function(){ SFX.tap(); setPaused(false); goHome(); };
}).catch(function(e){
  console.error(e);
  if(e&&e.message==='nocity')
    fail('No city found.<br><br>data/deja-vroom-city.json is missing or empty, and the mapper has nothing either. Export from <a href="mapper.html">mapper.html</a>.');
  else if(e&&e.message==='noroutes')
    fail('No routes found.<br><br>data/deja-vroom-routes.json is missing or empty, and the mapper has nothing either. Export from <a href="mapper.html">mapper.html</a>.');
  else
    fail('Could not load the game data.<br><br><code style="color:#ff8f8f">'+
         (e&&e.message?e.message:e)+'</code><br><br>It reads data/deja-vroom-city.json and '+
         'data/deja-vroom-routes.json, so the game has to be served over http rather than '+
         'opened as a file.');
});
</script>
