/* ---------- d3-geo projection ---------- */
const projection = d3.geoNaturalEarth1();

let baseScale = 1, baseT = [0,0];
function fitProjection(){
  projection.fitExtent([[10, 60], [W-10, H-40]], FC);
  baseScale = projection.scale();
  baseT = projection.translate().slice();
  applyCam();
}
/* camera: zoom + pan on top of the fitted projection */
const cam = { zoom:1, x:0, y:0 };
const MIN_ZOOM = 1, MAX_ZOOM = 12;
function applyCam(){
  projection.scale(baseScale * cam.zoom);
  projection.translate([ baseT[0]*cam.zoom + cam.x, baseT[1]*cam.zoom + cam.y ]);
}
function clampCam(){
  cam.zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, cam.zoom));
  if(!unitsReady) precomputeUnits();
  // land's on-screen bbox at the current zoom+pan (from raw scale-1 bounds; no re-walk)
  const s=baseScale*cam.zoom, tx=baseT[0]*cam.zoom+cam.x, ty=baseT[1]*cam.zoom+cam.y;
  const x0=s*uWorld[0][0]+tx, y0=s*uWorld[0][1]+ty, x1=s*uWorld[1][0]+tx, y1=s*uWorld[1][1]+ty;
  const mw=x1-x0, mh=y1-y0;
  let dx=0, dy=0;
  // if land is wider/taller than the viewport, keep the viewport INSIDE it; else centre it
  if(mw>=W){ if(x0>0)dx=-x0; else if(x1<W)dx=W-x1; } else { dx=(W-(x0+x1))/2; }
  if(mh>=H){ if(y0>0)dy=-y0; else if(y1<H)dy=H-y1; } else { dy=(H-(y0+y1))/2; }
  cam.x+=dx; cam.y+=dy;
  applyCam();
}

const aliasMap={};
for(const k in ALIASES){ const idx=canonMap[norm(ALIASES[k])]; if(idx!==undefined) aliasMap[norm(k)]=idx; }
function lev(a,b){
  const m=a.length,n=b.length; if(!m)return n; if(!n)return m;
  const dp=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    const c=a[i-1]===b[j-1]?0:1;
    dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+c);
  }
  return dp[m][n];
}
function matchCountry(raw){
  const q=norm(raw); if(!q) return -1;
  if(canonMap[q]!==undefined) return canonMap[q];
  if(aliasMap[q]!==undefined) return aliasMap[q];
  // fuzzy: tolerance scales with length; skip very short
  if(q.length<4) return -1;
  const tol=q.length<=8?1:2;
  let best=-1,bestD=99;
  for(const key in canonMap){
    if(Math.abs(key.length-q.length)>tol) continue;
    const d=lev(q,key);
    if(d<=tol && d<bestD){ bestD=d; best=canonMap[key]; if(d===0)break; }
  }
  if(best<0){
    for(const key in aliasMap){
      if(key.length<5) continue;
      if(Math.abs(key.length-q.length)>tol) continue;
      const d=lev(q,key);
      if(d<=tol && d<bestD){ bestD=d; best=aliasMap[key]; }
    }
  }
  return best;
}

  const d=gameData(),rec=playerRec(d,PLAYER),names=[];

function loadProgress(p){
  const rec=playerRec(gameData(),p);

  (rec.found||[]).forEach(v=>{
    if(typeof v!=='string') return;            // legacy index-based entries: skip

    if(idx!==undefined && !found[idx]){ found[idx]=true; foundCount++; }

let geoKey='', bboxes=new Array(TOTAL), centroids=new Array(TOTAL), tiny=new Array(TOTAL);
const uBounds=new Array(TOTAL), uCentroid=new Array(TOTAL);
let uWorld=null;   // raw (scale-1) screen bounds of ALL land, for pan clamping
let unitsReady=false;
function precomputeUnits(){
  const s=projection.scale(), t=projection.translate();
  projection.scale(1).translate([0,0]);
  for(let i=0;i<TOTAL;i++){ uBounds[i]=path.bounds(FEATURES[i]); uCentroid[i]=path.centroid(FEATURES[i]); }
  uWorld=path.bounds(LAND);
  projection.scale(s).translate(t);
  unitsReady=true;
}
function updateGeoCache(){
  if(!unitsReady) precomputeUnits();
  const s=projection.scale(), t=projection.translate();
  const k=s+'|'+t[0]+'|'+t[1]+'|'+W+'|'+H;
  if(k===geoKey) return; geoKey=k;
  for(let i=0;i<TOTAL;i++){
    const ub=uBounds[i], uc=uCentroid[i];
    const x0=ub[0][0]*s+t[0], y0=ub[0][1]*s+t[1], x1=ub[1][0]*s+t[0], y1=ub[1][1]*s+t[1];
    bboxes[i]=[[x0,y0],[x1,y1]];
    const w=x1-x0, h=y1-y0;
    tiny[i]=!isFinite(w)||!isFinite(h)||Math.max(w,h)<MICRO_PX;
    centroids[i]=(isFinite(uc[0])&&isFinite(uc[1]))?[uc[0]*s+t[0],uc[1]*s+t[1]]:null;
  }
}
function offscreen(b){ return !b||!isFinite(b[0][0])||b[1][0]<0||b[0][0]>W||b[1][1]<0||b[0][1]>H; }
/* null = the land base already paints this country correctly (big perf win:
   only found / hinted countries need a path of their own) */
function stateColor(i,allFound){
  if(found[i]) return (i===hintIdx)?COL.foundHi:(allFound?null:COL.found);
  if(!revealed && i===hintIdx) return '#6b6f2a';
  return null;
}
function draw(now){
  ctx.clearRect(0,0,W,H);
  // ocean bg gradient
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a0a2e'); g.addColorStop(0.5,'#141452'); g.addColorStop(1,'#1a1a6e');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  if(STATE==='menu') return;
  updateGeoCache();

  // 1) land base: ONE dissolved path — any residual sub-pixel seam between two
  //    neighbours reveals LAND, not ocean. Traced once, then filled AND stroked
  //    (the coastline outline can never cut between neighbours, so no seams).
  const allFound = foundCount===TOTAL;
  ctx.beginPath(); path(LAND);
  ctx.fillStyle = allFound ? COL.found : (revealed ? '#c0392b' : COL.land); ctx.fill();
  ctx.lineWidth=0.7; ctx.strokeStyle=COL.landStroke; ctx.stroke();

  // 2) per-country fills, only where the colour differs from the land base
  const dotDefault = allFound ? COL.found : (revealed ? '#e74c3c' : COL.landStroke);
  for(let i=0;i<TOTAL;i++){
    let col=stateColor(i,allFound);
    // reveal tween: a freshly-found country floods from land colour to green
    let anim=0;
    if(found[i] && revealAt[i]>=0){
      const dt=now-revealAt[i];
      if(dt<REVEAL_MS){ anim=easeOut(dt/REVEAL_MS); col=lerpColor(COL.land,(i===hintIdx?COL.foundHi:COL.found),anim); }
    }
    if(tiny[i]){
      // microstate: sub-pixel at this zoom, so draw a visible dot instead
      const c=centroids[i];
      if(!c || c[0]<-12 || c[0]>W+12 || c[1]<-12 || c[1]>H+12) continue;
      const r = anim>0 ? DOT_R*(1+0.9*Math.sin(anim*Math.PI)) : DOT_R;   // little pop as it lands
      ctx.beginPath(); ctx.arc(c[0],c[1],r,0,TAU);
      ctx.fillStyle = col || dotDefault; ctx.fill();
      continue;
    }
    if(!col) continue;
    if(offscreen(bboxes[i])) continue;
    ctx.beginPath(); path(FEATURES[i]); ctx.fillStyle=col; ctx.fill();
    if(anim>0){
      // expanding glow outline that fades as the fill settles
      ctx.save(); ctx.globalAlpha=1-anim; ctx.lineWidth=1+3*(1-anim);
      ctx.strokeStyle=COL.foundHi; ctx.shadowColor=COL.foundHi; ctx.shadowBlur=12*(1-anim);
      ctx.stroke(); ctx.restore();
    }
  }

  // 3) shared borders: one thin BLACK stroke of the interior mesh, on top of the fills
  ctx.beginPath(); path(BORDERS);
  ctx.lineWidth=0.7; ctx.strokeStyle='#000'; ctx.stroke();

  // 4) pulsing hint highlight
  if(hintIdx>=0){
    const pulse=0.5+0.5*Math.sin(now/200);
    ctx.save(); ctx.lineWidth=2+2*pulse; ctx.strokeStyle=COL.gold; ctx.shadowColor=COL.gold; ctx.shadowBlur=16;
    ctx.beginPath(); path(FEATURES[hintIdx]); ctx.stroke();
    if(tiny[hintIdx]){
      const c=centroids[hintIdx];
      if(c){ ctx.beginPath(); ctx.arc(c[0],c[1],10+4*pulse,0,TAU); ctx.stroke(); }
    }
    ctx.restore();
  }
}

/* ---------- Hint / reveal / guess ---------- */
function updateHintBtn(){
  const now=performance.now();
  if(now<hintCooldownUntil){ hintBtn.disabled=true; hintBtn.textContent='Hint '+Math.ceil((hintCooldownUntil-now)/1000)+'s'; }
  else { hintBtn.disabled=false; hintBtn.textContent='Hint'; }
}
function giveHint(idx){
  const now=performance.now();
  if(STATE!=='play'||now<hintCooldownUntil) return false;
  if(idx<0||idx>=TOTAL||found[idx]) return false;
  hintIdx=idx; hintCooldownUntil=now+HINT_COOLDOWN;
  const nm=COUNTRIES[idx].name, info=INFO[nm];
  hintInfo=info?{name:nm,capital:info[0],fact:info[1]}:{name:nm,capital:'',fact:''};
  panToCountry(idx); sfxHint(); updateHintBtn(); return true;
}
function useHint(){
  if(STATE!=='play'||performance.now()<hintCooldownUntil)return;
  const pool=[]; for(let i=0;i<TOTAL;i++)if(!found[i])pool.push(i);
  if(!pool.length)return;
  giveHint(pool[Math.floor(Math.random()*pool.length)]);
}
// tap a country you don't have yet -> a hint for THAT country (shares the hint cooldown)
function tapCountry(px,py){
  const i=countryAt(px,py); if(i<0)return;
  if(found[i]){ hoverIdx=i; return; }                 // tapping a found country just flashes its name
  const now=performance.now();
  if(now<hintCooldownUntil){ showToast('Hint ready in '+Math.ceil((hintCooldownUntil-now)/1000)+'s',COL.subtitle); return; }
  giveHint(i);
}
function panToCountry(idx){
  const c=path.centroid(FEATURES[idx]); if(!c||isNaN(c[0]))return;
  // move camera so centroid goes to screen centre, at a comfortable zoom
  const targetZoom=Math.max(cam.zoom,2.6); const f=targetZoom/cam.zoom;
  cam.zoom=Math.min(targetZoom,MAX_ZOOM);
  // recompute after zoom, then centre
  applyCam(); const c2=path.centroid(FEATURES[idx]);
  cam.x += (W/2 - c2[0]); cam.y += (H/2 - c2[1]); clampCam();
}
function submitGuess(){
  if(STATE!=='play')return;
  const raw=guessEl.value.trim(); if(!raw)return;
  const idx=matchCountry(raw);
  if(idx<0){ sfxWrong(); showToast('Not a country — try again',COL.danger); return; }
  if(found[idx]){ showToast(COUNTRIES[idx].name+' already found',COL.subtitle); guessEl.value=''; return; }
  found[idx]=true; revealAt[idx]=performance.now(); foundCount++; guessEl.value=''; sfxCorrect();
  showToast('✓ '+COUNTRIES[idx].name,COL.foundHi);
  // clear the hint once the next country is entered correctly
  hintIdx=-1; hintInfo=null;
  saveProgress();
  if(foundCount===TOTAL) winGame();
}
function winGame(){ endTime=performance.now(); elapsed=endTime-startTime; saveProgress(); sfxWin(); initConfetti(); STATE='summary'; typePanel.classList.add('hidden'); updatePanelMetrics(); }
function doResetProgress(){
  const d=gameData(),rec=playerRec(d,PLAYER); rec.found=[]; saveArcadeData(d);
  found.fill(false); revealAt.fill(-1); foundCount=0; revealed=false; hintIdx=-1; hintInfo=null; hintCooldownUntil=0;
  startTime=performance.now(); elapsed=0; showToast('Progress reset',COL.glow);
}

    keyboardEl.appendChild(r);
  });
  const r=document.createElement('div'); r.className='krow';
  r.appendChild(makeKey('⌫','key wide',backspace));

/* height of the bottom typing panel, so canvas toast/hint sit above it */

/* ---------- pointer: hit-test, pan, zoom, hover, press-hold ---------- */
const NEAR_PX=14;   // forgiving tap slop
const DOT_HIT=8;    // tap radius for a microstate dot (dot itself is DOT_R)
function nearestCentroid(px,py,onlyTiny){
  const r=onlyTiny?DOT_HIT:NEAR_PX; let best=-1,bestD=r*r;
  for(let i=0;i<TOTAL;i++){
    if(onlyTiny&&!tiny[i]) continue;
    const c=centroids[i]; if(!c) continue;
    const dx=c[0]-px, dy=c[1]-py, d=dx*dx+dy*dy;
    if(d<bestD){ bestD=d; best=i; }
  }
  return best;
}
function countryAt(px,py){
  updateGeoCache();
  // microstates are drawn as dots — test them FIRST so enclaves (Vatican inside
  // Italy, San Marino, Monaco…) stay tappable instead of hitting the host country
  const dot=nearestCentroid(px,py,true);
  if(dot>=0) return dot;
  // d3 projection invert + geoContains for accurate hit-testing
  const ll=projection.invert&&projection.invert([px,py]);
  if(ll){ for(let i=0;i<TOTAL;i++){ if(d3.geoContains(FEATURES[i],ll)) return i; } }
  // forgiving fallback: nearest projected centroid within NEAR_PX
  return nearestCentroid(px,py,false);
}
function hitBox(x,y,b){ return b&&x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h; }
const pointers=new Map(); let lastPinch=0, dragMoved=false, dragStart=null;
canvas.addEventListener('pointerdown',e=>{
  if(STATE==='summary'){ if(hitBox(e.clientX,e.clientY,againBtn)){ resetRun(); startGame(); } return; }
  if(STATE!=='play')return;
  if(confirmReset){ if(hitBox(e.clientX,e.clientY,resetYesBtn)){doResetProgress();confirmReset=false;} else if(hitBox(e.clientX,e.clientY,resetNoBtn)){confirmReset=false;} return; }
  if(hitBox(e.clientX,e.clientY,resetBtn)){ confirmReset=true; return; }
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  dragMoved=false; dragStart={x:e.clientX,y:e.clientY,camx:cam.x,camy:cam.y};
  if(pointers.size===2){ const p=[...pointers.values()]; lastPinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y); }
  // press-hold (touch) to reveal a found country label
  if(e.pointerType!=='mouse'){ pressHoldTimer=setTimeout(()=>{ const i=countryAt(e.clientX,e.clientY); if(i>=0&&found[i]) hoverIdx=i; },350); }
});
canvas.addEventListener('pointermove',e=>{
  if(STATE!=='play')return;
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){
    const p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    if(lastPinch){ const mx=(p[0].x+p[1].x)/2,my=(p[0].y+p[1].y)/2; zoomAt(mx,my,d/lastPinch); }
    lastPinch=d; dragMoved=true; if(pressHoldTimer){clearTimeout(pressHoldTimer);pressHoldTimer=null;} return;
  }
  if(dragStart && pointers.has(e.pointerId)){
    const dx=e.clientX-dragStart.x, dy=e.clientY-dragStart.y;
    if(Math.abs(dx)+Math.abs(dy)>4){ dragMoved=true; if(pressHoldTimer){clearTimeout(pressHoldTimer);pressHoldTimer=null;} }
    cam.x=dragStart.camx+dx; cam.y=dragStart.camy+dy; clampCam();
  }
  // mouse hover: reveal found country label
  if(e.pointerType==='mouse' && pointers.size===0){ const i=countryAt(e.clientX,e.clientY); hoverIdx=(i>=0&&found[i])?i:-1; }
});
function endPointer(e){ pointers.delete(e.pointerId); if(pointers.size<2)lastPinch=0; if(!pointers.size)dragStart=null; if(pressHoldTimer){clearTimeout(pressHoldTimer);pressHoldTimer=null;} if(e.pointerType!=='mouse')hoverIdx=-1; }
canvas.addEventListener('pointerup',e=>{
  // a clean tap on the map (single pointer, no drag, not a HUD button) -> tap-to-hint
  if(STATE==='play' && dragStart && !dragMoved && pointers.size===1) tapCountry(e.clientX,e.clientY);
  endPointer(e);
});
canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('pointerleave',e=>{ if(e.pointerType==='mouse')hoverIdx=-1; });
function zoomAt(cx,cy,factor){
  const before=cam.zoom; cam.zoom=Math.max(MIN_ZOOM,Math.min(MAX_ZOOM,cam.zoom*factor)); const f=cam.zoom/before;
  // keep (cx,cy) roughly stationary: adjust pan
  cam.x = cx-(cx-cam.x)*f; cam.y = cy-(cy-cam.y)*f; clampCam();
}
canvas.addEventListener('wheel',e=>{ if(STATE!=='play')return; e.preventDefault(); zoomAt(e.clientX,e.clientY,e.deltaY<0?1.12:1/1.12); },{passive:false});

/* ---------- Game flow ---------- */
function resetRun(){ found.fill(false); revealAt.fill(-1); foundCount=0; revealed=false; hintIdx=-1; hintInfo=null; hintCooldownUntil=0; cam.zoom=1; cam.x=0; cam.y=0; clampCam(); }
function startGame(){ STATE='play'; startTime=performance.now(); elapsed=0; document.getElementById('overlay').classList.add('hidden'); typePanel.classList.remove('hidden'); updatePanelMetrics(); ensureAudio(); setTimeout(()=>{guessEl.focus(); updatePanelMetrics();},100); }
function updateProgressPreview(p){ const s=playerSummary(p); document.getElementById('playerProgress').textContent=s?s:''; }
function startAsPlayer(p){
  PLAYER=p;
  document.querySelectorAll('.pbtn').forEach(b=>b.classList.toggle('sel',b.dataset.player===p));
  ensureAudio(); loadProgress(p);
  revealed=false; hintIdx=-1; hintInfo=null; hintCooldownUntil=0; confirmReset=false;
  cam.zoom=1; cam.x=0; cam.y=0; clampCam();
  startGame();
}
document.querySelectorAll('.pbtn').forEach(b=>{
  // show saved progress on hover/focus, and start that player's game on click
  b.addEventListener('pointerenter',()=>updateProgressPreview(b.dataset.player));
  b.addEventListener('focus',()=>updateProgressPreview(b.dataset.player));
  b.addEventListener('click',()=>startAsPlayer(b.dataset.player));
});

/* ---------- Main loop ---------- */
function loop(now){
  if(STATE==='play') elapsed=now-startTime;
  draw(now);
  if(STATE==='play'){
    drawHoverLabel();
    drawHintClue();
    drawHUD(now);
    drawToast(now);
    updateHintBtn();
    if(confirmReset) drawResetConfirm();
  }
  if(STATE==='summary'){ drawSummary(now); if(foundCount===TOTAL)drawConfetti(); }
  requestAnimationFrame(loop);
}
resize();
window.addEventListener('resize',resize);
requestAnimationFrame(loop);

</script>
