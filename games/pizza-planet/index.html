<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Pizza Planet - Garfield Boys' Arcade</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body { background:#0a0a2e; touch-action:none; -webkit-user-select:none; user-select:none;
         font-family:Nunito,system-ui,sans-serif; color:#3A2218; -webkit-tap-highlight-color:transparent; }
  #backBtn { position:fixed; top:12px; left:12px; z-index:9999;
    background:rgba(0,0,0,0.55); color:#fff; text-decoration:none;
    padding:6px 18px; border-radius:20px;
    font:600 15px/1.4 Fredoka,'Segoe UI',system-ui,sans-serif;
    border:1px solid rgba(255,255,255,0.18);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); transition:background 0.2s; }
  #backBtn:hover { background:rgba(0,0,0,0.75); }
  #stage { position:absolute; left:0; top:0; width:1333px; height:690px; overflow:hidden;
           transform-origin:0 0; touch-action:none; }
  .scr { position:absolute; inset:0; overflow:hidden; }
  .space { background:
      radial-gradient(circle,rgba(255,255,255,.75) 1px,transparent 1.6px) 0 0/97px 97px,
      radial-gradient(circle,rgba(255,255,255,.4) 1px,transparent 1.6px) 41px 63px/131px 131px,
      radial-gradient(circle,rgba(255,230,160,.5) 1.5px,transparent 2px) 70px 20px/173px 173px,
      linear-gradient(#0a0a2e,#141452 55%,#1a1a6e); }
  .ab { position:absolute; }
  .fx { display:flex; align-items:center; }
  .fd { font-family:Fredoka,system-ui,sans-serif; }
  .cap { font:800 11px Nunito,sans-serif; letter-spacing:.14em; text-transform:uppercase; color:#9A7A62; }
  .pill { display:flex; align-items:center; gap:8px; background:#FFF8EC; border-radius:999px; padding:8px 18px;
          box-shadow:0 4px 0 rgba(0,0,0,.25); font:700 22px/1 Fredoka,sans-serif; font-variant-numeric:tabular-nums; }
  .coin { width:22px; height:22px; border-radius:50%; flex:none;
          background:radial-gradient(circle at 35% 30%,#FFE89A,#FFC94A 55%,#D99A1A); box-shadow:0 2px 3px rgba(0,0,0,.2); }
  .btn { display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; color:#fff;
         white-space:nowrap; transition:transform .08s; }
  .btn:active { transform:translateY(4px); }
  .btn .ic { font-size:1.1em; line-height:1; filter:drop-shadow(0 2px 0 rgba(0,0,0,.18)); }
  .tap { cursor:pointer; }
  .tap:active { transform:translateY(3px); }
  .logo { font:700 32px/1 Fredoka,sans-serif; display:flex; gap:9px; letter-spacing:-.01em; }
  .tp { position:relative; width:64px; height:64px; pointer-events:none; }
  .sil { filter:brightness(0) opacity(.28); }
  .lift { transition:transform .2s cubic-bezier(.3,1.6,.5,1); }
  .lift:active { transform:translateY(-4px) scale(.98); }
  @keyframes squash { 0%{transform:scale(1.35,.65)} 45%{transform:scale(.88,1.12)} 75%{transform:scale(1.06,.95)} 100%{transform:scale(1)} }
  .squash > .tpw { animation:squash .34s ease-out; }
  @keyframes bob { 0%,100%{transform:translateY(0) scaleY(1)} 50%{transform:translateY(-5px) scaleY(1.02)} }
  @keyframes hop { 0%{transform:translateY(40px) scale(.7);opacity:0} 60%{transform:translateY(-12px) scale(1.05);opacity:1} 100%{transform:none} }
  @keyframes happy { 0%,100%{transform:translateY(0)} 30%{transform:translateY(-22px) rotate(-4deg)} 60%{transform:translateY(0) rotate(3deg)} }
  @keyframes wobble { 0%,100%{transform:rotate(-6deg) scale(1)} 50%{transform:rotate(6deg) scale(1.08)} }
  @keyframes zz { 0%{transform:translate(0,0);opacity:0} 30%{opacity:1} 100%{transform:translate(18px,-30px);opacity:0} }
  @keyframes pop { 0%{transform:scale(.4);opacity:0} 70%{transform:scale(1.08);opacity:1} 100%{transform:scale(1)} }
  @keyframes toast { 0%{transform:translate(-50%,30px);opacity:0} 12%,85%{transform:translate(-50%,0);opacity:1} 100%{transform:translate(-50%,10px);opacity:0} }
  @keyframes flash { 0%{opacity:0;transform:translateY(0)} 20%{opacity:1} 100%{opacity:0;transform:translateY(-40px)} }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(79,163,90,.55)} 50%{box-shadow:0 0 0 8px rgba(79,163,90,0)} }
  .bob { animation:bob 2.2s ease-in-out infinite; }
  .arrive { animation:hop .45s cubic-bezier(.3,1.4,.5,1); }
  .yay { animation:happy .6s ease-out; }
  .toast { position:absolute; left:50%; bottom:22px; background:#3A2218; color:#FFF8EC; font:600 18px Fredoka,sans-serif;
           padding:12px 24px; border-radius:999px; box-shadow:0 8px 20px rgba(0,0,0,.25); animation:toast 2.4s ease forwards;
           pointer-events:none; z-index:80; white-space:nowrap; }
  #music { position:absolute; right:14px; top:14px; width:48px; height:48px; border-radius:50%; z-index:90;
           background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center;
           cursor:pointer; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); transition:transform .08s, background .2s; }
  #music:active { transform:scale(.92); }
  #music svg { width:26px; height:26px; display:block; }
  #music.off { background:rgba(0,0,0,.35); }
  #dbg { position:fixed; right:12px; top:60px; z-index:10000; width:260px; background:rgba(10,10,46,.92); color:#fff;
         border:1px solid rgba(162,155,254,.5); border-radius:14px; padding:14px; font:600 14px Nunito,sans-serif; display:none; }
  #dbg.on { display:block; }
  #dbg h3 { font:700 16px Fredoka,sans-serif; color:#a29bfe; margin-bottom:8px; }
  #dbg label { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:8px 0; }
  #dbg select, #dbg input[type=range] { width:130px; }
  #dbg button { margin:6px 6px 0 0; padding:6px 10px; border-radius:8px; border:none; background:#6c5ce7; color:#fff; font:700 13px Fredoka,sans-serif; }

        <div class="btn" data-act="home" style="height:48px;padding:0 18px 0 8px;border-radius:24px;background:rgba(255,255,255,.14);font:700 18px Fredoka,sans-serif"><span style="width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#EDE3D6);box-shadow:inset 0 -8px 0 ${pr.color}"></span>${pr.name}</div>

        <div class="fx" style="gap:16px">${P.planet(p, 32, status === 'far')}
          <div style="flex:1;display:flex;flex-direction:column;gap:4px;min-width:0"><div class="fd" style="font-weight:700;font-size:30px;line-height:1">${p.name}</div>

          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
            ${status === 'open' ? `<div class="fx fd" style="gap:5px;font-weight:700;font-size:20px">${slice(26)}${s.shifts[p.id] || 0}</div>` : ''}
            ${i > 0 ? `<div class="fx fd" style="gap:5px;font-weight:700;font-size:15px;color:#fff;background:#F0B43A;padding:4px 12px;border-radius:999px"><div class="coin" style="width:16px;height:16px"></div>×${D.planetMult(i)}</div>` : ''}</div></div>
        <div style="display:flex;gap:16px;align-items:flex-end">
          <div style="display:flex;flex-direction:column;gap:4px"><span class="cap">Locals</span>
            <div style="display:flex;gap:4px">${p.species.map(m => `<div style="width:52px;height:57px;position:relative">${P.mIcon({ species: m }, 0.26, D.species[m].trait === 'twins')}</div>`).join('')}</div></div>
          ${traits ? `<div style="display:flex;flex-direction:column;gap:6px;padding-bottom:6px"><span class="cap">New here</span><div style="display:flex;gap:6px;flex-wrap:wrap">${traits}</div></div>` : ''}

  /* ----- Shop ----- */
  let SS = null;

  function buy(id) {
    const s = SS, price = D.price(id), item = D.ing[id] || D.rec[id];
    if (s.owned[id]) return;
    if (D.rec[id] && !D.rec[id].parts.every(x => s.owned[x])) { SFX.no(); toast('Buy its ingredients first!'); return; }
    if (s.coins < price) { SFX.no(); toast('Not enough coins yet. Feed more monsters!'); return; }
    s.coins -= price; s.owned[id] = true; D.save(s); SFX.buy();

    screenEl.innerHTML = `<div class="scr" style="background:radial-gradient(ellipse at 60% 20%,#FFF4E2,#FBEBD3 55%,#F2D9B6)">
      ${header('<div class="fd" style="font-weight:700;font-size:30px;line-height:1">Cosmic Pantry</div>', 'Buy ingredients and recipes to open new planets', true)}
        <div class="pill" style="box-shadow:0 4px 0 rgba(160,100,50,.25)">${slice(24)}<span>${D.sliceTotal(s)}</span></div>

        ${btn({ act: 'galaxy', label: 'Galaxy', icon: '🪐', color: '#4A4FA8', h: 48, font: 20, pad: 20 })}
      </div>

  /* ----- Alien guide ----- */
  const PARTS = { body: ['blob', 'round', 'tall', 'pear', 'wide', 'bean', 'square'], eyes: ['1', '2', '3', '5', 'sleepy', 'stalk'], top: ['', 'antenna', 'antennae', 'horns', 'ears', 'tuft', 'sprout', 'crown'], extra: ['', 'cheeks', 'freckles', 'spots', 'fangs', 'belly', 'unibrow'] };
  const SYL = ['Blo', 'Zib', 'Gor', 'Wum', 'Fli', 'Snor', 'Quib', 'Mo', 'Plin', 'Dro', 'Ka', 'Nub'];
  const END = ['rp', 'ble', 'zle', 'nk', 'bo', 'gus', 'ling', 'mo', 'x'];
  function renderGuide() {
    const g = UI.guide, mu = g.mutant, sp = D.species[g.sel];
    const planet = D.planets.find(p => p.id === (mu ? mu.planet : sp.planet)), trait = D.traits[mu ? mu.trait : sp.trait];
    const pill = on => `height:44px;min-width:44px;padding:0 14px;border-radius:22px;display:flex;align-items:center;justify-content:center;font:700 15px Fredoka,sans-serif;background:${on ? '#FFF8EC' : 'transparent'};color:${on ? '#3A2218' : '#E6E2FF'}`;

      cells += `<div class="tap" data-act="gpick" data-id="${id}" style="position:relative;height:106px;border-radius:16px;background:${on ? '#FFF8EC' : 'rgba(255,255,255,.06)'};margin:2px;opacity:${dim ? .25 : 1};transition:opacity .2s;overflow:hidden">
        <div style="position:absolute;left:5px;top:4px;width:76px;height:84px">${P.mIcon({ species: id, variant: g.gridVar }, 0.38, s.trait === 'twins')}</div>

        <span class="fd" style="position:absolute;left:2px;right:2px;bottom:5px;font-weight:600;font-size:11px;line-height:1;text-align:center;color:${on ? '#3A2218' : '#E6E2FF'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.name}</span></div>`;

    screenEl.innerHTML = `<div class="scr space">

        <div style="display:flex;gap:4px;background:rgba(255,255,255,.12);padding:4px;border-radius:999px">${[0, 1, 2].map(i => `<div class="tap" data-act="ggrid" data-i="${i}" style="${pill(g.gridVar === i)}">${i + 1}</div>`).join('')}</div>
        ${btn({ act: 'galaxy', label: 'Galaxy', icon: '🪐', color: '#4A4FA8', h: 48, font: 20, pad: 20 })}

          <div style="position:absolute;left:12px;right:12px;bottom:10px;display:flex;justify-content:center;gap:6px">${moods}</div></div>

  /* =====================================================================
     THE SHIFT
     ===================================================================== */
  const PX = 500, PY = 96, PD = 380, CX = PX + PD / 2, CY = PY + PD / 2, SHIFT = 60, TOP = 96; /* TOP = topping size on the pizza */
  /* rewards: exact order = (BASE + PER_TOPPING × toppings + patience × 10) × trait × planet; a recipe counts as 2 toppings.
     Each finished shift that fed at least one monster earns one pizza slice on that planet. */
  const BASE = 12, PER_TOPPING = 2;
  /* later planets pay more (and cost more) by D.planetMult(i): ×1 … ×3.25 */

  const ADJ = ['Galactic', 'Wobbly', 'Cosmic', 'Squishy', 'Mega', 'Moonbeam', 'Sparkly', 'Gloopy', 'Turbo', 'Teeny'];
  const NOUN = ['Supreme', 'Deluxe', 'Special', 'Surprise', 'Feast', 'Classic', 'Stack', 'Party', 'Blast'];
  const LINES = {
    regular: ['One pizza, extra silly please!', 'Make it just like the card!', 'My tummy is doing backflips!', 'I came all this way for pizza!'],

  const theme = document.getElementById('theme'), mBtn = document.getElementById('music');
  const SPK = '<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#fff" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>';
  const ICON_ON = `<svg viewBox="0 0 24 24" fill="none">${SPK}<path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>`;
  const ICON_OFF = `<svg viewBox="0 0 24 24" fill="none">${SPK}<path d="M15.5 9.5l5 5M20.5 9.5l-5 5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>`;
  let muted = false, playing = false;
  const EVENTS = ['pointerdown', 'pointerup', 'click', 'touchend', 'keydown'];
  function drawMusic() { mBtn.innerHTML = muted ? ICON_OFF : ICON_ON; mBtn.classList.toggle('off', muted); }
  function arm() { EVENTS.forEach(e => document.addEventListener(e, startMusic, true)); }
  function disarm() { EVENTS.forEach(e => document.removeEventListener(e, startMusic, true)); }
  function startMusic(e) {
    if (e && e.target && e.target.closest && e.target.closest('#music')) return; /* the toggle handles itself */
    if (playing || muted) return;
    theme.volume = 0.5;
    let p; try { p = theme.play(); } catch (err) { return; }
    if (p && p.then) p.then(() => { playing = true; disarm(); }, () => {}); else { playing = true; disarm(); }
  }
  mBtn.addEventListener('click', () => {
    muted = !muted; drawMusic();
    if (SAVE) { SAVE.muted = muted; persist(); }
    if (muted) { theme.pause(); playing = false; disarm(); }
    else { playing = false; arm(); startMusic(); }
  });
  document.addEventListener('visibilitychange', () => {
    if (!playing) return;
    if (document.hidden) theme.pause(); else theme.play().catch(() => {});
  });
  drawMusic(); arm();

  /* ---------- boot ---------- */
  Store.ready(() => {
    const d = Store.get();
    SAVE = (d && d.profiles) ? d : { active: 'caleb', profiles: {} };
    saveGen = SAVE.gen || 0;
    muted = !!SAVE.muted; drawMusic(); if (muted) disarm();
    ['caleb', 'ezra'].forEach(pid => { if (!SAVE.profiles[pid] || !SAVE.profiles[pid].owned) SAVE.profiles[pid] = freshSave(); });
    go('home');
  });
  window.__PP = { get G() { return G; }, get SAVE() { return SAVE; }, DBG, go, quickAdd, finish: l => finish(l), tick, evaluate: () => evaluate(), endShift: () => endShift() };
})();
</script>
