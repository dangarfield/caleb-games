// Lane offsets from center spline
const laneConfig = { centerOffset: 0, leftOffset: -0.2, rightOffset: 0.2, showDebug: false };

// Debug visualization objects
let debugGroup = null;

// Stored during buildRaceSpline: point index where each piece starts
let splinePieceBoundaries = []; // [{ pointIndex, pieceIdx }]

function buildRaceSpline() {
  if (track.length < 4) return null;
  const points = [];
  splinePieceBoundaries = [];
  track.forEach((p, trackIdx) => {
    splinePieceBoundaries.push({ pointIndex: points.length, pieceIdx: p.pieceIdx });
    const def = PIECES[p.pieceIdx];
    const curX = p.prevCursor.x;
    const curZ = p.prevCursor.z;
    const startY = p.prevCursor.y || 0;
    const heading = p.heading;

    // Compute exit Y for this piece
    const nextCursor = getNextCursor(p.pieceIdx, p.prevCursor, p.rotation || 0);
    const endY = nextCursor.y || 0;

    if (def.turn === 0) {
      // Straight piece: linear interpolation
      const entryW = transformPoint(def.entry.x, def.entry.z, heading);
      const exitW = transformPoint(def.exit.x, def.exit.z, heading);
      const dx = exitW.x - entryW.x;
      const dz = exitW.z - entryW.z;
      const hasHeight = Math.abs(endY - startY) > 0.01;
      const hasBump = def.bumpHeight > 0;
      const steps = (hasHeight || hasBump) ? 8 : Math.max(2, Math.ceil(Math.sqrt(dx*dx + dz*dz) * 2));
      for (let i = 0; i < steps; i++) {
        const t = i / steps;
        let y;
        if (hasBump) {
          // Sine hump: rises to bumpHeight at midpoint, returns to startY
          y = startY + def.bumpHeight * Math.sin(t * Math.PI) + 0.005;
        } else if (hasHeight) {
          // Smoothstep for ramps (curved height transition)
          const yT = t * t * (3 - 2 * t);
          y = startY + (endY - startY) * yT + 0.005;
        } else {
          y = startY + (endY - startY) * t + 0.005;
        }
        points.push(new THREE.Vector3(curX + dx * t, y, curZ + dz * t));
      }
    } else {
      // Corner piece: arc interpolation
      const turnRad = def.turn * DEG;
      const entryW = transformPoint(def.entry.x, def.entry.z, heading);
      const exitW = transformPoint(def.exit.x, def.exit.z, heading);
      const dx = exitW.x - entryW.x;
      const dz = exitW.z - entryW.z;
      const chord = Math.sqrt(dx*dx + dz*dz);
      const R = chord / (2 * Math.sin(Math.abs(turnRad) / 2));

      // Entry direction in world (heading 0 = -Z)
      const dirX = Math.sin(heading * DEG);
      const dirZ = -Math.cos(heading * DEG);

      // Perpendicular toward arc center
      const sign = def.turn > 0 ? 1 : -1;
      const perpX = sign * (-dirZ);
      const perpZ = sign * dirX;

      // Arc center in world
      const centerX = curX + perpX * R;
      const centerZ = curZ + perpZ * R;

      // Start angle
      const startAngle = Math.atan2(curZ - centerZ, curX - centerX);
      const sweep = turnRad;

      // Sample arc
      const steps = Math.max(4, Math.ceil(Math.abs(def.turn) / 10));
      for (let i = 0; i < steps; i++) {
        const t = i / steps;
        const angle = startAngle + t * sweep;
        const px = centerX + R * Math.cos(angle);
        const pz = centerZ + R * Math.sin(angle);
        const y = startY + (endY - startY) * t + 0.005;
        points.push(new THREE.Vector3(px, y, pz));
      }
    }
  });
  // Add straight section from track end to loopTarget (the start grid)
  // Mark boundary so bridge section is treated as a straight (no corner limit)
  splinePieceBoundaries.push({ pointIndex: points.length, pieceIdx: -1 });
  const lastTrack = track[track.length - 1];
  const lastCursor = getNextCursor(lastTrack.pieceIdx, lastTrack.prevCursor, lastTrack.rotation);
  const ltX = loopTarget.x, ltZ = loopTarget.z;

  // Bridge from track end to loopTarget
  const bridge1Dx = ltX - lastCursor.x;
  const bridge1Dz = ltZ - lastCursor.z;
  const bridge1Len = Math.sqrt(bridge1Dx*bridge1Dx + bridge1Dz*bridge1Dz);
  const lastY = lastCursor.y || 0;
  const firstY = track[0].prevCursor.y || 0;
  if (bridge1Len > 0.1) {
    const steps = Math.max(2, Math.ceil(bridge1Len * 2));
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      const y = lastY + (firstY - lastY) * t + 0.005;
      points.push(new THREE.Vector3(lastCursor.x + bridge1Dx * t, y, lastCursor.z + bridge1Dz * t));
    }
  }

  // Bridge from loopTarget back to startCursor (the start grid straight)
  const scX = track[0].prevCursor.x, scZ = track[0].prevCursor.z;
  const bridge2Dx = scX - ltX;
  const bridge2Dz = scZ - ltZ;
  const bridge2Len = Math.sqrt(bridge2Dx*bridge2Dx + bridge2Dz*bridge2Dz);
  if (bridge2Len > 0.1) {
    const steps = Math.max(2, Math.ceil(bridge2Len * 2));
    for (let i = 1; i < steps; i++) { // Don't include last point (it's the first track point)
      const t = i / steps;
      points.push(new THREE.Vector3(ltX + bridge2Dx * t, firstY + 0.005, ltZ + bridge2Dz * t));
    }
  }

  // Record total points for piece map building
  splinePieceBoundaries.totalPoints = points.length;
  return new THREE.CatmullRomCurve3(points, true, 'catmullrom', 0.3);
}

// Get a point offset laterally from the spline (positive = left, negative = right)
// Uses arc-length parameterization for uniform speed
function getOffsetPoint(spline, t, lateralOffset) {
  const pos = spline.getPointAt(t);
  if (lateralOffset === 0) return pos;
  const tangent = spline.getTangentAt(t).normalize();
  // Perpendicular in XZ plane (rotate tangent 90 degrees)
  const normal = new THREE.Vector3(-tangent.z, 0, tangent.x);
  return pos.clone().add(normal.multiplyScalar(lateralOffset));
}

function updateDebugVis() {
  if (debugGroup) { scene.remove(debugGroup); debugGroup = null; }
  if (!laneConfig.showDebug || track.length < 4) return;

  const spline = buildRaceSpline();
  if (!spline) return;

  debugGroup = new THREE.Group();
  const numSamples = 100;

  // Center line
  const centerPts = [];
  const leftPts = [];
  const rightPts = [];
  for (let i = 0; i <= numSamples; i++) {
    const t = i / numSamples;
    centerPts.push(getOffsetPoint(spline, t, laneConfig.centerOffset));
    leftPts.push(getOffsetPoint(spline, t, laneConfig.leftOffset));
    rightPts.push(getOffsetPoint(spline, t, laneConfig.rightOffset));

  }

  // Draw center line (white)
  const centerGeo = new THREE.BufferGeometry().setFromPoints(centerPts);
  const centerLine = new THREE.Line(centerGeo, new THREE.LineBasicMaterial({ color: 0xffffff, opacity: 0.6, transparent: true }));
  debugGroup.add(centerLine);

  // Draw left line (blue)
  const leftGeo = new THREE.BufferGeometry().setFromPoints(leftPts);
  const leftLine = new THREE.Line(leftGeo, new THREE.LineBasicMaterial({ color: 0x4488ff, opacity: 0.8, transparent: true }));
  debugGroup.add(leftLine);

  // Draw right line (red)
  const rightGeo = new THREE.BufferGeometry().setFromPoints(rightPts);
  const rightLine = new THREE.Line(rightGeo, new THREE.LineBasicMaterial({ color: 0xff4444, opacity: 0.8, transparent: true }));
  debugGroup.add(rightLine);

  // Draw sample points (yellow dots at spline control points)
  const dotGeo = new THREE.SphereGeometry(0.04);
  const dotMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
  // Rebuild points to show raw control points
  const tempSpline = buildRaceSpline();
  if (tempSpline) {
    // Show evenly spaced points along the final spline
    for (let i = 0; i < 60; i++) {
      const t = i / 60;
      const pt = tempSpline.getPoint(t);
      pt.y = 0.08;
      const dot = new THREE.Mesh(dotGeo, dotMat);
      dot.position.copy(pt);
      debugGroup.add(dot);
    }
  }

  scene.add(debugGroup);
}

// Maps spline t ranges to corner types — rebuilt when spline is built
let splinePieceMap = []; // [{ tStart, tEnd, cornerType: 'small'|'large'|'larger'|null }]

function buildSplinePieceMap() {
  if (!raceSpline || track.length === 0 || splinePieceBoundaries.length === 0) return;
  splinePieceMap = [];

  const totalPts = splinePieceBoundaries.totalPoints;
  // Use the spline's arc-length lookup to convert raw u (point-index fraction) to arc-length t
  // CatmullRomCurve3.getPointAt(t) uses arc-length, getPoint(u) uses uniform u
  // We need to find arc-length t for each raw u boundary
  // Sample the spline's length distribution to build u->t mapping
  const divisions = 200;
  const lengths = raceSpline.getLengths(divisions);
  const totalLength = lengths[divisions];

  function uToArcT(u) {
    // u is raw parameter (0-1), returns arc-length t (0-1)
    // Find which segment u falls in and interpolate the arc-length fraction
    const targetIdx = u * divisions;
    const idx = Math.floor(targetIdx);
    if (idx >= divisions) return 1;
    const frac = targetIdx - idx;
    const len = lengths[idx] + (lengths[idx + 1] - lengths[idx]) * frac;
    return len / totalLength;
  }

  for (let i = 0; i < splinePieceBoundaries.length; i++) {
    const rawU = splinePieceBoundaries[i].pointIndex / totalPts;
    const nextRawU = i < splinePieceBoundaries.length - 1
      ? splinePieceBoundaries[i + 1].pointIndex / totalPts
      : 1.0;

    const tStart = uToArcT(rawU);
    const tEnd = uToArcT(nextRawU);

    const pieceIdx = splinePieceBoundaries[i].pieceIdx;
    const def = pieceIdx >= 0 ? PIECES[pieceIdx] : null;
    let cornerType = null;
    if (def && def.turn !== 0) {
      const id = def.id;
      if (id.includes('CornerSmall') || (Math.abs(def.turn) >= 80 && !id.includes('Large'))) cornerType = 'small';
      else if (id.includes('CornerLarger')) cornerType = 'larger';
      else if (id.includes('CornerLarge')) cornerType = 'large';
      else cornerType = 'small';
    }
    const isBoost = def && def.id === 'roadStraightArrow';
    splinePieceMap.push({ tStart, tEnd, cornerType, isBoost });
  }
}

// Debug: visualize braking zones on the track
let brakeZoneGroup = null;
function showBrakeZones() {
  if (brakeZoneGroup) { scene.remove(brakeZoneGroup); brakeZoneGroup = null; }
  if (!raceSpline || splinePieceMap.length === 0) return;
  brakeZoneGroup = new THREE.Group();
  const colors = { small: 0xe74c3c, large: 0xf39c12, larger: 0x2ecc71 };
  const samples = 200;
  for (let i = 0; i < samples; i++) {
    const t = i / samples;
    const limit = getCornerSpeedLimit(t);
    if (limit === Infinity) continue;
    const type = limit <= raceConfig.cornerSmallLimit ? 'small' :
                 limit <= raceConfig.cornerLargeLimit ? 'large' : 'larger';
    const pos = raceSpline.getPointAt(t);
    const geo = new THREE.SphereGeometry(0.06, 6, 6);
    const mat = new THREE.MeshBasicMaterial({ color: colors[type] });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(pos.x, pos.y + 0.1, pos.z);
    brakeZoneGroup.add(mesh);
  }
  scene.add(brakeZoneGroup);
  console.log('Brake zones:', splinePieceMap.filter(s => s.cornerType).map(s =>
    `${s.cornerType}: t=${s.tStart.toFixed(3)}-${s.tEnd.toFixed(3)}`));
}

// Get the corner speed limit at a given spline t (in world units/s), or Infinity if straight
function isOnBoost(t) {
  const tNorm = ((t % 1) + 1) % 1;
  for (const seg of splinePieceMap) {
    if (tNorm >= seg.tStart && tNorm < seg.tEnd) {
      return seg.isBoost || false;
    }
  }
  return false;
}

function getCornerSpeedLimit(t) {
  const tNorm = ((t % 1) + 1) % 1;
  for (const seg of splinePieceMap) {
    if (tNorm >= seg.tStart && tNorm < seg.tEnd) {
      if (!seg.cornerType) return Infinity;
      if (seg.cornerType === 'small') return raceConfig.cornerSmallLimit;
      if (seg.cornerType === 'large') return raceConfig.cornerLargeLimit;
      if (seg.cornerType === 'larger') return raceConfig.cornerLargerLimit;
    }
  }
  return Infinity;
}

async function startRace() {
  // Close the track if it forms a valid loop (e.g. just loaded for editing)
  if (!trackClosed && track.length >= 4) {
    trackClosed = true;
    if (ghostGroup) { scene.remove(ghostGroup); ghostGroup = null; }
    connectorMarker.visible = false;
  }
  if (!trackClosed) { alert('Track must be closed to race!'); return; }

  if (!raceSpline) {
    raceSpline = buildRaceSpline();
    if (!raceSpline) { alert('Track too short or not closed!'); return; }
    buildSplinePieceMap();
    updateFinishMarker();
  }

  // Ensure cars are spawned
  await spawnGridCars();

  mode = 'race';
  raceActive = false;
  raceFinished = false;
  carSpeed = 0;
  lapCount = -1; // starts at -1; first crossing from grid to finish doesn't count
  raceTime = 0;
  throttle = false;
  throttleTargetSpeed = 0;
  driftAngle = 0;
  carPenaltyActive = false;
  carBoosted = false;
  carOnBoostLastFrame = false;
  crashWarningTimer = 0;
  currentLane = raceConfig.playerLane;
  laneBlend = currentLane === 'right' ? 1 : 0;
  for (const ai of aiCars) { ai.speed = 0; ai.laneTimer = Math.random() * 5; ai.laps = -1; ai.prevT = ai.t; ai.boosted = false; ai.onBoostLastFrame = false; }

  // Hide editor UI
  document.getElementById('piecePalette').classList.add('hidden');
  document.getElementById('topBar').classList.add('hidden');
  document.getElementById('pieceCount').classList.add('hidden');
  document.getElementById('trackStatus').classList.add('hidden');
  document.getElementById('decorPalette').classList.remove('show');
  gridHelper.visible = false;
  connectorMarker.visible = false;

  // Switch to grass ground for race mode
  groundMat.color.set(0x4d8f6e);
  renderer.setClearColor(0x4d8f6e);
  scene.fog.color.set(0x4d8f6e);

  // Zoom in for race
  const a = window.innerWidth / window.innerHeight;
  const raceFrustum = 6;
  camera.left = -raceFrustum * a / 2;
  camera.right = raceFrustum * a / 2;
  camera.top = raceFrustum / 2;
  camera.bottom = -raceFrustum / 2;
  camera.updateProjectionMatrix();

  // Show race UI
  document.getElementById('raceHUD').classList.add('show');
  document.getElementById('racePosition').classList.add('show');
  document.getElementById('speedBar').classList.add('show');
  document.getElementById('speedNum').classList.add('show');
  lastPosition = 1;
  document.getElementById('throttleHint').classList.add('show');
  document.getElementById('throttleBar').classList.add('show');
  document.getElementById('switchLaneBtn').classList.remove('hidden');
  document.getElementById('switchLaneBtn').classList.add('show');

  // Keep controls enabled for position tweaking
  // controls.enabled = false;

  // Move camera to player car during countdown
  controls.enabled = false;
  countdownActive = true;
  await doCountdown();
  countdownActive = false;
  raceActive = true;
}

function doCountdown() {
  return new Promise(resolve => {
    const el = document.getElementById('countdown');
    el.classList.add('show');
    let count = 3;
    el.textContent = count;
    sfx.countdownBeep();
    const interval = setInterval(() => {
      count--;
      if (count > 0) { el.textContent = count; sfx.countdownBeep(); }
      else if (count === 0) { el.textContent = 'GO!'; sfx.countdownGo(); }
      else { el.classList.remove('show'); clearInterval(interval); resolve(); }
    }, 750);
  });
}

// Spawn cars on the track (called when track closes or config changes)
async function spawnGridCars() {
  const spline = buildRaceSpline();
  if (!spline) return;
  raceSpline = spline;
  buildSplinePieceMap();
  updateFinishMarker();

  const aiColors = ['raceCarGreen', 'raceCarOrange', 'raceCarWhite'];

  if (!carMesh) {
    carMesh = await loadModel('raceCarRed');
    carMesh.scale.setScalar(carScale);
    scene.add(carMesh);
  }
  carMesh.visible = true;
  carMesh.scale.setScalar(carScale);

  // Remove old AI cars if count changed
  while (aiCars.length > raceConfig.aiCount) {
    const removed = aiCars.pop();
    if (removed.mesh) scene.remove(removed.mesh);
  }
  // Add new AI cars if needed
  while (aiCars.length < raceConfig.aiCount) {
    const i = aiCars.length;
    const colorId = aiColors[i % aiColors.length];
    const mesh = await loadModel(colorId);
    mesh.scale.setScalar(carScale);
    mesh.visible = true;
    scene.add(mesh);
    aiCars.push({
      mesh,
      t: 0,
      speed: 0,
      lane: i % 2 === 0 ? 'right' : 'left',
      laneBlend: i % 2 === 0 ? 1 : 0,
      driftAngle: 0,
      skill: raceConfig.aiSkill + (Math.random() - 0.5) * 0.15,
      laneTimer: Math.random() * 5,
      laps: -1,
      prevT: 0,
      onBoostLastFrame: false,
      boosted: false,
    });
  }

  updateGridPositions();
}

function getStartLineT() {
  // The start line is at t=0 in the spline (first track piece entry)
  // But cars grid up just behind it, so we use a small offset behind t=0
  // Convert startOffset from a distance-behind-start (in world units) to t
  // startOffset is in world units distance before the start line
  const splineLen = raceSpline.getLength();
  // t=0 is the start line; cars line up just behind it (t slightly less than 1 wrapping)
  return (1.0 - raceConfig.startOffset / splineLen + 1) % 1;
}

function updateGridPositions() {
  if (!raceSpline) return;
  const totalCars = 1 + aiCars.length;
  const splineLen = raceSpline.getLength();
  // startSpacing in world units distance between cars
  const spacingT = raceConfig.startSpacing / splineLen;

  // Cars grid up behind the start line (t=0)
  // startOffset = distance in world units behind start line for the front car
  const frontT = (1.0 - raceConfig.startOffset / splineLen + 1) % 1;

  // Assign grid slots: position 0 = front, position N = back
  // Each slot gets a t value and alternating lanes
  for (let slot = 0; slot < totalCars; slot++) {
    const slotT = (frontT - slot * spacingT + 1) % 1; // stagger back from front
    const slotLane = slot % 2 === 0 ? 'left' : 'right';
    const laneOff = slotLane === 'right' ? laneConfig.rightOffset : laneConfig.leftOffset;

    if (slot === raceConfig.playerStart) {
      // Player in this slot
      carT = slotT;
      currentLane = raceConfig.playerLane;
      laneBlend = currentLane === 'right' ? 1 : 0;
      const playerOff = currentLane === 'right' ? laneConfig.rightOffset : laneConfig.leftOffset;
      const pPos = getOffsetPoint(raceSpline, slotT, playerOff);
      const pAhead = getOffsetPoint(raceSpline, (slotT + 0.005) % 1, playerOff);
      if (carMesh) { carMesh.position.copy(pPos); carMesh.lookAt(pAhead); }
    } else {
      // AI car in this slot
      const aiIdx = slot < raceConfig.playerStart ? slot : slot - 1;
      if (aiIdx >= 0 && aiIdx < aiCars.length) {
        const ai = aiCars[aiIdx];
        ai.t = slotT;
        ai.lane = slotLane === 'right' ? 'left' : 'right';
        ai.laneBlend = ai.lane === 'right' ? 1 : 0;
        const aiLaneOff = slotLane === 'right' ? laneConfig.leftOffset : laneConfig.rightOffset;
        const aiPos = getOffsetPoint(raceSpline, slotT, aiLaneOff);
        const aiAhead = getOffsetPoint(raceSpline, (slotT + 0.005) % 1, aiLaneOff);
        ai.mesh.position.copy(aiPos);
        ai.mesh.lookAt(aiAhead);
      }
    }
  }
}

function updateRace(dt) {
  if (!raceSpline) return;

  // Always position cars (even when paused for grid tweaking)
  if (!raceActive && !raceFinished) {
    updateGridPositions();
    return;
  }
  // After race finished and raceActive=false, just keep camera tracking
  if (!raceActive && raceFinished) {
    return;
  }

  const maxSpeed = raceConfig.topSpeed;
  const accel = raceConfig.acceleration;
  const decel = raceConfig.braking;
  const coast = raceConfig.coastDecel;

  // Corner auto-braking — check BEFORE throttle so penalty isn't skipped
  const cornerLimit = getCornerSpeedLimit(carT);
  let cornerBraking = false;
  const brakeTarget = cornerLimit < Infinity ? cornerLimit - raceConfig.cornerPenalty : 0;

  // Trigger penalty when entering a corner over the limit
  if (cornerLimit < Infinity && carSpeed > cornerLimit && !carPenaltyActive) {
    carPenaltyActive = true;
    sfx.speedLimited();
  }
  // Only clear penalty when leaving the corner (back on a straight)
  if (cornerLimit === Infinity) {
    carPenaltyActive = false;
  }

  if (carPenaltyActive) {
    carSpeed = Math.max(carSpeed - raceConfig.cornerBrakeRate * dt, brakeTarget);
    cornerBraking = true;
  }

  // Boost pad: add speed burst when entering an arrow piece
  const boostAmount = 0.9; // ~20mph in world units
  const onBoost = isOnBoost(carT);
  if (onBoost && !carOnBoostLastFrame && !raceFinished) {
    carSpeed += boostAmount;
    carBoosted = true;
  }
  carOnBoostLastFrame = onBoost;
  // Corner braking clears boost
  if (cornerLimit < Infinity) carBoosted = false;

  // User's throttle bar limits their target speed
  const boostMax = carBoosted ? maxSpeed + boostAmount : maxSpeed;
  const userMax = throttleTargetSpeed > 0 ? Math.min(boostMax, throttleTargetSpeed) : boostMax;
  // While penalty active, cap at brakeTarget; otherwise cap at corner limit
  const speedCap = carPenaltyActive ? brakeTarget :
    (cornerLimit < Infinity ? cornerLimit : boostMax);
  const effectiveMax = Math.min(userMax, speedCap);

  if (!cornerBraking) {
    if (raceFinished) {
      carSpeed = Math.max(carSpeed - coast * dt, 0);
    } else if (throttle) {
      carSpeed = Math.min(carSpeed + accel * dt, effectiveMax);
    } else {
      carSpeed = Math.max(carSpeed - coast * dt, 0);
    }
  }


  // Advance by actual distance along spline (arc-length parameterization)
  const splineLen = raceSpline.getLength();
  const distThisFrame = carSpeed * dt;
  const prevT = carT;
  carT += distThisFrame / splineLen;

  const wrapped = carT >= 1;
  if (wrapped) carT -= 1;

  // Detect crossing finish line
  const finishT = getFinishT();
  // Check if car crossed finishT this frame
  let crossed = false;
  if (wrapped) {
    // Car went from prevT past 1.0 and wrapped to carT near 0
    // Crossed finishT if it's between prevT→1.0 or 0→carT
    crossed = (finishT > prevT) || (finishT <= carT);
  } else {
    crossed = (prevT < finishT && carT >= finishT);
  }
  if (crossed) {
    lapCount++;
    console.log('Finish line crossed! lapCount:', lapCount, 'finishT:', finishT.toFixed(4), 'prevT:', prevT.toFixed(4), 'carT:', carT.toFixed(4));
    if (lapCount >= totalLaps) { finishRace(); return; }
  }

  raceTime += dt;

  // Smooth lane transition
  const targetBlend = currentLane === 'right' ? 1 : 0;
  const laneSpeed = 6; // how fast lane switch happens
  if (laneBlend < targetBlend) laneBlend = Math.min(laneBlend + laneSpeed * dt, 1);
  else if (laneBlend > targetBlend) laneBlend = Math.max(laneBlend - laneSpeed * dt, 0);
  const activeLaneOffset = laneConfig.leftOffset * (1 - laneBlend) + laneConfig.rightOffset * laneBlend;

  // Car position & orientation
  const t = carT % 1;
  const pos = getOffsetPoint(raceSpline, t, activeLaneOffset);
  const ahead = getOffsetPoint(raceSpline, (t + 0.005) % 1, activeLaneOffset);
  carMesh.position.copy(pos);
  carMesh.lookAt(ahead);

  // Drift: measure curvature from tangent change
  const tangent1 = raceSpline.getTangentAt(t).normalize();
  const tangent2 = raceSpline.getTangentAt((t + 0.01) % 1).normalize();
  const cross = tangent1.x * tangent2.z - tangent1.z * tangent2.x; // signed curvature
  const curvature = cross / 0.01; // approximate curvature

  // Drift angle proportional to speed^2 * curvature (like real oversteer)
  const driftStrength = 0.8;
  const targetDrift = -curvature * carSpeed * carSpeed * driftStrength * 0.01;
  const maxDrift = 0.5; // max ~28 degrees
  const clampedDrift = Math.max(-maxDrift, Math.min(maxDrift, targetDrift));

  // Lane-change steering: angle the car toward the target lane during transition
  const laneChangeRate = targetBlend - laneBlend; // positive = moving right, negative = moving left
  const laneSteerAngle = laneChangeRate * 0.4; // visual steer into the lane change

  // Smooth drift transition
  const driftLerp = throttle ? 8 : 12; // snappier recovery when off throttle
  driftAngle += (clampedDrift - driftAngle) * Math.min(driftLerp * dt, 1);

  // Apply drift + lane-change steering rotation
  carMesh.rotateY(driftAngle + laneSteerAngle);

  // Chase camera — fixed offset, direct tracking (freeze on finish)
  if (!raceFinished) {
    const isoOffset = new THREE.Vector3(8, 8, 8);
    camera.position.copy(pos).add(isoOffset);
    controls.target.copy(pos);
    camera.lookAt(pos);
  }

  // --- Update AI cars ---
  for (const ai of aiCars) {
    // AI boost pad
    const aiOnBoost = isOnBoost(ai.t);
    if (aiOnBoost && !ai.onBoostLastFrame && !raceFinished) {
      ai.speed += boostAmount;
      ai.boosted = true;
    }
    ai.onBoostLastFrame = aiOnBoost;
    const aiCornerLimit = getCornerSpeedLimit(ai.t);
    if (aiCornerLimit < Infinity) ai.boosted = false;

    // AI throttle: drive at skill fraction of AI max, capped by corner limit
    if (raceFinished) {
      ai.speed = Math.max(ai.speed - coast * dt, 0);
    } else {
      const aiBoostMax = ai.boosted ? raceConfig.aiTopSpeed * ai.skill + boostAmount : raceConfig.aiTopSpeed * ai.skill;
      const aiMaxSpeed = aiCornerLimit < Infinity
        ? Math.min(aiBoostMax, aiCornerLimit)
        : aiBoostMax;
      if (ai.speed < aiMaxSpeed) ai.speed = Math.min(ai.speed + raceConfig.aiAcceleration * dt, aiMaxSpeed);
      else ai.speed = Math.max(ai.speed - coast * dt, 0);
    }

    // AI corner auto-braking — if entered too fast, brake hard with penalty
    if (aiCornerLimit < Infinity && ai.speed > aiCornerLimit) {
      const aiBrakeTarget = aiCornerLimit - raceConfig.cornerPenalty;
      ai.speed = Math.max(ai.speed - raceConfig.cornerBrakeRate * dt, aiBrakeTarget);
    }

    // Advance AI
    ai.prevT = ai.t;
    ai.t += (ai.speed * dt) / splineLen;
    const aiWrapped = ai.t >= 1;
    if (aiWrapped) ai.t -= 1;

    // AI finish line crossing
    const finishT = getFinishT();
    let aiCrossed = false;
    if (aiWrapped) {
      aiCrossed = (finishT > ai.prevT) || (finishT <= ai.t);
    } else {
      aiCrossed = (ai.prevT < finishT && ai.t >= finishT);
    }
    if (aiCrossed) ai.laps++;

    // AI lane switching: randomly switch every few seconds
    ai.laneTimer -= dt;
    if (ai.laneTimer <= 0) {
      ai.lane = ai.lane === 'left' ? 'right' : 'left';
      ai.laneTimer = 3 + Math.random() * 4;
    }

    // Smooth lane blend
    const aiTargetBlend = ai.lane === 'right' ? 1 : 0;
    const aiLaneSpeed = 5;
    if (ai.laneBlend < aiTargetBlend) ai.laneBlend = Math.min(ai.laneBlend + aiLaneSpeed * dt, 1);
    else if (ai.laneBlend > aiTargetBlend) ai.laneBlend = Math.max(ai.laneBlend - aiLaneSpeed * dt, 0);
    const aiLaneOffset = laneConfig.leftOffset * (1 - ai.laneBlend) + laneConfig.rightOffset * ai.laneBlend;

    // Position AI car
    const aiPos = getOffsetPoint(raceSpline, ai.t % 1, aiLaneOffset);
    const aiAhead = getOffsetPoint(raceSpline, (ai.t + 0.005) % 1, aiLaneOffset);
    ai.mesh.position.copy(aiPos);
    ai.mesh.lookAt(aiAhead);

    // AI drift
    const aiT1 = raceSpline.getTangentAt(ai.t % 1).normalize();
    const aiT2 = raceSpline.getTangentAt((ai.t + 0.01) % 1).normalize();
    const aiCross = aiT1.x * aiT2.z - aiT1.z * aiT2.x;
    const aiCurvature = aiCross / 0.01;
    const aiTargetDrift = -aiCurvature * ai.speed * ai.speed * 0.8 * 0.01;
    const aiClampedDrift = Math.max(-0.5, Math.min(0.5, aiTargetDrift));
    ai.driftAngle += (aiClampedDrift - ai.driftAngle) * Math.min(10 * dt, 1);
    ai.mesh.rotateY(ai.driftAngle);
  }

  // --- Collision detection ---
  // Build array of all cars: { t, laneBlend, speed, isPlayer, idx }
  const collisionPenalty = 0.89; // 20 mph in world units
  const collisionDist = 0.4 / splineLen; // ~0.4 world units proximity in t
  const laneTolerance = 0.4; // lane blend overlap threshold

  // Check player against all AI
  for (const ai of aiCars) {
    const tDiff = Math.abs(((carT - ai.t) % 1 + 1.5) % 1 - 0.5); // wrapped distance
    if (tDiff < collisionDist) {
      const laneDiff = Math.abs(laneBlend - ai.laneBlend);
      if (laneDiff < laneTolerance) {
        // Collision! The car behind (or switching into) gets penalised
        const playerBehind = ((carT - ai.t + 1.5) % 1 - 0.5) < 0;
        if (playerBehind && carSpeed > ai.speed) {
          // Player rear-ended AI
          carSpeed = Math.max(ai.speed - collisionPenalty, 0);
          cornerBraking = true;
          crashWarningTimer = 1.0;
          sfx.bump();
        } else if (!playerBehind && ai.speed > carSpeed) {
          // AI rear-ended player
          ai.speed = Math.max(carSpeed - collisionPenalty, 0);
        }
        // Lane-switch bump: if lane blends are close, the one changing lane is penalised
        if (!playerBehind && !((carT - ai.t + 1.5) % 1 - 0.5 < 0)) {
          // Side-by-side: penalise the one currently switching lanes
          const playerSwitching = Math.abs(laneBlend - (currentLane === 'right' ? 1 : 0)) > 0.1;
          const aiSwitching = Math.abs(ai.laneBlend - (ai.lane === 'right' ? 1 : 0)) > 0.1;
          if (playerSwitching && !aiSwitching) {
            carSpeed = Math.max(ai.speed - collisionPenalty, 0);
            cornerBraking = true;
            crashWarningTimer = 1.0;
            sfx.bump();
          } else if (aiSwitching && !playerSwitching) {
            ai.speed = Math.max(carSpeed - collisionPenalty, 0);
          }
        }
      }
    }
  }

  // Check AI-vs-AI collisions
  for (let a = 0; a < aiCars.length; a++) {
    for (let b = a + 1; b < aiCars.length; b++) {
      const ai1 = aiCars[a], ai2 = aiCars[b];
      const tDiff = Math.abs(((ai1.t - ai2.t) % 1 + 1.5) % 1 - 0.5);
      if (tDiff < collisionDist) {
        const laneDiff = Math.abs(ai1.laneBlend - ai2.laneBlend);
        if (laneDiff < laneTolerance) {
          // The one behind gets penalised
          const ai1Behind = ((ai1.t - ai2.t + 1.5) % 1 - 0.5) < 0;
          if (ai1Behind && ai1.speed > ai2.speed) {
            ai1.speed = Math.max(ai2.speed - collisionPenalty, 0);
          } else if (!ai1Behind && ai2.speed > ai1.speed) {
            ai2.speed = Math.max(ai1.speed - collisionPenalty, 0);
          }
        }
      }
    }
  }

  // HUD - speed in mph (1 world unit = 10m, so speed * 22.37 ≈ mph)
  const mph = Math.round(carSpeed * 22.37);
  document.querySelector('#raceHUD .lap').textContent = `Lap ${Math.min(totalLaps, Math.max(1, lapCount+1))}/${totalLaps}`;
  document.querySelector('#raceHUD .time').textContent = formatTime(raceTime);
  document.querySelector('#raceHUD .speed').textContent = `${mph} mph`;
  document.getElementById('speedFill').style.width = `${(carSpeed/maxSpeed)*100}%`;
  document.getElementById('speedNum').textContent = `${mph} mph`;
  document.getElementById('speedNum').classList.toggle('braking', cornerBraking);
  document.getElementById('cornerWarning').classList.toggle('show', cornerBraking);

  // Warning label: "CRASH" (yellow) for collisions, "TOO FAST!" (red) for corners
  if (crashWarningTimer > 0) crashWarningTimer -= dt;
  const warningEl = document.getElementById('tooFastWarning');
  const showWarning = cornerBraking || crashWarningTimer > 0;
  warningEl.classList.toggle('show', showWarning);
  if (crashWarningTimer > 0) {
    warningEl.textContent = 'CRASH';
    warningEl.style.color = '#ffd32a';
  } else if (cornerBraking) {
    warningEl.textContent = 'TOO FAST!';
    warningEl.style.color = '#ff4757';
  }

  // Update position indicator
  const currentPos = getRacePosition();
  if (currentPos !== lastPosition) {
    if (currentPos < lastPosition) sfx.gainPlace();
    else sfx.losePlace();
    lastPosition = currentPos;
    const posEl = document.getElementById('racePosition');
    const suffixes = ['st','nd','rd','th'];
    const colors = ['#ffd32a','#c0c0c0','#cd7f32','#999'];
    posEl.querySelector('.pos-num').textContent = currentPos;
    posEl.querySelector('.pos-suffix').textContent = suffixes[currentPos-1] || 'th';
    posEl.querySelector('.pos-num').style.color = colors[currentPos-1] || '#999';
    posEl.querySelector('.pos-suffix').style.color = colors[currentPos-1] || '#999';
    posEl.classList.toggle('first', currentPos === 1);
    posEl.classList.add('animate');
    setTimeout(() => posEl.classList.remove('animate'), 300);
  }
}

function formatTime(t) {
  const m = Math.floor(t/60);
  const s = t % 60;
  return `${m}:${s.toFixed(2).padStart(5,'0')}`;
}

let raceFinished = false;
let lastPosition = 1;

function getRacePosition() {
  const finishT = getFinishT();
  // Compare lap-aware progress: laps * 1 + distance past finish
  const playerProgress = lapCount + ((carT - finishT) % 1 + 1) % 1;
  let position = 1;
  for (const ai of aiCars) {
    const aiProgress = ai.laps + ((ai.t - finishT) % 1 + 1) % 1;
    if (aiProgress > playerProgress) position++;
  }
  return position;
}

function getAIPositions() {
  // Return array of finishing positions for each AI car (1-based)
  const finishT = getFinishT();
  const playerProgress = lapCount + ((carT - finishT) % 1 + 1) % 1;
  const allProgress = [{ idx: -1, progress: playerProgress }];
  for (let i = 0; i < aiCars.length; i++) {
    const ai = aiCars[i];
    const aiProgress = ai.laps + ((ai.t - finishT) % 1 + 1) % 1;
    allProgress.push({ idx: i, progress: aiProgress });
  }
  allProgress.sort((a, b) => b.progress - a.progress);
  const aiPositions = [];
  for (let i = 0; i < aiCars.length; i++) {
    const rank = allProgress.findIndex(p => p.idx === i);
    aiPositions.push(rank + 1);
  }
  return aiPositions;
}

// Track name for current race (set when loading)
let currentRaceTrackName = null;

function finishRace() {
  raceFinished = true;
  throttle = false;
  // Cars coast to a stop (raceActive stays true so physics keep running)

  const time = raceTime;
  const position = getRacePosition();
  const isWinner = position === 1;

  // Save per-track best time
  const trackName = championship ? championship.tracks[championship.currentIdx].name : (currentRaceTrackName || 'unknown');
  let bestTime = null;
  try {
    const data = loadArcadeData();
    if (!data.raceMaker) data.raceMaker = {};
    if (!data.raceMaker.bestTimes) data.raceMaker.bestTimes = {};
    bestTime = data.raceMaker.bestTimes[trackName] || null;
    if (!bestTime || time < bestTime) data.raceMaker.bestTimes[trackName] = time;
    saveArcadeData(data);
    bestTime = data.raceMaker.bestTimes[trackName];
  } catch(e) {}

  const isNewBest = !bestTime || time <= bestTime;
  const bestStr = bestTime ? formatTime(bestTime) : '--';

  // Sound + fireworks
  if (isWinner) { sfx.victory(); spawnFireworks(); }
  else sfx.loss();

  // Championship: award points
  if (championship) {
    championship.points[0] += getPointsForPosition(position);
    championship.times.push(time);
    const aiPositions = getAIPositions();
    for (let i = 0; i < aiPositions.length; i++) {
      championship.points[i + 1] += getPointsForPosition(aiPositions[i]);
    }
  }

  // Show modal after delay with fade-in
  setTimeout(() => {
    raceActive = false;
    const modal = document.getElementById('trackModal');
    modal.style.opacity = '0';
    modal.style.transition = 'opacity 0.5s ease';

    if (championship) {
      showChampionshipStandings(position, time);
    } else {
      const posLabels = ['1st', '2nd', '3rd', '4th'];
      const posColors = ['#ffd32a', '#c0c0c0', '#cd7f32', '#999'];

      showModal('Race Complete!', `
        <div style="text-align:center; padding:10px 0;">
          <div style="font-size:3rem; margin-bottom:12px;">${isWinner ? '&#127942;' : '&#127937;'}</div>
          <div style="font-size:1.8rem; font-weight:800; color:${posColors[position-1]}; margin-bottom:8px;">${posLabels[position-1]} Place</div>
          <div style="font-size:1.4rem; font-weight:700; color:#ffd32a; margin-bottom:8px;">${formatTime(time)}</div>
          ${isNewBest ? '<div style="color:#2ecc71; font-weight:600; margin-bottom:8px;">New Best Time!</div>' : ''}
          <div style="color:rgba(255,255,255,0.6); font-size:0.9rem;">Best: ${bestStr}</div>
          <div style="margin-top:20px; display:flex; gap:10px; justify-content:center;">
            <button class="modal-btn modal-btn-primary" id="raceAgainBtn">Race Again</button>
            <button class="modal-btn" style="background:rgba(255,255,255,0.1); color:#fff;" id="raceExitBtn">Back to Menu</button>
          </div>
        </div>
      `, false, true);
      document.getElementById('raceAgainBtn').addEventListener('pointerup', (e) => { e.preventDefault(); hideModal(); startRace(); });
      document.getElementById('raceExitBtn').addEventListener('pointerup', (e) => { e.preventDefault(); hideModal(); exitRace(); raceMenuFromOverlay = true; showRaceMenu(); });
    }

    // Fade in
    requestAnimationFrame(() => { modal.style.opacity = '1'; });
  }, 1500);
}

function spawnFireworks() {
  const duration = 3000;
  const end = Date.now() + duration;
  const colors = ['#ffd32a','#ff6b6b','#2ecc71','#a29bfe','#fd79a8','#00cec9'];
  (function frame() {
    confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 }, colors });
    confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 }, colors });
    if (Date.now() < end) requestAnimationFrame(frame);
  })();
}

function exitRace() {
  mode = 'editor';
  raceActive = false;
  raceFinished = false;
  throttle = false;
  championship = null;
  // Keep cars visible on closed track (they show the grid)
  document.getElementById('raceHUD').classList.remove('show');
  document.getElementById('racePosition').classList.remove('show');
  document.getElementById('speedBar').classList.remove('show');
  document.getElementById('speedNum').classList.remove('show');
  document.getElementById('cornerWarning').classList.remove('show');
  document.getElementById('tooFastWarning').classList.remove('show');
  document.getElementById('throttleHint').classList.remove('show');
  document.getElementById('throttleBar').classList.remove('show');
  document.getElementById('switchLaneBtn').classList.remove('show');
  document.getElementById('switchLaneBtn').classList.add('hidden');
  document.getElementById('topBar').classList.remove('hidden');
  document.getElementById('pieceCount').classList.remove('hidden');
  document.getElementById('editorCloseBtn').classList.remove('hidden');
  updateTrackStatus();
  if (!trackClosed) {
    document.getElementById('piecePalette').classList.remove('hidden');
  }
  gridHelper.visible = true;
  controls.enabled = true;

  // Restore editor ground colours
  groundMat.color.set(0x2a2a2a);
  renderer.setClearColor(0x1a1a1a);
  scene.fog.color.set(0x1a1a1a);

  // Restore editor zoom
  const a = window.innerWidth / window.innerHeight;
  camera.left = -frustumSize * a / 2;
  camera.right = frustumSize * a / 2;
  camera.top = frustumSize / 2;
  camera.bottom = -frustumSize / 2;
  camera.updateProjectionMatrix();
  controls.target.set(
    track.reduce((s,p)=>s+p.worldX,0)/track.length, 0,
    track.reduce((s,p)=>s+p.worldZ,0)/track.length
  );
}

// WEB AUDIO
// ============================================================
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playTone(freq, duration, type = 'sine', volume = 0.3, ramp = 0.01) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, ctx.currentTime);
  gain.gain.setValueAtTime(volume, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + duration);
}

function playNoise(duration, volume = 0.15) {
  const ctx = getAudioCtx();
  const bufSize = ctx.sampleRate * duration;
  const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const gain = ctx.createGain();
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 800;
  filter.Q.value = 1;
  gain.gain.setValueAtTime(volume, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
  src.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  src.start();
  src.stop(ctx.currentTime + duration);
}

const sfx = {
  menuClick() { playTone(800, 0.08, 'square', 0.12); },
  countdownBeep() { playTone(440, 0.2, 'sine', 0.35); },
  countdownGo() { playTone(880, 0.4, 'sine', 0.4); },
  bump() { playNoise(0.25, 0.25); playTone(120, 0.15, 'sawtooth', 0.2); },
  speedLimited() { playTone(200, 0.12, 'triangle', 0.08); },
  switchLane() { playTone(600, 0.06, 'sine', 0.15); playTone(750, 0.06, 'sine', 0.12); },
  gainPlace() { playTone(523, 0.1, 'square', 0.2); setTimeout(() => playTone(659, 0.1, 'square', 0.2), 80); setTimeout(() => playTone(784, 0.15, 'square', 0.2), 160); },
  losePlace() { playTone(400, 0.1, 'sawtooth', 0.15); setTimeout(() => playTone(300, 0.15, 'sawtooth', 0.15), 100); },
  victory() { [523,659,784,1047].forEach((f,i) => setTimeout(() => playTone(f, 0.3, 'square', 0.25), i*120)); },
  loss() { [400,350,300,200].forEach((f,i) => setTimeout(() => playTone(f, 0.25, 'sawtooth', 0.15), i*150)); },
};

// Throttle bar controls
const throttleBarEl = document.getElementById('throttleBar');
const throttleMinSpeed = 0; // 0 mph at bottom of bar
const throttleMaxSpeed = 8;    // ~180 mph in world units

function initThrottleBar() {
  // Add corner speed markers — appended to throttleBar (not bar-bg which clips)
  const markers = [
    { speed: raceConfig.cornerSmallLimit, label: '60' },
    { speed: raceConfig.cornerLargeLimit, label: '100' },
    { speed: raceConfig.cornerLargerLimit, label: '140' },
  ];
  markers.forEach(m => {
    const pct = (m.speed - throttleMinSpeed) / (throttleMaxSpeed - throttleMinSpeed) * 100;
    const marker = document.createElement('div');
    marker.className = 'bar-marker';
    marker.style.bottom = pct + '%';
    const label = document.createElement('span');
    label.className = 'bar-marker-label';
    label.textContent = m.label;
    marker.appendChild(label);
    throttleBarEl.appendChild(marker);
  });
}

function updateThrottleFromPointer(clientY) {
  const rect = throttleBarEl.getBoundingClientRect();
  // Map Y position: top = max speed, bottom = min speed
  const relY = (clientY - rect.top) / rect.height;
  const clamped = Math.max(0, Math.min(1, relY));
  const fraction = 1 - clamped; // invert: bottom=0, top=1
  // 4 zones from bottom to top: 60, 100, 140, 180 mph
  const snapSpeeds = [
    raceConfig.cornerSmallLimit,   // 60 mph
    raceConfig.cornerLargeLimit,   // 100 mph
    raceConfig.cornerLargerLimit,  // 140 mph
    throttleMaxSpeed,              // 180 mph
  ];
  // Divide bar into 4 equal zones
  const zone = Math.min(3, Math.floor(fraction * 4));
  throttleTargetSpeed = snapSpeeds[zone];
  throttle = true;

  // Update visual — snap fill to zone position
  const snapPct = (throttleTargetSpeed / throttleMaxSpeed) * 100;
  throttleBarEl.querySelector('.bar-fill').style.height = snapPct + '%';
  throttleBarEl.querySelector('.bar-thumb').style.bottom = snapPct + '%';
  // Show speed number at snapped position
  const speedLabel = throttleBarEl.querySelector('.bar-speed');
  const mph = Math.round(throttleTargetSpeed * 22.37);
  speedLabel.textContent = mph + ' mph';
  speedLabel.style.bottom = snapPct + '%';
  throttleBarEl.classList.add('active');
}

function releaseThrottle() {
  throttle = false;
  throttleTargetSpeed = 0;
  throttleBarEl.querySelector('.bar-fill').style.height = '0%';
  throttleBarEl.querySelector('.bar-thumb').style.bottom = '0%';
  throttleBarEl.classList.remove('active');
}

throttleBarEl.addEventListener('pointerdown', e => {
  if (mode !== 'race') return;
  e.preventDefault();
  throttleBarEl.setPointerCapture(e.pointerId);
  updateThrottleFromPointer(e.clientY);
});
throttleBarEl.addEventListener('pointermove', e => {
  if (mode !== 'race' || !throttle) return;
  updateThrottleFromPointer(e.clientY);
});
throttleBarEl.addEventListener('pointerup', e => {
  if (mode !== 'race') return;
  releaseThrottle();
});
throttleBarEl.addEventListener('pointercancel', e => {
  releaseThrottle();
});

let lastTime = performance.now();

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  if (mode !== 'race' && !menuDemoActive) {
    // Arrow key panning
    const panSpeed = 0.3;
    if (keysDown.has('ArrowLeft')) controls.target.x -= panSpeed;
    if (keysDown.has('ArrowRight')) controls.target.x += panSpeed;
    if (keysDown.has('ArrowUp')) controls.target.z -= panSpeed;
    if (keysDown.has('ArrowDown')) controls.target.z += panSpeed;
    // Smoothly track last piece position (only move the orbit target, let controls handle camera)
    if (editorCameraGoal) {
      controls.target.lerp(editorCameraGoal, 0.05);
    }
    controls.update();
    // Keep grid cars positioned while editing
    if (trackClosed && raceSpline && carMesh) updateGridPositions();
  }
  if (mode === 'race') { updateRace(dt); }

  // During countdown, ease camera toward player car
  if (countdownActive && carMesh && raceSpline) {
    const carPos = carMesh.position.clone();
    const isoOffset = new THREE.Vector3(8, 8, 8);
    const targetPos = carPos.clone().add(isoOffset);
    camera.position.lerp(targetPos, 0.03);
    controls.target.lerp(carPos, 0.05);
    camera.lookAt(controls.target);
  }

  if (!menuDemoActive) renderer.render(scene, camera);
}

});

// Place a piece silently (no UI updates, no collision check)
async function placeDefaultPiece(pieceIdx) {
  const def = PIECES[pieceIdx];
  const placement = getPiecePlacement(pieceIdx, cursor, 0);
  const model = await loadModel(def.id);
  model.position.set(placement.x, 0, placement.z);
  model.rotation.y = -placement.heading * DEG;
  if (def.mirror) model.scale.x = -1;
  if (def.flipZ) {
    model.scale.z = -1;
    const offsetLocal = transformPoint(0, def.exit.z, placement.heading);
    model.position.x += offsetLocal.x;
    model.position.z += offsetLocal.z;
  }
  scene.add(model);
  track.push({
    pieceIdx,
    worldX: placement.x,
    worldZ: placement.z,
    heading: placement.heading,
    prevCursor: { ...cursor },
    rotation: 0,
    mesh: model,
  });
  cursor = getNextCursor(pieceIdx, cursor, 0);
}

const PIECE_NAME_MAP = {};
PIECES.forEach((p, i) => { PIECE_NAME_MAP[p.name] = i; });

async function loadDefaultTrack() {
  try {
    const resp = await fetch('default-track.json');
    const config = await resp.json();

    // Set starting cursor and loop target from config
    if (config.startCursor) {
      startCursorConfig = { x: config.startCursor.x || 0, z: config.startCursor.z || 0, heading: config.startCursor.heading || 0 };
      cursor = { x: startCursorConfig.x, y: 0, z: startCursorConfig.z, heading: startCursorConfig.heading };
    }
    if (config.loopTarget) {
      loopTarget = { x: config.loopTarget.x || 0, z: config.loopTarget.z || 0, heading: config.loopTarget.heading || 0 };
    }

    // Place track pieces (if any)
    if (config.track && config.track.length > 0) {
      for (const entry of config.track) {
        const idx = PIECE_NAME_MAP[entry.piece];
        if (idx === undefined) { console.warn('Unknown piece:', entry.piece); continue; }
        await placeDefaultPiece(idx);
      }
      trackClosed = true;
      await spawnGridCars();
    }

    // Place decorations
    for (const d of (config.decorations || [])) {
      try {
        const model = await loadModel(d.id);
        const mo = getModelOffset(d.id);
        model.position.set(d.x + globalOffset.x + mo.x, (d.y || 0) + globalOffset.y + mo.y, -(d.z || 0) + globalOffset.z + mo.z);
        if (d.flip) model.scale.z = -1;
        if (d.r) model.rotation.y = -d.r * DEG;
        scene.add(model);
        decorations.push({
          id: d.id, mesh: model, isDefault: true,
          params: { x: d.x, y: d.y || 0, z: d.z || 0, r: d.r || 0, flip: !!d.flip }
        });
      } catch(e) {}
    }

    connectorMarker.visible = false;
    updatePieceCount();
    updateCameraTarget();
    buildDecorGUI();
  } catch(e) {
    console.warn('No default track loaded:', e);
  }
}

// lil-gui for decoration editing
let decorGUI = null;
const globalOffset = { x: 0.5, y: 0, z: 0 };
const modelOffsets = {
  roadStartPositions: { x: 0, y: 0, z: 0 },
  roadStart: { x: -0.13, y: 0, z: 0 },
};

function getModelOffset(id) {
  // Check exact match first, then prefix (longest first)
  if (modelOffsets[id]) return modelOffsets[id];
  const keys = Object.keys(modelOffsets).sort((a,b) => b.length - a.length);
  for (const key of keys) {
    if (id.startsWith(key)) return modelOffsets[key];
  }
  return { x:0, y:0, z:0 };
}

function applyGlobalOffset() {
  decorations.forEach(d => {
    const mo = getModelOffset(d.id);
    d.mesh.position.set(
      d.params.x + globalOffset.x + mo.x,
      d.params.y + globalOffset.y + mo.y,
      -(d.params.z) + globalOffset.z + mo.z
    );
  });
}

function saveArcadeData(data) {
  localStorage.setItem('calebArcadeData', JSON.stringify(data));

async function fetchAllRaceTracks() {
  // Fetch built-in tracks
  let builtinTracks = [];
  try {
    const indexResp = await fetch('tracks/index.json');
    const trackFiles = await indexResp.json();
    for (const file of trackFiles) {
      try {
        const resp = await fetch('tracks/' + file);
        const data = await resp.json();
        builtinTracks.push(data);
      } catch(e) {}
    }
  } catch(e) {}

  // Get user-saved tracks (Custom Classic)
  const saved = getSavedTracks();
  const customTracks = Object.keys(saved).map(name => {
    const entry = saved[name];
    return {
      name,
      series: entry.series || 'Custom Classic',
      raceNo: entry.raceNo || 1,
      track: Array.isArray(entry) ? entry : entry.track,
      builtin: false,
    };
  });

  // Mark built-in tracks
  builtinTracks = builtinTracks.map(t => ({ ...t, builtin: true }));

  return [...builtinTracks, ...customTracks];
}

function getSeriesFromTracks(allTracks) {
  const seriesMap = {};
  for (const t of allTracks) {
    const s = t.series || 'Custom Classic';
    if (!seriesMap[s]) seriesMap[s] = [];
    seriesMap[s].push(t);
  }
  // Sort tracks within each series by raceNo
  for (const s of Object.keys(seriesMap)) {
    seriesMap[s].sort((a, b) => (a.raceNo || 0) - (b.raceNo || 0));
  }
  return seriesMap;
}

async function showRaceMenu() {
  const allTracks = await fetchAllRaceTracks();
  const seriesMap = getSeriesFromTracks(allTracks);
  const seriesOrder = ['Ezra Grand Prix', 'Caleb Cup', 'Daddy Rally', 'Mummy Masters', 'Custom Classic'];
  const seriesNames = seriesOrder.filter(s => seriesMap[s]).concat(Object.keys(seriesMap).filter(s => !seriesOrder.includes(s)));
  const arcadeData = loadArcadeData();
  const bestTimes = (arcadeData.raceMaker && arcadeData.raceMaker.bestTimes) || {};

  if (seriesNames.length === 0) {
    showModal('Race', '<div style="text-align:center;color:rgba(255,255,255,0.6);padding:20px;">No tracks available. Build and save a track first!</div>');
    return;
  }

  let html = '<div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));gap:12px;">';

  for (const series of seriesNames) {
    const tracks = seriesMap[series];
    const trackCount = tracks.length;
    const seriesColor = series === 'Caleb Cup' ? '#ffd32a' :
                        series === 'Ezra Grand Prix' ? '#2ecc71' :
                        series === 'Mummy Masters' ? '#e74c3c' :
                        series === 'Daddy Rally' ? '#3498db' :
                        '#a29bfe';

    html += `<div style="background:rgba(255,255,255,0.05);border-radius:12px;padding:14px;border:1px solid rgba(255,255,255,0.1);">`;
    html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">`;
    html += `<div style="font-weight:700;font-size:1rem;color:${seriesColor};">${series}</div>`;
    html += `<div style="font-size:0.75rem;color:rgba(255,255,255,0.5);">${trackCount} race${trackCount !== 1 ? 's' : ''}</div>`;
    html += `</div>`;

    // Championship button (only if > 1 track)
    if (trackCount > 1) {
      html += `<button class="modal-btn modal-btn-primary race-series-btn" data-series="${series}" style="width:100%;margin-bottom:8px;padding:8px;font-size:0.85rem;">
        &#127942; Championship
      </button>`;
    }

    // Individual tracks
    html += `<div style="display:flex;flex-direction:column;gap:3px;">`;
    for (const t of tracks) {
      const best = bestTimes[t.name];
      const bestStr = best ? formatTime(best) : '--';
      html += `<button class="modal-btn race-single-btn" data-track="${t.name}" data-builtin="${t.builtin}" style="background:rgba(255,255,255,0.08);color:#fff;width:100%;padding:6px 10px;font-size:0.8rem;display:flex;justify-content:space-between;align-items:center;">
        <span>&#127937; ${t.name}</span>
        <span style="font-size:0.7rem;color:rgba(255,255,255,0.4);">${bestStr}</span>
      </button>`;
    }
    html += `</div></div>`;
  }
  html += '</div>';

  showModal('Race', html, true);

  // Bind championship buttons — use pointerup for reliable tablet touch
  document.querySelectorAll('.race-series-btn').forEach(btn => {
    let down = false;
    btn.addEventListener('pointerdown', () => { down = true; });
    btn.addEventListener('pointerup', async (e) => {
      if (!down) return;
      down = false;
      e.preventDefault();
      const series = btn.dataset.series;
      const tracks = seriesMap[series];
      championship = {
        series,
        tracks: tracks.map(t => ({ name: t.name, builtin: t.builtin, track: t.track })),
        currentIdx: 0,
        points: new Array(raceConfig.aiCount + 1).fill(0), // [player, ai0, ai1, ai2]
        times: [],
      };
      raceMenuFromOverlay = false;
      stopMenuDemo();
      hideModal();
      await loadChampionshipRace(0);
    });
    btn.addEventListener('pointercancel', () => { down = false; });
  });

  // Bind individual race buttons
  document.querySelectorAll('.race-single-btn').forEach(btn => {
    let down = false;
    btn.addEventListener('pointerdown', () => { down = true; });
    btn.addEventListener('pointerup', async (e) => {
      if (!down) return;
      down = false;
      e.preventDefault();
      const name = btn.dataset.track;
      const builtin = btn.dataset.builtin === 'true';
      championship = null; // Single race, no championship
      raceMenuFromOverlay = false;
      stopMenuDemo();
      hideModal();
      if (builtin) {
        const t = allTracks.find(x => x.name === name && x.builtin);
        if (t) await doLoadTrackFromData(name, t.track);
      } else {
        await doLoadTrack(name);
      }
      await autoDecorate();
      await startRace();
    });
    btn.addEventListener('pointercancel', () => { down = false; });
  });
}

async function loadChampionshipRace(idx) {
  const raceInfo = championship.tracks[idx];
  championship.currentIdx = idx;

  if (raceInfo.builtin) {
    await doLoadTrackFromData(raceInfo.name, raceInfo.track);
  } else {
    await doLoadTrack(raceInfo.name);
  }
  await autoDecorate();
  await startRace();
}

// ============================================================
// MENU DEMO (AI cars racing in background on title screen)
// ============================================================
let menuDemoActive = false;
let menuDemoRAF = null;

async function startMenuDemo() {
  if (menuDemoActive) return;
  menuDemoActive = true;

  // Load first available track for demo
  let demoTrackData = null;
  try {
    const indexResp = await fetch('tracks/index.json');
    const trackFiles = await indexResp.json();
    if (trackFiles.length > 0) {
      const resp = await fetch('tracks/' + trackFiles[0]);
      const data = await resp.json();
      demoTrackData = data.track;
    }
  } catch(e) {}
  if (!demoTrackData) { menuDemoActive = false; return; }
  await doLoadTrackFromData('demo', demoTrackData);
  editorCameraGoal = null;

  await autoDecorate();

  // Build spline for demo
  trackClosed = true;
  raceSpline = buildRaceSpline();
  if (!raceSpline) { menuDemoActive = false; return; }
  buildSplinePieceMap();

  // Spawn AI cars
  await spawnGridCars();

  // Hide player car
  if (carMesh) carMesh.visible = false;

  // Position AI at spread around the track
  const splineLen = raceSpline.getLength();
  for (let i = 0; i < aiCars.length; i++) {
    aiCars[i].t = i / aiCars.length;
    aiCars[i].speed = raceConfig.aiTopSpeed * aiCars[i].skill * 0.8;
    aiCars[i].laps = 0;
    aiCars[i].prevT = aiCars[i].t;
  }

  // Set camera to overview
  const cx = track.reduce((s,p) => s + p.worldX, 0) / track.length;
  const cz = track.reduce((s,p) => s + p.worldZ, 0) / track.length;
  controls.target.set(cx, 0, cz);
  camera.position.set(cx + 12, 14, cz + 12);
  camera.lookAt(cx, 0, cz);

  // Switch to race ground
  groundMat.color.set(0x4d8f6e);
  renderer.setClearColor(0x87ceeb);
  scene.fog.color.set(0x87ceeb);

  // Animate AI cars
  let lastTime = performance.now();
  function demoLoop() {
    if (!menuDemoActive) return;
    menuDemoRAF = requestAnimationFrame(demoLoop);
    const now = performance.now();
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    for (const ai of aiCars) {
      // AI boost
      const aiOnBoost = isOnBoost(ai.t);
      if (aiOnBoost && !ai.onBoostLastFrame) ai.speed += 0.9;
      ai.onBoostLastFrame = aiOnBoost;
      const aiCornerLimit = getCornerSpeedLimit(ai.t);
      if (aiCornerLimit < Infinity && ai.speed > aiCornerLimit) {
        ai.speed = Math.max(ai.speed - raceConfig.cornerBrakeRate * dt, aiCornerLimit - raceConfig.cornerPenalty);
      } else {
        const target = raceConfig.aiTopSpeed * ai.skill;
        if (ai.speed < target) ai.speed = Math.min(ai.speed + raceConfig.aiAcceleration * dt, target);
        else ai.speed = Math.max(ai.speed - raceConfig.coastDecel * dt, target * 0.7);
      }

      ai.t += (ai.speed * dt) / splineLen;
      if (ai.t >= 1) ai.t -= 1;

      const aiLaneOff = laneConfig.leftOffset * (1 - ai.laneBlend) + laneConfig.rightOffset * ai.laneBlend;
      const pos = getOffsetPoint(raceSpline, ai.t, aiLaneOff);
      const ahead = getOffsetPoint(raceSpline, (ai.t + 0.005) % 1, aiLaneOff);
      ai.mesh.position.copy(pos);
      ai.mesh.lookAt(ahead);

      // Random lane switching
      ai.laneTimer -= dt;
      if (ai.laneTimer <= 0) {
        ai.lane = ai.lane === 'left' ? 'right' : 'left';
        ai.laneTimer = 3 + Math.random() * 4;
      }
      const aiTargetBlend = ai.lane === 'right' ? 1 : 0;
      if (ai.laneBlend < aiTargetBlend) ai.laneBlend = Math.min(ai.laneBlend + 5 * dt, 1);
      else if (ai.laneBlend > aiTargetBlend) ai.laneBlend = Math.max(ai.laneBlend - 5 * dt, 0);
    }

    renderer.render(scene, camera);
  }
  demoLoop();
}

function stopMenuDemo() {
  menuDemoActive = false;
  if (menuDemoRAF) { cancelAnimationFrame(menuDemoRAF); menuDemoRAF = null; }
  // Restore editor ground
  groundMat.color.set(0x2a2a2a);
  renderer.setClearColor(0x1a1a1a);
  scene.fog.color.set(0x1a1a1a);
  editorCameraGoal = null;
  if (carMesh) carMesh.visible = true;
}

function getPointsForPosition(pos) {
  // Points: 1st=25, 2nd=18, 3rd=15, 4th=12
  return [25, 18, 15, 12][pos - 1] || 0;
}

function showChampionshipStandings(racePosition, raceTime) {
  const posLabels = ['1st', '2nd', '3rd', '4th'];
  const posColors = ['#ffd32a', '#c0c0c0', '#cd7f32', '#999'];
  const raceIdx = championship.currentIdx;
  const totalRaces = championship.tracks.length;
  const isLastRace = raceIdx >= totalRaces - 1;

  // Build standings table
  const names = ['You', 'AI 1', 'AI 2', 'AI 3'].slice(0, raceConfig.aiCount + 1);
  const standings = championship.points.map((pts, i) => ({ name: names[i], points: pts, idx: i }));
  standings.sort((a, b) => b.points - a.points);

  let standingsHTML = standings.map((s, rank) => {
    const color = s.idx === 0 ? '#fff' : 'rgba(255,255,255,0.6)';
    const bold = s.idx === 0 ? 'font-weight:700;' : '';
    return `<div style="display:flex;justify-content:space-between;padding:4px 8px;${bold}color:${color};border-bottom:1px solid rgba(255,255,255,0.05);">
      <span>${rank + 1}. ${s.name}</span><span>${s.points} pts</span>
    </div>`;
  }).join('');

  const title = isLastRace ? `${championship.series} - Final Results!` : `${championship.series} - Race ${raceIdx + 1}/${totalRaces}`;
  const champWinner = isLastRace ? standings[0] : null;

  let html = `<div style="text-align:center; padding:10px 0;">
    <div style="font-size:1.4rem; font-weight:800; color:${posColors[racePosition-1]}; margin-bottom:8px;">${posLabels[racePosition-1]} Place</div>
    <div style="font-size:1.1rem; color:#ffd32a; margin-bottom:4px;">${formatTime(raceTime)}</div>
    <div style="color:rgba(255,255,255,0.5);font-size:0.8rem;margin-bottom:12px;">${championship.tracks[raceIdx].name}</div>
    <div style="font-weight:700;margin-bottom:6px;color:rgba(255,255,255,0.8);">Championship Standings</div>
    <div style="background:rgba(0,0,0,0.3);border-radius:8px;padding:8px;margin-bottom:14px;">${standingsHTML}</div>`;

  if (isLastRace && champWinner) {
    const winnerColor = champWinner.idx === 0 ? '#ffd32a' : '#e74c3c';
    const winnerText = champWinner.idx === 0 ? 'You win the championship!' : `${champWinner.name} wins!`;
    html += `<div style="font-size:1.3rem;font-weight:800;color:${winnerColor};margin-bottom:14px;">&#127942; ${winnerText}</div>`;
  }

  html += `<div style="display:flex;gap:10px;justify-content:center;">`;
  if (!isLastRace) {
    html += `<button class="modal-btn modal-btn-primary" id="nextRaceBtn">Next Race</button>`;
  }
  html += `<button class="modal-btn" style="background:rgba(255,255,255,0.1);color:#fff;" id="champExitBtn">${isLastRace ? 'Done' : 'Quit'}</button>`;
  html += `</div></div>`;

  showModal(title, html, false, true);

  if (!isLastRace) {
    document.getElementById('nextRaceBtn').addEventListener('pointerup', async (e) => {
      e.preventDefault();
      hideModal();
      await loadChampionshipRace(raceIdx + 1);
    });
  }
  document.getElementById('champExitBtn').addEventListener('pointerup', (e) => {
    e.preventDefault();
    championship = null;
    hideModal();
    exitRace();
    showRaceMenu();
  });
}

function saveTrack() {
  if (track.length === 0) return;
  showModal('Save Track', `
    <input class="modal-input" id="saveNameInput" type="text" placeholder="Name your track..." autofocus maxlength="30">
    <button class="modal-btn modal-btn-primary" id="saveConfirmBtn" disabled style="margin-top:12px;">Save Track</button>
  `);
  const input = document.getElementById('saveNameInput');
  const btn = document.getElementById('saveConfirmBtn');
  input.addEventListener('input', () => {
    btn.disabled = !input.value.trim();
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && input.value.trim()) doSave();
  });
  btn.onclick = doSave;
  setTimeout(() => input.focus(), 50);

  function doSave() {
    const name = input.value.trim();
    if (!name) return;
    const trackData = track.map(p => ({ piece: PIECES[p.pieceIdx].name, rotation: p.rotation }));
    const saved = getSavedTracks();
    // Count existing Custom Classic tracks to assign race number
    const customCount = Object.values(saved).filter(e => e.series === 'Custom Classic').length;
    saved[name] = { track: trackData, series: 'Custom Classic', raceNo: customCount + 1 };
    localStorage.setItem(TRACKS_KEY, JSON.stringify(saved));
    document.getElementById('modalBody').innerHTML = `
      <div class="modal-success">
        <span class="success-icon">&#127937;</span>
        <span class="success-text">"${name}" saved!</span>
      </div>
    `;
    setTimeout(hideModal, 1200);
  }
}

async function loadTrack() {
  const saved = getSavedTracks();

  // Fetch built-in tracks from tracks/ folder
  let builtinTracks = [];
  try {
    const indexResp = await fetch('tracks/index.json');
    const trackFiles = await indexResp.json();
    for (const file of trackFiles) {
      try {
        const resp = await fetch('tracks/' + file);
        const data = await resp.json();
        builtinTracks.push(data);
      } catch(e) {}
    }
  } catch(e) {}

  // Build combined list: built-in first, then user saves
  const allTracks = [];

  for (const bt of builtinTracks) {
    const pieces = bt.track ? bt.track.length : 0;
    const label = bt.series ? `${bt.series} #${bt.raceNo}` : '';
    allTracks.push({ name: bt.name, pieces, series: bt.series, raceNo: bt.raceNo, builtin: true, label });
  }

  const userNames = Object.keys(saved);
  for (const name of userNames) {
    const entry = saved[name];
    const trackData = Array.isArray(entry) ? entry : entry.track;
    const pieces = trackData ? trackData.length : 0;
    const series = entry.series || '';
    const raceNo = entry.raceNo || '';
    const label = series ? `${series} #${raceNo}` : '';
    allTracks.push({ name, pieces, series, raceNo, builtin: false, label });
  }

  if (allTracks.length === 0) {
    showModal('Load Track', `
      <div class="track-empty">
        <span class="empty-icon">&#128301;</span>
        No saved tracks yet!<br>Build a track and save it first.
      </div>
    `);
    return;
  }

  const itemsHTML = allTracks.map((t, i) => {
    const badge = t.builtin ? '<span style="font-size:9px;background:rgba(162,155,254,0.3);padding:2px 6px;border-radius:4px;margin-left:6px;">built-in</span>' : '';
    const seriesLabel = t.label ? `<span style="color:rgba(255,255,255,0.4);font-size:11px;margin-left:6px;">${t.label}</span>` : '';
    return `<li class="track-item" style="animation-delay:${i * 0.05}s" data-name="${t.name}" data-builtin="${t.builtin}">
      <div>
        <div class="track-name">&#127937; ${t.name}${badge}${seriesLabel}</div>
        <div class="track-pieces">${t.pieces} piece${t.pieces !== 1 ? 's' : ''}</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;">
        <button class="track-download" data-download="${t.name}" data-builtin="${t.builtin}" title="Download">&#11015;</button>
        ${!t.builtin ? `<button class="track-delete" data-delete="${t.name}" title="Delete">&times;</button>` : ''}
      </div>
    </li>`;
  }).join('');

  showModal('Load Track', `
    <button class="modal-btn" id="importTrackBtn" style="margin-bottom:12px;background:rgba(255,255,255,0.1);color:#fff;width:100%;padding:10px;">&#128229; Import from file</button>
    <ul class="track-list">${itemsHTML}</ul>
  `);

  // Store built-in track data for loading
  const builtinMap = {};
  for (const bt of builtinTracks) { builtinMap[bt.name] = bt; }

  // Bind click handlers — use pointerup for reliable tablet touch
  document.querySelectorAll('.track-item').forEach(item => {
    let itemDown = false;
    item.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.track-delete, .track-download')) return;
      itemDown = true;
    });
    item.addEventListener('pointerup', async (e) => {
      if (!itemDown) return;
      itemDown = false;
      if (e.target.closest('.track-delete, .track-download')) return;
      e.preventDefault();
      const name = item.dataset.name;
      const isBuiltin = item.dataset.builtin === 'true';
      hideModal();
      if (isBuiltin) {
        await doLoadTrackFromData(name, builtinMap[name].track);
      } else {
        await doLoadTrack(name);
      }
    });
    item.addEventListener('pointercancel', () => { itemDown = false; });
  });

  document.querySelectorAll('.track-delete').forEach(btn => {
    btn.addEventListener('pointerup', (e) => {
      e.stopPropagation();
      e.preventDefault();
      const name = btn.dataset.delete;
      const saved = getSavedTracks();
      delete saved[name];
      localStorage.setItem(TRACKS_KEY, JSON.stringify(saved));
      btn.closest('.track-item').style.transform = 'translateX(100px)';
      btn.closest('.track-item').style.opacity = '0';
      setTimeout(() => {
        btn.closest('.track-item').remove();
        if (document.querySelectorAll('.track-item').length === 0) {
          document.getElementById('modalBody').innerHTML = `
            <div class="track-empty">
              <span class="empty-icon">&#128301;</span>
              No saved tracks yet!
            </div>`;
        }
      }, 250);
    });
  });

  // Download track as JSON file
  document.querySelectorAll('.track-download').forEach(btn => {
    btn.addEventListener('pointerup', (e) => {
      e.stopPropagation();
      e.preventDefault();
      const name = btn.dataset.download;
      const isBuiltin = btn.dataset.builtin === 'true';
      let exportData;
      if (isBuiltin) {
        exportData = builtinMap[name];
      } else {
        const saved = getSavedTracks();
        const entry = saved[name];
        const trackData = Array.isArray(entry) ? entry : entry.track;
        exportData = { name, track: trackData, series: entry.series || undefined, raceNo: entry.raceNo || undefined };
      }
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${name}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });
  });

  // Import track from file
  document.getElementById('importTrackBtn').addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.addEventListener('change', async () => {
      if (!input.files.length) return;
      try {
        const text = await input.files[0].text();
        const data = JSON.parse(text);
        const name = data.name || input.files[0].name.replace('.json', '');
        const trackData = data.track;
        if (!trackData || !Array.isArray(trackData)) {
          alert('Invalid track file');
          return;
        }
        const saved = getSavedTracks();
        saved[name] = { track: trackData, series: data.series || undefined, raceNo: data.raceNo || undefined };
        localStorage.setItem(TRACKS_KEY, JSON.stringify(saved));
        hideModal();
        await doLoadTrack(name);
      } catch(e) {
        alert('Failed to import track: ' + e.message);
      }
    });
    input.click();
  });
}

async function doLoadTrackFromData(name, trackData) {
  currentRaceTrackName = name;
  // Clear current track
  track.forEach(p => scene.remove(p.mesh));
  track = [];
  cursor = { x: startCursorConfig.x, y:0, z: startCursorConfig.z, heading: startCursorConfig.heading };
  trackClosed = false;
  raceSpline = null;

  for (const entry of trackData) {
    const idx = PIECE_NAME_MAP[entry.piece];
    if (idx === undefined) continue;
    extraRotation = entry.rotation || 0;
    const def = PIECES[idx];
    const placement = getPiecePlacement(idx, cursor, extraRotation);
    const model = await loadModel(def.id);
    model.position.set(placement.x, 0, placement.z);
    model.rotation.y = -placement.heading * DEG;
    if (def.mirror) model.scale.x = -1;
    if (def.flipZ) {
      model.scale.z = -1;
      const offsetLocal = transformPoint(0, def.exit.z, placement.heading);
      model.position.x += offsetLocal.x;
      model.position.z += offsetLocal.z;
    }
    scene.add(model);
    track.push({
      pieceIdx: idx, worldX: placement.x, worldZ: placement.z,
      heading: placement.heading, prevCursor: { ...cursor },
      rotation: extraRotation, mesh: model,
    });
    cursor = getNextCursor(idx, cursor, extraRotation);
  }
  extraRotation = 0;
  trackClosed = false;
  if (mode !== 'title') document.getElementById('topBar').classList.remove('hidden');
  updatePieceCount();
  updatePieceAvailability();
  updateGhost();
  if (track.length > 0) {
    const last = track[track.length - 1];
    editorCameraGoal = new THREE.Vector3(last.worldX, 0, last.worldZ);
    controls.target.set(last.worldX, 0, last.worldZ);
  }
}

async function doLoadTrack(name) {
  currentRaceTrackName = name;
  const saved = getSavedTracks();
  if (!saved[name]) return;

  // Handle both old format (array) and new format (object with .track)
  const savedEntry = saved[name];
  const data = Array.isArray(savedEntry) ? savedEntry : savedEntry.track;

  // Clear current track
  track.forEach(p => scene.remove(p.mesh));
  track = [];
  cursor = { x: startCursorConfig.x, y:0, z: startCursorConfig.z, heading: startCursorConfig.heading };
  trackClosed = false;
  raceSpline = null;

  // Rebuild from saved data
  for (const entry of data) {
    const idx = PIECE_NAME_MAP[entry.piece];
    if (idx === undefined) continue;
    extraRotation = entry.rotation || 0;
    const def = PIECES[idx];
    const placement = getPiecePlacement(idx, cursor, extraRotation);
    const model = await loadModel(def.id);
    model.position.set(placement.x, 0, placement.z);
    model.rotation.y = -placement.heading * DEG;
    if (def.mirror) model.scale.x = -1;
    if (def.flipZ) {
      model.scale.z = -1;
      const offsetLocal = transformPoint(0, def.exit.z, placement.heading);
      model.position.x += offsetLocal.x;
      model.position.z += offsetLocal.z;
    }
    scene.add(model);
    track.push({
      pieceIdx: idx, worldX: placement.x, worldZ: placement.z,
      heading: placement.heading, prevCursor: { ...cursor },
      rotation: extraRotation, mesh: model,
    });
    cursor = getNextCursor(idx, cursor, extraRotation);
  }
  extraRotation = 0;
  trackClosed = false;
  if (mode !== 'title') document.getElementById('topBar').classList.remove('hidden');
  updatePieceCount();
  updatePieceAvailability();
  updateGhost();

  // Focus camera on last placed piece
  if (track.length > 0) {
    const last = track[track.length - 1];
    editorCameraGoal = new THREE.Vector3(last.worldX, 0, last.worldZ);
    controls.target.set(last.worldX, 0, last.worldZ);
  }
}

document.getElementById('saveBtn').addEventListener('pointerup', (e) => { e.preventDefault(); saveTrack(); });
document.getElementById('loadBtn').addEventListener('pointerup', (e) => { e.preventDefault(); loadTrack(); });

initThrottleBar();
const defaultTrackReady = loadDefaultTrack();
animate();

// Start menu demo on title screen
defaultTrackReady.then(() => startMenuDemo());

</script>
</body>
