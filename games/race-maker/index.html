<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Race Maker - Caleb's Arcade</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#1a1a1a; overflow:hidden; touch-action:none;
  font-family:'Segoe UI',system-ui,sans-serif; }
button, .piece-card, .track-item, .decor-item, .modal-btn, a { touch-action:manipulation; }
canvas { display:block; width:100%; height:100%; }
.hidden { display:none !important; }

#backBtn { position:fixed; top:12px; left:12px; z-index:9999;
  background:rgba(0,0,0,0.55); color:#fff; text-decoration:none;
  padding:6px 18px; border-radius:20px;
  font:bold 15px/1.4 'Segoe UI',system-ui,sans-serif;
  border:1px solid rgba(255,255,255,0.18);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  transition:background 0.2s; }
#backBtn:hover { background:rgba(0,0,0,0.75); }

#overlay { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:rgba(0,0,0,0.7); color:#fff; text-align:center; }
#overlay h1 { font-size:clamp(2rem,8vw,4rem); margin-bottom:0.5rem; }
#overlay .sub { font-size:clamp(1rem,3vw,1.4rem); color:#a0c4ff; margin-bottom:1.5rem; }
#overlay .info { font-size:clamp(0.85rem,2.5vw,1.1rem); color:rgba(255,255,255,0.7);
  margin-bottom:2rem; max-width:500px; padding:0 1rem; line-height:1.5; }
#overlay button { padding:14px 40px; font-size:1.3rem; border:none; border-radius:12px;
  background:linear-gradient(135deg,#6c5ce7,#a29bfe); color:#fff;
  cursor:pointer; font-weight:700;
  box-shadow:0 4px 20px rgba(108,92,231,0.4); transition:transform 0.15s; }
#overlay button:hover { transform:scale(1.05); }
#overlay button:active { transform:scale(0.95); }

/* Piece palette — compact overlay grid, bottom-left */
#piecePalette { position:fixed; bottom:12px; left:12px;
  z-index:100; background:rgba(0,0,0,0.88); border:1px solid rgba(255,255,255,0.15);
  border-radius:10px; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  padding:8px 10px; width:auto; }
#piecePalette .grid-section { display:grid; grid-template-columns:1fr 1fr 1fr;
  gap:4px; margin-bottom:6px; }
#piecePalette .grid-section:last-child { margin-bottom:0; }
#piecePalette .section-label { grid-column:1/-1; color:#a0c4ff; font-size:9px;
  font-weight:700; text-transform:uppercase; letter-spacing:0.5px;
  padding:1px 0; text-align:center; border-bottom:1px solid rgba(255,255,255,0.08);
  margin-bottom:2px; }
#piecePalette .specials-grid { display:grid; grid-template-columns:repeat(4, 1fr);
  gap:4px; grid-column:1/-1; }
.piece-card { padding:8px 8px; border-radius:6px; cursor:pointer;
  background:rgba(255,255,255,0.07); border:1.5px solid transparent;
  color:#fff; font-size:10px; font-weight:500; text-align:center;
  transition:all 0.12s; user-select:none; white-space:nowrap; line-height:1.2;
  min-height:44px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.piece-card:hover { background:rgba(108,92,231,0.35); border-color:rgba(162,155,254,0.5); }
.piece-card.selected { background:rgba(108,92,231,0.5); border-color:#a29bfe;
  box-shadow:0 1px 8px rgba(108,92,231,0.4); }
.piece-card .piece-icon { display:block; font-size:14px; margin-bottom:1px; }

/* Editor actions row — inside palette */
#piecePalette .actions-row { display:flex; gap:4px; margin-top:6px;
  padding-top:6px; border-top:1px solid rgba(255,255,255,0.08); }
#piecePalette .actions-row button { padding:10px 8px; border-radius:6px; border:none;
  background:rgba(255,255,255,0.1); color:#fff; font-size:10px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  transition:all 0.12s; font-weight:600; white-space:nowrap; flex:1; min-height:44px; }
#piecePalette .actions-row button .btn-icon { font-size:16px; line-height:1; }
#piecePalette .actions-row button:hover { background:rgba(255,255,255,0.22); }
#piecePalette .actions-row button:active { transform:scale(0.92); }
#piecePalette .actions-row button.danger { background:rgba(231,76,60,0.5); }
#piecePalette .actions-row button.success { background:rgba(46,204,113,0.5); }
#piecePalette .actions-row button[disabled] { opacity:0.3; pointer-events:none; }

/* Top bar */
#topBar { position:fixed; bottom:12px; right:12px; z-index:100;
  display:flex; gap:8px; }
#topBar button { padding:12px 18px; border-radius:10px; border:none;
  background:rgba(0,0,0,0.6); color:#fff; font-size:14px; font-weight:600;
  cursor:pointer; border:1px solid rgba(255,255,255,0.15);
  backdrop-filter:blur(6px); transition:all 0.15s; min-height:44px; }
#topBar button:hover { background:rgba(0,0,0,0.8); }
#topBar button.active { background:linear-gradient(135deg,#6c5ce7,#a29bfe);
  border-color:rgba(162,155,254,0.5); }

#editorCloseBtn { position:fixed; top:12px; right:12px; z-index:100;
  width:44px; height:44px; border-radius:50%; border:1px solid rgba(255,255,255,0.15);
  background:rgba(0,0,0,0.6); color:#fff; font-size:20px; cursor:pointer;
  backdrop-filter:blur(6px); transition:all 0.15s; display:flex; align-items:center; justify-content:center; }
#editorCloseBtn:hover { background:rgba(220,50,50,0.7); }
#editorCloseBtn.hidden { display:none; }

/* Piece count indicator */
#pieceCount { position:fixed; top:12px; left:50%; transform:translateX(-50%);
  z-index:100; background:rgba(0,0,0,0.6); color:#fff; padding:6px 14px;
  border-radius:10px; font-size:13px; border:1px solid rgba(255,255,255,0.12);
  backdrop-filter:blur(6px); }
#pieceCount span { color:#a29bfe; font-weight:700; }

#trackStatus { position:fixed; top:46px; left:50%; transform:translateX(-50%);
  z-index:100; background:rgba(0,0,0,0.6); color:#fff; padding:6px 14px;
  border-radius:10px; font-size:13px; border:1px solid rgba(255,255,255,0.12);
  backdrop-filter:blur(6px); font-weight:600; transition: color 0.3s; }
#trackStatus.complete { color:#2ecc71; }
#trackStatus.incomplete { color:#e74c3c; }

/* Decoration palette */
#decorPalette { display:none; position:fixed; left:12px; top:60px; bottom:12px;
  width:200px; z-index:100; background:rgba(0,0,0,0.85); border-radius:12px;
  border:1px solid rgba(255,255,255,0.12); backdrop-filter:blur(8px);
  overflow-y:auto; padding:8px; }
#decorPalette.show { display:block; }
#decorPalette h3 { color:#a0c4ff; font-size:11px; text-transform:uppercase;
  padding:8px 4px 4px; letter-spacing:0.5px; font-weight:700; }
.decor-item { display:block; padding:6px 10px; border-radius:8px; cursor:pointer;
  color:#fff; font-size:12px; transition:background 0.15s; margin:1px 0; }
.decor-item:hover { background:rgba(255,255,255,0.1); }
.decor-item.selected { background:rgba(108,92,231,0.4); }
#autoDecorBtn { width:100%; padding:10px; border:none; border-radius:10px;
  background:linear-gradient(135deg,#6c5ce7,#a29bfe); color:#fff; font-size:13px;
  font-weight:700; cursor:pointer; margin-bottom:10px; transition:all 0.15s;
  box-shadow:0 3px 12px rgba(108,92,231,0.3); }
#autoDecorBtn:hover { transform:translateY(-1px); box-shadow:0 5px 16px rgba(108,92,231,0.5); }
#autoDecorBtn:active { transform:scale(0.95); }

/* Race HUD */
#raceHUD { display:none; position:fixed; top:12px; left:50%; transform:translateX(-50%);
  z-index:100; background:rgba(0,0,0,0.75); padding:10px 24px; border-radius:14px;
  border:1px solid rgba(255,255,255,0.1); color:#fff; font-size:14px;
  gap:20px; align-items:center; backdrop-filter:blur(6px); }
#raceHUD.show { display:flex; }
#raceHUD .lap { font-weight:700; }
#raceHUD .time { font-family:monospace; font-size:16px; color:#ffd32a; }
#raceHUD .speed { color:#a29bfe; }

/* Race position indicator */
#racePosition { display:none; position:fixed; top:60px; left:50%; transform:translateX(-50%);
  z-index:100; text-align:center; pointer-events:none;
  background:rgba(0,0,0,0.75); padding:8px 20px; border-radius:14px;
  border:1px solid rgba(255,255,255,0.1); backdrop-filter:blur(6px);
  min-width:80px; }
#racePosition.show { display:block; }
#racePosition .pos-num { font-size:3rem; font-weight:900; line-height:1;
  transition:transform 0.3s cubic-bezier(0.175,0.885,0.32,1.275), color 0.3s; }
#racePosition .pos-suffix { font-size:1.3rem; font-weight:700; vertical-align:super; }
#racePosition.animate .pos-num { transform:scale(1.5); }
#racePosition.first { border-color:rgba(255,211,42,0.5);
  box-shadow:0 0 20px rgba(255,211,42,0.3), 0 0 40px rgba(255,211,42,0.1);
  animation:firstPulse 1.5s ease-in-out infinite; }
@keyframes firstPulse {
  0%, 100% { box-shadow:0 0 20px rgba(255,211,42,0.3), 0 0 40px rgba(255,211,42,0.1); }
  50% { box-shadow:0 0 30px rgba(255,211,42,0.5), 0 0 60px rgba(255,211,42,0.2); }
}

/* Too Fast warning */
#tooFastWarning { display:none; position:fixed; right:80px; top:22%; transform:translate(0,-50%) scale(0.8);
  z-index:150; color:#ff4757; font-size:1.4rem; font-weight:900; pointer-events:none;
  background:rgba(0,0,0,0.75); padding:6px 14px; border-radius:10px;
  border:1px solid rgba(255,255,255,0.1);
  opacity:0; transition:opacity 0.25s ease, transform 0.25s ease; letter-spacing:0.5px; }
#tooFastWarning.show { display:block; opacity:1;
  transform:translate(0,-50%) scale(1); animation:tooFastShake 2s ease-in-out infinite; }
@keyframes tooFastShake {
  0% { transform:translate(0,-50%) scale(1) rotate(0deg); }
  8% { transform:translate(-1px,-50%) scale(1.05) rotate(-1.5deg); }
  16% { transform:translate(2px,-50%) scale(0.97) rotate(1deg); }
  24% { transform:translate(-1px,-50%) scale(1.03) rotate(-0.5deg); }
  32% { transform:translate(1px,-50%) scale(1) rotate(0.8deg); }
  40% { transform:translate(0,-50%) scale(1.02) rotate(-0.3deg); }
  50% { transform:translate(0,-50%) scale(1) rotate(0deg); }
  100% { transform:translate(0,-50%) scale(1) rotate(0deg); }
}

/* Countdown */
#countdown { display:none; position:fixed; inset:0; z-index:200;
  align-items:center; justify-content:center;
  font-size:clamp(4rem,15vw,10rem); font-weight:900; color:#fff;
  text-shadow:0 0 40px rgba(108,92,231,0.8); pointer-events:none; }
#countdown.show { display:flex; }

/* Speed bar */
#speedBar { display:none; }
#speedBar.show { display:none; }
#speedFill { display:none; }
#speedNum { position:fixed; top:calc(22% - 60px); right:80px;
  z-index:100; font-size:28px; font-weight:700; color:#fff; font-family:monospace;
  text-shadow:0 2px 6px rgba(0,0,0,0.8); display:none; transition:color 0.15s; }
#speedNum.show { display:block; }
#speedNum.braking { color:#e74c3c; }
#cornerWarning { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  z-index:100; pointer-events:none; }
#cornerWarning.show { display:block; }
#cornerWarning .vignette { position:fixed; inset:0;
  box-shadow:inset 0 0 80px 30px rgba(231,76,60,0.4); pointer-events:none;
  animation:pulse-vignette 0.3s ease-in-out infinite alternate; }
@keyframes pulse-vignette { from { opacity:0.6; } to { opacity:1; } }
#throttleHint { display:none; }
#switchLaneBtn { position:fixed; left:16px; top:50%; transform:translateY(-50%);
  z-index:150; width:64px; height:100px; border-radius:25px;
  background:rgba(0,0,0,0.6); color:#fff; font-size:32px;
  cursor:pointer; transition:transform 0.12s, background 0.15s;
  display:none; touch-action:none;
  border:2px solid rgba(255,255,255,0.2); }
#switchLaneBtn:hover { background:rgba(0,0,0,0.75); }
#switchLaneBtn:active { transform:translateY(-50%) scale(0.88); background:rgba(108,92,231,0.5); }
#switchLaneBtn.show { display:flex; align-items:center; justify-content:center; }

/* Throttle bar */
#throttleBar { display:none; position:fixed; right:20px; top:50%; transform:translateY(-50%);
  width:50px; height:60vh; z-index:150; touch-action:none; }
#throttleBar.show { display:block; }
#throttleBar .bar-bg { position:absolute; inset:0; background:rgba(0,0,0,0.6);
  border-radius:25px; border:2px solid rgba(255,255,255,0.2); overflow:hidden; }
#throttleBar .bar-fill { position:absolute; bottom:0; left:0; right:0;
  background:linear-gradient(to top, #2ecc71, #f1c40f, #e74c3c);
  border-radius:0 0 23px 23px; transition:height 0.05s; }
#throttleBar .bar-marker { position:absolute; left:-30px; right:0; height:2px;
  background:rgba(255,255,255,0.5); pointer-events:none; }
#throttleBar .bar-marker-label { position:absolute; right:calc(100% + 6px); top:50%;
  font-size:11px; color:rgba(255,255,255,0.8); font-family:monospace; font-weight:700;
  transform:translateY(-50%); white-space:nowrap; }
#throttleBar .bar-thumb { position:absolute; left:50%; transform:translate(-50%,-50%);
  width:60px; height:14px; background:rgba(255,255,255,0.9); border-radius:7px;
  pointer-events:none; box-shadow:0 2px 8px rgba(0,0,0,0.4); display:none; }
#throttleBar.active .bar-thumb { display:block; }
#throttleBar .bar-speed { position:absolute; left:50%; transform:translate(-50%,-50%);
  font-size:13px; font-weight:700; color:#fff; font-family:monospace;
  pointer-events:none; text-shadow:0 1px 3px rgba(0,0,0,0.8); display:none;
  white-space:nowrap; }
#throttleBar.active .bar-speed { display:block; }

/* Save/Load Modal */
.modal-overlay { position:fixed; inset:0; z-index:9000; display:flex; align-items:center;
  justify-content:center; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px);
  animation:modalFadeIn 0.25s ease; }
.modal-overlay.hidden { display:none !important; }
@keyframes modalFadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes modalSlideUp { from { transform:translateY(30px) scale(0.95); opacity:0; }
  to { transform:translateY(0) scale(1); opacity:1; } }
@keyframes modalPop { 0% { transform:scale(0.8); opacity:0; }
  60% { transform:scale(1.03); } 100% { transform:scale(1); opacity:1; } }
.modal-box { background:linear-gradient(145deg,#2d2b55,#1a1a2e); border-radius:20px;
  border:2px solid rgba(162,155,254,0.3); padding:0; width:min(400px, 90vw);
  max-height:85vh; display:flex; flex-direction:column;
  box-shadow:0 20px 60px rgba(108,92,231,0.3), 0 0 40px rgba(108,92,231,0.1);
  animation:modalPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); overflow:hidden; }
.modal-box.wide { width:min(1200px, 95vw); }
@media (orientation:landscape) { .modal-box.wide { width:min(1200px, 98vw); } }
.modal-header { display:flex; align-items:center; justify-content:space-between;
  padding:18px 24px; background:rgba(108,92,231,0.15);
  border-bottom:1px solid rgba(162,155,254,0.2); }
.modal-header h2 { font-size:1.3rem; color:#fff; margin:0; }
.modal-close { background:none; border:none; color:rgba(255,255,255,0.6); font-size:24px;
  cursor:pointer; padding:10px 14px; border-radius:8px; transition:all 0.15s; min-width:44px; min-height:44px; }
.modal-close:hover { background:rgba(255,255,255,0.1); color:#fff; }
.modal-body { padding:20px 24px; overflow-y:auto; flex:1; }
.modal-input { width:100%; padding:12px 16px; border-radius:12px; border:2px solid rgba(162,155,254,0.3);
  background:rgba(0,0,0,0.3); color:#fff; font-size:16px; font-weight:500;
  outline:none; transition:border-color 0.2s; margin-bottom:16px; }
.modal-input:focus { border-color:#a29bfe; }
.modal-input::placeholder { color:rgba(255,255,255,0.35); }
.modal-btn { padding:12px 24px; border-radius:12px; border:none; font-size:15px;
  font-weight:700; cursor:pointer; transition:all 0.15s; }
.modal-btn:active { transform:scale(0.93); }
.modal-btn-primary { background:linear-gradient(135deg,#6c5ce7,#a29bfe); color:#fff;
  box-shadow:0 4px 15px rgba(108,92,231,0.4); width:100%; }
.modal-btn-primary:hover { box-shadow:0 6px 20px rgba(108,92,231,0.6); transform:translateY(-1px); }
.modal-btn-primary:disabled { opacity:0.4; pointer-events:none; }
.track-list { list-style:none; padding:0; margin:0; max-height:300px; overflow-y:auto; }
.track-item { display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px; border-radius:12px; margin-bottom:8px; cursor:pointer;
  background:rgba(255,255,255,0.05); border:2px solid transparent;
  transition:all 0.25s; animation:modalSlideUp 0.3s ease backwards; }
.track-item:hover { background:rgba(108,92,231,0.2); border-color:rgba(162,155,254,0.4); }
.track-item .track-name { font-size:15px; font-weight:600; color:#fff; }
.track-item .track-pieces { font-size:12px; color:rgba(255,255,255,0.5); }
.track-item .track-download { background:none; border:none; color:rgba(162,155,254,0.7);
  font-size:18px; cursor:pointer; padding:10px 12px; border-radius:6px; transition:all 0.15s; min-width:44px; min-height:44px; }
.track-item .track-download:hover { color:#a29bfe; background:rgba(162,155,254,0.15); }
.track-item .track-delete { background:none; border:none; color:rgba(231,76,60,0.7);
  font-size:20px; cursor:pointer; padding:10px 12px; border-radius:6px; transition:all 0.15s; min-width:44px; min-height:44px; }
.track-item .track-delete:hover { color:#e74c3c; background:rgba(231,76,60,0.15); }
.track-empty { text-align:center; padding:30px; color:rgba(255,255,255,0.4); font-size:14px; }
.track-empty .empty-icon { font-size:40px; margin-bottom:10px; display:block; }
.modal-success { text-align:center; padding:20px; animation:modalPop 0.4s ease; }
.modal-success .success-icon { font-size:48px; display:block; margin-bottom:12px; }
.modal-success .success-text { font-size:16px; color:#2ecc71; font-weight:600; }
</style>
</head>
<body>
<a id="backBtn" href="../../index.html">&larr; Games</a>

<div id="overlay">
  <h1>Race Maker</h1>
  <div class="sub">Build a track. Race it.</div>
  <div class="info">Build your circuit piece by piece, then race Scalextric-style — hold to go fast, but watch those corners!</div>
  <button id="startBtn">Build a Track</button>
  <button id="quickRaceBtn" style="margin-top:10px; background:linear-gradient(135deg,#e74c3c,#f39c12);">Race!</button>
</div>

<div id="piecePalette" class="hidden"></div>

<div id="topBar" class="hidden">
  <button id="modeEditBtn" class="active">Edit Track</button>
  <button id="modeDecorBtn">Decorate</button>
  <button id="modeRaceBtn">Race!</button>
</div>
<button id="editorCloseBtn" class="hidden">✕</button>

<div id="pieceCount" class="hidden"><span>0</span> pieces</div>
<div id="trackStatus" class="hidden incomplete">Incomplete</div>
<div id="decorPalette"></div>
<div id="raceHUD"><span class="lap">Lap 1/3</span><span class="time">0:00.00</span><span class="speed">0 mph</span></div>
<div id="racePosition"><span class="pos-num" style="color:#999">1</span><span class="pos-suffix" style="color:#999">st</span></div>
<div id="tooFastWarning">TOO FAST!</div>
<div id="countdown"></div>
<div id="speedNum">0 mph</div>
<div id="cornerWarning"><div class="vignette"></div></div>
<div id="throttleBar">
  <div class="bar-bg">
    <div class="bar-fill"></div>
  </div>
  <div class="bar-thumb"></div>
  <div class="bar-speed"></div>
</div>
<div id="speedBar"><div id="speedFill"></div></div>
<div id="throttleHint">Hold SPACE or tap to accelerate &middot; S to switch lane</div>
<button id="switchLaneBtn" class="hidden"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2l-4 4 4 4"/><path d="M3 6h11a4 4 0 0 1 0 8h-1"/><path d="M17 22l4-4-4-4"/><path d="M21 18H10a4 4 0 0 1 0-8h1"/></svg></button>

<!-- Save/Load Modal -->
<div id="trackModal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="modalTitle">Save Track</h2>
      <button class="modal-close" id="modalCloseBtn">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/",
    "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.esm.min.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

function getFinishT() {
  if (!raceSpline) return 0;
  const splineLen = raceSpline.getLength();
  return ((raceConfig.finishOffset / splineLen) % 1 + 1) % 1;
}

function updateFinishMarker() {
  if (!raceSpline) { finishMarker.visible = false; return; }
  const t = getFinishT();
  const pos = raceSpline.getPointAt(Math.max(0.0001, Math.min(t, 0.9999)));
  finishMarker.position.set(pos.x, pos.y + 0.4, pos.z);
  finishMarker.visible = false;
}

// ============================================================
// ASSET LOADING
// ============================================================
const loader = new GLTFLoader();
const modelCache = {};

function loadModel(id) {
  if (modelCache[id]) return Promise.resolve(modelCache[id].clone());
  return new Promise((resolve, reject) => {
    loader.load(ASSET_PATH + id + '.glb', gltf => {
      const model = gltf.scene;
      // Strip baked scene translation so geometry sits at true local origin.
      // All Kenney racing kit GLBs have a consistent offset on the first child.
      // Shift the whole model by negative of first child's position to preserve
      // relative positions between sub-parts (e.g. overhead poles).
      if (model.children.length > 0) {
        const offset = model.children[0].position.clone();
        model.children.forEach(child => {
          child.position.sub(offset);
        });
      }
      modelCache[id] = model;
      resolve(model.clone());
    }, undefined, reject);
  });
}

// ============================================================
// PIECE PLACEMENT MATH
// ============================================================

// Transform a local point by heading (matches Three.js rotation.y = -heading * DEG)
// Three.js Y-rotation matrix: x' = x*cos(a) + z*sin(a), z' = -x*sin(a) + z*cos(a)
function transformPoint(localX, localZ, heading) {
  const a = -heading * DEG;
  const cos = Math.cos(a), sin = Math.sin(a);
  return { x: localX * cos + localZ * sin, z: -localX * sin + localZ * cos };
}

// Compute world position to place a piece so its entry aligns with cursor
function getPiecePlacement(pieceIdx, cursorState, rotation) {
  const def = PIECES[pieceIdx];
  const totalHeading = cursorState.heading + rotation;

  // Transform entry point to world-relative offset
  const entryWorld = transformPoint(def.entry.x, def.entry.z, totalHeading);

  // Piece origin in world = cursor - rotated entry
  const worldX = cursorState.x - entryWorld.x;
  const worldZ = cursorState.z - entryWorld.z;

  return { x: worldX, z: worldZ, heading: totalHeading };
}

// Get the new cursor position after placing a piece
function getNextCursor(pieceIdx, cursorState, rotation) {
  const def = PIECES[pieceIdx];
  const totalHeading = cursorState.heading + rotation;

  // Transform entry and exit to world
  const entryWorld = transformPoint(def.entry.x, def.entry.z, totalHeading);
  const exitWorld = transformPoint(def.exit.x, def.exit.z, totalHeading);

  // New cursor = current cursor + (rotated exit - rotated entry)
  const newX = cursorState.x + (exitWorld.x - entryWorld.x);
  const newZ = cursorState.z + (exitWorld.z - entryWorld.z);
  const newY = def.dyAbsolute !== undefined ? def.dyAbsolute : cursorState.y + (def.dy || 0);
  const newHeading = totalHeading + def.turn;

  return { x: newX, y: newY, z: newZ, heading: newHeading };
}

// Check if cursor is close enough to the start to close the loop
function checkCanClose() {
  if (track.length < 4) return false;
  // Start connector: the entry of the first piece
  const firstPlacement = track[0];
  const firstDef = PIECES[firstPlacement.pieceIdx];
  // The entry of the first piece in world = first piece's cursor at time of placement
  // which is the initial cursor (0, 0, 0 heading)
  const startX = 0, startZ = 0, startHeading = 0;

  const dx = cursor.x - startX;
  const dz = cursor.z - startZ;
  const dist = Math.sqrt(dx*dx + dz*dz);

  // Normalize heading difference
  let headingDiff = ((cursor.heading - startHeading) % 360 + 360) % 360;
  if (headingDiff > 180) headingDiff -= 360;

  // Must also be at same elevation
  const dy = Math.abs(cursor.y - 0);
  return dist < 0.3 && Math.abs(headingDiff) < 10 && dy < 0.1;
}

// GHOST PREVIEW
// ============================================================
let ghostGeneration = 0;

async function updateGhost() {
  if (ghostGroup) { scene.remove(ghostGroup); ghostGroup = null; }
  if (mode !== 'editor' || trackClosed) return;

  const gen = ++ghostGeneration;
  const def = PIECES[selectedPieceIdx];
  const placement = getPiecePlacement(selectedPieceIdx, cursor, extraRotation);

  // Update connector marker immediately (no async)
  connectorMarker.position.set(cursor.x, 0, cursor.z);
  connectorMarker.rotation.y = -cursor.heading * DEG;
  connectorMarker.visible = true;

  // Enable loop button if we have enough pieces
  document.getElementById('closeBtn').disabled = track.length < 3;

  try {
    const model = await loadModel(def.id);
    // Abort if a newer ghost was requested while we were loading
    if (gen !== ghostGeneration) { return; }

    ghostGroup = model;
    ghostGroup.position.set(placement.x, 0, placement.z);
    ghostGroup.rotation.y = -placement.heading * DEG;
    if (def.mirror) ghostGroup.scale.x = -1;
    if (def.flipZ) {
      ghostGroup.scale.z = -1;
      const offsetLocal = transformPoint(0, def.exit.z, placement.heading);
      ghostGroup.position.x += offsetLocal.x;
      ghostGroup.position.z += offsetLocal.z;
    }

    // Ghost material — tint red if collision
    const collision = checkCollision(selectedPieceIdx, cursor, extraRotation);
    const ghostColor = collision === 'warning' ? 0xe74c3c : 0x6c5ce7;
    ghostGroup.traverse(child => {
      if (child.isMesh) {
        child.material = child.material.clone();
        child.material.transparent = true;
        child.material.opacity = 0.5;
        child.material.emissive = new THREE.Color(ghostColor);
        child.material.emissiveIntensity = 0.4;
      }
    });
    scene.add(ghostGroup);
  } catch(e) {
    console.warn('Ghost load failed:', e);
  }
}

// ============================================================
// COLLISION DETECTION
// ============================================================

// Get the cell key for a world position (half-unit grid for finer collision)
function cellKey(x, z) {
  return `${Math.round(x*2)},${Math.round(z*2)}`;
}

// Get grid cells occupied by a piece, EXCLUDING the entry point (shared connector)
function getPieceCells(pieceIdx, cursorState, rotation) {
  const def = PIECES[pieceIdx];
  const totalHeading = cursorState.heading + rotation;
  const entryW = transformPoint(def.entry.x, def.entry.z, totalHeading);
  const exitW = transformPoint(def.exit.x, def.exit.z, totalHeading);

  const cells = new Set();
  const dx = exitW.x - entryW.x;
  const dz = exitW.z - entryW.z;
  const length = Math.sqrt(dx*dx + dz*dz);
  const steps = Math.max(Math.ceil(length * 2), 2);

  // Sample from 20% to 80% of the piece (avoid connector zones at both ends)
  for (let i = 0; i < steps; i++) {
    const t = 0.2 + (i / (steps - 1)) * 0.6;
    const wx = cursorState.x + dx * t;
    const wz = cursorState.z + dz * t;
    cells.add(cellKey(wx, wz));
  }

  return cells;
}

// Check for collisions with existing track pieces
// Returns: 'clear' | 'warning' | 'bridge-ok'
function checkCollision(pieceIdx, cursorState, rotation) {
  const def = PIECES[pieceIdx];
  const newCells = getPieceCells(pieceIdx, cursorState, rotation);
  const newY = cursorState.y;
  const isBridge = def.id.includes('Bridge');

  // Skip the last 3 placed pieces (predecessors share connector space)
  const checkPieces = track.slice(0, Math.max(0, track.length - 3));

  for (const placed of checkPieces) {
    const placedDef = PIECES[placed.pieceIdx];
    const placedCells = getPieceCells(placed.pieceIdx, placed.prevCursor, placed.rotation);
    const placedY = placed.prevCursor.y;
    const placedIsRamp = placedDef.id.includes('Ramp');

    // Check cell overlap
    for (const cell of newCells) {
      if (placedCells.has(cell)) {
        // Bridge can pass over non-ramp pieces at different elevation
        if (isBridge && !placedIsRamp && Math.abs(newY - placedY) > 0.3) {
          return 'bridge-ok';
        }
        return 'warning';
      }
    }
  }
  return 'clear';
}

// ============================================================
// PLACE / UNDO
// ============================================================

async function placePiece(pieceIdx) {
  if (trackClosed) return;
  const def = PIECES[pieceIdx];
  const placement = getPiecePlacement(pieceIdx, cursor, extraRotation);

  // Check collision — block placement if overlapping
  const collision = checkCollision(pieceIdx, cursor, extraRotation);
  if (collision === 'warning') {
    showCollisionWarning();
    return;
  }

  try {
    const model = await loadModel(def.id);
    model.position.set(placement.x, 0, placement.z);
    model.rotation.y = -placement.heading * DEG;
    if (def.mirror) model.scale.x = -1;
    if (def.flipZ) {
      model.scale.z = -1;
      // Offset model forward by piece depth so flipped geometry stays ahead of entry
      const offsetLocal = transformPoint(0, def.exit.z, placement.heading);
      model.position.x += offsetLocal.x;
      model.position.z += offsetLocal.z;
    }
    scene.add(model);

    // Save to track
    track.push({
      pieceIdx,
      worldX: placement.x,
      worldZ: placement.z,
      heading: placement.heading,
      prevCursor: { ...cursor },
      rotation: extraRotation,
      mesh: model,
    });

    // Advance cursor
    cursor = getNextCursor(pieceIdx, cursor, extraRotation);
    extraRotation = 0;

    // Auto-select next piece based on what was just placed
    if (pieceIdx === 9) { selectedPieceIdx = 10; } // Ramp Up -> Bridge
    else if (pieceIdx === 12) { selectedPieceIdx = 7; } // Ramp Down -> Straight

    updatePieceCount();
    updatePieceAvailability();
    updatePaletteSelection();
    updateGhost();
    updateCameraTarget();
  } catch(e) {
    console.warn('Place failed:', e);
  }
}

function undoPiece() {
  if (track.length === 0) return;
  if (trackClosed) {
    // Undo the entire auto-close batch
    while (track.length > 0 && track[track.length-1].autoClose) {
      const p = track.pop();
      scene.remove(p.mesh);
    }
    trackClosed = false;
    if (track.length > 0) {
      cursor = getNextCursor(track[track.length-1].pieceIdx, track[track.length-1].prevCursor, track[track.length-1].rotation);
    } else {
      cursor = { x:0, y:0, z:0, heading:0 };
    }
  } else {
    const last = track.pop();
    scene.remove(last.mesh);
    cursor = last.prevCursor;
  }
  extraRotation = 0;
  trackClosed = false;
  updatePieceCount();
  updatePieceAvailability();
  updateGhost();
  updateCameraTarget();
}

// BFS pathfinder to close the loop automatically
function findClosePath() {
  const targetX = loopTarget.x, targetZ = loopTarget.z, targetHeading = loopTarget.heading;
  // Only use ground-level, non-special pieces for closing (indices 0-8)
  const usablePieces = [0,1,2,3,4,5,6,7,8];
  const maxDepth = 12;
  const tolerance = 0.5;
  const headingTol = 15;

  // State: {x, z, heading, path:[pieceIdx,...]}
  const queue = [{ x:cursor.x, z:cursor.z, heading:cursor.heading, path:[] }];
  // Visited set to avoid loops (round to 0.25 grid)
  const visited = new Set();
  function stateKey(x, z, h) {
    return `${Math.round(x*4)/4},${Math.round(z*4)/4},${((h%360)+360)%360}`;
  }
  visited.add(stateKey(cursor.x, cursor.z, cursor.heading));

  while (queue.length > 0) {
    const state = queue.shift();
    if (state.path.length >= maxDepth) continue;

    for (const idx of usablePieces) {
      const cur = { x:state.x, y:0, z:state.z, heading:state.heading };
      const next = getNextCursor(idx, cur, 0);
      const newPath = [...state.path, idx];

      // Check if we've reached the loop target
      const dx = next.x - targetX;
      const dz = next.z - targetZ;
      const dist = Math.sqrt(dx*dx + dz*dz);
      let hDiff = ((next.heading - targetHeading) % 360 + 360) % 360;
      if (hDiff > 180) hDiff -= 360;

      if (dist < tolerance && Math.abs(hDiff) < headingTol) {
        return newPath;
      }

      // Prune: don't go too far from midpoint between cursor and target
      const midX = (cursor.x + targetX) / 2;
      const midZ = (cursor.z + targetZ) / 2;
      const distFromMid = Math.sqrt((next.x-midX)**2 + (next.z-midZ)**2);
      const maxRange = Math.sqrt((cursor.x-targetX)**2 + (cursor.z-targetZ)**2) + 10;
      if (distFromMid > maxRange) continue;

      const key = stateKey(next.x, next.z, next.heading);
      if (visited.has(key)) continue;
      visited.add(key);

      queue.push({ x:next.x, z:next.z, heading:next.heading, path:newPath });
    }
  }
  return null; // No path found
}

async function closeLoop() {
  if (track.length < 3) return;

  // If already close enough, just close
  if (cursor.x === 0 && cursor.z === 0 && cursor.heading % 360 === 0) {
    trackClosed = true;
    if (ghostGroup) { scene.remove(ghostGroup); ghostGroup = null; }
    connectorMarker.visible = false;
    document.getElementById('topBar').classList.remove('hidden');
    await spawnGridCars();
    return;
  }

  const path = findClosePath();
  if (!path || path.length === 0) {
    // Show a warning
    let el = document.getElementById('collisionWarn');
    if (!el) {
      el = document.createElement('div');
      el.id = 'collisionWarn';
      el.style.cssText = 'position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:200;background:rgba(231,76,60,0.9);color:#fff;padding:8px 18px;border-radius:10px;font-size:13px;font-weight:600;pointer-events:none;transition:opacity 0.3s;';
      document.body.appendChild(el);
    }
    el.textContent = 'Cannot find a way to close this loop!';
    el.style.opacity = '1';
    setTimeout(() => { el.style.opacity = '0'; }, 3000);
    return;
  }

  // Place each piece in the path
  for (const pieceIdx of path) {
    const def = PIECES[pieceIdx];
    const placement = getPiecePlacement(pieceIdx, cursor, 0);
    try {
      const model = await loadModel(def.id);
      model.position.set(placement.x, 0, placement.z);
      model.rotation.y = -placement.heading * DEG;
      if (def.mirror) model.scale.x = -1;
      scene.add(model);

      track.push({
        pieceIdx,
        worldX: placement.x,
        worldZ: placement.z,
        heading: placement.heading,
        prevCursor: { ...cursor },
        rotation: 0,
        mesh: model,
        autoClose: true,
      });

      cursor = getNextCursor(pieceIdx, cursor, 0);
    } catch(e) {
      console.warn('Auto-close place failed:', e);
      return;
    }
  }

  trackClosed = true;
  if (ghostGroup) { scene.remove(ghostGroup); ghostGroup = null; }
  connectorMarker.visible = false;
  document.getElementById('topBar').classList.remove('hidden');
  updatePieceCount();
  updateCameraTarget();
  await spawnGridCars();
}

function updatePieceCount() {
  document.querySelector('#pieceCount span').textContent = track.length;
  updateTrackStatus();
}

function updateTrackStatus() {
  const el = document.getElementById('trackStatus');
  if (track.length < 3 || mode === 'title') {
    el.classList.add('hidden');
    return;
  }
  el.classList.remove('hidden');
  // Check if cursor matches loopTarget (track forms a complete loop)
  const tolerance = 0.05;
  const headingMatch = ((cursor.heading % 360) + 360) % 360;
  const targetHeading = ((loopTarget.heading % 360) + 360) % 360;
  const complete = Math.abs(cursor.x - loopTarget.x) < tolerance &&
                   Math.abs(cursor.z - loopTarget.z) < tolerance &&
                   Math.abs(headingMatch - targetHeading) < 1;
  el.textContent = complete ? 'Complete' : 'Incomplete';
  el.classList.toggle('complete', complete);
  el.classList.toggle('incomplete', !complete);
}

let editorCameraGoal = null;
function updateCameraTarget() {
  if (track.length === 0) return;
  const last = track[track.length - 1];
  editorCameraGoal = new THREE.Vector3(last.worldX, 0, last.worldZ);
  updateDebugVis();
}

function buildPalette() {
  const pal = document.getElementById('piecePalette');
  pal.innerHTML = '';

  function makeCard(idx) {
    const card = document.createElement('div');
    card.className = 'piece-card' + (idx === selectedPieceIdx ? ' selected' : '');
    card.dataset.idx = idx;
    card.innerHTML = `<span class="piece-icon">${PIECES[idx].icon}</span>${PIECES[idx].name}`;
    card.onmouseenter = () => {
      selectedPieceIdx = idx;
      extraRotation = 0;
      updatePaletteSelection();
      updateGhost();
    };
    // Unified pointer handler — works for both mouse and touch without conflicts
    let cardPointerDown = false;
    card.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      cardPointerDown = true;
    });
    card.addEventListener('pointerup', (e) => {
      if (!cardPointerDown) return;
      cardPointerDown = false;
      e.stopPropagation();
      e.preventDefault();
      if (selectedPieceIdx === idx) {
        placePiece(idx);
      } else {
        selectedPieceIdx = idx;
        extraRotation = 0;
        updatePaletteSelection();
        updateGhost();
      }
    });
    card.addEventListener('pointercancel', () => { cardPointerDown = false; });
    return card;
  }

  // Main 3x3 grid (turns + straights)
  const mainSection = document.createElement('div');
  mainSection.className = 'grid-section';
  const mainLabel = document.createElement('div');
  mainLabel.className = 'section-label';
  mainLabel.textContent = 'Track Pieces';
  mainSection.appendChild(mainLabel);
  // Rows 0-2 (indices 0-8)
  for (let i = 0; i < 9; i++) {
    mainSection.appendChild(makeCard(i));
  }
  pal.appendChild(mainSection);

  // Specials 4-column row
  const specSection = document.createElement('div');
  specSection.className = 'grid-section';
  const specLabel = document.createElement('div');
  specLabel.className = 'section-label';
  specLabel.textContent = 'Specials';
  specSection.appendChild(specLabel);
  const specRow = document.createElement('div');
  specRow.className = 'specials-grid';
  for (let i = 9; i < PIECES.length; i++) {
    specRow.appendChild(makeCard(i));

  specSection.appendChild(specRow);
  pal.appendChild(specSection);

}

function updatePieceAvailability() {
  const elevated = cursor.y > 0.1;
  document.querySelectorAll('.piece-card').forEach(c => {
    const idx = parseInt(c.dataset.idx);
    const def = PIECES[idx];
    let disabled = false;
    const isRampDown = def.dyAbsolute !== undefined || def.dy < 0;
    const isBridge = def.id.includes('Bridge');
    const isRampUp = def.dy > 0 && !isBridge;
    if (elevated) {
      // When elevated: only allow Bridge High, Bridge, and Ramp Down
      disabled = !(isBridge || isRampDown);
    } else {
      // When on ground: don't allow Bridge, Bridge High, or Ramp Down
      disabled = isBridge || isRampDown;
    }
    c.classList.toggle('disabled', disabled);
    c.style.opacity = disabled ? '0.3' : '';
    c.style.pointerEvents = disabled ? 'none' : '';
  });
}

// Auto-decorate params (exposed in lil-gui)
const autoDecorParams = {
  seed: 42,
  cornerEdgeChance: 0.7,    // chance a corner run gets edge decoration
  style: 'mixed',           // 'border', 'wall+sand', or 'mixed'
  tracksPerStand: 5,         // 1 stand per N track pieces (min 1 corner stand)
  standRotation: 90,        // degrees rotation for grandstands (face +X)
};

// Seeded PRNG (mulberry32)
function mulberry32(seed) {
  let s = seed | 0;
  return function() {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

async function autoDecorate() {
  if (track.length < 4) return;

  // Remove only auto-placed decorations, keep default-track ones
  const kept = [];
  for (const d of decorations) {
    if (d.isDefault) {
      kept.push(d);
    } else {
      scene.remove(d.mesh);
    }
  }
  decorations = kept;

  const rng = mulberry32(autoDecorParams.seed);

  // --- Identify corner runs (consecutive corner pieces turning the same direction) ---
  const cornerRuns = [];
  let i = 0;
  while (i < track.length) {
    const def = PIECES[track[i].pieceIdx];
    if (def.turn !== 0) {
      const run = { pieces: [], direction: def.turn > 0 ? 'right' : 'left' };
      while (i < track.length && PIECES[track[i].pieceIdx].turn !== 0 &&
             (PIECES[track[i].pieceIdx].turn > 0 ? 'right' : 'left') === run.direction) {
        run.pieces.push(track[i]);
        i++;
      }
      cornerRuns.push(run);
    } else {
      i++;
    }
  }

  function getCornerSize(pieceId) {
    if (pieceId === 'roadCornerSmall') return 'Small';
    if (pieceId === 'roadCornerLarge') return 'Large';
    if (pieceId === 'roadCornerLarger') return 'Larger';
    return null;
  }

  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  // Cell footprints: local offsets that outer/inner edges need FREE
  // Defined for a RIGHT turn at heading 0. Left turns mirror x. Heading rotates.
  const EDGE_CELLS = {
    Small: {
      outer: [[-1, 0], [-1, -1], [0, -1]],
      inner: [],
    },
    Large: {
      outer: [[-1, 0], [-1, -1], [0, -2], [1, -2]],
      inner: [[2, 0], [2, -1]],
    },
    Larger: {
      outer: [[-1, 0], [-1, -1], [-1, -2], [0, -3], [1, -3], [2, -3]],
      inner: [[3, 0], [3, -1], [3, -2]],
    },
  };

  // Rotate a local cell offset by heading (90-degree steps)
  function rotateCell(dx, dz, heading) {
    const steps = (((Math.round(heading) % 360) + 360) % 360) / 90;
    let rx = dx, rz = dz;
    for (let s = 0; s < steps; s++) {
      const tmp = rx;
      rx = -rz;
      rz = tmp;
    }
    return [rx, rz];
  }

  // Get world cells an edge needs free
  function getEdgeCheckCells(piece, size, isInner, isLeftTurn) {
    const localCells = isInner ? EDGE_CELLS[size].inner : EDGE_CELLS[size].outer;
    const px = Math.round(piece.worldX);
    const pz = Math.round(piece.worldZ);
    const result = [];
    for (const [dx, dz] of localCells) {
      const mx = isLeftTurn ? -dx : dx;
      const [rx, rz] = rotateCell(mx, dz, piece.heading);
      result.push(`${px + rx},${pz + rz}`);
    }
    return result;
  }

  // Build a lightweight occupied grid for edge placement:
  // Only track centerline + default decorations (NOT bounding boxes, so edges can be adjacent)
  const occupiedCells = new Set();
  for (const tp of track) {
    // Mark the cursor entry position (where the car drives)
    const def2 = PIECES[tp.pieceIdx];
    const entryW = transformPoint(def2.entry.x, def2.entry.z, tp.heading);
    occupiedCells.add(`${Math.round(tp.worldX + entryW.x)},${Math.round(tp.worldZ + entryW.z)}`);
    const exitW = transformPoint(def2.exit.x, def2.exit.z, tp.heading);
    occupiedCells.add(`${Math.round(tp.worldX + exitW.x)},${Math.round(tp.worldZ + exitW.z)}`);
  }
  for (const d of decorations) {
    if (d.mesh) {
      occupiedCells.add(`${Math.round(d.mesh.position.x)},${Math.round(d.mesh.position.z)}`);
    }
  }

  // --- Place corner edges ---
  // For 'mixed', pick style per-run randomly
  const baseStyle = autoDecorParams.style;

  for (const run of cornerRuns) {
    if (rng() > autoDecorParams.cornerEdgeChance) continue;

    // Pick style for this run
    const runStyle = baseStyle === 'mixed'
      ? (rng() > 0.5 ? 'wall+sand' : 'border')
      : baseStyle;

    for (const piece of run.pieces) {
      const def = PIECES[piece.pieceIdx];
      const size = getCornerSize(def.id);
      if (!size) continue;

      const hasInner = (size === 'Large' || size === 'Larger');
      const isLeftTurn = def.turn < 0;

      // Check outer: if the outer cells are free, place edge
      const outerCells = getEdgeCheckCells(piece, size, false, isLeftTurn);
      const outerFree = outerCells.every(c => !occupiedCells.has(c));

      if (outerFree) {
        for (const c of outerCells) occupiedCells.add(c);

        const outerModels = runStyle === 'wall+sand'
          ? [`roadCorner${size}Wall`, `roadCorner${size}Sand`]
          : [`roadCorner${size}Border`];

        for (const modelId of outerModels) {
          try {
            const model = await loadModel(modelId);
            model.position.set(piece.worldX, 0, piece.worldZ);
            model.rotation.y = -piece.heading * DEG;
            if (def.mirror) model.scale.x = -1;
            scene.add(model);
            decorations.push({ id: modelId, x: piece.worldX, z: piece.worldZ, mesh: model });
          } catch(e) {}
        }
      }

      // Check inner (if available for this size)
      if (hasInner) {
        const innerCells = getEdgeCheckCells(piece, size, true, isLeftTurn);
        const innerFree = innerCells.every(c => !occupiedCells.has(c));

        if (innerFree) {
          for (const c of innerCells) occupiedCells.add(c);

          const innerModels = runStyle === 'wall+sand'
            ? [`roadCorner${size}WallInner`, `roadCorner${size}SandInner`]
            : [`roadCorner${size}BorderInner`];

          for (const modelId of innerModels) {
            try {
              const model = await loadModel(modelId);
              model.position.set(piece.worldX, 0, piece.worldZ);
              model.rotation.y = -piece.heading * DEG;
              if (def.mirror) model.scale.x = -1;
              scene.add(model);
              decorations.push({ id: modelId, x: piece.worldX, z: piece.worldZ, mesh: model });
            } catch(e) {}
          }
        }
      }
    }
  }

  // --- Place grandstands ---
  // Rebuild occupied cells using full bounding boxes (includes edges just placed)
  const standOccupied = buildOccupiedCells();
  // Merge any cells added during edge placement
  for (const c of occupiedCells) standOccupied.add(c);

  const standTypes = ['grandStand', 'grandStandCovered', 'grandStandAwning'];
  const cornerStandTypes = ['grandStandRound', 'grandStandCoveredRound'];
  const maxStands = Math.max(1, Math.floor(track.length / autoDecorParams.tracksPerStand));
  let standsPlaced = 0;
  const standRotRad = autoDecorParams.standRotation * Math.PI / 180;

  const straightPieces = track.filter(p => PIECES[p.pieceIdx].turn === 0);
  const cornerPieces = track.filter(p => PIECES[p.pieceIdx].turn !== 0);

  // --- First: place at least 1 corner stand cluster (round stand + flanking straights) ---
  // Find the best corner in the -X/-Z area
  const trackCenterX = track.reduce((s, p) => s + p.worldX, 0) / track.length;
  const trackCenterZ = track.reduce((s, p) => s + p.worldZ, 0) / track.length;

  // Sort corners by distance into -X/-Z quadrant (prefer furthest into that quadrant)
  const sortedCorners = [...cornerPieces].sort((a, b) => {
    const scoreA = (trackCenterX - a.worldX) + (trackCenterZ - a.worldZ);
    const scoreB = (trackCenterX - b.worldX) + (trackCenterZ - b.worldZ);
    return scoreB - scoreA;
  });

  for (const p of sortedCorners) {
    if (standsPlaced >= 3) break; // 1 corner + 2 flanking max for this phase
    const def = PIECES[p.pieceIdx];
    const isLeft = def.turn < 0;

    // Outer direction from the curve
    const localOuterX = isLeft ? 1 : -1;
    const a = -p.heading * DEG;
    const cos = Math.cos(a), sin = Math.sin(a);
    const outerDirX = localOuterX * cos;
    const outerDirZ = -localOuterX * sin;

    // Place corner stand 2 cells out in outer direction
    const cx = Math.round(p.worldX + outerDirX * 2);
    const cz = Math.round(p.worldZ + outerDirZ * 2);
    const cKey = `${cx},${cz}`;
    if (standOccupied.has(cKey)) continue;

    // Place the corner stand
    const cornerStandId = cornerStandTypes[Math.floor(rng() * cornerStandTypes.length)];
    try {
      const model = await loadModel(cornerStandId);
      model.position.set(cx + 0.5, 0, cz);
      model.rotation.y = standRotRad;
      scene.add(model);
      decorations.push({ id: cornerStandId, x: cx, z: cz, mesh: model });
      standOccupied.add(cKey);
      standsPlaced++;
    } catch(e) { continue; }

    // Place flanking stands in an L-shape:
    // Stand 1: same row, adjacent to corner (along track dir)
    // Stand 2: next row, offset (diagonal from stand 1)
    const trackDirX = -outerDirZ; // perpendicular to outer = along track
    const trackDirZ = outerDirX;

    // Stand 1: next to corner along track
    const f1x = Math.round(cx + trackDirX);
    const f1z = Math.round(cz + trackDirZ);
    const f1Key = `${f1x},${f1z}`;
    if (!standOccupied.has(f1Key)) {
      const flankId = standTypes[Math.floor(rng() * standTypes.length)];
      try {
        const flankModel = await loadModel(flankId);
        flankModel.position.set(f1x + 0.5, 0, f1z);
        flankModel.rotation.y = standRotRad;
        scene.add(flankModel);
        decorations.push({ id: flankId, x: f1x + 0.5, z: f1z, mesh: flankModel });
        standOccupied.add(f1Key);
        standsPlaced++;
      } catch(e) {}
    }

    // Stand 2: below corner, offset in outer direction
    const f2x = Math.round(cx - trackDirX);
    const f2z = Math.round(cz - trackDirZ);
    const f2Key = `${f2x},${f2z}`;
    if (!standOccupied.has(f2Key) && standsPlaced < maxStands) {
      const flankId = standTypes[Math.floor(rng() * standTypes.length)];
      try {
        const flankModel = await loadModel(flankId);
        flankModel.position.set(f2x + 0.5, 0, f2z);
        flankModel.rotation.y = standRotRad;
        scene.add(flankModel);
        decorations.push({ id: flankId, x: f2x, z: f2z, mesh: flankModel });
        standOccupied.add(f2Key);
        standsPlaced++;
      } catch(e) {}
    }
    break; // Only place one corner cluster
  }

  // --- Then fill remaining stands on straights ---
  for (const p of straightPieces) {
    if (standsPlaced >= maxStands) break;
    const sx = Math.round(p.worldX) - 2;
    const sz = Math.round(p.worldZ);
    const key = `${sx},${sz}`;
    if (standOccupied.has(key)) continue;

    const standId = standTypes[Math.floor(rng() * standTypes.length)];
    try {
      const model = await loadModel(standId);
      model.position.set(sx + 0.5, 0, p.worldZ);
      model.rotation.y = standRotRad;
      scene.add(model);
      decorations.push({ id: standId, x: sx, z: p.worldZ, mesh: model });
      standOccupied.add(key);
      standsPlaced++;
    } catch(e) {}
  }

  // --- Scatter props around and inside track area ---
  const propsPool = [
    { id: 'lightPostLarge', weight: 2 },
    { id: 'lightPostModern', weight: 2 },
    { id: 'flagCheckers', weight: 1 },
    { id: 'flagRed', weight: 1 },
    { id: 'flagGreen', weight: 1 },
    { id: 'barrierRed', weight: 3 },
    { id: 'barrierWhite', weight: 3 },
    { id: 'fenceStraight', weight: 2 },
    { id: 'rail', weight: 2 },
    { id: 'treeLarge', weight: 4 },
    { id: 'treeSmall', weight: 5 },
    { id: 'tent', weight: 1 },
    { id: 'tent', weight: 1 },
    { id: 'pylon', weight: 3 },
    { id: 'billboardLow', weight: 1 },
  ];
  // Build weighted pool
  const weightedProps = [];
  for (const p of propsPool) {
    for (let w = 0; w < p.weight; w++) weightedProps.push(p.id);
  }

  // Build a set of cells that are 1-2 cells away from the track (adjacent/nearby)
  const trackCells = new Set();
  for (const tp of track) {
    trackCells.add(`${Math.round(tp.worldX)},${Math.round(tp.worldZ)}`);
  }
  const nearbyCells = [];
  const nearbyChecked = new Set();
  for (const tp of track) {
    const cx = Math.round(tp.worldX);
    const cz = Math.round(tp.worldZ);
    // Check cells 1-2 units away in all directions
    for (let dx = -2; dx <= 2; dx++) {
      for (let dz = -2; dz <= 2; dz++) {
        if (dx === 0 && dz === 0) continue;
        const nx = cx + dx;
        const nz = cz + dz;
        const key = `${nx},${nz}`;
        if (nearbyChecked.has(key)) continue;
        nearbyChecked.add(key);
        if (standOccupied.has(key)) continue;
        if (trackCells.has(key)) continue;
        nearbyCells.push({ x: nx, z: nz });
      }
    }
  }

  // Shuffle nearby cells using rng
  for (let i = nearbyCells.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [nearbyCells[i], nearbyCells[j]] = [nearbyCells[j], nearbyCells[i]];
  }

  // Place props in nearby cells (prioritizes spots close to track)
  const propCount = Math.min(nearbyCells.length, Math.floor(track.length * 2.4));
  for (let i = 0; i < propCount; i++) {
    const cell = nearbyCells[i];
    const key = `${cell.x},${cell.z}`;
    if (standOccupied.has(key)) continue;

    const propId = weightedProps[Math.floor(rng() * weightedProps.length)];
    try {
      const model = await loadModel(propId);
      const ox = (rng() - 0.5) * 0.3;
      const oz = (rng() - 0.5) * 0.3;
      model.position.set(cell.x + ox, 0, cell.z + oz);
      if (!propId.startsWith('tent')) model.rotation.y = rng() * Math.PI * 2;
      scene.add(model);
      decorations.push({ id: propId, x: cell.x + ox, z: cell.z + oz, mesh: model });
      standOccupied.add(key);
    } catch(e) {}
  }

  // Update cell debug if visible
  updateCellDebug();
}

// Occupied cell debug visualization
let cellDebugGroup = null;
const cellDebugConfig = { show: false };

// Build the full set of occupied cells (mirrors autoDecorate logic)
// Uses world-space bounding boxes of each piece mesh to mark all covered grid cells
function buildOccupiedCells() {
  const cells = new Set();

  // Track pieces — compute world bounding box and mark all grid cells within
  // Cells are centered at integers: cell N covers (N-0.5) to (N+0.5)
  for (const tp of track) {
    if (!tp.mesh) continue;
    const box = new THREE.Box3().setFromObject(tp.mesh);
    const minX = Math.round(box.min.x + 0.01);
    const maxX = Math.round(box.max.x - 0.01);
    const minZ = Math.round(box.min.z + 0.01);
    const maxZ = Math.round(box.max.z - 0.01);
    for (let x = minX; x <= maxX; x++) {
      for (let z = minZ; z <= maxZ; z++) {
        cells.add(`${x},${z}`);
      }
    }
  }

  // All decorations (default + auto-placed)
  for (const d of decorations) {
    if (d.mesh) {
      const box = new THREE.Box3().setFromObject(d.mesh);
      const minX = Math.round(box.min.x + 0.01);
      const maxX = Math.round(box.max.x - 0.01);
      const minZ = Math.round(box.min.z + 0.01);
      const maxZ = Math.round(box.max.z - 0.01);
      for (let x = minX; x <= maxX; x++) {
        for (let z = minZ; z <= maxZ; z++) {
          cells.add(`${x},${z}`);
        }
      }
    }
  }

  return cells;
}

function updateCellDebug() {
  if (cellDebugGroup) { scene.remove(cellDebugGroup); cellDebugGroup = null; }
  if (!cellDebugConfig.show) return;

  cellDebugGroup = new THREE.Group();
  const geo = new THREE.PlaneGeometry(0.95, 0.95);
  const mat = new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.3, side: THREE.DoubleSide });

  const cells = buildOccupiedCells();

  for (const cell of cells) {
    const [cx, cz] = cell.split(',').map(Number);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = -Math.PI / 2;
    // Cell centered at integer position, covering (cx-0.5) to (cx+0.5)
    mesh.position.set(cx, 0.02, cz);
    cellDebugGroup.add(mesh);
  }
  scene.add(cellDebugGroup);
}

// Check if a grid position is already occupied by a decoration
function isPositionOccupied(x, z) {
  const key = `${x.toFixed(1)},${z.toFixed(1)}`;
  for (const d of decorations) {
    const pos = d.mesh.position;
    if (`${pos.x.toFixed(1)},${pos.z.toFixed(1)}` === key) return true;
  }
  return false;
}

async function placeDecoration(worldPos) {
  if (!selectedDecor) return;
  // Snap to grid
  const snappedX = Math.round(worldPos.x);
  const snappedZ = Math.round(worldPos.z);
  if (isPositionOccupied(snappedX, snappedZ)) return;
  try {
    const model = await loadModel(selectedDecor);
    model.position.set(snappedX, 0, snappedZ);
    scene.add(model);
    decorations.push({ id:selectedDecor, x:snappedX, z:snappedZ, mesh:model });
  } catch(e) {}
}

// RACING
