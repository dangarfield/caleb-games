<style>

  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }

<body>
<a id="backBtn" href="../../index.html">&larr; Games</a>
<canvas id="c"></canvas>
<script>
/* =====================================================================
   JIGSAW — Bonza-style tessellated jigsaw (Netflix "Jigsaw" / bonzaJigsaw)

   RELATIVE ASSEMBLY. There is no board and no tray: there is a pannable,
   zoomable *table*. Pieces are scattered on it, and you drag them
   together. Two pieces join when they come to rest in their true
   relative position — never onto an absolute slot.

   The picture is cut on a tessellated LATTICE, not into classic jigsaw
   pieces. Five lattices ship in the data:

     classic     1 cell  per cluster : a square
     slash       2 cells per cluster : half-square triangles
     diamond     4 cells per cluster : quarter triangles, cluster is 2:1
     skew_left   4 cells per cluster : quarter triangles
     skew_right  4 cells per cluster : quarter triangles

   A *cluster* is one square of the lattice. levels.json gives a
   gridRows x gridCols array of piece ids; all cells sharing an id form
   one piece (a polyomino of lattice cells). Pieces are dealt in
   "portions" (waves of 3-9); the next wave arrives once everything
   already dealt is joined into one blob.

   THE ONE IDEA THAT MAKES THIS WORK
   ---------------------------------
   The lattice tiles the whole infinite plane, and a *legal* translation
   of a piece is one that preserves every cell's `idx` (its shape):

       classic  : any (dr, dc)
       slash    : dc even
       triangle : dc === 2*dr  (mod 4)

   ...and the pixel shift of a legal (dr, dc) is exactly
   (dc * pitch, dr * clusterH), where pitch = clusterW / cellsPerCluster.
   (Validated in Python over all 312 levels.)

   Those legal translations form a subgroup, so a *group* of joined
   pieces is fully described by ONE legal translation (g.dr, g.dc):
     - the plane cell it occupies is simply (r + dr, c + dc)
     - distinct plane cells never overlap, so "does this fit?" is just a
       set test on a Map keyed "R:C"
     - two groups are in correct relative position iff their (dr, dc) are
       EQUAL. So touching + equal offset => join; touching + different
       offset => wrong neighbour => red edge + shake.

   A piece needs NO image crop maths: clip to its polygons and draw the
   whole source image as if the entire picture sat at its group's anchor.
   A whole group is clipped as ONE path, so joined pieces show no seam —
   shared cell edges cancel inside a single clip region.

   Single file, Canvas 2D, no dependencies. The one network call is the
   puzzle picture from the Netflix CDN (deliberate, user-approved); the
   game degrades gracefully when it fails.
   ===================================================================== */

// ---------------------------------------------------------------- canvas
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 1, H = 1, DPR = 1;
let ready = false;
// The render loop idles when nothing is animating (see busy()), so ANY state change
// outside an animation has to ask for one more frame. Missing this is why a zoom
// button used to do nothing until the next touch.
let dirty = true;
function needFrame() { dirty = true; }
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, innerWidth);
  H = Math.max(1, innerHeight);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (ready) { relayout(); draw(); }
}
addEventListener('resize', resize);
addEventListener('orientationchange', resize);

// ---------------------------------------------------------------- theme
const COL = {
  bg0:'#0a0a2e', bg1:'#141452', bg2:'#1a1a6e',
  accent:'#6c5ce7', glow:'#a29bfe', sub:'#a0c4ff',
  gold:'#ffd32a', danger:'#e74c3c', good:'#2ecc71',
  board:'#0d0d33'
};
const TESS_COL = {
  classic:'#6c5ce7', slash:'#00b894', diamond:'#e17055',
  skew_left:'#0984e3', skew_right:'#d63031'
};
const TESS_LABEL = {
  classic:'Squares', slash:'Triangles', diamond:'Diamonds',
  skew_left:'Lean left', skew_right:'Lean right'
};
const MONTHS = ['January','February','March','April','May','June','July',
                'August','September','October','November','December'];

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
function easeInOut(t) { return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2; }
// deterministic per-cell noise: the backdrop must not shimmer while panning
function hash2(a, b) {
  let h = (a * 374761393 + b * 668265263) | 0;
  h = (h ^ (h >>> 13)) | 0;
  h = (h * 1274126177) | 0;
  h = (h ^ (h >>> 16)) | 0;
  return (h >>> 0) / 4294967296;
}

// ---------------------------------------------------------------- audio
let audioCtx = null;
function ensureAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) { audioCtx = null; }
  return audioCtx;
}
function tone(freq, dur, type, vol, endFreq, delay) {
  const ac = ensureAudio(); if (!ac) return;
  const t0 = ac.currentTime + (delay || 0);
  const osc = ac.createOscillator(), gain = ac.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  if (endFreq) osc.frequency.exponentialRampToValueAtTime(Math.max(endFreq, 20), t0 + dur);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(vol || 0.1, t0 + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain); gain.connect(ac.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
function noise(dur, vol, freq, delay) {
  const ac = ensureAudio(); if (!ac) return;
  const t0 = ac.currentTime + (delay || 0);
  const len = Math.max(1, Math.floor(ac.sampleRate * dur));
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource(); src.buffer = buf;
  const gain = ac.createGain();
  gain.gain.setValueAtTime(vol || 0.06, t0);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  const filt = ac.createBiquadFilter();
  filt.type = 'bandpass'; filt.frequency.value = freq || 900; filt.Q.value = 1.1;
  src.connect(filt); filt.connect(gain); gain.connect(ac.destination);
  src.start(t0); src.stop(t0 + dur + 0.02);
}
const sfx = {
  lift() { tone(320, 0.07, 'sine', 0.05, 480); },
  place() { noise(0.035, 0.035, 700); tone(150, 0.06, 'sine', 0.04, 100); },
  // the "it fits" click: short wood knock + a bright chime on top
  join(n) {
    noise(0.05, 0.07, 1500);
    const scale = [523, 587, 659, 784, 880, 988, 1046];
    tone(scale[Math.min(scale.length - 1, n || 0)], 0.16, 'triangle', 0.09);
    tone(180, 0.09, 'sine', 0.07, 90);
  },
  nope() { tone(200, 0.13, 'sawtooth', 0.05, 130); noise(0.07, 0.04, 400); },
  wave() {
    [523, 659, 784].forEach((f, i) => tone(f, 0.2, 'sine', 0.06, null, i * 0.07));
    noise(0.25, 0.03, 600);
  },
  win() {
    [523, 659, 784, 1046, 1318].forEach((f, i) =>
      tone(f, 0.42, 'triangle', 0.09, null, i * 0.13));
  },
  tap() { tone(600, 0.05, 'sine', 0.045); }
};

// ---------------------------------------------------------------- storage
function loadArcadeData() {
  try { return JSON.parse(localStorage.getItem('calebArcadeData')) || {}; }
  catch (e) { return {}; }
}
function saveArcadeData(d) {
  try { localStorage.setItem('calebArcadeData', JSON.stringify(d)); }
  catch (e) { /* private mode */ }
}
const pdCache = {};
function gameData() {
  const d = loadArcadeData();
  if (!d.jigsaw) d.jigsaw = {};
  return d;
}
function getPlayerData(name) {
  if (!name) return { solved:{} };
  if (pdCache[name]) return pdCache[name];
  const d = gameData();
  if (!d.jigsaw[name] || typeof d.jigsaw[name] !== 'object') d.jigsaw[name] = { solved:{} };
  if (!d.jigsaw[name].solved) d.jigsaw[name].solved = {};
  saveArcadeData(d);
  pdCache[name] = d.jigsaw[name];
  return pdCache[name];
}
function markSolved(name, id) {
  if (!name) return;
  const pd = getPlayerData(name);
  if (pd.solved[id]) return;
  pd.solved[id] = 1;
  const d = gameData();
  d.jigsaw[name] = pd;
  saveArcadeData(d);
  solvedCountCache = {};
}
let solvedCountCache = {};
function totalSolved(name) {
  if (!name) return 0;
  if (solvedCountCache[name] != null) return solvedCountCache[name];
  const pd = getPlayerData(name);
  let n = 0;
  for (const k in pd.solved) if (pd.solved[k]) n++;
  return (solvedCountCache[name] = n);
}
function getPref(key, dflt) {
  const d = gameData();
  return d.jigsaw[key] === undefined ? dflt : d.jigsaw[key];
}
function setPref(key, val) {
  const d = gameData();
  d.jigsaw[key] = val;
  saveArcadeData(d);
}

// ---------------------------------------------------------------- levels
let LEVELS = [], levelsLoaded = false, levelsError = '';

// A bare relative fetch('levels.json') breaks when the page is served WITHOUT a
// trailing slash (/games/jigsaw): the browser treats "jigsaw" as the document
// name and the request escapes to /games/levels.json. Try the dir-relative form
// FIRST so the common cases never even log a failed request.
function levelsUrls() {
  const out = [];
  let p = '';
  try { p = (location && location.pathname) || ''; } catch (e) {}
  if (p && !p.endsWith('/') && !/\.html?$/i.test(p)) out.push(p.replace(/\/+$/, '') + '/levels.json');
  try { out.push(new URL('levels.json', document.baseURI).href); } catch (e) {}
  out.push('levels.json');
  const dir = p.replace(/[^/]*$/, '');
  if (dir) out.push(dir + 'jigsaw/levels.json');
  return out.filter((u, i) => out.indexOf(u) === i);
}
async function loadLevels() {
  let lastErr = null;
  for (const url of levelsUrls()) {
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (Array.isArray(data) && data.length) { LEVELS = data; break; }
      throw new Error('empty level list');
    } catch (e) { lastErr = e; }
  }
  levelsLoaded = true;
  if (!LEVELS.length) {
    levelsError = 'Puzzle list unavailable — needs a web server.';
    console.warn('levels.json unavailable:', lastErr && lastErr.message);
  } else {
    buildSections();
  }
  draw();
}

// 312 dailies in one flat grid is a wall of tiles, so they are chunked into
// month sections (the data is already in date order).
let SECTIONS = [];
function buildSections() {
  SECTIONS = [];
  let cur = null;
  for (let i = 0; i < LEVELS.length; i++) {
    const lv = LEVELS[i];
    const parts = String(lv.date || '').split('-');
    const key = parts[0] + '-' + parts[1];
    const label = (MONTHS[(+parts[1] || 1) - 1] || '') + ' ' + parts[0];
    if (!cur || cur.key !== key) { cur = { key, label, idx:[] }; SECTIONS.push(cur); }
    cur.idx.push(i);
    lv._day = +parts[2] || 0;
  }
}

// ---------------------------------------------------------- lattice geometry
const TILE = 40;
// level-scoped lattice constants, set by buildLevel
let cwU = TILE, chU = TILE, pitchU = TILE, cpc = 1, TRI = false, STEP = 1;

function isTri(t) { return t === 'diamond' || t === 'skew_left' || t === 'skew_right'; }

// idx of a cell anywhere on the INFINITE plane (negatives included)
function planeIdx(R, C) {
  if (cpc === 1) return 0;
  if (TRI && (R & 1)) return (((C + 2) % 4) + 4) % 4;
  return ((C % cpc) + cpc) % cpc;
}
// Cluster origin. Odd rows of the triangle family are staggered: the model
// offset is 2 cells, the render offset half a cluster.
function clusterOriginX(R, C) {
  if (TRI && (R & 1)) return Math.floor((C - 2) / cpc) * cwU + cwU / 2;
  return Math.floor(C / cpc) * cwU;
}
// Cell polygon in world units (flat [x,y,x,y,...]). Valid for any integers.
function planeCellPoly(R, C) {
  const ox = clusterOriginX(R, C), oy = R * chU, idx = planeIdx(R, C);
  let v;
  if (cpc === 1) {
    v = [0,0, cwU,0, cwU,chU, 0,chU];
  } else if (cpc === 2) {
    v = idx === 0 ? [0,0, cwU,0, 0,chU] : [0,chU, cwU,0, cwU,chU];
  } else {
    const h = cwU / 2;
    v = idx === 0 ? [0,0, h,0, 0,chU]           // top-left
      : idx === 1 ? [0,chU, h,0, h,chU]         // bottom-right
      : idx === 2 ? [h,0, cwU,chU, h,chU]       // bottom-left
      :             [h,0, cwU,0, cwU,chU];      // top-right
  }
  const out = new Array(v.length);
  for (let i = 0; i < v.length; i += 2) { out[i] = ox + v[i]; out[i+1] = oy + v[i+1]; }
  return out;
}
// Lattice neighbours (transcribed from the bundle, symmetric closure verified).
function nbrsOf(R, C) {
  if (cpc === 1) return [R-1,C, R,C+1, R+1,C, R,C-1];
  const i = planeIdx(R, C);
  if (cpc === 2) {
    return i === 0 ? [R-1,C+1, R,C+1, R,C-1]
                   : [R,C-1, R,C+1, R+1,C-1];
  }
  if (i === 0) return [R-1,C, R,C+1, R,C-1];
  if (i === 1) return [R,C-1, R,C+1, R+1,C];
  if (i === 2) return [R,C+1, R+1,C, R,C-1];
  return [R-1,C, R,C+1, R,C-1];
}
// The one edge two lattice neighbours share. Every vertex is an integer in world
// units for all five tessellations, so exact comparison is safe.
function sharedSeg(a, b) {
  for (let i = 0; i < a.length; i += 2) {
    const ax = a[i], ay = a[i+1];
    const bx = a[(i+2) % a.length], by = a[(i+3) % a.length];
    for (let j = 0; j < b.length; j += 2) {
      const cx = b[j], cy = b[j+1];
      const dx = b[(j+2) % b.length], dy = b[(j+3) % b.length];
      if ((ax === cx && ay === cy && bx === dx && by === dy) ||
          (ax === dx && ay === dy && bx === cx && by === cy)) return [ax, ay, bx, by];
    }
  }
  return null;
}
// Boundary of a set of cell polygons: every edge used exactly once.
function boundaryEdges(polys) {
  const seen = new Map();
  for (const poly of polys) {
    for (let i = 0; i < poly.length; i += 2) {
      const ax = poly[i], ay = poly[i+1];
      const bx = poly[(i+2) % poly.length], by = poly[(i+3) % poly.length];
      const k = (ax < bx || (ax === bx && ay < by))
        ? ax+'_'+ay+'_'+bx+'_'+by : bx+'_'+by+'_'+ax+'_'+ay;
      const e = seen.get(k);
      if (e) e.n++; else seen.set(k, { n:1, s:[ax,ay,bx,by] });
    }
  }
  const out = [];
  seen.forEach(e => { if (e.n === 1) out.push(e.s); });
  return out;
}
function bboxOf(polys) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const poly of polys) for (let i = 0; i < poly.length; i += 2) {
    if (poly[i] < x0) x0 = poly[i];
    if (poly[i] > x1) x1 = poly[i];
    if (poly[i+1] < y0) y0 = poly[i+1];
    if (poly[i+1] > y1) y1 = poly[i+1];
  }
  return { x0, y0, w: x1 - x0, h: y1 - y0 };
}
// A translation is legal only if it preserves every cell's idx (its shape).
function legalDelta(dr, dc) {
  if (STEP === 1) return true;
  if (STEP === 2) return (((dc % 2) + 2) % 2) === 0;
  return ((((dc - 2 * dr) % 4) + 4) % 4) === 0;
}
function nearestLegalDc(dr, want) {
  if (STEP === 1) return Math.round(want);
  const res = STEP === 4 ? (((2 * dr) % 4) + 4) % 4 : 0;
  return res + STEP * Math.round((want - res) / STEP);
}

// ------------------------------------------------------------ level build
let level = null;         // the raw record
let pieces = [];          // all pieces, build order
let pieceById = new Map();
let groups = [];          // live groups on the table
let occ = new Map();      // "R:C" -> group occupying that plane cell
let boardU = 0;           // unscaled picture width/height (square)
let gidSeq = 1;

function buildLevel(lv) {
  level = lv;
  cwU = lv.tessellation === 'diamond' ? TILE * 2 : TILE;
  chU = TILE;
  cpc = lv.cellsPerCluster;
  TRI = isTri(lv.tessellation);
  pitchU = cwU / cpc;
  STEP = cpc === 1 ? 1 : cpc === 2 ? 2 : 4;
  boardU = lv.size * TILE;

  const byId = new Map();
  for (let r = 0; r < lv.gridRows; r++) {
    const row = lv.grid[r];
    for (let c = 0; c < lv.gridCols; c++) {
      const id = row[c];
      let p = byId.get(id);
      if (!p) { p = { id, cells:[], polys:[] }; byId.set(id, p); }
      p.cells.push(r, c);
      p.polys.push(planeCellPoly(r, c));
    }
  }
  pieces = [];
  pieceById = byId;
  byId.forEach(p => {
    p.edges = boundaryEdges(p.polys);
    const b = bboxOf(p.polys);
    p.bx0 = b.x0; p.by0 = b.y0; p.bw = b.w; p.bh = b.h;
    p.wave = -1;
    p.group = null;
    pieces.push(p);
  });
  for (let i = 0; i < lv.portions.length; i++)
    for (const id of lv.portions[i]) { const p = byId.get(id); if (p) p.wave = i; }

  groups = [];
  occ = new Map();
  gidSeq = 1;
  badEdges = [];
  dealtCount = 0;
}

// ------------------------------------------------------------------- groups
function makeGroup(list, dr, dc) {
  const g = { gid: gidSeq++, pieces: list.slice(), dr, dc, ax:0, ay:0,
              tw:null, shake:0, pop:0, flash:0,
              cache:null, bakedFor:0, cacheS:0, cacheW:0, cacheH:0 };
  refreshGroup(g);
  for (const p of list) p.group = g;
  return g;
}
function refreshGroup(g) {
  const cells = [], polys = [];
  for (const p of g.pieces) {
    for (let i = 0; i < p.cells.length; i++) cells.push(p.cells[i]);
    for (const poly of p.polys) polys.push(poly);
  }
  g.cells = cells;
  g.polys = polys;          // clipped as ONE path so joins have no seam
  g.edges = boundaryEdges(polys);
  const b = bboxOf(polys);
  g.bx0 = b.x0; g.by0 = b.y0; g.bw = b.w; g.bh = b.h;
  g.bakedFor = 0;
}
function cellKey(R, C) { return R + ':' + C; }
function occAdd(g) {
  for (let i = 0; i < g.cells.length; i += 2)
    occ.set(cellKey(g.cells[i] + g.dr, g.cells[i+1] + g.dc), g);
}
function occDel(g) {
  for (let i = 0; i < g.cells.length; i += 2) {
    const k = cellKey(g.cells[i] + g.dr, g.cells[i+1] + g.dc);
    if (occ.get(k) === g) occ.delete(k);
  }
}
// world anchor of a group (where the whole picture's origin sits for it)
function gAnchorX(g) { return g.dc * pitchU + g.ax; }
function gAnchorY(g) { return g.dr * chU + g.ay; }
function groupBox(g) {
  const gx = gAnchorX(g), gy = gAnchorY(g);
  return { x0: gx + g.bx0, y0: gy + g.by0,
           x1: gx + g.bx0 + g.bw, y1: gy + g.by0 + g.bh };
}
function contentBounds() {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const g of groups) {
    const b = groupBox(g);
    if (b.x0 < x0) x0 = b.x0; if (b.y0 < y0) y0 = b.y0;
    if (b.x1 > x1) x1 = b.x1; if (b.y1 > y1) y1 = b.y1;
  }
  if (!isFinite(x0)) return { x0:0, y0:0, x1:boardU, y1:boardU };
  return { x0, y0, x1, y1 };
}
function assemblySize() {
  let m = 0;
  for (const g of groups) if (g.pieces.length > m) m = g.pieces.length;
  return m;
}

// Does g fit at (dr, dc)? Distinct plane cells never overlap geometrically, so
// this is a pure set test.
function groupFitsAt(g, dr, dc) {
  const cells = g.cells;
  for (let i = 0; i < cells.length; i += 2) {
    const o = occ.get(cellKey(cells[i] + dr, cells[i+1] + dc));
    if (o && o !== g) return false;
  }
  return true;

  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = COL.gold;
  ctx.font = 'bold ' + titleSize + 'px "Segoe UI",system-ui,sans-serif';
  ctx.fillText(title, W/2, titleY);
  ctx.fillStyle = COL.sub;
  ctx.font = subSize + 'px "Segoe UI",system-ui,sans-serif';
  const BACK_R = 122, BACK_B = 47;
  if (short && subY - subSize < BACK_B && W/2 - ctx.measureText(sub).width/2 < BACK_R)
    subY = BACK_B + subSize + 2;
  ctx.fillText(sub, W/2, subY);
  pill(W - 112, short ? 6 : 12, 100, 42, backLabel, false, backAction, list);
  return { top: subY + (short ? 10 : 16), bottom: H - 12 };
}
function scrollFor(key, contentH, availH) {
  selMax[key] = Math.max(0, contentH - availH);
  selScroll[key] = clamp(selScroll[key], 0, selMax[key]);
  return selScroll[key];
}
function pushClipped(list, box, top, bot) {
  const y0 = Math.max(box.y, top), y1 = Math.min(box.y + box.h, bot);
  if (y1 - y0 < 14) return;
  list.push(Object.assign({}, box, { y:y0, h:y1 - y0 }));
}
function drawScrollHint(top, bot, scroll, max) {
  if (max <= 0.5) return;
  const trackH = bot - top, x = W - 8;
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  roundRect(x, top, 4, trackH, 2); ctx.fill();
  const thumbH = Math.max(28, trackH * trackH / (trackH + max));
  ctx.fillStyle = 'rgba(162,155,254,0.6)';
  roundRect(x, top + (trackH - thumbH) * (scroll / max), 4, thumbH, 2); ctx.fill();
  if (scroll > 1) {
    const g = ctx.createLinearGradient(0, top, 0, top + 22);
    g.addColorStop(0, 'rgba(10,10,46,0.9)'); g.addColorStop(1, 'rgba(10,10,46,0)');
    ctx.fillStyle = g; ctx.fillRect(0, top, W, 22);
  }
  if (scroll < max - 1) {
    const g = ctx.createLinearGradient(0, bot - 22, 0, bot);
    g.addColorStop(0, 'rgba(10,10,46,0)'); g.addColorStop(1, 'rgba(10,10,46,0.9)');
    ctx.fillStyle = g; ctx.fillRect(0, bot - 22, W, 22);

}
function drawLevelSelect() {
  hitboxes.levels = [];
  const pd = getPlayerData(player);
  const { top, bottom } = selectChrome(player || 'Puzzles',
    totalSolved(player) + ' / ' + LEVELS.length + ' pictures done',
    'Players', 'menu', hitboxes.levels);
  const gap = 8, availW = W - 24, availH = bottom - top;
  const cols = Math.max(4, Math.min(10, Math.floor((availW + gap) / (62 + gap))));
  const bs = Math.max(44, Math.min(76, Math.floor((availW - (cols-1)*gap) / cols)));
  const headH = 30;
  const rowsOf = [];
  let contentH = 0;
  for (const sec of SECTIONS) {
    const rows = Math.ceil(sec.idx.length / cols);
    rowsOf.push({ sec, rows, y: contentH });
    contentH += headH + rows * bs + (rows - 1) * gap + 14;
  }
  if (pendingScrollTo >= 0) {
    let target = 0;
    for (const rw of rowsOf) {
      const k = rw.sec.idx.indexOf(pendingScrollTo);
      if (k >= 0) { target = rw.y + headH + Math.floor(k / cols) * (bs + gap); break; }
    }
    selScroll.levels = Math.max(0, target - availH / 2);
    pendingScrollTo = -1;
  }
  const scroll = scrollFor('levels', contentH, availH);
  const sx = (W - (cols * bs + (cols-1) * gap)) / 2;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, top, W, availH); ctx.clip();
  for (const rw of rowsOf) {
    const ry = top + rw.y - scroll;
    if (ry > bottom || ry + headH + rw.rows * (bs + gap) < top) continue;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = 'bold 14px "Segoe UI",system-ui,sans-serif';
    ctx.fillText(rw.sec.label, sx, ry + headH/2 + 2);
    for (let k = 0; k < rw.sec.idx.length; k++) {
      const gi = rw.sec.idx[k], lv = LEVELS[gi];
      const x = sx + (k % cols) * (bs + gap);
      const y = ry + headH + Math.floor(k / cols) * (bs + gap);
      if (y > bottom || y + bs < top) continue;
      const solved = !!pd.solved[lv.id];
      const base = TESS_COL[lv.tessellation] || COL.accent;
      ctx.fillStyle = solved ? base : 'rgba(255,255,255,0.08)';
      roundRect(x, y, bs, bs, 11); ctx.fill();
      ctx.strokeStyle = solved ? COL.gold : base;
      ctx.lineWidth = solved ? 2 : 1.4;
      roundRect(x, y, bs, bs, 11); ctx.stroke();
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#fff';
      ctx.font = 'bold ' + Math.floor(bs * 0.36) + 'px "Segoe UI",system-ui,sans-serif';
      ctx.fillText(lv._day, x + bs/2, y + bs * 0.47);
      ctx.font = Math.floor(bs * 0.2) + 'px "Segoe UI",system-ui,sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.62)';
      ctx.fillText(lv.pieceCount + ' pc', x + bs/2, y + bs * 0.76);
      if (solved) {
        ctx.fillStyle = COL.gold;
        ctx.font = 'bold ' + Math.floor(bs * 0.24) + 'px "Segoe UI",system-ui,sans-serif';
        ctx.fillText('✓', x + bs - bs * 0.18, y + bs * 0.26);
      }
      pushClipped(hitboxes.levels, { x, y, w:bs, h:bs, action:'level', idx:gi }, top, bottom);
    }
  }
  ctx.restore();
  drawScrollHint(top, bottom, scroll, selMax.levels);
}
function drawLoading(now) {
  const lv = LEVELS[levelIdx];
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#fff'; ctx.font = 'bold 22px "Segoe UI",system-ui,sans-serif';
  ctx.fillText(lv ? (lv.title || 'Puzzle') : 'Puzzle', W/2, H/2 - 44);
  ctx.fillStyle = COL.sub; ctx.font = '15px "Segoe UI",system-ui,sans-serif';
  ctx.fillText('Getting the picture…', W/2, H/2 - 18);
  const r = 20, cx = W/2, cy = H/2 + 28;
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(now / 260);
  ctx.strokeStyle = COL.glow; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 1.35); ctx.stroke();
  ctx.restore();
}
function drawImgError() {
  hitboxes.err = [];
  const lv = LEVELS[levelIdx];
  const bw = Math.min(340, W - 40), bx = (W - bw)/2;
  const bhh = 226, by = Math.max(60, (H - bhh)/2);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  roundRect(bx, by, bw, bhh, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(231,76,60,0.55)'; ctx.lineWidth = 2;
  roundRect(bx, by, bw, bhh, 16); ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = '34px "Segoe UI",system-ui,sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText('🧩', W/2, by + 48);
  ctx.fillStyle = COL.danger; ctx.font = 'bold 18px "Segoe UI",system-ui,sans-serif';
  ctx.fillText('Picture not available', W/2, by + 82);
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.font = '14px "Segoe UI",system-ui,sans-serif';
  ctx.fillText('This puzzle needs the internet to', W/2, by + 108);
  ctx.fillText('download its picture.', W/2, by + 128);
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = '11px "Segoe UI",system-ui,sans-serif';
  ctx.fillText(String(loadErrMsg).slice(0, 46), W/2, by + 148);
  const pw = bw - 48;
  pill(bx + 24, by + 164, pw, 44, 'Try Again', true, 'retry', hitboxes.err,
       'bold 17px "Segoe UI",system-ui,sans-serif');
  pill(W - 112, H < 520 ? 6 : 12, 100, 42, 'Levels', false, 'levels', hitboxes.err);
  if (lv) {
    ctx.fillStyle = COL.sub; ctx.font = '13px "Segoe UI",system-ui,sans-serif';
    ctx.fillText(lv.title || '', W/2, by - 14);
  }
}
function drawToast() {
  if (!toast) return;
  const age = performance.now() - toast.t0;
  const a = age < 200 ? age/200 : age > 1500 ? Math.max(0, 1 - (age-1500)/400) : 1;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.font = 'bold 14px "Segoe UI",system-ui,sans-serif';
  const tw = ctx.measureText(toast.msg).width, w = tw + 32, h = 36;
  const x = (W - w)/2, y = Math.max(70, H * 0.22);
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  roundRect(x, y, w, h, 18); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(toast.msg, W/2, y + h/2);
  ctx.restore();
}

function draw() {
  const now = performance.now();
  drawBackground();
  if (view === 'menu') { drawMenu(now); drawToast(); return; }
  if (view === 'levels') { drawLevelSelect(); drawToast(); return; }
  if (view === 'loading') { drawLoading(now); drawToast(); return; }
  if (view === 'imgError') { drawImgError(); drawToast(); return; }
  if (!level) return;
  drawTable(now);
  if (view !== 'won') drawHud(now);
  drawConfetti();
  if (view === 'won') drawWin(now);
  drawToast();
}

// ------------------------------------------------------------------- input
function inBox(b, x, y) { return b && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; }
function ptInPoly(poly, x, y) {
  let inside = false;
  for (let i = 0, j = poly.length - 2; i < poly.length; j = i, i += 2) {
    const xi = poly[i], yi = poly[i+1], xj = poly[j], yj = poly[j+1];
    if (((yi > y) !== (yj > y)) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
// Groups never overlap geometrically, so an exact polygon test is unambiguous;
// a padded pass afterwards keeps slivers grabbable on a touch screen.
function hitGroup(sx, sy) {
  const wx = s2wx(sx), wy = s2wy(sy);
  for (const g of groups) {
    const lx = wx - gAnchorX(g), ly = wy - gAnchorY(g);
    if (lx < g.bx0 || ly < g.by0 || lx > g.bx0 + g.bw || ly > g.by0 + g.bh) continue;
    for (const p of g.pieces) {
      if (lx < p.bx0 || ly < p.by0 || lx > p.bx0 + p.bw || ly > p.by0 + p.bh) continue;
      for (const poly of p.polys) if (ptInPoly(poly, lx, ly)) return g;
    }
  }
  const pad = 12 / cam.s;
  let best = null, bestD = Infinity;
  for (const g of groups) {
    const lx = wx - gAnchorX(g), ly = wy - gAnchorY(g);
    if (lx < g.bx0 - pad || ly < g.by0 - pad ||
        lx > g.bx0 + g.bw + pad || ly > g.by0 + g.bh + pad) continue;
    const d = Math.hypot(lx - (g.bx0 + g.bw/2), ly - (g.by0 + g.bh/2));
    if (d < bestD) { bestD = d; best = g; }
  }
  return best;
}
const ptrs = new Map();
let gesture = null;
let selDrag = null;
const SCROLL_SLOP = 8;

function startPinch() {
  const ids = Array.from(ptrs.keys());
  if (ids.length < 2) return;
  const a = ptrs.get(ids[0]), b = ptrs.get(ids[1]);
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  gesture = { type:'pinch', a:ids[0], b:ids[1],
              d0: Math.max(12, Math.hypot(a.x - b.x, a.y - b.y)),
              s0: cam.s, wx: s2wx(mx), wy: s2wy(my) };
  camTween = null;
}
function endGroupDrag(revert) {
  const g = gesture.g;
  if (revert) { tweenSettle(g, 200); recomputeBadEdges(); }
  else dropGroup(g);
  gesture = null;
}

function onDown(x, y, e) {
  ensureAudio();
  if (view === 'menu') {
    for (const b of hitboxes.menu) if (inBox(b, x, y)) {
      player = b.player;
      setPref('lastPlayer', b.player);
      sfx.tap();
      selScroll.levels = 0;
      showLevels();
      return;
    }
    return;
  }
  if (view === 'levels') { selDrag = { y0:y, s0:selScroll.levels, moved:false }; return; }
  if (view === 'imgError') {
    for (const b of hitboxes.err) if (inBox(b, x, y)) {
      sfx.tap();
      if (b.action === 'retry') { imgCache.delete(LEVELS[levelIdx].imageUrl); startLevel(levelIdx); }
      else showLevels();
      return;
    }
    return;
  }
  if (view === 'loading') return;
  if (view === 'won') {
    for (const b of hitboxes.win) if (inBox(b, x, y)) {
      sfx.tap();
      if (b.action === 'next') { const n = nextLevelIdx(); if (n >= 0) startLevel(n); else showLevels(); }
      else showLevels();
      return;
    }
    return;
  }
  // playing
  if (ptrs.size >= 2) {
    if (gesture && gesture.type === 'group') endGroupDrag(true);
    startPinch();
    return;
  }
  for (const b of hitboxes.play) if (inBox(b, x, y)) {
    sfx.tap();
    if (b.action === 'levels') showLevels();
    else if (b.action === 'fit') fitAll(420);
    else if (b.action === 'zoomin') zoomBy(1.35, null, null, 200);
    else if (b.action === 'zoomout') zoomBy(1 / 1.35, null, null, 200);
    return;
  }
  const g = hitGroup(x, y);
  if (g) {
    g.tw = null; g.shake = 0;
    const lift = (e && e.pointerType === 'touch') ? 18 / cam.s : 0;
    gesture = { type:'group', g, id: e ? e.pointerId : 0,
                wx0: s2wx(x), wy0: s2wy(y),
                ax0: g.ax, ay0: g.ay, lift, moved:false };
    g.ay -= lift;   // held pieces ride above the finger; the drop uses this too
    // topmost while held
    const gi = groups.indexOf(g);
    if (gi >= 0) { groups.splice(gi, 1); groups.push(g); }
    sfx.lift();
    return;
  }
  gesture = { type:'pan', id: e ? e.pointerId : 0, sx:x, sy:y, cx0:cam.x, cy0:cam.y };
  camTween = null;
}
function onMove(x, y) {
  if (selDrag) {
    const dy = y - selDrag.y0;
    if (!selDrag.moved) { if (Math.abs(dy) < SCROLL_SLOP) return; selDrag.moved = true; }
    selScroll.levels = clamp(selDrag.s0 - dy, 0, selMax.levels);
    draw();
    return;
  }
  if (!gesture) return;
  if (gesture.type === 'pinch') {
    const a = ptrs.get(gesture.a), b = ptrs.get(gesture.b);
    if (!a || !b) return;
    const d = Math.max(12, Math.hypot(a.x - b.x, a.y - b.y));
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    cam.s = clamp(gesture.s0 * (d / gesture.d0), sMin, sMax);
    cam.x = gesture.wx - (mx - vcx()) / cam.s;
    cam.y = gesture.wy - (my - vcy()) / cam.s;
    clampCam();
    return;
  }
  if (gesture.type === 'pan') {
    cam.x = gesture.cx0 - (x - gesture.sx) / cam.s;
    cam.y = gesture.cy0 - (y - gesture.sy) / cam.s;
    clampCam();
    return;
  }
  const g = gesture.g;
  gesture.moved = true;
  g.ax = gesture.ax0 + (s2wx(x) - gesture.wx0);
  g.ay = gesture.ay0 + (s2wy(y) - gesture.wy0) - gesture.lift;
}
function onUp(x, y) {
  if (selDrag) {
    const d = selDrag; selDrag = null;
    if (d.moved) return;
    for (const b of hitboxes.levels) if (inBox(b, x, y)) {
      sfx.tap();
      if (b.action === 'menu') { view = 'menu'; draw(); }
      else if (b.action === 'level') startLevel(b.idx);
      return;
    }
    return;
  }
  if (!gesture) return;
  if (gesture.type === 'group') { endGroupDrag(false); return; }
  gesture = null;
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  needFrame();
  ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (selDrag) return;
  if (gesture && gesture.type !== 'group' && ptrs.size < 2) return;
  onDown(e.clientX, e.clientY, e);
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId);
  if (p) { p.x = e.clientX; p.y = e.clientY; }
  needFrame();
  if (!gesture && !selDrag) return;
  if (gesture && gesture.type === 'pinch') {
    if (e.pointerId !== gesture.a && e.pointerId !== gesture.b) return;
  } else if (gesture && gesture.id != null && e.pointerId !== gesture.id) return;
  e.preventDefault();
  onMove(e.clientX, e.clientY);
});
function releasePtr(e, cancelled) {
  ptrs.delete(e.pointerId);
  if (selDrag) { if (cancelled) selDrag = null; else onUp(e.clientX, e.clientY); return; }
  if (!gesture) return;
  if (gesture.type === 'pinch') {
    if (e.pointerId === gesture.a || e.pointerId === gesture.b) gesture = null;
    return;
  }
  if (gesture.id != null && e.pointerId !== gesture.id) return;
  if (cancelled && gesture.type === 'group') endGroupDrag(true);
  else onUp(e.clientX, e.clientY);
}
canvas.addEventListener('pointerup', e => { e.preventDefault(); needFrame(); releasePtr(e, false); });
canvas.addEventListener('pointercancel', e => { needFrame(); releasePtr(e, true); });
canvas.addEventListener('wheel', e => {
  if (view === 'levels') {
    if (!selMax.levels) return;
    e.preventDefault();
    selScroll.levels = clamp(selScroll.levels + e.deltaY, 0, selMax.levels);
    needFrame();
    return;
  }
  if (view !== 'playing') return;
  e.preventDefault();
  zoomBy(Math.exp(-e.deltaY * 0.0018), e.clientX, e.clientY);
  needFrame();
}, { passive:false });
canvas.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (view === 'playing') {
    if (e.key === '+' || e.key === '=') zoomBy(1.35, null, null, 200);
    else if (e.key === '-' || e.key === '_') zoomBy(1 / 1.35, null, null, 200);
    else if (e.key === 'f' || e.key === 'F') fitAll(420);
  }
  if (e.key === 'Escape' && (view === 'playing' || view === 'won' || view === 'imgError')) showLevels();
});

// ---------------------------------------------------------------- main loop
function busy() {
  if (view === 'loading') return true;
  if (view === 'menu' || view === 'levels' || view === 'imgError') return false;
  if (gesture || camTween || confetti.length || pendingDeal || pendingWin) return true;
  if (badEdges.length) return true;
  if (toast) return true;
  if (view === 'won') return true;
  for (const g of groups)
    if (g.tw || g.shake || g.flash || (g.pop && performance.now() - g.pop < 320)) return true;
  return false;
}
function loop() {
  const now = performance.now();
  if (view === 'playing' || view === 'won') stepAnims(now);
  else if (toast || confetti.length) stepAnims(now);
  if (busy() || dirty) { dirty = false; draw(); }
  requestAnimationFrame(loop);
}

// -------------------------------------------------------------------- boot
const lastP = getPref('lastPlayer', null);
if (lastP === 'Caleb' || lastP === 'Ezra') player = lastP;
ready = true;
resize();
loadLevels();
draw();
loop();

// ------------------------------------------------------------- debug handles
// Everything above is a top-level declaration in a classic script, so it already
// lives in the global lexical environment and a test harness can reach it by
// name. This is only the small bit of sugar worth naming.
window.__jig = {
  state: () => ({ view, levelIdx, waveIdx, groups: groups.length,
                  assembly: assemblySize(), pieces: level ? level.pieceCount : 0,
                  dealt: dealtCount, bad: badEdges.length, s: cam.s,
                  tess: level ? level.tessellation : null }),
  levels: () => LEVELS,
  setPlayer: n => { player = n; },
  start: i => startLevel(i)
};
</script>
