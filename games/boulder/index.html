<script>
// Directory URL guard: /games/boulder -> /games/boulder/ so js/, sfx/ and assets/ resolve.
if (!/\/$|\.html$/.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);
</script>

<script data-arcade-back>
/* arcade-back v1 (knowledge/arcade-back.md). "← Games" = the browser's back button.
   Any link whose href is exactly ../../index.html goes BACK in history when this page was opened
   from the arcade home, so home comes back as it was left (scroll position, no reload).
   Opened any other way (bookmark, direct URL, dev tool), the link just navigates as normal. */
(function () {
  document.addEventListener('click', function (e) {
    if (e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (!a || a.getAttribute('href') !== '../../index.html') return;
    var home = new URL(a.href), ref;
    try { ref = new URL(document.referrer); } catch (err) { return; }
    var dir = home.pathname.replace(/index\.html$/, '');
    if (ref.origin !== home.origin || (ref.pathname !== home.pathname && ref.pathname !== dir) || history.length < 2) return;
    e.preventDefault();
    var go = function () { location.href = home.href; };
    // Still on this page after going back (an in-game history entry) or nothing happened: go home directly.
    addEventListener('popstate', go, { once: true });
    var t = setTimeout(go, 2500);
    addEventListener('pagehide', function () { clearTimeout(t); }, { once: true });
    history.back();
  });
})();
</script>

          <button onClick="{{ openEditor }}" style="height:68px;padding:0 22px;border-radius:16px;background:rgba(20,16,13,.6);border:2px solid rgba(245,241,232,.35);color:#f5f1e8;font:700 18px/1 'Segoe UI',system-ui,sans-serif;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:8px"><span style="font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:600;letter-spacing:normal;text-transform:none;white-space:nowrap;font-style:normal;">construction</span>Route editor</button>

        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
          <div style="font:400 44px/1 'Lilita One',sans-serif">Locker</div>
          <div style="display:flex;align-items:center;gap:6px;height:42px;padding:0 16px 0 12px;border-radius:21px;background:rgba(255,211,42,.14);color:#ffd32a;font:800 18px/1 'Segoe UI',system-ui,sans-serif;white-space:nowrap"><span style="font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:600;letter-spacing:normal;text-transform:none;white-space:nowrap;font-style:normal">star</span>{{ wallet }}<span style="font:700 14px/1 'Segoe UI',system-ui,sans-serif;color:#d9c47a">to spend</span></div>
        </div>
        <div style="display:flex;gap:6px;padding:5px;border-radius:14px;background:rgba(245,241,232,.06)">
          <sc-for list="{{ lockerSections }}" as="t" hint-placeholder-count="2">
            <button onClick="{{ t.pick }}" style="flex:1;height:46px;display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:10px;background:{{ t.bg }};color:{{ t.fg }};font:400 22px/1 'Lilita One',sans-serif;white-space:nowrap;cursor:pointer"><span style="font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:600;letter-spacing:normal;text-transform:none;white-space:nowrap;font-style:normal">{{ t.icon }}</span>{{ t.label }}</button>

                </sc-for>

                <button onClick="{{ nextStep }}" style="flex:1;height:58px;display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:16px;background:#f08a2c;color:#14100d;font:400 26px/1 'Lilita One',sans-serif;cursor:pointer;box-shadow:0 6px 0 #a3530f;white-space:nowrap">{{ nextLabel2 }}<span style="font-family:'Material Symbols Rounded';font-size:28px;line-height:1;font-weight:600;letter-spacing:normal;text-transform:none;white-space:nowrap;font-style:normal">{{ nextIcon }}</span></button>

          </div>
        </div>
      </sc-if>

      <sc-if value="{{ isPaused }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;inset:0;z-index:20;background:rgba(10,8,6,.66);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)">
          <div style="width:760px;max-width:100%;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px;padding:28px 30px;border-radius:24px;background:rgba(20,16,13,.95);border:1px solid rgba(245,241,232,.14)">
            <div style="display:flex;flex-direction:column;gap:10px">
              <div style="font:400 50px/1 'Lilita One',sans-serif;margin-bottom:8px">Paused</div>
              <button onClick="{{ resume }}" style="height:60px;display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:16px;background:#f08a2c;color:#14100d;font:400 26px/1 'Lilita One',sans-serif;cursor:pointer;box-shadow:0 6px 0 #a3530f;white-space:nowrap"><span style="font-family:'Material Symbols Rounded';font-size:30px;line-height:1;font-weight:600;letter-spacing:normal;text-transform:none;white-space:nowrap;font-style:normal">play_arrow</span>Keep climbing</button>
              <button onClick="{{ retry }}" style="height:52px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;background:transparent;border:2px solid rgba(245,241,232,.3);color:#f5f1e8;font:700 16px/1 'Segoe UI',system-ui,sans-serif;cursor:pointer;white-space:nowrap"><span style="font-family:'Material Symbols Rounded';font-size:22px;line-height:1;font-weight:600;letter-spacing:normal;text-transform:none;white-space:nowrap;font-style:normal">replay</span>Start again</button>
              <button onClick="{{ helpFromPause }}" style="height:52px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;background:transparent;border:2px solid rgba(245,241,232,.3);color:#f5f1e8;font:700 16px/1 'Segoe UI',system-ui,sans-serif;cursor:pointer;white-space:nowrap"><span style="font-family:'Material Symbols Rounded';font-size:22px;line-height:1;font-weight:600;letter-spacing:normal;text-transform:none;white-space:nowrap;font-style:normal">info</span>How to climb</button>
              <button onClick="{{ toProblems }}" style="height:52px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;background:transparent;border:2px solid rgba(245,241,232,.3);color:#f5f1e8;font:700 16px/1 'Segoe UI',system-ui,sans-serif;cursor:pointer;white-space:nowrap"><span style="font-family:'Material Symbols Rounded';font-size:22px;line-height:1;font-weight:600;letter-spacing:normal;text-transform:none;white-space:nowrap;font-style:normal">grid_view</span>{{ backLabel }}</button>
            </div>
            <div style="display:flex;flex-direction:column;gap:4px;justify-content:center">
              <div style="display:flex;align-items:center;gap:14px;height:52px"><span style="font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:600;letter-spacing:normal;text-transform:none;white-space:nowrap;font-style:normal;color:#d9d2c4">volume_up</span><div style="width:64px;font:700 16px/1 'Segoe UI',system-ui,sans-serif">Sound</div><input type="range" min="0" max="100" value="{{ soundPct }}" onChange="{{ onSound }}" aria-label="Sound volume" style="flex:1;min-width:0;accent-color:#f08a2c;height:30px"><div style="width:34px;text-align:right;font:700 14px/1 'Segoe UI',system-ui,sans-serif;color:#d9d2c4;font-variant-numeric:tabular-nums">{{ soundLabel }}</div></div>
              <div style="display:flex;align-items:center;gap:14px;height:52px"><span style="font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:600;letter-spacing:normal;text-transform:none;white-space:nowrap;font-style:normal;color:#d9d2c4">music_note</span><div style="width:64px;font:700 16px/1 'Segoe UI',system-ui,sans-serif">Music</div><input type="range" min="0" max="100" value="{{ musicPct }}" onChange="{{ onMusic }}" aria-label="Music volume" style="flex:1;min-width:0;accent-color:#f08a2c;height:30px"><div style="width:34px;text-align:right;font:700 14px/1 'Segoe UI',system-ui,sans-serif;color:#d9d2c4;font-variant-numeric:tabular-nums">{{ musicLabel }}</div></div>
              <div style="height:1px;background:rgba(245,241,232,.1);margin:6px 0"></div>
              <button onClick="{{ toggleReach }}" style="display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:54px;padding:0;background:transparent;border:none;color:#f5f1e8;cursor:pointer;text-align:left"><div style="display:flex;flex-direction:column;gap:4px"><div style="font:700 16px/1 'Segoe UI',system-ui,sans-serif">Reach circles</div><div style="font:500 13px/1.3 'Segoe UI',system-ui,sans-serif;color:#a69c8c">Show which holds a limb can reach</div></div><div style="position:relative;flex:none;width:58px;height:34px;border-radius:17px;background:{{ reachTrack }}"><div style="position:absolute;top:3px;left:{{ reachKnob }};width:28px;height:28px;border-radius:50%;background:#f5f1e8;transition:left .15s"></div></div></button>
              <button onPointerDown="{{ fastDown }}" onPointerUp="{{ fastUp }}" onPointerLeave="{{ fastCancel }}" style="display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:54px;padding:0;background:transparent;border:none;color:#f5f1e8;cursor:pointer;text-align:left;touch-action:none"><div style="display:flex;flex-direction:column;gap:4px"><div style="font:700 16px/1 'Segoe UI',system-ui,sans-serif">Fast mode</div><div style="font:500 13px/1.3 'Segoe UI',system-ui,sans-serif;color:#a69c8c">Simpler shadows for older tablets</div></div><div style="position:relative;flex:none;width:58px;height:34px;border-radius:17px;background:{{ fastTrack }}"><div style="position:absolute;top:3px;left:{{ fastKnob }};width:28px;height:28px;border-radius:50%;background:#f5f1e8;transition:left .15s"></div></div></button>
            </div>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ isFallen }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;inset:0;z-index:20;background:linear-gradient(0deg,rgba(10,8,6,.85),rgba(10,8,6,.55));display:flex;align-items:center;justify-content:center">
          <div style="display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:0 24px">
            <div style="font:400 clamp(60px,13vh,96px)/0.95 'Lilita One',sans-serif;color:#f5f1e8;white-space:nowrap;text-shadow:0 6px 0 rgba(0,0,0,.4)">Off the wall!</div>
            <div style="font:600 20px/1.4 'Segoe UI',system-ui,sans-serif;color:#d9d2c4;max-width:480px;text-wrap:pretty">{{ fallText }}</div>
            <div style="display:flex;gap:14px;margin-top:20px">
              <button onClick="{{ retry }}" style="height:64px;padding:0 34px;display:flex;align-items:center;gap:10px;border:none;border-radius:16px;background:#f08a2c;color:#14100d;font:400 30px/1 'Lilita One',sans-serif;white-space:nowrap;cursor:pointer;box-shadow:0 6px 0 #a3530f"><span style="font-family:'Material Symbols Rounded';font-size:32px;line-height:1;font-weight:600;letter-spacing:normal;text-transform:none;white-space:nowrap;font-style:normal">replay</span>Try again</button>
              <button onClick="{{ toProblems }}" style="height:64px;padding:0 24px;display:flex;align-items:center;gap:8px;border-radius:16px;background:rgba(20,16,13,.6);border:2px solid rgba(245,241,232,.35);color:#f5f1e8;font:700 18px/1 'Segoe UI',system-ui,sans-serif;white-space:nowrap;cursor:pointer"><span style="font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:600;letter-spacing:normal;text-transform:none;white-space:nowrap;font-style:normal">grid_view</span>All climbs</button>
            </div>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ isTop }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;inset:0;z-index:20;background:radial-gradient(circle at 50% 40%,rgba(20,16,13,.6),rgba(10,8,6,.9));display:flex;align-items:center;justify-content:center">
          <div style="display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vh,14px);text-align:center;padding:0 24px">
            <div style="display:flex;align-items:center;gap:12px">
              <div style="background:{{ color }};color:{{ gradeFg }};font:400 22px/1 'Lilita One',sans-serif;padding:7px 10px 6px;transform:rotate(-3deg);white-space:nowrap">{{ gradeCode }}</div>
              <div style="font:700 18px/1 'Segoe UI',system-ui,sans-serif;color:#d9d2c4;white-space:nowrap">{{ name }}</div>
              <sc-if value="{{ flash }}" hint-placeholder-val="{{ false }}"><div style="font:800 13px/1 'Segoe UI',system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:7px 10px;border-radius:20px;background:#ffd32a;color:#14100d">Flash</div></sc-if>
            </div>
            <div style="font:400 clamp(72px,16vh,124px)/0.9 'Lilita One',sans-serif;color:#ffd32a;white-space:nowrap;text-shadow:0 6px 0 rgba(0,0,0,.4),0 0 40px rgba(255,211,42,.45)">Sent!</div>
            <sc-if value="{{ practice }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:20px;background:#3f8ff0;color:#14100d;font:800 15px/1 'Segoe UI',system-ui,sans-serif;white-space:nowrap"><span style="font-family:'Material Symbols Rounded';font-size:20px;line-height:1;font-weight:600;letter-spacing:normal;text-transform:none;white-space:nowrap;font-style:normal">all_inclusive</span>Never-tired climb. Turn it off to win stars and open new climbs!</div>
            </sc-if>
            <div style="display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;justify-content:center">
              <sc-for list="{{ resultTiles }}" as="r" hint-placeholder-count="3">
                <div style="display:flex;flex-direction:column;align-items:center;gap:8px;width:170px;padding:14px 10px;border-radius:16px;background:rgba(20,16,13,.85);border:2px solid {{ r.border }}">
                  <span style="font-family:'Material Symbols Rounded';font-size:32px;line-height:1;font-weight:600;letter-spacing:normal;text-transform:none;white-space:nowrap;font-style:normal;color:{{ r.star }}">star</span>
                  <div style="font:700 24px/1 'Segoe UI',system-ui,sans-serif;font-variant-numeric:tabular-nums;color:#f5f1e8">{{ r.value }}</div>
                  <div style="font:700 13px/1.3 'Segoe UI',system-ui,sans-serif;color:#a69c8c;white-space:nowrap">{{ r.label }}</div>
                </div>
              </sc-for>
            </div>
            <sc-if value="{{ showEarned }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:22px;background:rgba(255,211,42,.14);color:#ffd32a;font:800 16px/1 'Segoe UI',system-ui,sans-serif;white-space:nowrap"><span style="font-family:'Material Symbols Rounded';font-size:20px;line-height:1;font-weight:600;letter-spacing:normal;text-transform:none;white-space:nowrap;font-style:normal">star</span>{{ earnedText }}</div>
            </sc-if>
            <div style="display:flex;gap:14px;margin-top:14px">
              <button onClick="{{ next }}" style="height:62px;padding:0 30px;display:flex;align-items:center;gap:8px;border:none;border-radius:16px;background:#f08a2c;color:#14100d;font:400 28px/1 'Lilita One',sans-serif;white-space:nowrap;cursor:pointer;box-shadow:0 6px 0 #a3530f">{{ nextLabel }}<span style="font-family:'Material Symbols Rounded';font-size:30px;line-height:1;font-weight:600;letter-spacing:normal;text-transform:none;white-space:nowrap;font-style:normal">arrow_forward</span></button>
              <button onClick="{{ retry }}" style="height:62px;padding:0 22px;display:flex;align-items:center;gap:8px;border-radius:16px;background:rgba(20,16,13,.6);border:2px solid rgba(245,241,232,.35);color:#f5f1e8;font:700 17px/1 'Segoe UI',system-ui,sans-serif;white-space:nowrap;cursor:pointer"><span style="font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:600;letter-spacing:normal;text-transform:none;white-space:nowrap;font-style:normal">replay</span>Climb again</button>
            </div>
          </div>
        </div>
      </sc-if>
    </div>
  </sc-if>


  <sc-if value="{{ isEditor }}" hint-placeholder-val="{{ false }}">
    <div data-screen-label="Route editor" style="position:absolute;inset:0;display:grid;grid-template-columns:96px minmax(0,1fr) 330px;background:#14100d">
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:76px 0 12px;background:#1a1511;border-right:1px solid rgba(245,241,232,.08);overflow-y:auto">
        <button onClick="{{ goHome }}" aria-label="Home" style="width:76px;height:52px;padding:0;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:26px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.18);color:#fff;font:700 13px/1 'Segoe UI',system-ui,sans-serif;cursor:pointer;margin-bottom:6px"><span style="font-family:'Material Symbols Rounded';font-size:20px;line-height:1;font-weight:600;letter-spacing:normal;text-transform:none;white-space:nowrap;font-style:normal;">arrow_back</span>Home</button>

        <div style="flex:1;min-height:6px"></div>
        <button onClick="{{ edUp }}" aria-label="Scroll up" style="width:76px;height:42px;padding:0;border-radius:12px;border:none;background:rgba(245,241,232,.08);color:#f5f1e8;display:flex;align-items:center;justify-content:center;cursor:pointer"><span style="font-family:'Material Symbols Rounded';font-size:28px;line-height:1;font-weight:600;letter-spacing:normal;text-transform:none;white-space:nowrap;font-style:normal;">keyboard_arrow_up</span></button>
        <button onClick="{{ edDown }}" aria-label="Scroll down" style="width:76px;height:42px;padding:0;border-radius:12px;border:none;background:rgba(245,241,232,.08);color:#f5f1e8;display:flex;align-items:center;justify-content:center;cursor:pointer"><span style="font-family:'Material Symbols Rounded';font-size:28px;line-height:1;font-weight:600;letter-spacing:normal;text-transform:none;white-space:nowrap;font-style:normal;">keyboard_arrow_down</span></button>
      </div>
      <div style="display:flex;flex-direction:column;min-width:0;min-height:0">
        <div style="position:relative;flex:1;min-height:0">
        <x-import component-from-global-scope="boulder-editor" from="./boulder-editor.js" fast="{{ fastStr }}" route="{{ edRouteInit }}" style="position:absolute;inset:0" hint-size="100%,100%"></x-import>
        <div style="position:absolute;left:12px;right:12px;top:72px;display:flex;justify-content:center;pointer-events:none"><div style="display:flex;align-items:center;gap:8px;max-width:100%;box-sizing:border-box;padding:10px 16px;border-radius:14px;background:rgba(20,16,13,.82);border:1px solid rgba(245,241,232,.14);font:700 15px/1.3 'Segoe UI',system-ui,sans-serif;text-wrap:balance"><span style="font-family:'Material Symbols Rounded';font-size:20px;line-height:1;font-weight:600;letter-spacing:normal;text-transform:none;white-space:nowrap;font-style:normal;color:#f08a2c;flex:none">{{ toolIcon }}</span>{{ toolHint }}</div></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;padding:12px 14px;background:#1a1511;border-top:1px solid rgba(245,241,232,.08)">
          <div style="display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px">
            <sc-for list="{{ edTypes }}" as="h" hint-placeholder-count="9">
              <button onClick="{{ h.pick }}" style="display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 0 6px;border-radius:12px;border:2px solid {{ h.ring }};background:{{ h.bg }};color:#d9d2c4;font:700 11px/1 'Segoe UI',system-ui,sans-serif;cursor:pointer;min-width:0;white-space:nowrap">
                <div style="height:36px;display:flex;align-items:center;justify-content:center"><div style="{{ h.shape }}"></div></div>{{ h.label }}
              </button>
            </sc-for>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <div style="flex:none;font:700 11px/1 'Segoe UI',system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#a69c8c;margin-right:4px">Colour</div>
            <sc-for list="{{ edColors }}" as="c" hint-placeholder-count="8"><button onClick="{{ c.pick }}" aria-label="{{ c.hex }}" style="flex:none;width:30px;height:30px;padding:0;border-radius:50%;background:{{ c.hex }};border:3px solid {{ c.ring }};box-shadow:inset 0 0 0 2px #14100d;cursor:pointer"></button></sc-for>
            <div style="flex:1"></div>
            <div style="min-width:0;font:600 12px/1.3 'Segoe UI',system-ui,sans-serif;color:#a69c8c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Drag the empty wall to look around</div>
          </div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px;padding:18px 20px;background:#1a1511;border-left:1px solid rgba(245,241,232,.08);min-width:0;overflow-x:hidden;overflow-y:auto">
        <div style="font:400 32px/1 'Lilita One',sans-serif">Route editor</div>
        <div style="display:flex;flex-direction:column;gap:6px"><div style="font:700 11px/1 'Segoe UI',system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#a69c8c">Name</div>
          <input value="{{ edName }}" onChange="{{ onEdName }}" maxLength="18" placeholder="My route" style="height:44px;box-sizing:border-box;padding:0 12px;border-radius:12px;background:rgba(245,241,232,.08);border:2px solid rgba(245,241,232,.18);color:#f5f1e8;font:700 16px/1 'Segoe UI',system-ui,sans-serif;outline:none;-webkit-user-select:text;user-select:text"></div>
        <div style="display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:14px;background:{{ chkBg }};border:1px solid {{ chkBorder }}">
          <div style="display:flex;align-items:center;gap:8px"><span style="font-family:'Material Symbols Rounded';font-size:22px;line-height:1;font-weight:600;letter-spacing:normal;text-transform:none;white-space:nowrap;font-style:normal;color:{{ chkCol }}">{{ chkIcon }}</span><div style="font:400 20px/1 'Lilita One',sans-serif;color:{{ chkCol }};white-space:nowrap">{{ chkTitle }}</div>
            <sc-if value="{{ chkHasGrade }}" hint-placeholder-val="{{ false }}"><div style="margin-left:auto;font:400 17px/1 'Lilita One',sans-serif;padding:5px 7px 4px;transform:rotate(-3deg);background:{{ chkGradeCol }};color:{{ chkGradeFg }}">{{ chkGrade }}</div></sc-if>

<script type="module">
// Boulder — climbing wall for Caleb and Ezra. Three.js views are custom elements in js/
// (boulder-wall/-climber/-duo, boulder-climb, boulder-editor); the UI here is plain HTML/CSS.

document.addEventListener('contextmenu', e => e.preventDefault());
const Store = ArcadeStore('boulder');                 // calebArcadeData:boulder (IndexedDB)
const SID = Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
// pointerdown/touchstart don't grant activation on a touch screen; these do (plus pointerdown for mice).
const AUDIO_EVENTS = ['pointerdown', 'pointerup', 'click', 'touchend', 'keydown'];

// three.js Stats, top-left under "← Games"; the design's numbers sit under it.
// Loaded on its own so a failed fetch can never stop the game from starting.
let STATS = null, statsOn = false;
import('https://unpkg.com/three@0.160.0/examples/jsm/libs/stats.module.js').then(m => {
  STATS = new m.default();
  STATS.dom.style.cssText = 'position:fixed;top:64px;left:12px;z-index:61;cursor:pointer;opacity:.9;display:none';
  document.body.appendChild(STATS.dom); showStats(statsOn);
}).catch(() => {});
function showStats(on) { statsOn = !!on; if (STATS) STATS.dom.style.display = on ? 'block' : 'none'; }

// ---------------------------------------------------------------------------
// Tiny view renderer — replaces the Claude Design runtime (support.js + React).
// The design's <x-dc> template is kept verbatim in <template id="view">. It is
// compiled once into functions; each render builds the UI as an HTML string and
// *morphs* it into the live DOM (attributes/text patched in place).
//   {{ path }}          value lookup (sc-for item first, then render values)
//   <sc-if value>       keyed display:contents wrapper, always emitted, so a
//                       screen's DOM is created once and its 3D view lives on
//   <sc-for list as>    repeat children per item
//   <x-import ...>      the custom element itself (<boulder-climb> etc.) inside a
//                       wrapper carrying the positional style; the morph only
//                       ever ADDS/updates its attributes and never touches its
//                       children (the element owns its canvas and overlays)
//   onClick/onChange/onPointerDown/Up/Leave   delegated (onChange = input event)
//   style-hover         a generated :hover rule
// ---------------------------------------------------------------------------
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const VOID = new Set(['input', 'br', 'img', 'hr', 'meta', 'link', 'source', 'wbr']);
const EVENTS = { onclick: 'click', onchange: 'change', onpointerdown: 'pointerdown', onpointerup: 'pointerup', onpointerleave: 'pointerleave' };
let hoverN = 0;
const hoverCss = [];

function lookup(scope, path) {
  path = path.trim();
  let o = scope;
  for (const k of path.split('.')) { if (o == null) return undefined; o = o[k]; }
  return o;
}
function compileText(raw) {
  if (!raw.includes('{{')) { const t = esc(raw); return () => t; }
  const parts = raw.split(/\{\{([\s\S]+?)\}\}/g);
  return sc => parts.map((p, i) => i & 1 ? esc(lookup(sc, p)) : esc(p)).join('');
}
function compileAttrVal(raw) {
  const whole = raw.match(/^\s*\{\{([\s\S]+?)\}\}\s*$/);
  if (whole) return sc => lookup(sc, whole[1]);
  if (raw.includes('{{')) { const parts = raw.split(/\{\{([\s\S]+?)\}\}/g); return sc => parts.map((p, i) => i & 1 ? (lookup(sc, p) ?? '') : p).join(''); }
  return () => raw;
}
let keyN = 0;
function compileChildren(node) {
  const fns = Array.from(node.childNodes).map(compileNode).filter(Boolean);
  return (sc, R) => { let s = ''; for (const f of fns) s += f(sc, R); return s; };
}
function compileNode(n) {
  if (n.nodeType === 3) return compileText(n.nodeValue);
  if (n.nodeType !== 1) return null;
  const tag = n.localName;
  if (tag === 'sc-if') {
    const cond = compileAttrVal(n.getAttribute('value') || ''), kids = compileChildren(n), k = 'if' + (keyN++);
    return (sc, R) => `<div style="display:contents" data-k="${k}">${cond(sc) ? kids(sc, R) : ''}</div>`;
  }
  if (tag === 'sc-for') {
    const list = compileAttrVal(n.getAttribute('list') || ''), as = n.getAttribute('as') || 'item', kids = compileChildren(n);
    return (sc, R) => { const l = list(sc) || []; let s = ''; for (const it of l) { const s2 = Object.create(sc); s2[as] = it; s += kids(s2, R); } return s; };
  }
  if (tag === 'x-import') {
    const el = n.getAttribute('component-from-global-scope'), wrapStyle = n.getAttribute('style') || '', k = 'xi' + (keyN++);
    const attrs = Array.from(n.attributes).filter(a => !['component-from-global-scope', 'from', 'style', 'hint-size'].includes(a.name)).map(a => [a.name, compileAttrVal(a.value)]);
    return sc => `<div style="${esc(wrapStyle)}" data-k="${k}"><${el}${attrs.map(([nm, f]) => { const v = f(sc); return v == null ? '' : ` ${nm}="${esc(v)}"`; }).join('')}></${el}></div>`;
  }
  const attrs = [];
  let hoverCls = '';
  for (const a of Array.from(n.attributes)) {
    if (a.name.startsWith('hint-')) continue;
    if (a.name === 'style-hover') { hoverCls = 'dch' + (hoverN++); hoverCss.push(`.${hoverCls}:hover{${a.value.replace(/;?\s*$/, '').split(';').map(d => d + ' !important').join(';')}}`); continue; }
    if (EVENTS[a.name]) { const f = compileAttrVal(a.value), ev = EVENTS[a.name]; attrs.push((sc, R) => { const fn = f(sc); return typeof fn === 'function' ? ` data-on-${ev}="${R.push(fn) - 1}"` : ''; }); continue; }
    const f = compileAttrVal(a.value), nm = a.name;
    attrs.push(sc => { const v = f(sc); return v == null || v === false ? '' : ` ${nm}="${esc(v)}"`; });
  }
  if (hoverCls) { const c = n.getAttribute('class'); if (c == null) attrs.push(() => ` class="${hoverCls}"`); }
  const kids = VOID.has(tag) ? null : compileChildren(n);
  return (sc, R) => {
    let s = '<' + tag; for (const a of attrs) s += a(sc, R); s += '>';
    if (kids) s += kids(sc, R) + '</' + tag + '>';
    return s;
  };
}
const isCE = n => n.nodeType === 1 && n.nodeName.includes('-');
function morphChildren(a, b) {
  const o = Array.from(a.childNodes), n = Array.from(b.childNodes);
  for (let i = 0; i < n.length; i++) { if (i >= o.length) a.appendChild(n[i]); else patchNode(o[i], n[i]); }
  for (let i = n.length; i < o.length; i++) a.removeChild(o[i]);
}
function patchNode(a, b) {
  if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName || (a.nodeType === 1 && a.getAttribute('data-k') !== b.getAttribute('data-k'))) { a.replaceWith(b); return; }
  if (a.nodeType !== 1) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
  for (const at of Array.from(b.attributes)) if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
  if (isCE(a)) return;                                   // owns its own style + children
  for (const at of Array.from(a.attributes)) if (!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  if (a.nodeName === 'INPUT') { const v = b.getAttribute('value'); if (v != null && a.value !== v) a.value = v; }
  morphChildren(a, b);
}

// React-ish base the design's Component extends (it was DCLogic).
class DCBase {
  constructor(host, tpl) {
    this.host = host; this.handlers = [];
    this.viewFn = compileChildren(tpl.content);
    if (hoverCss.length) { const st = document.createElement('style'); st.textContent = hoverCss.join('\n'); document.head.appendChild(st); }
    const H = ev => e => {
      const b = e.target.closest && e.target.closest(`[data-on-${ev}]`); if (!b || !host.contains(b)) return;
      const fn = this.handlers[+b.getAttribute(`data-on-${ev}`)]; if (typeof fn === 'function') fn(e);
    };
    host.addEventListener('click', H('click'));
    host.addEventListener('input', H('change'));
    host.addEventListener('pointerdown', H('pointerdown'));
    host.addEventListener('pointerup', H('pointerup'));
    // pointerleave doesn't bubble: catch it on the way down and only for the element itself.
    host.addEventListener('pointerleave', e => { const t = e.target; if (!t.getAttribute || !t.hasAttribute('data-on-pointerleave')) return; const fn = this.handlers[+t.getAttribute('data-on-pointerleave')]; if (fn) fn(e); }, true);
    host.addEventListener('pointercancel', e => { const t = e.target.closest && e.target.closest('[data-on-pointerleave]'); if (!t) return; const fn = this.handlers[+t.getAttribute('data-on-pointerleave')]; if (fn) fn(e); }, true);
  }
  start() { this.renderNow(); this.componentDidMount && this.componentDidMount(); }
  setState(patch, cb) {
    Object.assign(this.state, typeof patch === 'function' ? patch(this.state) : patch);
    if (!this._queued) { this._queued = true; queueMicrotask(() => { this._queued = false; this.renderNow(); }); }
    cb && cb();
  }
  renderNow() {
    const R = [], html = this.viewFn(this.renderVals(), R);
    this.handlers = R;
    if (html === this._html) return;
    this._html = html;
    const t = document.createElement('template'); t.innerHTML = html;
    morphChildren(this.host, t.content);
  }
}

    const mine = s.grade === 'mine';
    return {
      gradeTabs: gradeTabs.map(t => mine ? { ...t, bg: 'rgba(20,16,13,.72)', border: 'transparent' } : t), cards, showGrades: !mine, showMine: mine,
      mineTab: { bg: mine ? 'rgba(245,241,232,.14)' : 'rgba(20,16,13,.72)', border: mine ? '#f5f1e8' : 'transparent', note: s.myRoutes.length ? s.myRoutes.length + ' saved' : 'Make one!', go: () => this.setState({ grade: 'mine' }) },
      mineCards: s.myRoutes.map(m => ({ name: m.name, color: m.route.color, holds: m.route.holds.length, grade: m.grade == null ? 'V?' : 'V' + m.grade, gradeCol: m.grade == null ? 'rgba(245,241,232,.25)' : this.GCOL[m.grade], gradeFg: m.grade === 8 ? '#f5f1e8' : '#14100d',
        play: () => this.playMine(m), edit: () => { this.save({ edDraft: m.route, edName: m.name, edColor: m.route.color, screen: 'editor', edTool: 'place' }); this.validateSoon(m.route, 0); } })),
      newRoute: () => { this.save({ edDraft: { holds: [], color: '#f08a2c' }, edName: '', screen: 'editor', edTool: 'place', edCheck: { status: 'empty' } }); },
      starTotal: Object.keys(s.best).reduce((a, k) => a + this.starCount(k), 0)
    };
  }

  // ---------- climb ----------
  climbVals() {
    const s = this.state, par = s.par || {}, gold = '#ffd32a', lost = 'rgba(245,241,232,.75)';
    const goal = (ok, label) => ({ label, color: ok ? gold : lost, deco: ok ? 'none' : 'line-through' });
    const r = s.result, st = (r && r.stars) || {};
    const tile = (ok, value, label) => ({ value, label, star: ok ? gold : 'rgba(245,241,232,.25)', border: ok ? gold : 'rgba(245,241,232,.12)' });
    const cat = s.cat, nextI = s.pi + 1, hasNext = nextI < cat.length && this.isOpen(nextI);
    const hs = this.STEPS[s.step], lastStep = s.step === this.STEPS.length - 1, pt = s.tick ? hs.b : hs.a;
    return {
      climbIdx: String(s.climbIdx), infiniteStr: String(s.infinite),
      infBg: s.infinite ? '#3f8ff0' : 'rgba(0,0,0,.55)', infFg: s.infinite ? '#14100d' : '#fff', infBorder: s.infinite ? '#3f8ff0' : 'rgba(255,255,255,.18)',
      customJson: s.custom ? JSON.stringify(s.custom) : '', backLabel: s.custom && s.customFrom === 'editor' ? 'Back to editor' : 'All climbs',
      name: s.name, gradeCode: 'V' + s.gradeNum + (s.custom ? ' · mine' : cat[s.pi] ? '-' + cat[s.pi].k : ''), gradeFg: s.gradeNum === 8 ? '#f5f1e8' : '#14100d', color: s.color, moves: s.moves, timeStr: this.fmt(s.time),
      practice: s.practice, showGoals: !s.practice,
      goals: [goal(s.moves <= par.moves, par.moves + ' moves'), goal(s.time <= par.time, this.fmt(par.time)), goal(s.holds <= par.holds, par.holds + ' holds')],
      showHint: s.hint < 2 && s.status === 'climb' && !s.paused && !s.help && !s.introOpen,
      hintText: s.hint === 0 ? `Drag a ring onto a glowing ${s.colorName} hold` : `Only ${s.colorName} holds count. Get both hands on the gold TOP!`,
      toast: s.status === 'climb' && !s.help ? s.toast : null, toastBg: s.toastBg,
      introOpen: !!(s.introOpen && s.intro) && !s.help, introIcon: s.intro ? s.intro.icon : '', introName: s.intro ? s.intro.name : '', introText: s.intro ? s.intro.text : '',
      closeIntro: () => { this.setState({ introOpen: false }); if (!this.state.paused) this.call('setPaused', false); },
      help: s.help, hs, helpBg: `url("${hs.img}")`, ptrX: pt[0], ptrY: pt[1],
      stepBars: this.STEPS.map((_, i) => i <= s.step ? '#f08a2c' : 'rgba(245,241,232,.15)'),
      notFirstStep: s.step > 0, nextLabel2: lastStep ? "Let's climb!" : 'Next', nextIcon: lastStep ? 'play_arrow' : 'arrow_forward',
      nextStep: () => lastStep ? this.closeHelp() : this.setState({ step: s.step + 1, auto: false }),
      prevStep: () => this.setState({ step: Math.max(0, s.step - 1), auto: false }),
      openHelp: () => this.openHelp(), closeHelp: () => this.closeHelp(),
      helpFromPause: () => { this.setState({ paused: false }); this.openHelp(); },
      toggleInf: () => { const on = !s.infinite; this.setState({ infinite: on, practice: s.practice || on }); this.showToast(on ? 'Never-tired mode ON · no stars this climb' : 'Never-tired mode OFF', on ? '#3f8ff0' : '#f5f1e8'); },
      isPaused: s.paused && s.status === 'climb' && !s.help, isFallen: s.status === 'fallen', isTop: s.status === 'top',
      fallText: s.slipName ? `Your ${s.slipName.toLowerCase()} got too tired and let go. Shake out tired hands and keep your feet on!` : 'Keep at least one hand on the wall!',
      flash: !!(r && r.flash),
      resultTiles: r ? [tile(st.moves, r.moves, `moves · goal ${par.moves}`), tile(st.time, this.fmt(r.time), `time · goal ${this.fmt(par.time)}`), tile(st.holds, r.holds, `holds · goal ${par.holds}`)] : [],
      showEarned: s.earned > 0, earnedText: `+${s.earned} new star${s.earned === 1 ? '' : 's'} · ${s.wallet} to spend in the Locker`,
      nextLabel: s.custom ? (s.customFrom === 'editor' ? 'Back to editor' : 'My routes') : hasNext ? 'Next climb' : 'All climbs',
      pause: () => { this.call('setPaused', true); this.setState({ paused: true }); },
      resume: () => { this.call('setPaused', false); this.setState({ paused: false }); },
      retry: () => { this.setState({ paused: false }); this.call('retry'); },
      next: () => { if (s.custom) this.setState(s.customFrom === 'editor' ? { screen: 'editor', custom: null } : { screen: 'problems', grade: 'mine', custom: null }); else if (hasNext) this.call('load', nextI); else this.setState({ screen: 'problems', grade: null }); },
      toProblems: () => s.custom ? this.setState(s.customFrom === 'editor' ? { screen: 'editor', custom: null, paused: false, help: false } : { screen: 'problems', grade: 'mine', custom: null, paused: false, help: false }) : this.setState({ screen: 'problems', grade: null, paused: false, help: false })
    };
  }

  // ---------- route editor ----------
  ED_TYPES = ['jug', 'crimp', 'sloper', 'pinch', 'pocket', 'volume', 'ledge', 'foot', 'top'];
  ED_DIRS = [null, 'left', 'right', 'under'];
  ED_COLS = ['#5fcf7a', '#f2d23c', '#3f8ff0', '#f08a2c', '#e5484d', '#9b6bf0', '#f06fb4', '#f5f1e8'];
  edCall(fn, ...a) { const e = document.querySelector('boulder-editor'); if (e && e[fn]) return e[fn](...a); }
  toProblem(route, name) {
    const C = this.core, H = route.holds, ti = H.findIndex(h => h.type === 'top');
    const order = H.map((_, i) => i).filter(i => i !== ti).concat(ti >= 0 ? [ti] : []);
    const rows = order.map(i => { const h = H[i], row = [h.type, h.x, h.y]; if (h.dir || h.jump) row.push(h.dir || null); if (h.jump) row.push('J'); return row; });
    const st = order.map((oi, ni) => ({ h: H[oi], ni })).filter(o => o.h.start).sort((a, b) => b.h.y - a.h.y);
    const hands = st.filter(o => C.HOLD[o.h.type].hand).slice(0, 2).sort((a, b) => a.h.x - b.h.x);
    const feet = st.filter(o => !hands.includes(o) && C.HOLD[o.h.type].foot && o.h.dir !== 'under').sort((a, b) => a.h.x - b.h.x);
    if (!hands.length) return null;
    const start = { LH: hands[0].ni, RH: (hands[1] || hands[0]).ni, LF: feet[0] ? feet[0].ni : null, RF: feet[1] ? feet[1].ni : feet[0] ? feet[0].ni : null };
    return { grade: 0, name: name || 'My route', cx: 0, color: route.color, start, holds: rows };
  }
  playMine(m) {
    const C = this.core; if (!C) return;
    const p = this.toProblem(m.route, m.name); if (!p) { this.showGlobal('This route needs fixing in the editor first'); return; }
    const L = C.buildLayout(0, [{ problems: [p] }], false), pr = L.problems[0];
    if (!C.validState(pr.start, L.holds, {})) { this.showGlobal('This route needs fixing in the editor first'); return; }
    const r = C.search(L, 0); if (!r.ok) { this.showGlobal('No way to the top yet. Fix it in the editor'); return; }
    const used = new Set(); r.path.forEach(s => ['LH', 'RH', 'LF', 'RF'].forEach(l => { if (s[l] != null && !pr.startIds.includes(s[l])) used.add(s[l]); }));
    const grade = m.grade ?? 0;
    this.setState({ custom: { ...p, grade, par: C.parFor(r.moves, used.size) }, customFrom: 'problems', screen: 'climb', climbIdx: 0, status: 'climb', result: null, paused: false, help: false, introOpen: false, toast: null, hint: 0 });
  }
  validateSoon(route, wait = 450) { clearTimeout(this.vt); this.setState({ edCheck: { status: 'working' } }); this.vt = setTimeout(() => this.validate(route), wait); }
  validate(route) {
    const C = this.core; if (!C) return;
    const H = route.holds, name = this.state.edName || 'My route';
    const out = c => this.setState({ edCheck: c });
    if (!H.length) return out({ status: 'empty' });
    if (!H.some(h => h.type === 'top')) return out({ status: 'bad', msg: 'Add a gold TOP hold. Pick Top below, then tap where the route ends.' });
    if (H.filter(h => h.start).length < 2) return out({ status: 'bad', msg: 'Use the Start tool to mark 2 to 4 holds where the climber begins.' });
    const p = this.toProblem(route, name); if (!p) return out({ status: 'bad', msg: 'At least one start hold needs to be a hand hold.' });
    const L = C.buildLayout(0, [{ problems: [p] }], false), pr = L.problems[0];
    if (!C.validState(pr.start, L.holds, {})) return out({ status: 'bad', msg: 'The climber can\'t reach all the start holds at once. Move them closer together.' });
    const g = C.gradeRoute(L, 0);
    if (!g.ok) return out({ status: 'bad', msg: 'No way to the top yet. Add holds where the climber would get stuck.' });
    const used = new Set(); g.path.forEach(s => ['LH', 'RH', 'LF', 'RF'].forEach(l => { if (s[l] != null && !pr.startIds.includes(s[l])) used.add(s[l]); }));
    const grade = C.suggestGrade(g, L, 0);
    out({ status: 'ok', grade, moves: g.moves, required: g.required, problem: { ...p, grade, par: C.parFor(g.moves, used.size) } });
  }
  editorVals() {
    const s = this.state, chk = s.edCheck || { status: 'empty' }, tool = s.edTool;
    const TOOLS = [['place', 'Place', 'add_circle', 'Tap the wall to place a hold. Routes can go sideways too!'], ['move', 'Move', 'open_with', 'Drag a hold to move it'], ['delete', 'Delete', 'delete', 'Tap a hold to take it off'],
      ['start', 'Start', 'flag', 'Tap 2 to 4 holds where the climber starts'], ['turn', 'Turn', 'rotate_right', 'Tap a hold to turn it sideways or upside down'], ['jump', 'Jump', 'keyboard_double_arrow_up', 'Tap a hand hold to make it a jump hold']];
    const col = s.edColor, sh = {
      jug: `width:40px;height:26px;border-radius:50% 50% 45% 45%;background:${col}`, crimp: `width:44px;height:10px;border-radius:5px;background:${col}`,
      sloper: `width:44px;height:22px;border-radius:22px 22px 6px 6px;background:${col}`, pinch: `width:14px;height:34px;border-radius:7px;background:${col}`,
      pocket: `width:30px;height:30px;border-radius:50%;background:#14100d;box-shadow:inset 0 0 0 8px ${col}`, volume: `width:44px;height:34px;background:${col};clip-path:polygon(50% 0,100% 100%,0 100%)`,
      ledge: 'width:50px;height:11px;border-radius:3px;background:#e6dccb', foot: `width:14px;height:9px;border-radius:50%;background:${col}`, top: 'width:42px;height:26px;border-radius:50% 50% 45% 45%;background:#ffd32a;box-shadow:0 0 0 4px rgba(255,211,42,.35)'
    };
    const LBL = { jug: 'Jug', crimp: 'Crimp', sloper: 'Sloper', pinch: 'Pinch', pocket: 'Pocket', volume: 'Volume', ledge: 'Ledge', foot: 'Foot chip', top: 'Top' };
    const ok = chk.status === 'ok', bad = chk.status === 'bad', work = chk.status === 'working';
    const t = TOOLS.find(x => x[0] === tool);
    return {
      edRouteInit: JSON.stringify(s.edDraft || { holds: [], color: s.edColor }),
      edTools: TOOLS.map(([id, label, icon]) => ({ label, icon, ring: tool === id ? '#f5f1e8' : 'transparent', bg: tool === id ? 'rgba(245,241,232,.14)' : 'transparent', pick: () => { this.setState({ edTool: id }); this.edCall('setTool', id); } })),
      toolHint: t[3], toolIcon: t[2],
      edTypes: this.ED_TYPES.map(id => ({ label: LBL[id], shape: sh[id], ring: s.edType === id ? '#f5f1e8' : 'transparent', bg: s.edType === id ? 'rgba(245,241,232,.1)' : 'rgba(245,241,232,.03)', pick: () => { this.setState({ edType: id, edTool: 'place' }); this.edCall('setType', id); this.edCall('setTool', 'place'); } })),
      edColors: this.ED_COLS.map(hex => ({ hex, ring: s.edColor === hex ? '#f5f1e8' : 'transparent', pick: () => { this.setState({ edColor: hex }); this.edCall('setColor', hex); } })),
      edUp: () => this.edCall('scrollBy', 1.2), edDown: () => this.edCall('scrollBy', -1.2),
      edName: s.edName, onEdName: e => { this.save({ edName: String(e.target.value).slice(0, 18) }); if (s.edDraft) this.validateSoon(s.edDraft, 600); },
      chkBg: ok ? 'rgba(95,211,138,.12)' : bad ? 'rgba(247,194,60,.1)' : 'rgba(245,241,232,.05)', chkBorder: ok ? 'rgba(95,211,138,.5)' : bad ? 'rgba(247,194,60,.45)' : 'rgba(245,241,232,.12)',
      chkCol: ok ? '#5fd38a' : bad ? '#f7c23c' : '#d9d2c4', chkIcon: ok ? 'check_circle' : bad ? 'error' : work ? 'hourglass_top' : 'construction',
      chkTitle: ok ? 'Can be topped!' : bad ? 'Not climbable yet' : work ? 'Checking…' : 'Build a route',
      chkMsg: ok ? `Best way up: ${chk.moves} moves. The grader says this is a V${chk.grade}.` : bad ? chk.msg : work ? 'The solver is trying every hand and foot position.' : 'Place holds, mark the start, and add a gold TOP. The solver checks it can be climbed.',
      chkHasGrade: ok, chkGrade: ok ? 'V' + chk.grade : '', chkGradeCol: ok ? this.GCOL[chk.grade] : '#000', chkGradeFg: ok && chk.grade === 8 ? '#f5f1e8' : '#14100d',
      chkHasNeeds: ok && chk.required.length > 0, chkNeeds: ok ? chk.required.map(x => ({ icon: this.TECHI[x][0], label: this.TECHI[x][1] })) : [],
      testBg: ok ? '#f08a2c' : 'rgba(245,241,232,.08)', testFg: ok ? '#14100d' : '#a69c8c', testShadow: ok ? '0 6px 0 #a3530f' : 'none',
      testClimb: () => { if (!ok) { this.showGlobal(bad ? chk.msg : 'Build a route first'); return; } this.setState({ custom: chk.problem, customFrom: 'editor', screen: 'climb', climbIdx: 0, status: 'climb', result: null, paused: false, help: false, introOpen: false, toast: null, hint: 0 }); },
      saveRoute: () => { if (!s.edDraft || !s.edDraft.holds.length) { this.showGlobal('Place some holds first'); return; } const name = s.edName || 'My route'; const list = [{ name, route: s.edDraft, grade: ok ? chk.grade : null }, ...s.myRoutes.filter(m => m.name !== name)].slice(0, 10); this.save({ myRoutes: list }); this.showGlobal('Saved to My routes on this device'); },
      hasMyRoutes: s.myRoutes.length > 0,
      myRouteList: s.myRoutes.map((m, i) => ({ name: m.name, grade: m.grade == null ? '?' : 'V' + m.grade, col: m.grade == null ? 'rgba(245,241,232,.2)' : this.GCOL[m.grade], fg: m.grade === 8 ? '#f5f1e8' : '#14100d',
        load: () => { this.save({ edDraft: m.route, edName: m.name, edColor: m.route.color }); this.edCall('setRoute', m.route); this.validateSoon(m.route, 0); },
        del: () => this.save({ myRoutes: s.myRoutes.filter((_, k) => k !== i) }) })),
      clearRoute: () => { this.edCall('clear'); }
    };
  }

  renderVals() {
    const s = this.state, set = s.settings, nu = this.nextUp();
    const toggle = on => ({ track: on ? '#f08a2c' : 'rgba(245,241,232,.18)', knob: on ? '27px' : '3px' });
    const rT = toggle(set.reach), fT = toggle(set.fast);
    return {
      ...(s.screen === 'locker' ? this.lockerVals() : {}), ...(s.screen === 'problems' ? this.problemVals() : {}), ...(s.screen === 'climb' ? this.climbVals() : {}), ...(s.screen === 'editor' ? this.editorVals() : {}),
      perfOn: !!set.perf, perfText: s.perfText || 'measuring…',
      isEditor: s.screen === 'editor', openEditor: () => this.setState({ screen: 'editor', edTool: 'place' }),
      isHome: s.screen === 'home', isLocker: s.screen === 'locker', isProblems: s.screen === 'problems', isClimb: s.screen === 'climb',
      char: s.char, charName: s.char === 'ezra' ? 'Ezra' : 'Caleb', lockerTitle: (s.char === 'ezra' ? 'Ezra' : 'Caleb') + "'s locker", charLook: JSON.stringify(s.looks[s.char]), wallet: s.wallet,
      nextUpText: nu ? `Next up: V${nu.grade}-${nu.k} · ${nu.name}` : 'Loading climbs…',
      walletText: s.wallet === 1 ? '1 star to spend' : s.wallet + ' stars to spend', hasNextUp: !!nu,
      nextUpGrade: nu ? `V${nu.grade}-${nu.k}` : '', nextUpName: nu ? nu.name : '', nextUpCol: nu ? this.GCOL[nu.grade] : '#000', nextUpFg: nu && nu.grade === 8 ? '#f5f1e8' : '#14100d',
      lookA: JSON.stringify(s.looks.caleb), lookB: JSON.stringify(s.looks.ezra), waveKey: s.char === 'ezra' ? 'b' : 'a',
      climbers: ['caleb', 'ezra'].map(id => { const on = s.char === id; return { id, name: id === 'caleb' ? 'Caleb' : 'Ezra', look: JSON.stringify(s.looks[id]), wave: String(on), border: on ? '#f08a2c' : 'rgba(245,241,232,.1)', tag: on ? 'Ready!' : 'Pick', tagBg: on ? '#f08a2c' : 'rgba(245,241,232,.55)', pick: () => this.save({ char: id, preview: null }) }; }),
      openProblems: () => this.setState({ screen: 'problems', grade: null }),
      openLocker: () => this.setState({ screen: 'locker', tab: 'climber', view: 'front', preview: null }),
      goHome: () => this.setState({ screen: 'home', preview: null }),
      editorSoon: () => this.showGlobal('The route editor is coming soon!'),
      settingsOpen: s.settingsOpen, openSettings: () => this.setState({ settingsOpen: true }), closeSettings: () => this.setState({ settingsOpen: false }),
      globalToast: s.globalToast,
      soundPct: Math.round(set.sound * 100), musicPct: Math.round(set.music * 100),
      soundLabel: set.sound > 0 ? Math.round(set.sound * 100) : 'Off', musicLabel: set.music > 0 ? Math.round(set.music * 100) : 'Off',
      onSound: e => { this.setSetting('sound', +e.target.value / 100); this.initAudio(); clearTimeout(this.st); this.st = setTimeout(() => this.blip(520, .08, .3), 60); }, onMusic: e => { this.setSetting('music', +e.target.value / 100); this.initAudio(); },
      reachTrack: rT.track, reachKnob: rT.knob, fastTrack: fT.track, fastKnob: fT.knob,
      reachStr: String(set.reach), fastStr: String(set.fast), perfStr: String(set.perf),
      toggleReach: () => this.setSetting('reach', !set.reach),
      fastDown: () => { clearTimeout(this.ht); this.held = false; this.ht = setTimeout(() => { this.held = true; this.togglePerf(); }, 600); },
      fastUp: () => { clearTimeout(this.ht); if (!this.held) this.setSetting('fast', !this.state.settings.fast); this.held = true; },
      fastCancel: () => { clearTimeout(this.ht); this.held = true; }
    };
  }
}

Store.ready(() => {
  const app = new Component(document.getElementById('app'), document.getElementById('view'));
  window.__boulder = app;
  app.start();
});
