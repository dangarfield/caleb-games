<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<title>The Wind &amp; The Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4ECD9;--moss:#2F3F2C;--scarf:#D9553B;--sage:#E6EEDD;--feather:#A0703E;--stone:#CDBFA6;--ink:#1F1D1A;--wind:#BFE3F0;--honey:#EDC36A;--honey-ink:#4A3413}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#DDEBE4;color:var(--moss);font-family:Figtree,sans-serif;-webkit-font-smoothing:antialiased;touch-action:none;user-select:none;-webkit-user-select:none}
a{color:var(--scarf)}a:hover{color:#B5452F}
button{font:inherit;border:none;cursor:pointer;color:inherit;background:none}
.serif{font-family:'Young Serif',serif}
.hidden{display:none!important}
#sky{display:none}   /* the sky is drawn inside the 3D scene now */
#gl{position:fixed;inset:0;transition:filter .25s}
#gl canvas{display:block;width:100%;height:100%}
body.hush #gl{filter:saturate(.45) brightness(1.04)}
#veil{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 62%,transparent 38%,rgba(47,63,44,.5));opacity:0;transition:opacity .25s}
body.hush #veil{opacity:1}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--paper);color:var(--moss);font:700 13px Figtree;padding:9px 14px;border-radius:99px;text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:space-between;gap:18px;background:var(--scarf);color:#fff;border-radius:16px;padding:14px 20px;font:800 17px Figtree;min-height:48px}
.btn:hover{background:#C44A32}
.btn small{display:block;font:500 12px Figtree;opacity:.92}
.btn.soft{background:var(--paper);color:var(--moss)}
.btn.soft:hover{background:#EDE3CC}
.btn.dark{background:var(--moss);color:var(--paper)}
.btn.dark:hover{background:#26341F}
.feather-i{display:inline-block;width:7px;height:15px;border-radius:50%;background:var(--feather);transform:rotate(28deg)}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 12px Figtree;background:var(--sage);color:var(--moss);padding:5px 10px 5px 6px;border-radius:99px}
/* thin scrollbars in the paper/moss colours for the scrolling panels */
*{scrollbar-width:thin;scrollbar-color:rgba(47,63,44,.38) transparent}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(47,63,44,.38);border-radius:6px}::-webkit-scrollbar-thumb:hover{background:rgba(47,63,44,.6)}
.kicker{font:700 12px Figtree;letter-spacing:.16em;color:#B5452F;text-transform:uppercase}
.pips{display:inline-flex;gap:6px;margin-left:10px;vertical-align:1px}.pips i{width:10px;height:10px;border-radius:50%;border:2px solid var(--scarf);box-sizing:border-box}.pips i.on{background:var(--scarf)}
.screen{position:fixed;inset:0;z-index:20;display:flex}
#title{align-items:center;padding:0 80px;background:linear-gradient(90deg,rgba(244,236,217,.92) 0%,rgba(244,236,217,.6) 34%,rgba(244,236,217,0) 58%)}
#title .col{display:flex;flex-direction:column;gap:22px;max-width:440px}
#title h1{font:400 clamp(44px,55px,76px)/.95 'Young Serif';color:var(--moss)}
#title p{font:400 17px/1.5 'Young Serif';color:#3D3932}
#title .row{display:flex;gap:10px}
#title .row > .btn{flex:1;min-width:0}
#title .row.cta .btn{padding:12px 16px;gap:10px}
#title .row.cta .btn small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#title .row.cta .btn > span:first-child{min-width:0;text-align:left}
#title .row.cta .btn > span:first-child > span{white-space:nowrap}
#title .row.cta .btn{min-height:58px;align-items:center}
.pill{white-space:nowrap}
#title .row.nav .btn{justify-content:center;text-align:center;padding:12px 10px;font-size:15px}
.corner{position:fixed;top:max(16px,env(safe-area-inset-top));z-index:25}
.corner.l{left:max(18px,env(safe-area-inset-left))}.corner.r{right:max(18px,env(safe-area-inset-right))}
.panel{background:#F4ECD9;border-radius:24px;box-shadow:0 20px 60px rgba(31,29,26,.25)}
#journey,#book,#pause,#intro,#outro,#scene{align-items:center;justify-content:center;background:rgba(47,63,44,.35);padding:18px}
#journey .panel{width:min(1120px,1280px);max-height:635px;overflow:auto;padding:24px 28px;display:flex;flex-direction:column;gap:16px}
.jhead{display:flex;align-items:center;gap:16px}
.jhead h2{font:400 30px 'Young Serif'}
.chapters{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.chap{border-radius:12px;padding:12px;font:400 14px/1.2 'Young Serif';min-height:70px;display:flex;flex-direction:column;gap:4px;text-align:left;opacity:.82;cursor:pointer}
.chap small{font:700 10px Figtree;letter-spacing:.1em;opacity:.85}
.chap.on{opacity:1;box-shadow:0 0 0 3px var(--moss)}
.chap.locked{opacity:.3;pointer-events:none}
.stages{display:flex;gap:10px}.stages .stage{flex:1 1 0;min-width:0}   /* the chapter's stages share the full width equally */
.stage{background:#fff;border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px;border:2px solid transparent}
.stage:hover{border-color:var(--moss)}
.stage .code{font:600 11px Figtree;letter-spacing:.1em;color:#6B655B}
.stage .nm{font:400 18px/1.15 'Young Serif'}
.stage .st{margin-top:auto;font:700 12px Figtree;color:#5A544B;display:flex;gap:6px;align-items:center}
.stage.locked{opacity:.45;pointer-events:none}
.stage.next{border-color:var(--scarf)}
#intro .panel,#outro .panel,#scene .panel{grid-template-columns:420px 1fr!important;width:min(1040px,1280px);height:min(560px,621px);display:grid;grid-template-columns:42% 1fr;overflow:hidden}
.painting{position:relative;overflow:hidden;background:linear-gradient(#A9D0DC,#DDEBE4 58%)}
.painting i{position:absolute;border-radius:50%}
.painting .h1{left:-20%;top:52%;width:90%;height:50%;background:#A9C293}
.painting .h2{right:-30%;top:46%;width:110%;height:60%;background:#86A672}
.painting .g{left:-10%;right:-10%;top:70%;bottom:-20%;border-radius:0;background:#9DB884}
.painting .w{left:30%;top:64%;width:40%;height:14%;border-radius:4px;background:var(--stone);border-top:6px solid #6F8F5A}
.painting .hole{left:46%;top:67%;width:8%;height:11%;border-radius:40px 40px 0 0;background:#E8DCBE}
.painting .cap{position:absolute;left:18px;bottom:16px;font:600 11px Figtree;letter-spacing:.08em;background:rgba(244,236,217,.88);padding:6px 10px;border-radius:8px;color:#4E4A44}
.story{padding:clamp(20px,28px,38px) clamp(20px,40px,40px);display:flex;flex-direction:column;gap:14px;overflow:auto}
.story h2{font:400 clamp(26px,35px,38px)/1.05 'Young Serif'}
.story .tale{font:400 clamp(15px,18px,18px)/1.6 'Young Serif';color:#3D3932;text-wrap:pretty}
.story .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.story .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.memory{background:var(--moss);color:var(--paper);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.memory .kicker{color:#E6EEDD}
.memory h3{font:400 20px 'Young Serif'}
.memory p{font:400 14px/1.55 'Young Serif';opacity:.95}
#book .panel{width:min(1040px,1280px);height:min(560px,621px);display:grid;grid-template-columns:290px 420px 1fr;overflow:hidden}
#book .jhead h2{white-space:nowrap;font-size:19px!important}
.bpic{position:relative;overflow:hidden;background:linear-gradient(#A9D0DC,#DDEBE4 58%,#9DB884 58%)}
.bpic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bpic .bnone{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.bpic .bnone .feather-i{width:34px;height:76px;opacity:.28}
#lightbox{position:fixed;inset:0;z-index:1000;background:rgba(31,29,26,.92);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
#lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.blist{padding:24px;display:flex;flex-direction:column;gap:2px;overflow:auto;background:var(--paper)}
.bch{font:700 11px Figtree;letter-spacing:.12em;color:#6B655B;margin:10px 0 2px;text-transform:uppercase}
.bitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;text-align:left;font:400 15px 'Young Serif'}
.bitem.on{background:var(--sage)}
.bitem.no{color:#9C958A}
.bread{padding:28px 30px;background:#FBF8F2;display:flex;flex-direction:column;gap:12px;overflow:auto}
.bread h3{font:400 28px 'Young Serif'}
.bread p{font:400 16px/1.65 'Young Serif';color:#3D3932}
#guide{align-items:center;justify-content:center;background:rgba(47,63,44,.35);padding:18px}
#guide .panel{width:min(1180px,1280px);max-height:635px;overflow:auto;padding:22px 26px;display:flex;flex-direction:column;gap:14px}
.gtabs{display:flex;gap:6px;flex-wrap:wrap}
.gtab{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:rgba(47,63,44,.72);color:var(--paper);font:700 13px Figtree}
.gtab.on{background:var(--moss);box-shadow:0 0 0 3px var(--scarf)}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px}
.gcard{background:var(--moss);color:var(--paper);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}
.gcard img{width:100%;aspect-ratio:246/232;border-radius:10px;display:block;background:linear-gradient(#A9D0DC,#DDEBE4)}
.gcard .nm{font:400 15px/1.15 'Young Serif'}
.gcard .seq{gap:6px;flex-wrap:wrap}
.gcard .seq .arr{font-size:16px}
.gempty{font:400 16px/1.5 'Young Serif';color:#5A544B;padding:20px 0}
.players{display:flex;gap:8px}
.player{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:10px 14px;border-radius:14px;background:rgba(244,236,217,.7);border:2px solid transparent;text-align:left;min-height:52px}
.player.on{background:var(--paper);border-color:var(--moss)}
.player .pn{font:400 20px 'Young Serif'}
.player .ps{font:600 11px Figtree;color:#5A544B;display:flex;gap:5px;align-items:center}
.painting.art i{display:none}
#hud.dance > *:not(#subtitle){display:none!important}
#tutor{position:absolute;left:50%;top:78px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:var(--paper);color:var(--moss);border-radius:18px;padding:12px 22px 12px 12px;font:400 22px/1.25 'Young Serif';box-shadow:0 14px 40px rgba(31,29,26,.3);white-space:nowrap;pointer-events:none;animation:tutin .35s ease-out}
#tutor .ic{width:56px;height:56px;border-radius:50%;background:var(--moss);display:flex;align-items:center;justify-content:center;flex:none}
@keyframes tutin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
#tutHold{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);z-index:14;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:10px;font:400 28px 'Young Serif';color:#fff;text-shadow:0 2px 10px rgba(31,29,26,.55)}
#tutHold .ring{width:112px;height:112px;border-radius:50%;border:6px solid #F4ECD9;background:rgba(47,63,44,.35);animation:holdp 1.3s ease-in-out infinite}
@keyframes holdp{0%,100%{transform:scale(.86);opacity:.7}50%{transform:scale(1.06);opacity:1}}
#tutArrow{position:absolute;z-index:16;pointer-events:none;width:0;height:0}
#tutArrow svg{position:absolute;left:-22px;top:-30px;animation:arrb .8s ease-in-out infinite}
@keyframes arrb{0%,100%{transform:translateY(-7px)}50%{transform:translateY(7px)}}
.vol{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:10px 14px;margin-bottom:4px}
.vol input{flex:1;accent-color:var(--moss);height:28px}
.vol span{font:800 13px Figtree;width:40px;text-align:right}
.vol .vlbl{font:800 13px Figtree;width:52px}
.vol.perf .vlbl small{display:block;font:500 11px Figtree;color:#6b665c;margin-top:2px}
.vol input.switch{flex:none;height:30px}
.switch{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:99px;background:#d8d0bd;position:relative;flex:none;transition:background .2s;margin:0}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch:checked{background:var(--moss)}.switch:checked::after{transform:translateX(22px)}
#pause .panel{padding:28px;display:flex;flex-direction:column;gap:10px;min-width:300px}
#pause h2{font:400 28px 'Young Serif';margin-bottom:6px}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
#arcadeBack{z-index:60;pointer-events:auto}
.htop{position:absolute;top:max(14px,env(safe-area-inset-top));left:max(128px,calc(env(safe-area-inset-left) + 110px));right:max(18px,env(safe-area-inset-right));display:flex;align-items:center;gap:14px}
.round{pointer-events:auto;width:44px;height:44px;border-radius:50%;background:rgba(244,236,217,.92);display:flex;align-items:center;justify-content:center;gap:4px}
.round span{width:4px;height:13px;border-radius:1px;background:var(--moss)}
#hudStage{font:400 16px 'Young Serif';white-space:nowrap;text-shadow:0 1px 0 rgba(244,236,217,.6)}
.prog{flex:1;height:6px;border-radius:3px;background:rgba(47,63,44,.2);position:relative}
#progFill{height:6px;border-radius:3px;background:var(--moss);width:0}
#progCairn{position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 2px var(--moss);transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;transition:background .3s}
#progCairn svg{display:block}
#progCairn.got{background:var(--moss)}
#progCairn.got svg{stroke:var(--paper)}#progCairn.got svg circle{fill:var(--paper)}
.spacer{flex:1}
.hpill{background:rgba(244,236,217,.92);border-radius:99px;padding:8px 12px;display:flex;gap:7px;align-items:center;font:800 14px Figtree}
.tumbles{display:flex;gap:5px}
.tumbles i{width:11px;height:11px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 1.5px var(--moss)}
.tumbles i.lost{background:transparent}
.hint{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));width:72px;height:72px;border-radius:50%;background:rgba(47,63,44,.5);display:flex;align-items:center;justify-content:center;transition:background .3s}
.hint.l{left:max(22px,env(safe-area-inset-left))}.hint.r{right:max(22px,env(safe-area-inset-right))}
.hint svg{animation:breathe 2.4s ease-in-out infinite}
.hint.r.wind{background:rgba(60,104,124,.88);animation:windpulse 1.1s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.08);opacity:1}}
@keyframes windpulse{0%,100%{box-shadow:0 0 0 0 rgba(191,227,240,0)}50%{box-shadow:0 0 0 14px rgba(191,227,240,.55)}}
.ibadge{display:inline-flex;align-items:center;justify-content:center;flex:none}
.seq{display:flex;align-items:center;gap:10px}
.seq .arr{font:800 20px Figtree;opacity:.55}
.seq .dim{opacity:.45}
#queued{position:absolute;left:50%;bottom:max(96px,calc(env(safe-area-inset-bottom) + 84px));transform:translateX(-50%);width:64px;height:64px;border-radius:50%;background:var(--moss);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(244,236,217,.9),0 8px 24px rgba(31,29,26,.3);transition:transform .15s}
#queued.on{transform:translateX(-50%) scale(1.12);background:var(--scarf)}
#subtitle{position:absolute;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(560px,693px);text-align:center;font:400 15px/1.45 'Young Serif';background:rgba(244,236,217,.86);padding:8px 16px;border-radius:12px;opacity:0;transition:opacity .5s}
#subtitle.on{opacity:1}
#tapHint{position:absolute;right:max(24px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));z-index:11;font:400 15px 'Young Serif';color:#2F3F2C;background:rgba(244,236,217,.92);padding:9px 16px;border-radius:99px;opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s;pointer-events:none}
#tapHint.on{opacity:1;transform:none;animation:tapPulse 2.4s ease-in-out .4s infinite}
@keyframes tapPulse{0%,100%{opacity:1}50%{opacity:.6}}
#banner{position:absolute;left:50%;top:72px;transform:translateX(-50%);max-width:min(680px,1146px);text-align:center;background:rgba(47,63,44,.92);color:var(--paper);font:700 15px/1.4 Figtree;padding:10px 16px;border-radius:14px;box-shadow:0 10px 30px rgba(31,29,26,.25)}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:30;background:var(--paper);color:var(--moss);border-radius:16px;padding:12px 18px;font:700 15px Figtree;display:flex;gap:10px;align-items:center;box-shadow:0 14px 40px rgba(31,29,26,.25);pointer-events:none;transition:opacity .3s;max-width:1066px;text-align:center}
#toast .serif{font-size:17px;font-weight:400}
#fade{position:fixed;inset:0;z-index:40;background:var(--paper);opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1}
#wheel{position:fixed;z-index:15;pointer-events:none}
#wheel svg{width:100%;height:100%;overflow:visible}
.sector path{fill:rgba(47,63,44,.85);transition:fill .12s}
.sector text{fill:var(--paper);font:800 11px Figtree;letter-spacing:.06em}
.sector.on path{fill:var(--paper)}
.sector.on text{fill:var(--moss)}
.sector.magic path{fill:rgba(60,104,124,.9)}
.sector.item path{fill:rgba(126,92,38,.9)}
.sector.item.on path{fill:var(--honey)}
.sector.item.on text{fill:var(--honey-ink)}
.sector.item.pending path{fill:rgba(237,195,106,.6)}
.sector.magic.on path{fill:var(--wind)}
.sector.magic.on text{fill:#1F3A47}
.sector.pending path{fill:rgba(244,236,217,.5);transition:fill .38s linear}
.sector.magic.pending path{fill:rgba(191,227,240,.6)}
.sector.glint path{animation:glint 0.9s ease-in-out infinite}
.cancel{fill:#1F2A1D}
.cancel-t{fill:var(--paper);font:700 9px Figtree;opacity:.85}
.slot-in{opacity:0;transform:scale(.3);transform-box:fill-box;transform-origin:center;transition:opacity .16s ease-out,transform .2s ease-out}
.loaded .slot-in{opacity:1;transform:scale(1)}
.slot{color:var(--moss)}
.slot-bg{fill:var(--paper)}
.slots-magic .slot-bg{fill:var(--wind)}
.slots-magic .slot{color:#1F3A47}
.slots-item .slot-bg{fill:var(--honey)}
.slots-item .slot{color:var(--honey-ink)}
.slot-empty{fill:none;stroke:rgba(244,236,217,.45);stroke-width:2;stroke-dasharray:4 4}
.slot.hover{color:#fff}
.slot.hover .slot-bg{fill:var(--scarf);stroke:var(--paper);stroke-width:4}
.slot.glint .slot-bg{animation:glint .9s ease-in-out infinite}
@keyframes glint{0%,100%{filter:none}50%{filter:brightness(1.25) drop-shadow(0 0 6px #fff)}}
#wheelLabel{position:absolute;left:50%;top:100%;transform:translate(-50%,6px);white-space:nowrap;background:var(--paper);color:var(--moss);font:800 14px Figtree;padding:8px 14px;border-radius:99px}
#hushWord{position:fixed;top:64px;left:max(24px,env(safe-area-inset-left));z-index:12;font:400 28px 'Young Serif';color:var(--paper);opacity:0;transition:opacity .2s;pointer-events:none}
body.hush #hushWord{opacity:1}
#rotate{position:fixed;inset:0;z-index:100;background:var(--moss);color:var(--paper);display:none;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;padding:30px;font:400 24px/1.3 'Young Serif'}
#rotate small{font:600 14px Figtree;opacity:.8}
@media (orientation:portrait){#rotate{display:flex}}

#root{position:fixed;left:50%;top:50%;width:1333px;height:690px;transform:translate(-50%,-50%) scale(var(--s,1));overflow:hidden;background:#DDEBE4}
</style>

body{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
.memory.has-img{flex-direction:row;align-items:flex-start;gap:14px}

<script data-arcade-back>
/* arcade-back v1 (knowledge/arcade-back.md). "← Games" = the browser's back button.
   Any link whose href is exactly ../../index.html goes BACK in history when this page was opened
   from the arcade home, so home comes back as it was left (scroll position, no reload).
   Opened any other way (bookmark, direct URL, dev tool), the link just navigates as normal. */
(function () {
  document.addEventListener('click', function (e) {
    if (e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (!a || a.getAttribute('href') !== '../../index.html') return;
    var home = new URL(a.href), ref;
    try { ref = new URL(document.referrer); } catch (err) { return; }
    var dir = home.pathname.replace(/index\.html$/, '');
    if (ref.origin !== home.origin || (ref.pathname !== home.pathname && ref.pathname !== dir) || history.length < 2) return;
    e.preventDefault();
    var go = function () { location.href = home.href; };
    // Still on this page after going back (an in-game history entry) or nothing happened: go home directly.
    addEventListener('popstate', go, { once: true });
    var t = setTimeout(go, 2500);
    addEventListener('pagehide', function () { clearTimeout(t); }, { once: true });
    history.back();
  });
})();
</script>

(function () {

    'Soul & freestyle': ['Northern Soul Dance', 'Northern Soul Floor Combo', 'Northern Soul Floor Spin', 'Northern Soul Spin', 'Northern Soul Spin Combo', 'Butterfly Twirl', ...n('Dancing', 5), 'Dancing Maraschino Step'],
    'Held poses': [...n('Female Dance Pose', 5), ...n('Male Dance Pose', 3)]

    const base = opts.base || 'research/animations/';
    const loader = new FBXLoader();
    const bones = []; model.traverse(o => { if (o.isBone) bones.push(o); });
    const bare = s => s.replace(/^mixamorig\d*[:_]?/i, '');

    const DANCE_SET = new Set(Object.values(DANCES).flat());
    const cache = {};
    let hipRatio = restHips.y / 94;

        const bone = byBare[node]; if (!bone) continue;
        if (prop === 'position' && node !== 'Hips') continue;
        if (prop === 'scale') continue;

        if (node === 'Hips' && prop === 'position') { const v = nt.values, x0 = v[0], z0 = v[2]; for (let i = 0; i < v.length; i += 3) { v[i] = travel ? restHips.x + (v[i] - x0) * hipRatio : restHips.x; v[i + 1] *= hipRatio; v[i + 2] = travel ? restHips.z + (v[i + 2] - z0) * hipRatio : restHips.z; } }

      get jumpPhase() { return S.phase; }, get jT() { return S.jT; }, get jumpHalf() { return S.jump ? S.jump.dur / 2 : 0.5; }, get dancing() { return !!S.dance; }, get danceW() { return S.wD; },

      async setJump(name) { try { const j = await load(name); if (S.jump) { S.jump.low.stop(); S.jump.up.stop(); } S.phase = null; S.jT = 0; S.jump = { low: act(j.lower, true, true), up: act(j.upper, true, true), dur: j.dur, name }; api.hasJump = true; } catch (e) { console.info('Jump animation not loaded', e.message || e); } },
      async init(runName, jumpName) {
        const st = loadSettings();

      },
      jumpStart() { if (!S.jump || S.phase) return false; S.jT = 0; S.phase = 'up'; S.jTarget = 1; return true; },
      jumpRelease() { if (S.phase === 'hold' || S.phase === 'up') S.phase = 'down'; },
      jumpCancel() { if (S.phase) { S.phase = 'out'; S.jTarget = 0; } },
      async playUpper(name, speed) { if (!name) return; try { const c = await load(name); if (S.over) S.over.a.stop(); S.over = { a: act(c.upper, true, true), dur: c.dur, sp: speed || loadSettings().actionSpeed || 1 }; S.oT = 0; S.oTarget = 1; } catch (e) { console.info('Action not loaded', name); } },
      async playDance(name) { const c = await load(name); if (S.dance) S.dance.a.stop(); S.dance = { a: act(c.full), dur: c.dur, name }; S.dTarget = 1; return c.dur; },
      stopDance() { S.dTarget = 0; },
      // Scrubbed full-body clips: the game sets the clip time from its own progress (e.g. how far over a wall),
      // so the animation lands exactly when the body does. lockY keeps the hips at rest height (the game lifts the body).
      scrub(name, f, lockY = true) {

G(1, '2-3', 'Hive Rows', ['pose:reach', 'item:honeycomb'], [], ['pose:reach', 'honeycomb', 'apple', 'pose', 'gust'],

G(1, '2-4', 'The Leaf Barrow', [], ['whirl', 'lift'], ['whirl', 'lift', 'honeycomb', 'apple', 'pose'],
