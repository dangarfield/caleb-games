<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skyborn · Text Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Nunito:wght@600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..700,0..1,0&display=block">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#fff6e8;--dim:rgba(255,246,232,.66);--line:rgba(255,255,255,.14);--acc:oklch(0.72 0.16 50)}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,oklch(0.27 0.06 300) 0%,oklch(0.33 0.08 330) 45%,oklch(0.26 0.05 40) 100%) fixed;padding:20px 24px 60px;min-height:100vh}
a{color:oklch(0.82 0.13 70)}a:hover{color:oklch(0.9 0.12 80)}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
.ms{font-family:'Material Symbols Rounded';font-size:20px;line-height:1;font-variation-settings:'FILL' 1;vertical-align:middle}
header{display:flex;align-items:center;gap:12px 14px;flex-wrap:wrap;margin-bottom:16px}
h1{font:900 34px/1 'Cinzel Decorative',serif}.sub{font:700 14px/1.4 Nunito;color:var(--dim);max-width:560px}.grow{flex:1}
.pill{height:40px;padding:0 16px 0 12px;border-radius:20px;background:rgba(0,0,0,.35);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;font:800 14px/1 Nunito;white-space:nowrap;text-decoration:none;color:var(--ink)}
.pill:hover{background:rgba(255,255,255,.08)}.pill.orange{background:var(--acc);border-color:transparent;color:#fff}
.search{height:40px;width:240px;border-radius:20px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--ink);font:700 14px Nunito;padding:0 16px}
.base{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.base > div{border-radius:20px;background:rgba(20,12,24,.6);border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.base h3{display:flex;align-items:center;gap:8px;font:900 17px/1 Nunito}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
nav a{height:34px;padding:0 14px;border-radius:17px;background:rgba(0,0,0,.3);display:inline-flex;align-items:center;gap:6px;font:800 13px/1 Nunito;text-decoration:none;color:var(--ink);white-space:nowrap}
nav a .n{font:800 11px/1 Nunito;padding:3px 6px;border-radius:999px;background:rgba(255,255,255,.14)}
section{border-radius:20px;background:rgba(20,12,24,.55);border:1px solid var(--line);padding:16px;margin-bottom:16px}
section h2{font:900 20px/1 Nunito;display:flex;align-items:center;gap:10px}section > p{font:700 13px/1.4 Nunito;color:var(--dim);margin:6px 0 12px}
.row,.hd{display:grid;grid-template-columns:140px 104px 240px minmax(0,1fr) 170px 104px;gap:10px}
.row{align-items:start;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);margin-top:8px}
.row.edited{border-color:color-mix(in oklch,var(--acc) 60%,transparent)}
.hd{padding:0 12px;font:800 11px/1 Nunito;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.id{font:700 12px/1.3 'JetBrains Mono',monospace;color:var(--dim);word-break:break-all;padding-top:8px}
.flag{height:28px;padding:0 10px;border-radius:14px;font:900 12px/28px Nunito;letter-spacing:.06em;text-transform:uppercase;text-align:center;margin-top:3px}
.flag.Narrator{background:oklch(0.55 0.1 260)}.flag.Rider{background:oklch(0.62 0.16 50)}.flag.Character{background:oklch(0.5 0.08 160)}
textarea{width:100%;min-height:34px;resize:vertical;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--ink);font:700 15px/1.45 Nunito;padding:6px 10px}
textarea.dir{font:700 13px/1.35 Nunito;color:oklch(0.9 0.06 80)}
.when{font:700 12px/1.35 Nunito;color:var(--dim);padding-top:8px}
.acts{display:flex;gap:2px;padding-top:2px}.acts button{width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}.acts button:hover{background:rgba(255,255,255,.1)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:12px 20px;border-radius:999px;background:rgba(20,12,24,.85);font:800 15px/1 Nunito;opacity:0;transition:opacity .3s;pointer-events:none}.toast.show{opacity:1}
@media (max-width:1100px){.row{grid-template-columns:1fr 1fr}.hd{display:none}.base{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div><h1>Text Lab</h1><div class="sub">Every voiced line in Skyborn. Narrator and Rider lines combine the base voice below with each line's direction (the emotion). Character lines carry their own complete direction. Edits save on this device.</div></div>
  <div class="grow"></div>
  <input class="search" id="q" placeholder="Search lines…">
  <button class="pill" id="copyJson"><span class="ms">data_object</span>Copy JSON</button>
  <button class="pill" id="copyScript"><span class="ms">description</span>Copy script</button>
  <button class="pill" id="saveScript"><span class="ms">download</span>Save script (.md)</button>
  <button class="pill" id="saveJson"><span class="ms">download</span>Save JSON</button>
  <button class="pill" id="reset"><span class="ms">restart_alt</span>Reset edits</button>
  <a class="pill orange" href="soundlab.html"><span class="ms">graphic_eq</span>Sound Lab</a>
</header>
<div class="base">
  <div><h3><span class="flag Narrator">Narrator</span>Base voice prompt</h3><textarea id="base-Narrator" rows="3"></textarea></div>
  <div><h3><span class="flag Rider">Rider</span>Base voice prompt</h3><textarea id="base-Rider" rows="3"></textarea></div>
</div>
<nav id="nav"></nav>
<main id="main"></main>
<div class="toast" id="toast"></div>
<script>
const SECTIONS = [{"id":"intro","title":"Intro story","note":"Narrator. One line per intro screen.","lines":[{"id":"intro.1","sp":"Narrator","dir":"Calm and wistful, setting the scene","text":"Long ago, dragons and riders flew together over Emberreach.","when":"Intro screen 1"},{"id":"intro.2","sp":"Narrator","dir":"Quieter, a little sad","text":"Then the clouds rolled in. The Dragon Towers went cold, and the dragons fell asleep.","when":"Intro screen 2"},{"id":"intro.3","sp":"Narrator","dir":"Low and slightly ominous","text":"Sky pirates took the winds, led by the Pirate King in his floating fortress.","when":"Intro screen 3"},{"id":"intro.4","sp":"Narrator","dir":"Warm, hopeful, gentle wonder","text":"But one egg stayed warm. A young wind dragon called Breeze has hatched, and she has chosen you.","when":"Intro screen 4"},{"id":"intro.5","sp":"Narrator","dir":"Rousing and encouraging, building up","text":"Light the towers, wake the dragons, and set Emberreach free. Fly, rider!","when":"Intro screen 5"}]},{"id":"title","title":"Title screen","note":"Narrator.","lines":[{"id":"title.story","sp":"Narrator","dir":"Warm storytelling, steady pace","text":"Emberreach has slept under the clouds for a hundred years. Its Dragon Towers have gone cold, and sky raiders rule the winds. You and Breeze are the first riders to fly in an age.","when":"Title screen story"},{"id":"title.name","sp":"Narrator","dir":"Grand, announcing the title","text":"Skyborn.","when":"Title logo"}]},{"id":"regions","title":"Entering a region","note":"Rider.","lines":[{"id":"region.0","sp":"Rider","dir":"Happy, relieved","text":"Home sweet home! Hearthvale!","when":"Entering Hearthvale"},{"id":"region.1","sp":"Rider","dir":"Amazed, a bit hot and bothered","text":"Whoa, Cinder Peaks! It’s so hot here!","when":"Entering Cinder Peaks"},{"id":"region.2","sp":"Rider","dir":"Thrilled but holding on tight","text":"Stormcrown! Hold on tight, Breeze, it’s windy!","when":"Entering Stormcrown"},{"id":"region.3","sp":"Rider","dir":"Shivering, excited","text":"Brrr! Frostfang! Look at all the snow!","when":"Entering Frostfang Heights"},{"id":"region.4","sp":"Rider","dir":"Wide-eyed wonder","text":"Woah, the Sunken Reach! Look at the sea!","when":"Entering Sunken Reach"},{"id":"region.5","sp":"Rider","dir":"Breathless awe","text":"The Sky Isles! We’re above the clouds!","when":"Entering Sky Isles"}]},{"id":"barriers","title":"Locked regions","note":"Rider.","lines":[{"id":"barrier.cinder","sp":"Rider","dir":"Yelping, pulling back from heat","text":"Ow ow ow, too hot! We need a fire dragon for that lava.","when":"Cinder Peaks edge"},{"id":"barrier.stormcrown","sp":"Rider","dir":"Startled, then determined","text":"Whoa! The storm threw us back! We need something super fast to smash through.","when":"Stormcrown edge"},{"id":"barrier.frostfang","sp":"Rider","dir":"Teeth chattering","text":"Brrr! That blizzard is way too cold. We need an ice dragon!","when":"Frostfang edge"},{"id":"barrier.reach","sp":"Rider","dir":"Worried, wondering","text":"The waves are too big out here! If only we could swim…","when":"Sunken Reach edge"},{"id":"barrier.sky","sp":"Rider","dir":"Gasping, out of breath","text":"I can’t breathe up here! We need a dragon that can fly really, really high.","when":"Sky Isles ceiling"}]},{"id":"towers","title":"Towers, nests and eggs","note":"Rider.","lines":[{"id":"tower.land","sp":"Rider","dir":"Eager, urging","text":"Here’s the brazier! Breathe fire into it!","when":"Landing on an unlit tower · variant 1 of 3"},{"id":"tower.land.v2","sp":"Rider","dir":"Eager, urging","text":"The brazier! Light it up!","when":"Landing on an unlit tower · variant 2 of 3"},{"id":"tower.land.v3","sp":"Rider","dir":"Eager, urging","text":"Quick, breathe on the brazier!","when":"Landing on an unlit tower · variant 3 of 3"},{"id":"tower.lit","sp":"Rider","dir":"Cheering, triumphant","text":"Woohoo! Tower lit!","when":"A tower lights · variant 1 of 4"},{"id":"tower.lit.v2","sp":"Rider","d ath while carrying · variant 1 of 3"},{"id":"egg.noFire.v2","sp":"Rider","dir":"Quick warning, a bit panicky","text":"No fire! Don’t burn the egg!","when":"Pressing Breath while carrying · variant 2 of 3"},{"id":"egg.noFire.v3","sp":"Rider","dir":"Quick warning, a bit panicky","text":"Careful! No breathing fire now!","when":"Pressing Breath while carrying · variant 3 of 3"},{"id":"home.welcome","sp":"Rider","dir":"Overjoyed","text":"We’re home! Woohoo!","when":"Landing at the Aerie · variant 1 of 3"},{"id":"home.welcome.v2","sp":"Rider","dir":"Overjoyed","text":"Back home!","when":"Landing at the Aerie · variant 2 of 3"},{"id":"home.welcome.v3","sp":"Rider","dir":"Overjoyed","text":"Home again! Phew!","when":"Landing at the Aerie · variant 3 of 3"},{"id":"hatchery.next","sp":"Rider","dir":"Curious, encouraging","text":"There’s another egg out there somewhere. Let’s light some more towers!","when":"Hatchery hint"}]},{"id":"champions","title":"Champions","note":"Rider.","lines":[{"id":"champ.hearthvale","sp":"Rider","dir":"Amazed, a bit scared","text":"Whoa, that pirate ship is massive!","when":"Champion appears: hearthvale"},{"id":"champ.cinder","sp":"Rider","dir":"Shocked disbelief","text":"A metal dragon?! No way!","when":"Champion appears: cinder"},{"id":"champ.stormcrown","sp":"Rider","dir":"Nervous, creeped out","text":"Is that cloud… looking at us?!","when":"Champion appears: stormcrown"},{"id":"champ.frostfang","sp":"Rider","dir":"Squealing, startled","text":"Eek, it’s a giant ice snake!","when":"Champion appears: frostfang"},{"id":"champ.reach","sp":"Rider","dir":"Panicky, almost laughing","text":"Tentacles! Tentacles everywhere!","when":"Champion appears: reach"},{"id":"champ.sky","sp":"Rider","dir":"Serious, brave, steady","text":"This is it. The Pirate King!","when":"Champion appears: sky"},{"id":"champ.rematch","sp":"Rider","dir":"Cocky, fired up","text":"Round two! Let’s show them who rules the sky!","when":"Rematch starts"},{"id":"champ.again","sp":"Rider","dir":"Triumphant, giddy","text":"We beat it again! We’re unstoppable!","when":"Rematch won"},{"id":"champ.left","sp":"Rider","dir":"Slightly disappointed, promising","text":"Okay, we’ll come back later.","when":"Flying away from a champion fight"},{"id":"champ.reinforce","sp":"Rider","dir":"Alarmed","text":"More of them?! Watch out!","when":"The champion calls for help · variant 1 of 3"},{"id":"champ.reinforce.v2","sp":"Rider","dir":"Alarmed","text":"They brought friends!","when":"The champion calls for help · variant 2 of 3"},{"id":"champ.reinforce.v3","sp":"Rider","dir":"Alarmed","text":"Even more?! Keep going!","when":"The champion calls for help · variant 3 of 3"},{"id":"ending","sp":"Rider","dir":"Ecstatic, shouting with joy","text":"We did it! We actually did it! Emberreach is free! WOOHOO!","when":"Final victory"}]},{"id":"hatch","title":"Hatching","note":"Rider.","lines":[{"id":"hatch.tap","sp":"Rider","dir":"Whispering, excited","text":"Shh… tap it gently…","when":"Hatch starts"},{"id":"hatch.wobble","sp":"Rider","dir":"Giggling","text":"It wobbled! Again, again!","when":"First tap · variant 1 of 3"},{"id":"hatch.wobble.v2","sp":"Rider","dir":"Giggling","text":"It moved! Do it again!","when":"First tap · variant 2 of 3"},{"id":"hatch.wobble.v3","sp":"Rider","dir":"Giggling","text":"Wobble wobble!","when":"First tap · variant 3 of 3"},{"id":"hatch.crack1","sp":"Rider","dir":"Gasp","text":"Oooh, a crack!","when":"Second tap"},{"id":"hatch.crack2","sp":"Rider","dir":"Squealing with excitement","text":"It’s hatching!","when":"Third tap"},{"id":"hatch.Ember","sp":"Rider","dir":"Delighted, meeting a new friend","text":"Hi Ember! You can fly right over lava!","when":"Ember hatches"},{"id":"hatch.Storm","sp":"Rider","dir":"Delighted, meeting a new friend","text":"Hi Storm! Lightning Dash, that’s so cool!","when":"Storm hatches"},{"id":"hatch.Frost","sp":"Rider","dir":"Delighted, meeting a new friend","text":"Hi Frost! You can fly through blizzards!","when":"Frost hatches"},{"id":"hatch.Tide","sp":"Rider","dir":"Delighted, meeting a new friend","text":"Hi Tide! You can swim underwater!","when":"Tide hatches"},{"id":"hatch.Gold","sp":"Rider","dir":"Delighted, meeting a new friend","text":"Hi Gold! You can fly higher than anyone!","when":"Gold hatches"}]},{"id":"combat","title":"Battle","note":"Rider.","lines":[{"id":"combat.incoming","sp":"Rider","dir":"Alarmed, shouting","text":"Whoa, incoming!","when":"Enemies arrive · variant 1 of 4"},{"id":"combat.incoming.v2","sp":"Rider","dir":"Alarmed, shouting","text":"Look out, here they come!","when":"Enemies arrive · variant 2 of 4"},{"id":"combat.incoming.v3","sp":"Rider","dir":"Alarmed, shouting","text":"Uh oh, enemies!","when":"Enemies arrive · variant 3 of 4"},{"id":"combat.incoming.v4","sp":"Rider","dir":"Alarmed, shouting","text":"Heads up, incoming!","when":"Enemies arrive · variant 4 of 4"},{"id":"combat.enemies","sp":"Rider","dir":"Urgent","text":"Enemies! Slow down!","when":"Soar interrupted by enemies"},{"id":"combat.here","sp":"Rider","dir":"Determined","text":"Here they come!","when":"Favour fight starts · variant 1 of 3"},{"id":"combat.here.v2","sp":"Rider","dir":"Determined","text":"Here we go!","when":"Favour fight starts · variant 2 of 3"},{"id":"combat.here.v3","sp":"Rider","dir":"Determined","text":"Get ready!","when":"Favour fight starts · variant 3 of 3"},{"id":"combat.dodge","sp":"Rider","dir":"Cocky, laughing","text":"Ha! Missed me!","when":"Rolling through an attack · variant 1 of 4"},{"id":"combat.dodge.v2","sp":"Rider","dir":"Cocky, laughing","text":"Whoosh! Too slow!","when":"Rolling through an attack · variant 2 of 4"},{"id":"combat.dodge.v3","sp":"Rider","dir":"Cocky, laughing","text":"Nope! Can’t catch us!","when":"Rolling through an attack · variant 3 of 4"},{"id":"combat.dodge.v4","sp":"Rider","dir":"Cocky, laughing","text":"Nice dodge!","when":"Rolling through an attack · variant 4 of 4"},{"id":"combat.ouch","sp":"Rider","dir":"Short pained yelp" avour done"},{"id":"fav.start","sp":"Rider","dir":"Keen, helpful","text":"Okay! We’ll help!","when":"Accepting a favour · variant 1 of 3"},{"id":"fav.start.v2","sp":"Rider","dir":"Keen, helpful","text":"Sure! Leave it to us!","when":"Accepting a favour · variant 2 of 3"},{"id":"fav.start.v3","sp":"Rider","dir":"Keen, helpful","text":"We can do that! Let’s go!","when":"Accepting a favour · variant 3 of 3"},{"id":"fav.done","sp":"Rider","dir":"Proud and happy","text":"Favour done! That was fun!","when":"Favour complete · variant 1 of 3"},{"id":"fav.done.v2","sp":"Rider","dir":"Proud and happy","text":"We did it! Happy to help!","when":"Favour complete · variant 2 of 3"},{"id":"fav.done.v3","sp":"Rider","dir":"Proud and happy","text":"All done! That was easy!","when":"Favour complete · variant 3 of 3"}]}];
const BASE0 = {"Narrator":"A warm, deep-voiced american storyteller, aged mentor.","Rider":"Bright and encouraging young boy, english accent."};
const KEY = 'skyborn-textlab-v3', $ = id => document.getElementById(id);
let edits = {}; try { edits = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
if (!edits._b2) { delete edits['base.Narrator']; delete edits['base.Rider']; edits._b2 = 1; localStorage.setItem(KEY, JSON.stringify(edits)); }
const base = sp => (edits['base.' + sp] && edits['base.' + sp].text) ?? BASE0[sp] ?? '';
const save = () => localStorage.setItem(KEY, JSON.stringify(edits));
const toast = t => { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2000); };
const cur = l => ({ ...l, dir: (edits[l.id] && edits[l.id].dir) ?? l.dir, text: (edits[l.id] && edits[l.id].text) ?? l.text });
const prompt = l => l.sp === 'Character' ? l.dir : base(l.sp) + ' ' + l.dir + '.';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const copy = async t => { try { await navigator.clipboard.writeText(t); return true; } catch (e) {} try { const a = document.createElement('textarea'); a.value = t; a.style.position = 'fixed'; a.style.opacity = '0'; document.body.appendChild(a); a.select(); const ok = document.execCommand('copy'); a.remove(); return ok; } catch (e) { return false; } };
['Narrator', 'Rider'].forEach(sp => { const t = $('base-' + sp); t.value = base(sp); t.oninput = () => { if (t.value === BASE0[sp]) delete edits['base.' + sp]; else edits['base.' + sp] = { text: t.value }; save(); }; });
function render() {
  const q = $('q').value.trim().toLowerCase();
  $('nav').innerHTML = SECTIONS.map(s => `<a href="#s-${s.id}">${s.title}<span class="n">${s.lines.length}</span></a>`).join('');
  $('main').innerHTML = SECTIONS.map(s => { const ls = s.lines.map(cur).filter(l => !q || (l.text + ' ' + l.dir + ' ' + l.id + ' ' + l.when + ' ' + l.sp).toLowerCase().includes(q)); if (!ls.length) return '';
    return `<section id="s-${s.id}"><h2><span class="ms">record_voice_over</span>${s.title}</h2><p>${s.note}</p><div class="hd"><span>ID</span><span>Speaker</span><span>Voice direction</span><span>Line</span><span>When it plays</span><span></span></div>${ls.map(l => `<div class="row ${edits[l.id] ? 'edited' : ''}" data-id="${l.id}"><span class="id">${l.id}</span><span class="flag ${l.sp}">${l.sp}</span><textarea class="dir" data-f="dir" rows="${Math.max(1, Math.ceil(l.dir.length / 34))}">${esc(l.dir)}</textarea><textarea data-f="text" rows="${Math.max(1, Math.ceil(l.text.length / 60))}">${esc(l.text)}</textarea><span class="when">${esc(l.when)}</span><span class="acts"><button title="Copy voice prompt" data-cv><span class="ms">record_voice_over</span></button><button title="Copy line" data-cp><span class="ms">content_copy</span></button><button title="Undo edit" data-undo><span class="ms">undo</span></button></span></div>`).join('')}</section>`; }).join('');
  document.querySelectorAll('.row').forEach(r => { const id = r.dataset.id, b0 = SECTIONS.flatMap(s => s.lines).find(l => l.id === id);
    r.querySelectorAll('[data-f]').forEach(inp => inp.oninput = () => { const f = inp.dataset.f; edits[id] = edits[id] || {}; if (inp.value === b0[f]) delete edits[id][f]; else edits[id][f] = inp.value; if (!Object.keys(edits[id]).length) delete edits[id]; r.classList.toggle('edited', !!edits[id]); save(); });
    r.querySelector('[data-cv]').onclick = () => { copy(prompt(cur(b0))); toast('Voice prompt copied'); };
    r.querySelector('[data-cp]').onclick = () => { copy(r.querySelector('[data-f=text]').value); toast('Line copied'); };
    r.querySelector('[data-undo]').onclick = () => { delete edits[id]; save(); render(); toast('Edit undone'); }; });
}
$('q').oninput = render;
$('copyJson').onclick = async () => { const ok = await copy(jsonText()); toast(ok ? 'All lines copied as JSON' : 'Copy is blocked here. Use Save JSON instead.'); };
// Copy script: Breeze TTS voiceover format. One level-4 clip per line; > voice = base voice + this line's direction (Narrator/Rider), or the character's own direction.
const scriptText = () => { const clip = l => { const ref = l.sp === 'Character' ? '' : '\n> ref: ' + l.sp.toLowerCase(); return '#### `' + l.id.replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '.mp3`\n> voice: ' + prompt(l) + ref + '\n_' + l.when + '._\n\n```text\n' + l.text + '\n```'; };
  return SECTIONS.map(s => '## ' + s.title + '\n\n' + s.lines.map(cur).map(clip).join('\n\n')).join('\n\n\n') + '\n'; };
const jsonText = () => JSON.stringify({ voices: { Narrator: base('Narrator'), Rider: base('Rider') }, sections: SECTIONS.map(s => ({ section: s.title, lines: s.lines.map(cur).map(l => ({ id: l.id, speaker: l.sp, direction: l.dir, voicePrompt: prompt(l), text: l.text, when: l.when })) })) }, null, 2);
const download = (name, text, type) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); };
$('copyScript').onclick = async () => { const ok = await copy(scriptText()); toast(ok ? 'Script copied in voiceover format' : 'Copy is blocked here. Use Save script instead.'); };
$('saveScript').onclick = () => { download('skyborn-voiceover.md', scriptText(), 'text/markdown'); toast('Saved skyborn-voiceover.md'); };
$('saveJson').onclick = () => { download('skyborn-text.json', jsonText(), 'application/json'); toast('Saved skyborn-text.json'); };
$('reset').onclick = () => { if (!confirm('Undo all your edits, including the base voices?')) return; edits = {}; save(); ['Narrator', 'Rider'].forEach(sp => { $('base-' + sp).value = BASE0[sp]; }); render(); toast('All edits undone'); };
render();
</script>
