<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Pin Pals - Garfield Boys' Arcade</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@600;700&family=New+Rocker&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--u:min(1vw,1.932vh);--ink:#f6efe4;--mut:rgba(246,239,228,.72);--line:rgba(246,239,228,.16);--wood:#1e1712;
  --brass:#d4a24c;--accRGB:212,162,76;--acc2:#f6efe4;--acc3:#b3261e;--onAcc:#1e1712;--panelRGB:30,23,18;--sheet:#2a2019;--panel:rgba(var(--panelRGB),.78)}
/* UI theme per lane: primary (go, best, coins, strikes) · secondary (spares, ivory emphasis) · tertiary (alerts) */
body{--panel:rgba(var(--panelRGB),.78)}
body[data-alley="metal"] #mTag{font-size:calc(1.45*var(--u));letter-spacing:.34em;gap:calc(1.5*var(--u))}   /* Oswald is condensed: widen so the tagline matches the other lanes */
body[data-alley="cosmic"]{--brass:#29f0ff;--accRGB:41,240,255;--acc2:#ff3df2;--acc3:#ffd84d;--onAcc:#07051a;--panelRGB:14,10,40;--sheet:#130e36;--ink:#eef6ff;--mut:rgba(238,246,255,.72);--line:rgba(160,220,255,.18)}
body[data-alley="metal"]{--brass:#ff5a1f;--accRGB:255,90,31;--acc2:#d9d6d0;--acc3:#ffc23a;--onAcc:#120d0c;--panelRGB:18,15,16;--sheet:#1c1718;--ink:#f1ece4;--mut:rgba(241,236,228,.72);--line:rgba(241,236,228,.16)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--onAcc);overflow:hidden;touch-action:none;font-family:'Bricolage Grotesque',system-ui,sans-serif;color:var(--ink);
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;-webkit-tap-highlight-color:transparent}
img,a,canvas{-webkit-user-drag:none}
input,textarea{-webkit-user-select:text;user-select:text}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}

#backBtn{position:fixed;top:12px;left:12px;z-index:9999;display:flex;align-items:center;gap:calc(.6*var(--u));height:max(44px,calc(3.6*var(--u)));padding:0 calc(1.3*var(--u)) 0 calc(1*var(--u));
  background:rgba(var(--panelRGB),.88);color:var(--ink);text-decoration:none;border-radius:calc(.8*var(--u));border:1px solid var(--line);
  font:700 max(14px,calc(1.15*var(--u)))/1 'Bricolage Grotesque',system-ui,sans-serif;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  transition:background 0.2s,opacity .25s;white-space:nowrap}
#backBtn .ic{width:1.3em;height:1.3em}
  font:700 15px/1 'Bricolage Grotesque',system-ui,sans-serif;border:1px solid rgba(246,239,228,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:background 0.2s,opacity .25s;white-space:nowrap}
#backBtn:hover{background:rgba(42,32,25,.95)}
body.throwing #backBtn{opacity:.35}

#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
.panel{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;pointer-events:auto;touch-action:manipulation}
.btn{display:flex;align-items:center;justify-content:center;border-radius:calc(.8*var(--u));min-height:max(52px,calc(4.2*var(--u)));font-weight:600;font-size:calc(1.3*var(--u));padding:0 calc(1.8*var(--u));white-space:nowrap;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--brass);color:var(--onAcc);font-weight:800;font-size:calc(1.7*var(--u));box-shadow:0 calc(.6*var(--u)) calc(2*var(--u)) rgba(0,0,0,.35)}
.btn.sec{border:1px solid rgba(246,239,228,.2)}
.seg{display:flex;padding:calc(.3*var(--u));border-radius:calc(2*var(--u));background:rgba(246,239,228,.1);font-size:calc(1.15*var(--u));font-weight:600}
.seg button{padding:calc(.7*var(--u)) calc(1.4*var(--u));border-radius:calc(2*var(--u));color:rgba(246,239,228,.8);min-height:44px;white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--onAcc)}
.dot{border-radius:50%;box-shadow:0 0 0 1px rgba(246,239,228,.45);flex:none}

/* HUD */
#hud{position:absolute;inset:0;transition:opacity .25s}
#score{position:absolute;top:calc(.9*var(--u));left:50%;padding:calc(.5*var(--u)) calc(.6*var(--u));border-radius:calc(.8*var(--u));display:grid;gap:calc(.2*var(--u));align-items:center;
  opacity:0;pointer-events:none;transform:translate(-50%,calc(-1.2*var(--u)));transition:opacity .28s ease,transform .28s cubic-bezier(.2,.8,.2,1);max-width:calc(100vw - 2*max(52px,calc(3.9*var(--u))) - 4*var(--u))}
#score.open{opacity:1;transform:translate(-50%,0)}
.dim{opacity:.55}

.sname{display:flex;align-items:center;gap:calc(.5*var(--u));padding:0 calc(.6*var(--u)) 0 calc(.3*var(--u));font-size:calc(1.05*var(--u));font-weight:700;white-space:nowrap}
.snum{text-align:center;font-size:calc(.75*var(--u));font-weight:600;color:rgba(246,239,228,.55)}
.scell{min-width:calc(2.8*var(--u));padding:0 calc(.2*var(--u));height:calc(2.6*var(--u));border-radius:calc(.4*var(--u));background:rgba(246,239,228,.05);display:flex;flex-direction:column;align-items:center;justify-content:center}
.scell.cur{box-shadow:inset 0 0 0 calc(.15*var(--u)) var(--brass)}
.scell.fx,.ocell.fx{background:var(--brass)!important;color:var(--onAcc)}
.scell.fs,.ocell.fs{background:var(--acc2)!important;color:var(--onAcc)}
.scell.fx .mk,.scell.fs .mk,.ocell.fx .mk,.ocell.fs .mk{color:rgba(var(--panelRGB),.8)!important}
.scell .mk{font-size:calc(.85*var(--u));font-weight:600;letter-spacing:.06em;color:rgba(246,239,228,.75);min-height:calc(1*var(--u));white-space:nowrap;line-height:1.15}
.scell .tt{font-size:calc(1.05*var(--u));font-weight:700;min-height:calc(1.1*var(--u));line-height:1.15}
.stot{min-width:calc(3.4*var(--u));text-align:center;font-size:calc(1.4*var(--u));font-weight:800}
#pauseBtn{flex:none;width:max(52px,calc(3.9*var(--u)));height:max(52px,calc(3.9*var(--u)));border-radius:50%;display:flex;align-items:center;justify-content:center;gap:calc(.45*var(--u));background:rgba(246,239,228,.08);border:1px solid var(--line);transition:opacity .25s}
#pauseBtn i{width:calc(.4*var(--u));min-width:4px;height:calc(1.4*var(--u));min-height:16px;border-radius:2px;background:var(--ink)}
#side{position:absolute;top:calc(.9*var(--u));right:calc(.9*var(--u));min-width:calc(15*var(--u));padding:calc(.7*var(--u));border-radius:calc(1.2*var(--u));display:flex;flex-direction:column;gap:calc(.7*var(--u));transition:opacity .25s}
#sdHead{display:flex;align-items:center;justify-content:space-between;gap:calc(1*var(--u));padding-left:calc(.4*var(--u))}
#sdBody{display:flex;flex-direction:column}
#sdSkip{display:flex;align-items:center;justify-content:space-between;gap:calc(.6*var(--u));min-height:36px;padding:0 calc(.4*var(--u));font-size:calc(.85*var(--u));line-height:1;font-weight:700;color:var(--mut);white-space:nowrap}
#sdSkip .tog{width:calc(2.6*var(--u));height:calc(1.5*var(--u));padding:calc(.2*var(--u))}
#sdSkip .tog i{width:calc(1.1*var(--u));height:calc(1.1*var(--u))}
#sdSkip.on{color:var(--ink)}
.fc{font-size:calc(.85*var(--u));font-weight:800;letter-spacing:.04em;padding:calc(.2*var(--u)) calc(.45*var(--u));border-radius:calc(.4*var(--u));background:rgba(246,239,228,.1);color:var(--ink);min-width:calc(2.2*var(--u));text-align:center;white-space:nowrap;flex:none}
.fc.x{background:var(--brass);color:var(--onAcc)}
.fc.sp{background:var(--ink);color:var(--onAcc)}
.fc.now{background:transparent;box-shadow:inset 0 0 0 calc(.12*var(--u)) var(--brass);color:var(--brass)}
.fc.old{opacity:.7}
#guide{position:absolute;left:50%;top:0;pointer-events:none;opacity:0;transition:opacity .3s}
#guide.on{opacity:1}
#gPath{position:absolute;left:0;width:calc(.25*var(--u));min-width:2px;margin-left:calc(-.125*var(--u));background:repeating-linear-gradient(180deg,rgba(246,239,228,.5) 0 calc(.6*var(--u)),transparent calc(.6*var(--u)) calc(1.2*var(--u)))}
#gDot{position:absolute;left:0;top:0;width:calc(5*var(--u));height:calc(5*var(--u));margin:calc(-2.5*var(--u)) 0 0 calc(-2.5*var(--u));border-radius:50%;background:rgba(246,239,228,.22);box-shadow:0 0 0 calc(.2*var(--u)) rgba(246,239,228,.85);animation:gMove 3.6s ease-in-out infinite}
#gDot::after{content:'';position:absolute;inset:calc(-.9*var(--u));border-radius:50%;box-shadow:0 0 0 calc(.25*var(--u)) var(--brass);opacity:0;animation:gRing 3.6s ease-in-out infinite}
#gLabel{position:absolute;left:calc(4*var(--u));top:0;transform:translateY(-50%);display:flex;flex-direction:column;gap:calc(.3*var(--u));white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.7)}
#gLabel b{font-size:calc(1.3*var(--u));font-weight:800}
#gLabel span{font-size:calc(1*var(--u));font-weight:600;color:var(--mut)}
@keyframes gMove{0%{transform:translateY(0) scale(1.15);opacity:0}10%{transform:translateY(0) scale(1.15);opacity:1}18%{transform:translateY(0) scale(.9)}50%{transform:translateY(var(--gd)) scale(.9)}78%{transform:translateY(var(--gd)) scale(.9);opacity:1}86%{transform:translateY(calc(var(--gd) * .3)) scale(.9);opacity:.6}92%,100%{transform:translateY(calc(var(--gd) * .1)) scale(1);opacity:0}}
@keyframes gRing{0%,52%{opacity:0;transform:scale(1.3)}62%,80%{opacity:1;transform:scale(1)}86%,100%{opacity:0;transform:scale(1)}}
#sdPins{display:flex;flex-direction:column;gap:calc(.4*var(--u));align-items:center}
#sdPins div{display:flex;gap:calc(.4*var(--u))}
#sdPins i{width:calc(.95*var(--u));height:calc(.95*var(--u));border-radius:50%;background:var(--ink);transition:all .2s}
#sdPins i.down{background:transparent;box-shadow:inset 0 0 0 calc(.12*var(--u)) rgba(246,239,228,.5)}
#rail{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:stretch;gap:calc(.7*var(--u));transition:opacity .2s;pointer-events:none}
#railTrack{position:relative;height:calc(.5*var(--u));min-height:4px;border-radius:4px;background:rgba(246,239,228,.28);box-shadow:0 1px 6px rgba(0,0,0,.35)}
#railTrack i{position:absolute;top:50%;width:calc(.35*var(--u));height:calc(.35*var(--u));margin:calc(-.175*var(--u)) 0 0 calc(-.175*var(--u));border-radius:50%;background:rgba(var(--panelRGB),.6)}
#railThumb{position:absolute;top:50%;display:flex;align-items:center;justify-content:space-between;padding:0 calc(.15*var(--u));color:var(--onAcc);width:calc(3.6*var(--u));height:calc(1.6*var(--u));margin-left:calc(-1.8*var(--u));transform:translateY(-50%);border-radius:calc(1*var(--u));background:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.4)}
#railThumb .ic{width:calc(1.2*var(--u));height:calc(1.2*var(--u))}
#rail.active #railThumb{background:var(--brass)}
#rail.active #railTrack{background:rgba(var(--accRGB),.45)}
#railCap{display:flex;align-items:center;justify-content:center;gap:calc(.8*var(--u));font-size:calc(1.15*var(--u));font-weight:700;white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.6)}
#railCap em{font-style:normal;display:flex;align-items:center;gap:calc(.7*var(--u));height:max(40px,calc(3.2*var(--u)));padding:0 calc(1.2*var(--u)) 0 calc(.9*var(--u));border-radius:calc(2*var(--u));background:rgba(var(--panelRGB),.9);border:1px solid var(--line);line-height:1}
#railCap .mv{display:flex;color:var(--brass)}
#railCap .mv .ic{width:calc(1.6*var(--u));height:calc(1.6*var(--u))}
#railCap b{font-size:calc(1.15*var(--u));font-weight:800}
#railCap small{font-size:calc(.95*var(--u));font-weight:600;color:var(--mut)}
#railCap small:empty{display:none}
#rail.active #railCap em{border-color:var(--brass)}
#railCap .ar{display:inline-block;width:0;height:0;border-top:calc(.65*var(--u)) solid transparent;border-bottom:calc(.65*var(--u)) solid transparent}
#railCap .ar.l{border-right:calc(.9*var(--u)) solid var(--ink);animation:nudgeL 1.4s ease-in-out infinite}
#railCap .ar.r{border-left:calc(.9*var(--u)) solid var(--ink);animation:nudgeR 1.4s ease-in-out infinite}
#rail.moved #railCap .ar{animation:none;opacity:.7}
.scell.pending .mk,.scell.pending .tt{opacity:0}
.scell.pop{animation:cellPop .55s cubic-bezier(.2,.8,.2,1)}
.scell.pop.slow{animation-duration:1.1s}
.ctag{position:fixed;z-index:40;pointer-events:none;transform:translate(-50%,-50%);display:flex;align-items:center;gap:calc(.5*var(--u));padding:calc(.45*var(--u)) calc(.9*var(--u));border-radius:calc(2*var(--u));background:rgba(var(--panelRGB),.94);border:1px solid var(--line);font-size:calc(1.05*var(--u));line-height:1;font-weight:800;white-space:nowrap;box-shadow:0 calc(.4*var(--u)) calc(1.2*var(--u)) rgba(0,0,0,.4)}
.ctag .dot{width:calc(1*var(--u));height:calc(1*var(--u))}
.ctag.x{background:var(--brass);color:var(--onAcc);border-color:var(--brass)}
.ctag.sp{background:var(--ink);color:var(--onAcc);border-color:var(--ink)}
@keyframes cellPop{0%{transform:scale(1.35);background:var(--brass);color:var(--onAcc)}60%{transform:scale(.96)}100%{transform:scale(1)}}
#flyer{position:fixed;left:0;top:0;z-index:50;pointer-events:none;font-weight:800;letter-spacing:-.03em;white-space:nowrap;transform-origin:50% 50%;text-shadow:0 calc(.5*var(--u)) calc(2*var(--u)) rgba(0,0,0,.5)}
@keyframes nudgeL{0%,100%{transform:translateX(0)}50%{transform:translateX(calc(-.6*var(--u)))}}
@keyframes nudgeR{0%,100%{transform:translateX(0)}50%{transform:translateX(calc(.6*var(--u)))}}
#hint{position:absolute;left:50%;top:calc(.9*var(--u));transform:translateX(-50%);font-size:calc(1.25*var(--u));font-weight:600;padding:calc(.6*var(--u)) calc(1.4*var(--u));border-radius:calc(2*var(--u));white-space:nowrap;transition:opacity .4s}
body.throwing #sdBody,body.throwing #guide{display:none}
body.throwing #score{opacity:0;transform:translate(-50%,calc(-1.2*var(--u)))}
body.throwing #hint,body.throwing #rail{opacity:0;pointer-events:none}
body.pulling #side{opacity:0;pointer-events:none}
body.rolling #pauseBtn{opacity:.6}
body[data-alley="cosmic"],body[data-alley="cosmic"] #backBtn{font-family:'Rajdhani',system-ui,sans-serif}
body[data-alley="cosmic"] #resWord,body[data-alley="cosmic"] #mTitle > div:first-child,body[data-alley="cosmic"] #ovTitle,body[data-alley="cosmic"] .lkBest b,body[data-alley="cosmic"] .stot,body[data-alley="cosmic"] .otot{font-family:'Orbitron',sans-serif;font-weight:900;letter-spacing:.02em}
body[data-alley="metal"],body[data-alley="metal"] #backBtn{font-family:'Barlow Condensed',system-ui,sans-serif}
body[data-alley="metal"] #resWord,body[data-alley="metal"] #mTitle > div:first-child,body[data-alley="metal"] #ovTitle,body[data-alley="metal"] .lkBest b{font-family:'New Rocker',serif;font-weight:400;letter-spacing:.01em}
body[data-alley="cosmic"] #resWord{text-shadow:0 0 calc(2*var(--u)) rgba(41,240,255,.8),0 calc(.5*var(--u)) calc(2*var(--u)) rgba(0,0,0,.5)}
body[data-alley="metal"] #resWord{text-shadow:0 0 calc(2*var(--u)) rgba(255,90,31,.85),0 calc(.5*var(--u)) calc(2*var(--u)) rgba(0,0,0,.5)}
#laneSel{position:absolute;top:12px;right:12px;display:flex;padding:calc(.3*var(--u));border-radius:999px;background:rgba(var(--panelRGB),.9);border:1px solid var(--line)}
#laneSel button{height:max(40px,calc(3.2*var(--u)));padding:0 calc(1.4*var(--u));border-radius:999px;font-size:calc(1.05*var(--u));line-height:1;font-weight:700;color:var(--mut);white-space:nowrap;transition:background .2s,color .2s}
#laneSel button.on{background:var(--brass);color:var(--onAcc);font-weight:800}
/* each lane's name is set in that lane's own display font */
#laneSel button[data-al="maple"]{font-family:'Bricolage Grotesque',sans-serif;font-weight:800}
#laneSel button[data-al="cosmic"]{font-family:'Orbitron',sans-serif;font-weight:800;font-size:calc(.95*var(--u));letter-spacing:.02em}
#laneSel button[data-al="metal"]{font-family:'New Rocker',serif;font-weight:400;font-size:calc(1.2*var(--u))}
.lkAlley{display:grid;grid-template-columns:auto repeat(3,1fr);gap:calc(.5*var(--u));align-items:center}
.lkAlley > span{font-size:calc(.85*var(--u));font-weight:800;letter-spacing:.14em;color:var(--mut);padding-right:calc(.3*var(--u))}
.lkAlley button{height:max(40px,calc(3*var(--u)));border-radius:calc(.7*var(--u));border:1px solid rgba(246,239,228,.18);font-size:calc(.95*var(--u));font-weight:700;display:flex;align-items:center;justify-content:center;gap:calc(.4*var(--u));white-space:nowrap}
.lkAlley button i{width:calc(1*var(--u));height:calc(1*var(--u));border-radius:50%;flex:none}
.lkAlley button.on{border-color:var(--brass);background:rgba(var(--accRGB),.14)}
body.fast #hud,body.fast #hud *,body.fast #steerLayer *,body.fast #backBtn{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
body.fast #score,body.fast #side,body.fast #steer,body.fast #railCap em,body.fast #bagBtn,body.fast #bagTray{background:var(--sheet)!important}

/* compose */
#compose{position:absolute;inset:0;opacity:0;transition:opacity .15s}
#compose.on{opacity:1}
#sight{position:absolute;width:calc(16*var(--u));height:calc(1.8*var(--u));border-radius:calc(.9*var(--u));background:rgba(var(--panelRGB),.8);border:1px solid rgba(246,239,228,.2);transform:translate(-50%,-50%);transition:border-color .15s,box-shadow .15s}
#sight .notch{position:absolute;left:50%;top:calc(.25*var(--u));bottom:calc(.25*var(--u));width:calc(2.2*var(--u));transform:translateX(-50%);border-left:1px solid rgba(246,239,228,.6);border-right:1px solid rgba(246,239,228,.6)}
#bubble{position:absolute;left:50%;top:50%;width:calc(1.3*var(--u));height:calc(1.3*var(--u));border-radius:50%;background:var(--ink);transform:translate(-50%,-50%)}
#compose.ready #sight{border-color:var(--brass);box-shadow:0 0 calc(1.4*var(--u)) rgba(var(--accRGB),.45)}
#compose.ready #sight .notch{border-color:var(--brass)}
#compose.ready #bubble{background:var(--brass)}
#origin{position:absolute;width:calc(.9*var(--u));height:calc(.9*var(--u));border-radius:50%;border:calc(.15*var(--u)) solid rgba(246,239,228,.7);transform:translate(-50%,-50%)}
#track{position:absolute;width:calc(.2*var(--u));min-width:2px;background:rgba(246,239,228,.55);transform:translateX(-50%)}
#ticks{position:absolute;font-size:calc(.85*var(--u));font-weight:700;letter-spacing:.06em}
#ticks span{position:absolute;left:0;transform:translateY(-50%);color:rgba(246,239,228,.4);white-space:nowrap}
#ticks span.on{color:var(--ink)}
#ring{position:absolute;width:calc(9*var(--u));height:calc(9*var(--u));transform:translate(-50%,-50%);border-radius:50%;
  background:conic-gradient(var(--rc,var(--ink)) 0 var(--cp,0%),rgba(246,239,228,.18) var(--cp,0%) 100%);
  -webkit-mask:radial-gradient(circle,transparent calc(3.7*var(--u)),#000 calc(3.8*var(--u)));mask:radial-gradient(circle,transparent calc(3.7*var(--u)),#000 calc(3.8*var(--u)))}
#compose.ready #ring{--rc:var(--brass);--cp:100%;filter:drop-shadow(0 0 calc(1.2*var(--u)) rgba(var(--accRGB),.6))}
#ring.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(1.06)}100%{transform:translate(-50%,-50%) scale(1)}}
#ringIn{position:absolute;width:calc(4.6*var(--u));height:calc(4.6*var(--u));border-radius:50%;background:rgba(246,239,228,.16);transform:translate(-50%,-50%)}
#compose.ready #ringIn{background:rgba(var(--accRGB),.22)}
#wrist{position:absolute;width:calc(11*var(--u));height:calc(11*var(--u))}
#wrist i{position:absolute;left:50%;top:0;width:calc(.4*var(--u));height:calc(1.2*var(--u));margin-left:calc(-.2*var(--u));border-radius:2px;background:var(--brass)}
#compose.ready #wrist i{background:var(--ink)}

<script data-arcade-back>
/* arcade-back v1 (knowledge/arcade-back.md). "← Games" = the browser's back button.
   Any link whose href is exactly ../../index.html goes BACK in history when this page was opened
   from the arcade home, so home comes back as it was left (scroll position, no reload).
   Opened any other way (bookmark, direct URL, dev tool), the link just navigates as normal. */
(function () {
  document.addEventListener('click', function (e) {
    if (e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (!a || a.getAttribute('href') !== '../../index.html') return;
    var home = new URL(a.href), ref;
    try { ref = new URL(document.referrer); } catch (err) { return; }
    var dir = home.pathname.replace(/index\.html$/, '');
    if (ref.origin !== home.origin || (ref.pathname !== home.pathname && ref.pathname !== dir) || history.length < 2) return;
    e.preventDefault();
    var go = function () { location.href = home.href; };
    // Still on this page after going back (an in-game history entry) or nothing happened: go home directly.
    addEventListener('popstate', go, { once: true });
    var t = setTimeout(go, 2500);
    addEventListener('pagehide', function () { clearTimeout(t); }, { once: true });
    history.back();
  });
})();
</script>

  else if (fr.length === 1) { rerack = fr[0] === 10; }
  else if (fr.length === 2) { if (fr[0] === 10) rerack = fr[1] === 10; else if (fr[0] + fr[1] === 10) rerack = true; else done = true; }
  else done = true;
  if (done) {
    G.frameRolls = []; G.rackBalls = 0; G.standing = Array(10).fill(true);
    G.cp++; if (G.cp >= G.order.length) { G.cp = 0; G.frame++; }
    if (G.frame >= G.N) { gameOver(); return; }
    rack(); persistGame(); beginTurn();
  } else {
    if (rerack) { G.standing = Array(10).fill(true); G.rackBalls = 0; rack(); } else sweep();
    persistGame(); enterAim();
  }
}
function persistGame() { if (G && G.slot) save.games[G.slot] = G; persist(); }

/* ---------------- game over ---------------- */
function gameOver() {
  phase = 'over'; setThrowing(false); ui.show('hud', false);
  const rows = G.order.map(id => ({ id, sc: score(G.rolls[id], G.N), st: G.stats[id] }));
  const top = Math.max(...rows.map(r => r.sc.total)), winners = rows.filter(r => r.sc.total === top);
  const solo = rows.length === 1, tie = !solo && winners.length > 1;
  let newBest = false;
  rows.forEach(r => {
    const P = save.players[r.id]; if (!P) return; P.games++; P.last = r.sc.total; P.strikes += r.st.strikes; P.spares += r.st.spares; P.throws += r.st.throws; P.ready += r.st.ready;
    if (G.mode === 'classic' && r.sc.total > P.best) { P.best = r.sc.total; P.pins += 20; G.earned[r.id] = (G.earned[r.id] || 0) + 20; if (r.sc.total === top) newBest = true; r.best = true; }
  });
  if (!solo && !tie && save.players[winners[0].id]) { const W = save.players[winners[0].id]; W.wins++; W.pins += 25; G.earned[winners[0].id] = (G.earned[winners[0].id] || 0) + 25; }
  const w = ROSTER[winners[0].id];
  $('ovKick').textContent = solo ? (newBest ? 'NEW BEST' : 'FINAL') : `${newBest ? 'NEW BEST · ' : 'FINAL · '}${tie ? 'TIE' : w.name.toUpperCase()}`;
  $('ovTitle').textContent = solo ? String(top) : tie ? `It's a tie at ${top}` : `${w.name} wins by ${top - Math.max(...rows.filter(r => r.id !== w.id).map(r => r.sc.total))}`;
  let h = `<div class="orow"><div class="oname"></div>${Array.from({ length: G.N }, (_, i) => `<div class="ocell num">${i + 1}</div>`).join('')}<div class="otot" style="border-left:none"></div></div>`;
  rows.forEach(r => {
    const pct = r.st.throws ? Math.round(r.st.ready / r.st.throws * 100) : 0;
    h += `<div class="orow ${!tie && r.sc.total === top ? 'win' : ''}"><div class="oname"><div class="dot" style="background:${ROSTER[r.id].color}"></div><div><b>${ROSTER[r.id].name}</b>${save.players[r.id] ? `<span style="color:var(--brass);font-weight:700">+${G.earned[r.id] || 0} pins</span>` : ''}</div></div>`;
    r.sc.frames.forEach(f => { h += `<div class="ocell ${fcls(f.marks)}"><span class="mk">${f.marks.join(' ')}</span><span class="tt">${f.total ?? ''}</span></div>`; });
    h += `<div class="otot">${r.sc.total}</div></div>`;
  });
  $('ovCard').innerHTML = h;
  lastCfg = { slot: G.slot, order: G.order.slice(), bots: Object.assign({}, G.bots) };
  if (G.slot) delete save.games[G.slot];
  $('ovShops').innerHTML = G.order.filter(id => save.players[id]).map(id => `<button class="btn sec" data-shop="${id}" style="gap:calc(.6*var(--u))"><span style="display:flex;width:1.2em;height:1.2em">${ICON.bag}</span>${G.order.filter(x => save.players[x]).length > 1 ? ROSTER[id].name + "'s shop" : 'Ball shop'}<span style="display:flex;align-items:center;gap:calc(.3*var(--u));color:var(--brass)"><span style="display:flex;width:1.1em;height:1.1em">${ICON.coins}</span>${save.players[id].pins}</span></button>`).join('');
  const hint = G.order.filter(id => save.players[id]).map(id => {
    const P = save.players[id], b = BALLS.filter(B => !P.owned.includes(B.id) && P.pins >= B.price).pop();
    return b ? `${ROSTER[id].name} has ${P.pins} pins: enough for the ${b.name} ball` : '';
  }).filter(Boolean)[0] || '';
  $('ovHint').textContent = hint;
  G = null; persist();
  if (!solo) sfx.strike();
  screens('over'); setShot('deck'); dirty = true;
}
$('rematchBtn').addEventListener('click', () => { ensureAudio(); sfx.go(); if (lastCfg.slot === 'both') startTogether(); else startGame(lastCfg.slot, lastCfg.order, lastCfg.bots); });
$('changeBtn').addEventListener('click', () => { ensureAudio(); sfx.blip(); showMenu(); });

/* ---------------- pause ---------------- */
function renderPause() {
  $('pauseSub').textContent = G ? `Frame ${G.frame + 1}` : '';
  const s = save.settings;
  [['sfxSl', 'sfxOut', volFor(volOwner).sfx], ['musSl', 'musOut', volFor(volOwner).mus]].forEach(([sl, out, v]) => { $(sl).value = v; $(sl).style.setProperty('--v', v + '%'); $(out).textContent = v ? v : 'Off'; });
  $('aimRow').classList.toggle('on', s.aim); $('fastRow').classList.toggle('on', s.fast);

  $('pausePlayers').innerHTML = (G ? G.order : []).map(id => {
    if (isBot(id)) return `<div class="prow" data-id="${id}"><div class="dot" style="background:${ROSTER[id].color}"></div><b>${ROSTER[id].name} <small style="display:inline;font-weight:500;color:var(--mut)">AI</small></b>
      <button class="pill" data-act="diff">${DIFF_LABEL[G.bots[id]]}</button></div>`;
    const P = save.players[id];
    return `<div class="prow" data-id="${id}"><div class="dot" style="background:${ROSTER[id].color}"></div><b>${ROSTER[id].name}</b>
      <button class="pill ${P.bumpers ? 'on' : ''}" data-act="bump">Bumpers</button></div>`;
  }).join('');
}
function openPause() {
  if (paused || !G || phase === 'over' || phase === 'menu') return;
  ensureAudio(); sfx.blip();
  if (T.mode === 'pull') cancelThrow();
  paused = true; clearTimeout(resultTimer); stopRoll(); setTension(0);
  renderPause(); ui.show('pause', true); dirty = true;
}
function closePause() {
  paused = false; ui.show('pause', false); sfx.go();
  if (phase === 'result') resultTimer = setTimeout(advanceResult, 800);
  if (phase === 'rolling') startRoll();
  last = performance.now(); dirty = true;
}
$('pauseBtn').addEventListener('click', openPause);
$('resumeBtn').addEventListener('click', closePause);
$('restartBtn').addEventListener('click', () => { paused = false; ui.show('pause', false); startGame(G.slot, G.order, G.bots); });
$('playersBtn').addEventListener('click', () => { showMenu(); });
$('sfxSl').addEventListener('input', e => { save.players[volOwner].sfx = +e.target.value; ensureAudio(); sounds.gain.value = level(+e.target.value); e.target.style.setProperty('--v', e.target.value + '%'); $('sfxOut').textContent = e.target.value > 0 ? e.target.value : 'Off'; sfx.blip(); });
$('musSl').addEventListener('input', e => { save.players[volOwner].mus = +e.target.value; ensureAudio(); musicBus.gain.value = level(+e.target.value); e.target.style.setProperty('--v', e.target.value + '%'); $('musOut').textContent = e.target.value > 0 ? e.target.value : 'Off'; });
['sfxSl', 'musSl'].forEach(id => $(id).addEventListener('change', persist));
$('aimRow').addEventListener('click', () => { save.settings.aim = !save.settings.aim; persist(); renderPause(); sfx.blip(); aimLine.visible = save.settings.aim && phase === 'aim'; dirty = true; });
$('skipRow').addEventListener('click', () => { save.settings.autoSkip = !save.settings.autoSkip; persist(); renderPause(); sfx.blip(); });
$('fastRow').addEventListener('click', () => { if (monHeld) { monHeld = false; return; } save.settings.fast = !save.settings.fast; persist(); applyFast(); renderPause(); sfx.blip(); });
{ const row = $('fastRow'); let t = 0; const cancel = () => clearTimeout(t);
  row.addEventListener('pointerdown', () => { cancel(); monHeld = false; t = setTimeout(() => { monHeld = true; toggleMon(); }, 600); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => row.addEventListener(ev, cancel)); }
$('pausePlayers').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.closest('.prow').dataset.id, P = save.players[id];
  if (b.dataset.act === 'diff') { const ds = ['easy', 'medium', 'hard']; G.bots[id] = ds[(ds.indexOf(G.bots[id]) + 1) % 3]; persistGame(); renderPause(); sfx.blip(); return; }
  P.bumpers = !P.bumpers;
  if (G && id === G.order[G.cp]) setBumpers(!!P.bumpers);
  persist(); renderPause(); sfx.blip(); dirty = true;
});

/* ---------------- main loop ---------------- */
let last = performance.now(), frameN = 0;
const skipBtn = $('skipBtn');
const _v = new THREE.Vector3();
var hudKey = '';
function toScreen(x, y, z) { _v.set(x, y, z).project(camera); return [(_v.x + 1) / 2 * innerWidth, (1 - _v.y) / 2 * innerHeight]; }
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; frameN++;
  let active = false;
  if (!paused) {
    if (phase === 'rolling') { stepRoll(dt); active = true; }
    if (phase === 'aim' && updateCompose(dt, now)) active = true;
    if (phase === 'aim' && aiState) { stepAI(dt); active = true; }
    if (stepFx(dt)) active = true;
    if (phase === 'shop') { ballMesh.rotateOnWorldAxis(Y_AXIS, dt * 0.6); active = true; }
    if (updateCamera(dt)) active = true;
    if (phase === 'menu' && frameN % 2 === 0) active = true;
    if (bandPulse > 0) { bandPulse -= dt; bandMat.color.set(bandPulse > 0 ? (Math.floor(bandPulse * 12) % 2 ? 0xffffff : bandBase) : bandBase); active = true; }
  }
  if (phase === 'aim') {
    aimLine.position.set(stanceX, 0.004, ballMesh.position.z - 0.2);
    const [bx, by] = toScreen(stanceX, 0.32, ballMesh.position.z - 0.6);
    const rz = STANCE_Z + 0.32, [lx, ry] = toScreen(-HALF, 0, rz), [rx] = toScreen(HALF, 0, rz), [tx] = toScreen(stanceX, 0, rz);
    const rl = $('rail'), bot = curBot(), mv = rl.classList.contains('moved'), act = rl.classList.contains('active');
    // only show the rail once the camera has settled on the aim shot, otherwise it slides around with the camera move
    const settled = shot === 'aim' && camPos.distanceTo(tgtPos) < 0.03 && Math.abs(camLook.z - tgtLook.z) < 0.05 && Math.abs(camFov - tgtFov) < 0.2;
    const key = [bot, settled, Math.round(lx), Math.round(ry), Math.round(rx), Math.round(tx), mv, act, boardOf(stanceX), Math.round(bx), Math.round(by)].join('|');
    if (key !== hudKey) {          // only touch the DOM when something actually changed
      hudKey = key;
      rl.style.opacity = bot || !settled ? 0 : '';
      rl.style.left = lx + 'px'; rl.style.top = (ry + 6) + 'px'; rl.style.width = Math.max(40, rx - lx) + 'px';
      $('railThumb').style.left = ((tx - lx) / Math.max(1, rx - lx) * 100) + '%';
      $('railTxt').textContent = mv ? `Board ${boardOf(stanceX)}` : 'Drag sideways to move the ball';
      $('railSub').textContent = mv ? (act ? 'release to set' : 'drag to adjust') : '';
      const sg = $('sight'); sg.style.left = bx + 'px'; sg.style.top = by + 'px';
    }
    updateGuide();
  }
  if (phase !== 'aim' && hudKey !== 'off') { $('rail').style.opacity = 0; hudKey = 'off'; }   // never during results ("7 down"), rolls or menus
  skipBtn.classList.toggle('hidden', !(curBot() && !paused && (phase === 'aim' || phase === 'rolling' || phase === 'result')));
  let drew = false;
  if (!(active || dirty)) resLast = 0;
  if (active || dirty) {
    if (shadowDirty && renderer.shadowMap.enabled) { renderer.shadowMap.needsUpdate = true; shadowDirty = false; }
    if (save.settings.fast) adaptRes(now);
    renderer.render(scene, camera); dirty = false; drew = true;
  }
  monTick(now, drew);
}
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); scoreBottom = -1; hudKey = ''; dirty = true; });
addEventListener('pagehide', () => { if (G) persistGame(); Store.flush(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && phase === 'rolling') stopRoll(); else if (!document.hidden && phase === 'rolling' && !paused) startRoll(); last = performance.now(); });

/* ---------------- boot ---------------- */
SoundStore.ready(() => { soundCfg = SoundStore.get() || null; if (SFXE) SFXE.setCfg(soundCfg); });
Store.ready(() => {
  save = Store.get() || freshSave();
  if (!save.players || !save.settings) save = freshSave();
  { const fs = freshSave(); save.settings = Object.assign({}, fs.settings, save.settings);
    save.menu = { first: (save.menu && save.menu.first) || 'caleb' };
    if (!save.games || typeof save.games !== 'object') save.games = {};
    delete save.game;     // v1 single auto-resume save is retired: games resume only via Continue
    Object.keys(save.games).forEach(k => { const g = save.games[k]; if (!g || !g.order || g.N !== 10) delete save.games[k]; });
    ['caleb', 'ezra'].forEach(id => { const P = save.players[id] = Object.assign(freshPlayer(), save.players[id] || {});
      delete P.level; if (!Array.isArray(P.owned)) P.owned = ['classic']; if (!P.ball) P.ball = 'classic';
      if (P.sfx == null) P.sfx = save.settings.sfx ?? 80; if (P.mus == null) P.mus = save.settings.mus ?? 80; });
    delete save.settings.sfx; delete save.settings.mus;
    volOwner = save.players[save.settings.lastPlayer] ? save.settings.lastPlayer : 'caleb'; }
  showMon(save.settings.mon); cardOpen = !!save.settings.card;
  applyFast();
  showMenu();
  setShot(phase === 'menu' ? 'menu' : 'deck', true);
  requestAnimationFrame(loop);
});
