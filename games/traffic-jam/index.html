<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Traffic Jam - Garfield Boys' Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#2a2740;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;}
img,a,canvas{-webkit-user-drag:none;}

*{box-sizing:border-box;}

a:hover{color:#4a4570;}
button{font-family:inherit;}
@keyframes tjPop{0%{transform:scale(.4) rotate(-12deg);opacity:0}70%{transform:scale(1.18) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes tjRise{0%{transform:translateY(24px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes tjSlide{0%{transform:translateX(30px);opacity:0}100%{transform:translateX(0);opacity:1}}
/* Port helpers (the design's sc-if wrappers, style-active and style-before) */
.c{display:contents;}
.a1:active{box-shadow:0 1px 0 #2a2740 !important;}
.a2:active{box-shadow:0 2px 0 #2a2740 !important;}
.lk::before{content:'';position:absolute;left:3px;top:-8px;width:10px;height:10px;border:2.5px solid #b9b2cc;border-bottom:none;border-radius:6px 6px 0 0;box-sizing:border-box;}
</style>
<script data-arcade-back>
/* arcade-back v1 (knowledge/arcade-back.md). "← Games" = the browser's back button.
   Any link whose href is exactly ../../index.html goes BACK in history when this page was opened
   from the arcade home, so home comes back as it was left (scroll position, no reload).
   Opened any other way (bookmark, direct URL, dev tool), the link just navigates as normal. */
(function () {
  document.addEventListener('click', function (e) {
    if (e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (!a || a.getAttribute('href') !== '../../index.html') return;
    var home = new URL(a.href), ref;
    try { ref = new URL(document.referrer); } catch (err) { return; }
    var dir = home.pathname.replace(/index\.html$/, '');
    if (ref.origin !== home.origin || (ref.pathname !== home.pathname && ref.pathname !== dir) || history.length < 2) return;
    e.preventDefault();
    var go = function () { location.href = home.href; };
    // Still on this page after going back (an in-game history entry) or nothing happened: go home directly.
    addEventListener('popstate', go, { once: true });
    var t = setTimeout(go, 2500);
    addEventListener('pagehide', function () { clearTimeout(t); }, { once: true });
    history.back();
  });
})();
</script>
</head>
<body>
<!-- Theme music. No controls, on purpose (arcade rule: no mute button).
     preload="none" so nothing is fetched until the first gesture. -->
<audio id="theme" src="audio/traffic-jam-theme.webm" loop preload="none" aria-hidden="true"></audio>
<div id="app" style="position:fixed;inset:0;font-family:'Fredoka',system-ui,sans-serif;color:#2a2740;user-select:none;-webkit-user-select:none;">
  <div id="host" style="position:absolute;inset:0;"></div>
  <div id="ui" class="c"></div>
</div>
<script>
// Directory URL guard: the engine resolves assets/ and js/ against document.baseURI,
// so /games/traffic-jam (no slash) would look in /games/. Normalise before anything loads.
(function () { var p = location.pathname; if (!/\/$/.test(p) && !/\.html?$/.test(p)) location.replace(p + '/' + location.search + location.hash); })();
</script>
<script>
// ---------------------------------------------------------------------------
// Theme music — knowledge/audio-patterns.md pattern, verbatim. Engine SFX
// (Web Audio) are separate; engine.setMuted never touches this element.
// ---------------------------------------------------------------------------
function music() {
  const el = document.getElementById('theme');
  if (!el) return;
  const LEVEL = 0.5;                      // on top of the 6dB off the file
  // pointerdown and touchstart do NOT grant user activation on a touch screen —
  // only pointerup, touchend, click and keydown do.
  const EVENTS = ['pointerdown', 'pointerup', 'click', 'touchend', 'keydown'];
  let playing = false;
  const arm    = () => EVENTS.forEach(e => document.addEventListener(e, start, true));
  const disarm = () => EVENTS.forEach(e => document.removeEventListener(e, start, true));
  function start() {
    if (playing) return;                  // stay armed until it is really playing
    el.volume = LEVEL;
    let p;
    try { p = el.play(); } catch (e) { return; }   // no el.load(): it aborts the play
    if (p && p.then) p.then(() => { playing = true; disarm(); }, () => {});
    else { playing = true; disarm(); }
  }
  document.addEventListener('visibilitychange', () => {
    if (!playing) return;                 // never started; leave it alone
    if (document.hidden) el.pause();
    else el.play().catch(() => {});
  });
  arm();
}
music();

// ---------------------------------------------------------------------------
// Tiny renderer. The whole UI layer is rebuilt as an HTML string, then MORPHED
// into the live DOM (attributes + text patched in place, nodes only added or
// removed where the structure changed). Every <sc-if> from the design becomes a
// keyed display:contents wrapper that is always emitted, so sibling indexes stay
// stable and a screen's DOM is created once when it appears — entrance
// animations (tjPop / tjRise / tjSlide) play once, not on every move.
// ---------------------------------------------------------------------------
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const iff = (k, cond, html) => `<div class="c" data-k="${k}">${cond ? html : ''}</div>`;
function morphChildren(a, b) {
  const o = Array.from(a.childNodes), n = Array.from(b.childNodes);
  for (let i = 0; i < n.length; i++) { if (i >= o.length) a.appendChild(n[i]); else patchNode(o[i], n[i]); }
  for (let i = n.length; i < o.length; i++) a.removeChild(o[i]);
}
function patchNode(a, b) {
  if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName || (a.nodeType === 1 && a.getAttribute('data-k') !== b.getAttribute('data-k'))) { a.replaceWith(b); return; }
  if (a.nodeType !== 1) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
  for (const at of Array.from(b.attributes)) if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
  for (const at of Array.from(a.attributes)) if (!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  morphChildren(a, b);
}

// ---------------------------------------------------------------------------
// Component — ported from the Claude Design <script type="text/x-dc"> (DCLogic).
// Logic is kept line-for-line; only React plumbing (hostRef, setState, render)
// is replaced.
// ---------------------------------------------------------------------------
class Component {
  state = { screen: 'loading', progress: 0, player: null, district: 0, levelIdx: 0, moves: 0, bumps: 0, left: 0, canUndo: false, muted: false, win: null, toast: null, wipe: false, wide: true };
  hostRef = { current: document.getElementById('host') };
  PLAYERS = [['Caleb', '#ff4d6d'], ['Ezra', '#3ec1d3']];

  constructor() {
    this.ui = document.getElementById('ui'); this._html = null; this.vals = null;
    // Delegated taps: buttons carry data-click="<path into renderVals()>".
    document.getElementById('app').addEventListener('click', e => {
      const b = e.target.closest('[data-click]'); if (!b || !this.vals) return;
      const fn = b.getAttribute('data-click').split('.').reduce((o, k) => o == null ? o : o[k], this.vals);
      if (typeof fn === 'function') fn();
    });
    document.addEventListener('touchstart', () => {}, { passive: true }); // lets :active fire on iOS
    this.render();
    this.componentDidMount().catch(err => console.error('Traffic Jam failed to start', err));
  }
  setState(patch, cb) {
    Object.assign(this.state, typeof patch === 'function' ? patch(this.state) : patch);
    this.render(); this.componentDidUpdate(); cb && cb();
  }
  render() {
    const v = this.vals = this.renderVals(), html = view(v);
    if (html === this._html) return;
    this._html = html;
    const t = document.createElement('template'); t.innerHTML = html;
    morphChildren(this.ui, t.content);
  }

  async componentDidMount() {
    const u = f => new URL(f, document.baseURI).href;
    this.onResize = () => { const wide = innerWidth >= 760 && innerWidth / innerHeight >= 1.15; if (wide !== this.state.wide) this.setState({ wide }); };
    this.onResize(); addEventListener('resize', this.onResize);
    this.onKey = e => this.key(e); addEventListener('keydown', this.onKey);
    const [lv, en] = await Promise.all([import(u('js/traffic-levels.js')), import(u('js/traffic-engine.js'))]);
    Object.assign(this, { LEVELS: lv.LEVELS, TIERS: lv.TIERS, VARIANTS: lv.VARIANTS, TYPES: lv.TYPES, starTargets: lv.starTargets });
    let muted = false; try { muted = localStorage.getItem('trafficJamMuted') === '1'; } catch (e) {}
    this.engine = await en.createEngine(this.hostRef.current, {
      onProgress: p => this.setState({ progress: p }),
      onMoves: m => this.setState({ moves: m.moves, bumps: m.bumps, left: m.left, canUndo: m.canUndo }),
      onWin: r => this.onWin(r),
      onMenuPick: k => this.pickPlayer(k),
      onHint: on => this.setState({ hintOn: on }),
    });
    window.__tj = this.engine;
    this.engine.setMuted(muted); this.engine.menuGarage(this.locks(null));
    this.setState({ screen: 'title', muted });
  }
  componentDidUpdate() { const k = this.state.screen + '|' + this.state.wide; if (this.engine && k !== this._layoutKey) { this._layoutKey = k; this.applyInsets(); } }
  applyInsets() {
    const s = this.state.screen, w = this.state.wide;
    const map = { title: {}, driving: {}, district: { bottom: 190, top: 60 }, levels: { bottom: w ? 250 : 470, top: 60 }, play: w ? { right: 170, top: 0, bottom: 0 } : { top: 120, bottom: 96 }, win: w ? { right: 170 } : { top: 120, bottom: 96 } };
    this.engine.setInsets(map[s] || {});
  }
  key(e) {
    if (!this.engine) return;
    const s = this.state.screen;
    if (s === 'district' || s === 'levels') { if (e.key === 'ArrowLeft') this.goDistrict(-1); if (e.key === 'ArrowRight') this.goDistrict(1); if (e.key === 'Enter' && s === 'district') this.driveIn(); }
    if (s === 'play') { if (e.key === 'z' || e.key === 'u') this.engine.undo(); if (e.key === 'h') this.engine.hint(); if (e.key === 'r') this.engine.reset(); }
  }

  // Saves: legacy shared calebArcadeData object, under trafficJam[player].v2 — exactly as designed.
  data() { try { return JSON.parse(localStorage.getItem('calebArcadeData')) || {}; } catch (e) { return {}; } }
  save(d) { try { localStorage.setItem('calebArcadeData', JSON.stringify(d)); } catch (e) { console.warn('Traffic Jam: save failed', e); } }
  rec(d, p) { d.trafficJam = d.trafficJam || {}; d.trafficJam[p] = d.trafficJam[p] || { best: {} }; const r = d.trafficJam[p]; r.v2 = r.v2 || { stars: {}, best: {} }; return r.v2; }
  prog(p) { return p ? this.rec(this.data(), p) : { stars: {}, best: {} }; }
  solvedIn(rec, k) { let n = 0; for (let i = k * 10; i < k * 10 + 10; i++) if (rec.stars[i] != null) n++; return n; }
  districtOpen(rec, k) { return k === 0 || this.solvedIn(rec, k - 1) >= 7; }
  levelOpen(rec, i) { const k = Math.floor(i / 10); return this.districtOpen(rec, k) && (i % 10 === 0 || rec.stars[i - 1] != null || rec.stars[i] != null); }
  locks(p) { const rec = this.prog(p); return (this.TIERS || [0, 0, 0, 0, 0]).map((_, k) => !this.districtOpen(rec, k)); }

  wipe(fn) { this.setState({ wipe: true }); setTimeout(() => { fn(); setTimeout(() => this.setState({ wipe: false }), 60); }, 240); }
  pickPlayer(k) {
    if (this.state.screen !== 'title') return;
    const name = this.PLAYERS[k][0], rec = this.prog(name);
    let d = 0; for (let q = this.TIERS.length - 1; q >= 0; q--) if (this.districtOpen(rec, q)) { d = q; break; }
    if (rec.lastDistrict != null && this.districtOpen(rec, rec.lastDistrict)) d = rec.lastDistrict;
    this.engine.sfx('click');
    this.setState({ player: name, screen: 'driving', district: d });
    this.engine.menuPick(k, d, this.locks(name), () => this.setState({ screen: 'district' }));
  }
  goDistrict(dir) { const k = Math.max(0, Math.min(this.TIERS.length - 1, this.state.district + dir)); if (k === this.state.district) return; this.engine.sfx('click');
    if (this.state.screen === 'levels') { const open = this.districtOpen(this.prog(this.state.player), k); this.engine.menuDistrict(k, this.locks(this.state.player), open); this.setState({ district: k, screen: open ? 'levels' : 'district' }); return; }
    this.engine.menuDistrict(k, this.locks(this.state.player)); this.setState({ district: k }); }
  driveIn() {
    const rec = this.prog(this.state.player); if (!this.districtOpen(rec, this.state.district)) return;
    const d = this.data(); this.rec(d, this.state.player).lastDistrict = this.state.district; this.save(d);
    this.engine.sfx('click'); this.engine.menuDistrict(this.state.district, this.locks(this.state.player), true); this.setState({ screen: 'levels' });
  }
  onWin(r) {
    const d = this.data(), rec = this.rec(d, this.state.player), i = this.state.levelIdx;
    rec.stars[i] = Math.max(rec.stars[i] || 0, r.stars);
    if (rec.best[i] == null || r.moves < rec.best[i]) rec.best[i] = r.moves;
    this.save(d);
    this.setState({ screen: 'win', win: r });
    [0, 1, 2].forEach(k => { if (k < r.stars) setTimeout(() => this.engine.sfx('star', k), 500 + k * 220); });
  }
  play(i) {
    const L = this.LEVELS[i], V = this.VARIANTS[L.variant];
    this.wipe(() => {
      this.setState({ hintOn: false, screen: 'play', levelIdx: i, district: Math.floor(i / 10), win: null }, () => { this._layoutKey = 'play|' + this.state.wide; this.applyInsets(); this.engine.loadLevel(L, i); });
    });
    const first = !this.LEVELS.slice(0, i).some(x => x.variant === L.variant);
    const tips = {
      carpark: 'Drag cars along their lanes. When the gate lifts, drag the red car out through it!',
      night: 'Night shift! Same rules, but look for the headlights.',
      box: 'Drag or flick a car off the edge to clear it. Flick into another car and it bumps!',
      oneway: 'One-way street: every car can only drive the way its arrow points.',
      roadworks: 'Barriers never move. Plan your way around them.',
      onegate: 'New! Swipe a car to drive one square, back up, or turn left or right. Everyone leaves through the gate.',
      colour: 'Colour Match! Each car can only leave through the gate that matches its roof colour.',
    };
    const st3 = this.starTargets(L); const toast = first ? tips[L.variant] : (L.type === 'colour' ? `Match every car to its gate in ${st3.three} moves or fewer for 3 stars.` : L.type === 'rush' ? `Free the red car in ${st3.three} moves or fewer for 3 stars.` : 'Clear every car with 1 bump or fewer for 3 stars.');
    clearTimeout(this.toastT); this.setState({ toast }); this.toastT = setTimeout(() => this.setState({ toast: null }), first ? 7000 : 3500);
  }
  backToLevels() {
    const k = Math.floor(this.state.levelIdx / 10), sel = this.PLAYERS.findIndex(p => p[0] === this.state.player);
    this.wipe(() => { this.engine.menuReturn(k, this.locks(this.state.player), sel); this.setState({ screen: 'levels', district: k, toast: null }); });
  }

  renderVals() {
    const s = this.state, L = this.LEVELS, V = this.VARIANTS, lv = L ? L[s.levelIdx] : null;
    const click = fn => () => { this.engine && this.engine.sfx('click'); fn(); };
    const rec = this.prog(s.player);
    const totalStars = Object.values(rec.stars).reduce((a, b) => a + b, 0);
    const players = this.PLAYERS.map(([name, color], k) => ({ name, color, initial: name[0], left: k === 0 ? '31%' : '69%', stars: this.engine ? Object.values(this.prog(name).stars).reduce((a, b) => a + b, 0) : 0, pick: () => this.pickPlayer(k) }));
    const T = this.TIERS ? this.TIERS[s.district] : { name: '', sub: '' };
    let dStars = 0; for (let i = s.district * 10; i < s.district * 10 + 10; i++) dStars += rec.stars[i] || 0;
    const dOpen = this.TIERS ? this.districtOpen(rec, s.district) : true;
    const on = '#f5a300', off = '#cfc8dd';
    const tiles = L ? L.slice(s.district * 10, s.district * 10 + 10).map((l, k) => {
      const i = s.district * 10 + k, st = rec.stars[i] || 0, open = this.levelOpen(rec, i), v = V[l.variant];
      return { n: i + 1, open, locked: !open, mode: v.mode, short: { rush: 'Escape', grid: 'Clear', colour: 'Match' }[l.type], variant: v.name, bg: v.bg, ink: v.ink, s1: st >= 1 ? on : off, s2: st >= 2 ? on : off, s3: st >= 3 ? on : off, go: click(() => this.play(i)) };
    }) : [];
    const rush = lv && lv.type === 'rush', match = lv && lv.type === 'colour', counted = rush || match, v = lv ? V[lv.variant] : { name: '', ink: '#2a2740', bg: '#fff', rule: '' };
    const w = s.win || { stars: 0 };
    const titles = ['', 'You did it!', 'Great driving!', 'Perfect!'];
    const playing = s.screen === 'play' || s.screen === 'win';
    const nextOpen = L && s.levelIdx < L.length - 1 && this.levelOpen(rec, s.levelIdx + 1);
    return {
      isLoading: s.screen === 'loading', isTitle: s.screen === 'title',
      showMapTop: s.screen === 'district' || s.screen === 'levels',
      isDistrict: s.screen === 'district', isLevels: s.screen === 'levels',
      playWide: playing && s.wide, playNarrow: playing && !s.wide, isWin: s.screen === 'win',
      winRight: s.wide ? '174px' : '0px',
      progressPct: Math.round(s.progress * 100) + '%',
      players, totalStars, player: s.player, playerColor: (this.PLAYERS.find(p => p[0] === s.player) || [0, '#ccc'])[1],
      toTitle: click(() => { this.engine.menuGarage(this.locks(null)); this.setState({ screen: 'title', player: null }); }),
      districtNum: s.district + 1, districtName: T.name, districtSub: T.sub, districtStars: dStars, districtPct: Math.round(dStars / 30 * 100) + '%', districtMax: 30,
      districtCount: this.TIERS ? this.TIERS.length : 5, maxStars: L ? L.length * 3 : 150,
      districtDots: (this.TIERS || []).map((_, k) => ({ w: k === s.district ? '28px' : '10px', bg: k === s.district ? '#2a2740' : (this.TIERS && this.districtOpen(rec, k) ? '#ffd23f' : '#e7e2ef') })),
      districtOpen: dOpen, districtLocked: !dOpen,
      lockMsg: s.district > 0 && this.TIERS ? `Clear 7 levels in ${this.TIERS[s.district - 1].name} (${this.solvedIn(rec, s.district - 1)}/7)` : '',
      canPrev: s.district > 0, canNext: s.district < (this.TIERS ? this.TIERS.length - 1 : 4),
      prevDistrict: () => this.goDistrict(-1), nextDistrict: () => this.goDistrict(1),
      driveIn: () => this.driveIn(),
      backToMap: click(() => { this.engine.menuDistrict(s.district, this.locks(s.player), false); this.setState({ screen: 'district' }); }),
      tiles, tileCols: s.wide ? 'repeat(10,minmax(0,1fr))' : 'repeat(5,minmax(0,1fr))',
      legend: (this.TYPES ? ['rush', 'grid', 'colour'] : []).map(k => ({ name: this.TYPES[k].name, goal: this.TYPES[k].goal, bg: this.TYPES[k].bg, ink: this.TYPES[k].ink })),
      levelArrowTop: s.wide ? 'calc((100% - 250px) / 2 + 30px)' : 'calc((100% - 470px) / 2 + 30px)',
      toLevels: click(() => this.backToLevels()),
      levelNum: s.levelIdx + 1,
      modeLabel: v.mode, variantName: v.name, vInk: v.ink, vBg: v.bg, rule: v.rule,
      goal: match ? (lv.variant === 'onegate' ? 'Drive every car out of the gate' : 'Send each car to its colour gate') : rush ? 'Get the red car out of the gate' : 'Drive every car off the lot',
      statBig: counted ? String(s.moves) : String(s.left), statBigLabel: counted ? 'moves' : 'cars left',
      statSmall: counted ? String(lv && this.starTargets ? this.starTargets(lv).three : '') : String(s.bumps), statSmallLabel: counted ? 'for ★★★' : (s.bumps === 1 ? 'bump' : 'bumps'),
      showToast: !!s.toast && s.screen === 'play', toast: s.toast,
      undo: () => this.engine.undo(), reset: () => this.engine.reset(), hint: () => this.engine.hint(), hintLabel: s.hintOn ? 'Do it' : 'Hint', hintIcon: s.hintOn ? '▶' : '?', hintBg: s.hintOn ? '#7bd389' : '#ffd23f',
      undoOpacity: s.canUndo ? 1 : .45,
      winTitle: titles[w.stars] || '',
      winStars: [0, 1, 2].map(k => ({ color: k < w.stars ? '#ffd23f' : '#e2dcec', size: k === 1 ? '72px' : '56px', delay: (0.35 + k * 0.22) + 's' })),
      winStats: counted ? `${w.moves} moves · 3 stars in ${lv && this.starTargets ? this.starTargets(lv).three : ''} or fewer` : (w.bumps ? `${w.bumps} bump${w.bumps === 1 ? '' : 's'} · 1 bump or fewer for 3 stars` : 'No bumps at all!'),
      hasNext: !!nextOpen,
      replay: click(() => this.play(s.levelIdx)),
      next: click(() => this.play(s.levelIdx + 1)),
      wipeOpacity: s.wipe ? 1 : 0,
    };
  }
}

// ---------------------------------------------------------------------------
// View — the design's <x-dc> template, markup and inline styles kept as-is.
// style-active="box-shadow:0 1px/2px 0 #2a2740" -> class a1 / a2 (:active rule).
// ---------------------------------------------------------------------------
const BTN_SIDE = 'height:50px;background:#fffaf0;border:3px solid #2a2740;box-shadow:0 4px 0 #2a2740;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;color:#2a2740;display:flex;align-items:center;justify-content:center;gap:6px;line-height:1;';
const BTN_NARROW = 'pointer-events:auto;height:60px;min-width:72px;background:#fffaf0;border:3px solid #2a2740;box-shadow:0 5px 0 #2a2740;border-radius:18px;font-size:15px;font-weight:600;cursor:pointer;color:#2a2740;';
function view(v) {
  const e = esc;
  const loading = `
    <div style="position:absolute;inset:0;background:#2a2740;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;">
      <div style="background:#ffd23f;border:4px solid #15132a;box-shadow:0 8px 0 #15132a;border-radius:22px;padding:14px 30px;transform:rotate(-3deg);text-align:center;line-height:.9;">
        <div style="font-size:54px;font-weight:700;letter-spacing:.02em;">TRAFFIC</div>
        <div style="font-size:54px;font-weight:700;letter-spacing:.18em;color:#ff4d6d;">JAM</div>
      </div>
      <div style="width:min(280px,70vw);height:16px;border-radius:99px;background:#403c5e;border:3px solid #15132a;overflow:hidden;">
        <div style="height:100%;background:#ffd23f;border-radius:99px;width:${v.progressPct};transition:width .2s;"></div>
      </div>
      <div style="color:#cfc9ea;font-size:16px;font-weight:500;">Polishing the cars…</div>
    </div>`;

  const title = () => `
    <div style="position:absolute;inset:0;pointer-events:none;">
      <div style="position:absolute;top:18px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:12px;">
        <div style="animation:tjPop .7s cubic-bezier(.2,.9,.3,1.2) both;background:#ffd23f;border:5px solid #2a2740;box-shadow:0 8px 0 #2a2740;border-radius:22px;padding:8px 30px 6px;transform:rotate(-2deg);display:flex;align-items:baseline;gap:16px;line-height:1;">
          <div style="font-size:clamp(40px,6vw,64px);font-weight:700;letter-spacing:.02em;">TRAFFIC</div>
          <div style="font-size:clamp(40px,6vw,64px);font-weight:700;letter-spacing:.14em;color:#ff4d6d;">JAM</div>
        </div>
        <div style="background:#2a2740;color:#fffaf0;border-radius:99px;padding:6px 18px;font-size:18px;font-weight:500;">Who's driving today? Tap a car.</div>
      </div>
      ${v.players.map((p, k) => `
        <button data-click="players.${k}.pick" class="a2" style="pointer-events:auto;position:absolute;bottom:26px;left:${p.left};transform:translateX(-50%);width:210px;padding:12px 14px;background:#fffaf0;border:4px solid #2a2740;box-shadow:0 6px 0 #2a2740;border-radius:22px;cursor:pointer;display:flex;align-items:center;gap:12px;color:#2a2740;text-align:left;">
          <div style="width:52px;height:52px;flex-shrink:0;border-radius:50%;border:4px solid #2a2740;background:${p.color};display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#fffaf0;">${e(p.initial)}</div>
          <div style="display:flex;flex-direction:column;gap:2px;">
            <div style="font-size:24px;font-weight:600;line-height:1;">${e(p.name)}</div>
            <div style="font-size:15px;font-weight:500;color:#6a6488;">★ ${p.stars} / ${v.maxStars}</div>
          </div>
        </button>`).join('')}
    </div>`;

  const mapTop = () => `
    <div style="position:absolute;top:14px;left:136px;right:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;pointer-events:none;">
      <button data-click="toTitle" class="a1" style="pointer-events:auto;background:#fffaf0;border:3px solid #2a2740;box-shadow:0 4px 0 #2a2740;border-radius:14px;padding:8px 14px;font-weight:600;font-size:16px;cursor:pointer;color:#2a2740;display:flex;align-items:center;gap:8px;">
        <span style="width:22px;height:22px;border-radius:50%;background:${v.playerColor};border:2px solid #2a2740;display:inline-block;"></span>${e(v.player)} · switch
      </button>
      <div style="margin-left:auto;background:#ffd23f;border:3px solid #2a2740;box-shadow:0 4px 0 #2a2740;border-radius:14px;padding:8px 14px;font-weight:600;font-size:16px;">★ ${v.totalStars} / ${v.maxStars}</div>
    </div>`;

  const district = () => `
    <div style="position:absolute;inset:0;pointer-events:none;">
      ${iff('dprev', v.canPrev, `
        <button data-click="prevDistrict" class="a1" style="pointer-events:auto;position:absolute;left:18px;top:50%;transform:translateY(-50%);width:68px;height:68px;border-radius:50%;background:#fffaf0;border:4px solid #2a2740;box-shadow:0 5px 0 #2a2740;font-size:34px;font-weight:700;cursor:pointer;color:#2a2740;line-height:1;">‹</button>`)}
      ${iff('dnext', v.canNext, `
        <button data-click="nextDistrict" class="a1" style="pointer-events:auto;position:absolute;right:18px;top:50%;transform:translateY(-50%);width:68px;height:68px;border-radius:50%;background:#fffaf0;border:4px solid #2a2740;box-shadow:0 5px 0 #2a2740;font-size:34px;font-weight:700;cursor:pointer;color:#2a2740;line-height:1;">›</button>`)}
      <div style="position:absolute;left:16px;right:16px;bottom:22px;display:flex;justify-content:center;">
        <div style="width:100%;max-width:580px;pointer-events:auto;animation:tjRise .35s both;background:#fffaf0;border:4px solid #2a2740;box-shadow:0 8px 0 #2a2740;border-radius:26px;padding:16px 20px;display:flex;align-items:center;gap:18px;">
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;">
            <div style="display:flex;align-items:center;gap:8px;">
              ${v.districtDots.map(d => `<div style="width:${d.w};height:10px;border-radius:99px;background:${d.bg};border:2px solid #2a2740;transition:width .25s;"></div>`).join('')}
              <div style="font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6a6488;margin-left:4px;">District ${v.districtNum} of ${v.districtCount}</div>
            </div>
            <div style="font-size:32px;font-weight:700;line-height:1.05;">${e(v.districtName)}</div>
            <div style="font-size:16px;font-weight:500;color:#6a6488;">${e(v.districtSub)}</div>
            <div style="display:flex;align-items:center;gap:10px;margin-top:4px;">
              <div style="flex:1;height:12px;border-radius:99px;background:#e7e2ef;border:2px solid #2a2740;overflow:hidden;"><div style="height:100%;background:#ffd23f;width:${v.districtPct};"></div></div>
              <div style="font-size:15px;font-weight:600;white-space:nowrap;">★ ${v.districtStars} / ${v.districtMax}</div>
            </div>
          </div>
          ${iff('dopen', v.districtOpen, `
            <button data-click="driveIn" class="a2" style="flex-shrink:0;height:72px;padding:0 24px;background:#7bd389;border:4px solid #2a2740;box-shadow:0 6px 0 #2a2740;border-radius:20px;font-size:22px;font-weight:700;cursor:pointer;color:#2a2740;white-space:nowrap;">Drive in ›</button>`)}
          ${iff('dlocked', v.districtLocked, `
            <div style="flex-shrink:0;width:170px;background:#ffe4cc;border:3px dashed #b44f00;border-radius:18px;padding:10px 12px;text-align:center;font-size:15px;font-weight:600;color:#8a3c00;line-height:1.25;">Road closed<br><span style="font-weight:500;">${e(v.lockMsg)}</span></div>`)}
        </div>
      </div>
    </div>`;

  const levels = () => `
    ${iff('lprev', v.canPrev, `
      <button data-click="prevDistrict" class="a1" style="position:absolute;left:18px;top:${v.levelArrowTop};transform:translateY(-50%);width:60px;height:60px;border-radius:50%;background:#fffaf0;border:4px solid #2a2740;box-shadow:0 5px 0 #2a2740;font-size:30px;font-weight:700;cursor:pointer;color:#2a2740;line-height:1;">‹</button>`)}
    ${iff('lnext', v.canNext, `
      <button data-click="nextDistrict" class="a1" style="position:absolute;right:18px;top:${v.levelArrowTop};transform:translateY(-50%);width:60px;height:60px;border-radius:50%;background:#fffaf0;border:4px solid #2a2740;box-shadow:0 5px 0 #2a2740;font-size:30px;font-weight:700;cursor:pointer;color:#2a2740;line-height:1;">›</button>`)}
    <div style="position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 14px;pointer-events:none;">
      <div style="pointer-events:auto;width:100%;max-width:1300px;background:#fffaf0;border:4px solid #2a2740;border-bottom:none;border-radius:28px 28px 0 0;padding:16px 20px 22px;display:flex;flex-direction:column;gap:14px;animation:tjRise .35s both;box-shadow:0 -6px 0 rgba(42,39,64,.25);">
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
          <button data-click="backToMap" class="a1" style="height:46px;padding:0 16px;background:#fffaf0;border:3px solid #2a2740;box-shadow:0 4px 0 #2a2740;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;color:#2a2740;">‹ Map</button>
          <div style="display:flex;flex-direction:column;">
            <div style="font-size:26px;font-weight:700;line-height:1;">${e(v.districtName)}</div>
            <div style="font-size:14px;font-weight:500;color:#6a6488;">Three kinds of puzzle. Each has a few twists.</div>
          </div>
          <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;">
            ${v.legend.map(g => `
              <div style="display:flex;align-items:center;gap:8px;background:${g.bg};border:2px solid #2a2740;border-radius:14px;padding:4px 12px 4px 6px;">
                <div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fffaf0;background:${g.ink};border-radius:99px;padding:3px 9px;">${e(g.name)}</div>
                <div style="font-size:12px;font-weight:600;color:${g.ink};">${e(g.goal)}</div>
              </div>`).join('')}
          </div>
        </div>
        <div style="display:grid;grid-template-columns:${v.tileCols};gap:12px;">
          ${v.tiles.map((t, k) => `
            <div style="display:flex;">
              ${iff('topen', t.open, `
                <button data-click="tiles.${k}.go" class="a1" style="width:100%;height:132px;background:${t.bg};border:3px solid #2a2740;box-shadow:0 5px 0 #2a2740;border-radius:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 6px 9px;color:#2a2740;">
                  <div style="font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fffaf0;background:${t.ink};border-radius:99px;padding:2px 7px;white-space:nowrap;">${e(t.short)}</div>
                  <div style="font-size:36px;font-weight:700;line-height:1;">${t.n}</div>
                  <div style="font-size:13px;font-weight:600;color:${t.ink};line-height:1.1;text-align:center;">${e(t.variant)}</div>
                  <div style="font-size:17px;letter-spacing:1px;line-height:1;"><span style="color:${t.s1};">★</span><span style="color:${t.s2};">★</span><span style="color:${t.s3};">★</span></div>
                </button>`)}
              ${iff('tlocked', t.locked, `
                <div style="width:100%;height:132px;background:#ece8f2;border:3px dashed #b9b2cc;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#a39cb8;gap:8px;">
                  <div style="font-size:32px;font-weight:700;line-height:1;">${t.n}</div>
                  <div class="lk" style="width:16px;height:12px;border-radius:3px;background:#b9b2cc;position:relative;margin-top:6px;"></div>
                </div>`)}
            </div>`).join('')}
        </div>
      </div>
    </div>`;

  const toastWide = `
      <div style="position:absolute;left:16px;right:178px;bottom:16px;display:flex;justify-content:center;pointer-events:none;">
        <div style="max-width:520px;background:#2a2740;color:#fffaf0;border-radius:18px;padding:12px 16px;font-size:16px;font-weight:500;line-height:1.3;animation:tjRise .4s both;display:flex;gap:10px;align-items:center;">
          <div style="flex-shrink:0;width:26px;height:26px;border-radius:50%;background:#ffd23f;color:#2a2740;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;">!</div>
          <div>${e(v.toast)}</div>
        </div>
      </div>`;

  const playWide = () => `
    <div style="position:absolute;top:12px;right:12px;bottom:12px;width:150px;display:flex;flex-direction:column;gap:10px;animation:tjSlide .35s both;">
      <button data-click="toLevels" class="a1" style="height:44px;background:#fffaf0;border:3px solid #2a2740;box-shadow:0 4px 0 #2a2740;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;color:#2a2740;">‹ Levels</button>
      <div style="background:#fffaf0;border:3px solid #2a2740;box-shadow:0 4px 0 #2a2740;border-radius:16px;padding:10px 10px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;">
        <div style="font-size:11px;font-weight:600;color:#6a6488;letter-spacing:.04em;">${e(v.districtName)}</div>
        <div style="font-size:22px;font-weight:700;line-height:1;">Level ${v.levelNum}</div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:3px;"><div style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fffaf0;background:${v.vInk};border-radius:99px;padding:3px 9px;">${e(v.modeLabel)}</div><div style="font-size:12px;font-weight:600;color:${v.vInk};">${e(v.variantName)}</div></div>
        <div style="font-size:12px;font-weight:500;color:#5b5577;line-height:1.25;text-wrap:pretty;">${e(v.goal)}</div>
      </div>
      <div style="background:#2a2740;color:#fffaf0;border-radius:16px;padding:10px 8px;display:grid;grid-template-columns:1fr 1fr;gap:2px;text-align:center;">
        <div style="display:flex;flex-direction:column;"><div style="font-size:26px;font-weight:700;line-height:1;">${e(v.statBig)}</div><div style="font-size:10px;color:#cfc9ea;font-weight:500;">${e(v.statBigLabel)}</div></div>
        <div style="display:flex;flex-direction:column;"><div style="font-size:26px;font-weight:700;line-height:1;color:#ffd23f;">${e(v.statSmall)}</div><div style="font-size:10px;color:#cfc9ea;font-weight:500;">${e(v.statSmallLabel)}</div></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:auto;">
        <button data-click="hint" class="a1" style="${BTN_SIDE.replace('background:#fffaf0', 'background:' + v.hintBg)}"><span style="font-size:19px;font-weight:700;">${v.hintIcon}</span>${v.hintLabel}</button>
        <button data-click="undo" class="a1" style="${BTN_SIDE}opacity:${v.undoOpacity};"><span style="font-size:19px;font-weight:700;">↶</span>Undo</button>
        <button data-click="reset" class="a1" style="${BTN_SIDE}"><span style="font-size:19px;font-weight:700;">↻</span>Reset</button>
      </div>
    </div>
    ${iff('toastw', v.showToast, toastWide)}`;

  const playNarrow = () => `
    <div style="position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:12px;">
      <div style="display:flex;align-items:flex-start;gap:10px;padding-left:124px;">
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;">
          <div style="display:flex;align-items:center;gap:8px;background:#fffaf0;border:3px solid #2a2740;box-shadow:0 4px 0 #2a2740;border-radius:16px;padding:6px 12px;">
            <div style="font-size:19px;font-weight:700;white-space:nowrap;">Level ${v.levelNum}</div>
            <div style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fffaf0;background:${v.vInk};border-radius:99px;padding:3px 8px;white-space:nowrap;">${e(v.variantName)}</div>
          </div>
          <div style="font-size:14px;font-weight:600;background:rgba(255,250,240,.9);border-radius:99px;padding:3px 12px;text-align:center;">${e(v.goal)}</div>
        </div>
        <div style="flex-shrink:0;min-width:78px;height:56px;background:#2a2740;color:#fffaf0;border-radius:16px;padding:4px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;">
          <div style="font-size:24px;font-weight:700;">${e(v.statBig)}</div>
          <div style="font-size:11px;font-weight:500;color:#cfc9ea;white-space:nowrap;">${e(v.statBigLabel)}</div>
        </div>
        <button data-click="toLevels" class="a1" style="pointer-events:auto;height:56px;padding:0 14px;background:#fffaf0;border:3px solid #2a2740;box-shadow:0 4px 0 #2a2740;border-radius:16px;font-size:17px;font-weight:600;cursor:pointer;color:#2a2740;flex-shrink:0;">‹ Levels</button>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
        ${iff('toastn', v.showToast, `
          <div style="max-width:380px;background:#2a2740;color:#fffaf0;border-radius:18px;padding:10px 16px;text-align:center;font-size:15px;font-weight:500;line-height:1.3;animation:tjRise .4s both;">${e(v.toast)}</div>`)}
        <div style="display:flex;justify-content:center;gap:10px;">
          <button data-click="undo" class="a1" style="${BTN_NARROW}opacity:${v.undoOpacity};">↶ Undo</button>
          <button data-click="reset" class="a1" style="${BTN_NARROW}">↻ Reset</button>
          <button data-click="hint" class="a1" style="${BTN_NARROW.replace('background:#fffaf0', 'background:' + v.hintBg)}">${v.hintIcon} ${v.hintLabel}</button>
        </div>
      </div>
    </div>`;

  const win = () => `
    <div style="position:absolute;top:0;left:0;bottom:0;right:${v.winRight};background:rgba(42,39,64,.4);display:flex;align-items:center;justify-content:center;padding:20px;">
      <div style="animation:tjRise .45s both;width:100%;max-width:400px;background:#fffaf0;border:4px solid #2a2740;box-shadow:0 10px 0 #2a2740;border-radius:28px;padding:24px 22px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;">
        <div style="font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6a6488;">Level ${v.levelNum} · ${e(v.variantName)}</div>
        <div style="font-size:36px;font-weight:700;line-height:1;">${e(v.winTitle)}</div>
        <div style="display:flex;gap:6px;align-items:flex-end;">
          ${v.winStars.map(s => `<div style="font-size:${s.size};line-height:1;color:${s.color};-webkit-text-stroke:3px #2a2740;animation:tjPop .5s both;animation-delay:${s.delay};">★</div>`).join('')}
        </div>
        <div style="font-size:17px;font-weight:500;color:#4a4570;">${e(v.winStats)}</div>
        <div style="display:flex;gap:10px;width:100%;margin-top:6px;">
          <button data-click="toLevels" class="a1" style="flex:1;height:58px;background:#fffaf0;border:3px solid #2a2740;box-shadow:0 5px 0 #2a2740;border-radius:18px;font-size:17px;font-weight:600;cursor:pointer;color:#2a2740;">Levels</button>
          <button data-click="replay" class="a1" style="flex:1;height:58px;background:#fffaf0;border:3px solid #2a2740;box-shadow:0 5px 0 #2a2740;border-radius:18px;font-size:17px;font-weight:600;cursor:pointer;color:#2a2740;">Replay</button>
          ${iff('wnext', v.hasNext, `
            <button data-click="next" class="a1" style="flex:1.3;height:58px;background:#7bd389;border:3px solid #2a2740;box-shadow:0 5px 0 #2a2740;border-radius:18px;font-size:19px;font-weight:700;cursor:pointer;color:#2a2740;">Next ›</button>`)}
        </div>
      </div>
    </div>`;

  return iff('loading', v.isLoading, loading)
    + iff('title', v.isTitle, v.isTitle ? title() : '')
    + iff('maptop', v.showMapTop, v.showMapTop ? mapTop() : '')
    + iff('district', v.isDistrict, v.isDistrict ? district() : '')
    + iff('levels', v.isLevels, v.isLevels ? levels() : '')
    + iff('playwide', v.playWide, v.playWide ? playWide() : '')
    + iff('playnarrow', v.playNarrow, v.playNarrow ? playNarrow() : '')
    + iff('win', v.isWin, v.isWin ? win() : '')
    + `<div style="position:absolute;inset:0;background:#2a2740;pointer-events:none;transition:opacity .22s;opacity:${v.wipeOpacity};"></div>`
    + `<a href="../../index.html" style="position:absolute;top:14px;left:14px;z-index:20;display:flex;align-items:center;background:#fffaf0;border:3px solid #2a2740;box-shadow:0 4px 0 #2a2740;border-radius:14px;padding:8px 16px;font-weight:600;font-size:17px;">← Games</a>`;
}

document.addEventListener('contextmenu', e => e.preventDefault());
new Component();
</script>
</body>
</html>
