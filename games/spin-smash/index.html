<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Spin Smash - Garfield Boys' Arcade</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a2e;overflow:hidden;touch-action:none;font-family:'Segoe UI',system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
.hidden{display:none!important}
#backBtn{position:fixed;top:12px;left:12px;z-index:9999;background:rgba(0,0,0,0.55);color:#fff;text-decoration:none;padding:6px 18px;border-radius:20px;font:bold 15px/1.4 'Segoe UI',system-ui,sans-serif;border:1px solid rgba(255,255,255,0.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background 0.2s}
#backBtn:hover{background:rgba(0,0,0,0.75)}
#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.7);color:#fff;text-align:center}
#overlay h1{font-size:clamp(2rem,8vw,4rem);margin-bottom:0.5rem;text-shadow:0 0 30px #6c5ce7,0 0 60px #a29bfe}
#overlay .sub{font-size:clamp(1rem,3vw,1.4rem);color:#a0c4ff;margin-bottom:1.5rem}
#overlay .info{font-size:clamp(0.85rem,2.5vw,1.1rem);color:rgba(255,255,255,0.7);margin-bottom:2rem;max-width:500px;padding:0 1rem;line-height:1.5}
.btn{padding:14px 40px;font-size:1.3rem;border:none;border-radius:12px;background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;cursor:pointer;font-weight:700;box-shadow:0 4px 20px rgba(108,92,231,0.4);transition:transform 0.15s;display:inline-block;margin:6px}
.btn:hover{transform:scale(1.05)}.btn:active{transform:scale(0.95)}
.btn-sm{padding:10px 24px;font-size:1rem}
.btn-locked{opacity:0.4;pointer-events:none}
.btn-skip{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.3)}
#menuStats{color:#a0c4ff;margin-bottom:1.2rem;font-size:1.1rem}
#menuStats span{color:#ffd32a;font-weight:bold}
#draftScreen{flex-direction:row;flex-wrap:wrap;gap:12px}
#draftCards{flex-wrap:nowrap!important}
@media (orientation:landscape) and (max-height:600px){
#overlay{flex-direction:row;flex-wrap:wrap;padding:12px;gap:8px}
#overlay h1{font-size:clamp(1.4rem,5vw,2.4rem);margin:0 12px 0 0}
#overlay .sub,.info{margin-bottom:4px}
#draftScreen{padding:10px;gap:8px}
#draftScreen h2{font-size:1rem;margin-bottom:4px}
#draftCards{gap:10px!important}
#upgradesScreen{padding:12px}
#upgradesScreen>div{max-width:none!important;display:grid;grid-template-columns:1fr 1fr;gap:8px}
#upgradesScreen>div>h2,#upgradesScreen>div>button,#upgradesScreen>div>#shardBalance{grid-column:1/-1}
#pauseScreen{gap:8px}
#pauseScreen h2{margin-bottom:8px!important}
#ascensionScreen{padding:12px}
#ascensionScreen h2{font-size:1.4rem!important;margin-bottom:6px!important}
}
</style>
</head>
<body>
<a id="backBtn" href="../../index.html">&larr; Games</a>
<canvas id="c"></canvas>
<div id="overlay">
<h1>SPIN SMASH</h1>
<div class="sub">Knock them off. Stay on.</div>
<div class="info">Move with joystick/WASD. Dash to slam enemies off the edge!</div>
<div id="menuStats"></div>
<div id="menuArenas"></div>
<div style="margin-top:12px"><button class="btn btn-sm" id="btnUpgrades">UPGRADES</button></div>
</div>

<!-- Upgrades Screen -->
<div id="upgradesScreen" class="hidden" style="position:fixed;inset:0;z-index:25;background:rgba(0,0,0,0.95);color:#fff;overflow-y:auto;padding:20px">
<div style="max-width:900px;margin:0 auto">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
<button class="btn btn-sm" id="btnBackFromUpgrades">&larr; Back</button>
<div id="shardBalance"></div>
</div>
<h2 style="margin-bottom:12px;font-size:1.4rem;color:#a0c4ff">SYSTEM UPGRADES</h2>
<div id="upgradeList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px"></div>
<h2 style="margin-top:24px;margin-bottom:12px;font-size:1.4rem;color:#a0c4ff">CHASSIS CONFIG</h2>
<div id="chassisList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px"></div>
</div>
</div>

<!-- Draft Screen -->
<div id="draftScreen" class="hidden" style="position:fixed;inset:0;z-index:25;background:rgba(0,0,0,0.88);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px">
<h2 id="draftTitle" style="margin-bottom:6px;font-size:clamp(1.6rem,4vw,2.4rem)">WAVE CLEARED: UPGRADE MODULE</h2>
<div id="buildBadge" style="color:#a29bfe;margin-bottom:16px;font-size:0.9rem"></div>
<div id="draftCards" style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-bottom:16px"></div>
<button class="btn btn-skip" id="btnSkipDraft" style="font-size:1.1rem;padding:12px 32px">SKIP (+3 SHARDS)</button>
</div>

<!-- Ascension Screen -->
<div id="ascensionScreen" class="hidden" style="position:fixed;inset:0;z-index:25;background:rgba(0,0,0,0.92);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px">
<h2 id="ascensionTitle" style="font-size:2rem;margin-bottom:12px;text-shadow:0 0 20px #6c5ce7"></h2>
<p id="ascensionMsg" style="color:#a0c4ff;margin-bottom:12px;max-width:400px"></p>
<p id="ascensionBonus" style="color:#ffd32a;margin-bottom:20px"></p>
<button class="btn" id="btnAscend">CONTINUE</button>
</div>

<!-- Pause Screen -->
<div id="pauseScreen" class="hidden" style="position:fixed;inset:0;z-index:25;background:rgba(0,0,0,0.8);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center">
<h2 style="margin-bottom:20px">PAUSED</h2>
<button class="btn" id="btnResume">RESUME</button>
<button class="btn btn-sm" id="btnRestart" style="margin-top:8px">RESTART RUN</button>
<button class="btn btn-sm" id="btnQuit" style="margin-top:8px">QUIT TO MENU</button>
</div>

<!-- Touch controls -->
<div id="touchControls" class="hidden" style="position:fixed;inset:0;z-index:30;pointer-events:none">
<div id="joyBase" style="position:absolute;bottom:30px;left:30px;width:200px;height:200px;border-radius:50%;background:rgba(0,243,255,0.06);border:2px solid rgba(0,243,255,0.2);pointer-events:auto;display:flex;align-items:center;justify-content:center">
<div id="joyKnob" style="width:80px;height:80px;border-radius:50%;background:rgba(0,243,255,0.25);border:3px solid rgba(0,243,255,0.5);box-shadow:0 0 16px rgba(0,243,255,0.3);transition:transform 0.05s"></div>
</div>
<button id="dashBtn" style="position:absolute;bottom:40px;right:40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(108,92,231,0.7),rgba(108,92,231,0.3));border:4px solid #a29bfe;color:#fff;font-size:28px;pointer-events:auto;touch-action:none;box-shadow:0 0 24px rgba(162,155,254,0.4),inset 0 0 20px rgba(162,155,254,0.2);display:flex;align-items:center;justify-content:center;transition:opacity 0.15s,border-color 0.15s,box-shadow 0.15s">
<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
</button>
</div>

<script>
// ============================================================================
// SPIN SMASH - Complete Game
// ============================================================================
'use strict';
// roundRect polyfill
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this}}

// --- Vec2 & Utils ---
class Vec2{constructor(x=0,y=0){this.x=x;this.y=y}add(v){return new Vec2(this.x+v.x,this.y+v.y)}sub(v){return new Vec2(this.x-v.x,this.y-v.y)}mult(s){return new Vec2(this.x*s,this.y*s)}mag(){return Math.sqrt(this.x*this.x+this.y*this.y)}norm(){let m=this.mag();return m===0?new Vec2(0,0):new Vec2(this.x/m,this.y/m)}dist(v){return this.sub(v).mag()}dot(v){return this.x*v.x+this.y*v.y}}
const Utils={
clamp(v,mn,mx){return v<mn?mn:v>mx?mx:v},
rand(a,b){return a+Math.random()*(b-a)},
randInt(a,b){return Math.floor(Utils.rand(a,b+1))},
lerp(a,b,t){return a+(b-a)*t},
decayPow(f,dtf){return Math.pow(f,dtf)},
smoothstep(t){return t*t*(3-2*t)}
};
class ObjectPool{constructor(factory,reset){this.factory=factory;this.reset=reset;this.pool=[]}acquire(...args){let obj=this.pool.pop()||this.factory();this.reset(obj,...args);obj.active=true;return obj}release(obj){obj.active=false;this.pool.push(obj)}}

// --- Audio System ---
const AudioSys={
ctx:null,masterGain:null,compressor:null,limiter:null,noiseBuffer:null,initialized:false,muted:false,
activeVoices:[],maxTotalVoices:24,maxPerType:4,voiceCounts:{},
init(){if(this.initialized)return;try{const AC=window.AudioContext||window.webkitAudioContext;this.ctx=new AC();
this.compressor=this.ctx.createDynamicsCompressor();this.compressor.threshold.value=-10;this.compressor.knee.value=15;this.compressor.ratio.value=4;this.compressor.attack.value=0.015;this.compressor.release.value=0.1;
this.masterGain=this.ctx.createGain();this.masterGain.gain.value=0.45;
this.limiter=this.ctx.createDynamicsCompressor();this.limiter.threshold.value=-6;this.limiter.knee.value=0;this.limiter.ratio.value=20;this.limiter.attack.value=0.001;this.limiter.release.value=0.05;
this.compressor.connect(this.masterGain);this.masterGain.connect(this.limiter);this.limiter.connect(this.ctx.destination);
const bs=this.ctx.sampleRate*2;this.noiseBuffer=this.ctx.createBuffer(1,bs,this.ctx.sampleRate);const d=this.noiseBuffer.getChannelData(0);for(let i=0;i<bs;i++)d[i]=Math.random()*2-1;
this.initialized=true;
const resume=()=>{this.ctx.resume();document.removeEventListener('pointerdown',resume);document.removeEventListener('keydown',resume)};
if(this.ctx.state==='suspended'){document.addEventListener('pointerdown',resume);document.addEventListener('keydown',resume)}
}catch(e){}},

tryAcquireVoice(type,duration){if(!this.initialized)return false;const now=this.ctx.currentTime;this.activeVoices=this.activeVoices.filter(v=>v.endsAt>now);this.voiceCounts={};for(const v of this.activeVoices)this.voiceCounts[v.type]=(this.voiceCounts[v.type]||0)+1;if(this.activeVoices.length>=this.maxTotalVoices)return false;if((this.voiceCounts[type]||0)>=this.maxPerType)return false;const voice={type,endsAt:now+duration+0.05};this.activeVoices.push(voice);this.voiceCounts[type]=(this.voiceCounts[type]||0)+1;setTimeout(()=>{const idx=this.activeVoices.indexOf(voice);if(idx!==-1)this.activeVoices.splice(idx,1)},(duration+0.05)*1000);return true},
playTone(type,fS,fE,dur,vS,vE,cfg={}){if(!this.initialized||this.muted||this.ctx.state==='suspended')return;const vt=cfg.voiceType||'tone';if(!this.tryAcquireVoice(vt,dur))return;const t=this.ctx.currentTime;const atk=cfg.attack||0.01;const osc=this.ctx.createOscillator();const gain=this.ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(fS,t);if(fE)osc.frequency.exponentialRampToValueAtTime(fE,t+dur);gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(vS,t+atk);gain.gain.exponentialRampToValueAtTime(vE||0.001,t+dur);if(cfg.filterStart){const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(cfg.filterStart,t);if(cfg.filterEnd)f.frequency.exponentialRampToValueAtTime(cfg.filterEnd,t+dur);osc.connect(f);f.connect(gain)}else{osc.connect(gain)}gain.connect(this.compressor);osc.start(t);osc.stop(t+dur)},
playNoise(dur,fS,fE,vol,atk=0.01,vt='noise'){if(!this.initialized||this.muted||this.ctx.state==='suspended')return;if(!this.tryAcquireVoice(vt,dur))return;const t=this.ctx.currentTime;const src=this.ctx.createBufferSource();src.buffer=this.noiseBuffer;const f=this.ctx.createBiquadFilter();f.type='lowpass';f.Q.value=0.5;f.frequency.setValueAtTime(fS,t);f.frequency.exponentialRampToValueAtTime(fE,t+dur);const g=this.ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+atk);g.gain.exponentialRampToValueAtTime(0.001,t+dur);src.connect(f);f.connect(g);g.connect(this.compressor);src.start(t);src.stop(t+dur)},
playHit(force,isP){if(force<10)return;const n=Math.min(1,force/60);const bf=isP?300:200;const fS=bf-n*50;const vol=0.2+n*0.2;this.playTone('sine',fS,fS*0.1,0.15,vol,0.001,{voiceType:'hit'});this.playNoise(0.1,4000,1000,vol*0.5,0.01,'hit')},
playDash(isP){const v=isP?0.25:0.15;this.playNoise(0.25,4000,300,v,0.01,'dash');this.playTone('triangle',300,100,0.25,v*0.5,0.001,{voiceType:'dash'})},
playShoot(){this.playTone('triangle',1200,200,0.12,0.2,0.001,{attack:0.005,voiceType:'shoot'})},
playExplosion(pw){const v=Math.min(0.3,pw*0.03);this.playNoise(0.25,1800,200,v*0.5,0.01,'explosion');this.playTone('sine',120,50,0.3,v,0.001,{voiceType:'explosion'})},
playShard(){this.playTone('sine',1200,1200,0.1,0.2,0.001,{voiceType:'shard'});setTimeout(()=>this.playTone('sine',1600,1600,0.15,0.2,0.001,{voiceType:'shard'}),50)},
playWaveStart(){this.playTone('square',200,600,0.5,0.15,0.001,{filterStart:400,filterEnd:2000,voiceType:'waveStart'});this.playTone('triangle',300,900,0.5,0.15,0.001,{voiceType:'waveStart'})},
playBossSpawn(){this.playTone('sawtooth',120,40,2.0,0.3,0.001,{filterStart:1000,filterEnd:100,voiceType:'bossSpawn'});this.playNoise(1.5,3000,200,0.2,0.01,'bossSpawn')},
playGameOver(){this.playTone('sawtooth',300,20,1.5,0.25,0.001,{filterStart:1000,filterEnd:100,voiceType:'gameOver'});this.playNoise(1.5,2000,50,0.15,0.01,'gameOver')},
playLegendary(){this.playTone('square',440,440,1.0,0.1,0.001,{attack:0.05,filterStart:2000,filterEnd:400,voiceType:'legendary'});this.playTone('triangle',660,660,1.2,0.1,0.001,{attack:0.1,voiceType:'legendary'});this.playTone('sine',880,880,1.5,0.1,0.001,{attack:0.15,voiceType:'legendary'})},
playUpgrade(){this.playTone('sine',600,900,0.2,0.15,0.001,{voiceType:'upgrade'});this.playTone('triangle',900,1200,0.3,0.1,0.001,{attack:0.1,voiceType:'upgrade'})}
};

// --- Save System ---
function loadArcadeData(){try{return JSON.parse(localStorage.getItem('calebArcadeData'))||{}}catch(e){return{}}}
function saveArcadeData(d){localStorage.setItem('calebArcadeData',JSON.stringify(d))}
function getSave(){let d=loadArcadeData();if(!d.spinsmash)d.spinsmash={shards:0,bestWave:0,upgrades:{mass:0,spin:0,speed:0,harvest:0,cooldown:0,stun:0,arenaExpand:0,fabricator:0},tip:'standard',chassisOwned:{standard:true,flat:false,spike:false},arena2Unlocked:false,arena3Unlocked:false};return d.spinsmash}
function saveSave(s){let d=loadArcadeData();d.spinsmash=s;saveArcadeData(d)}
let save=getSave();

// --- Perk Database ---
const PERK_DB=[
{id:'gyroscopic',name:'Gyro-Stabilizer',type:'Body',rarity:'common',desc:'Agility +40%, Spin decay -10%',arch:{speed:1},apply:t=>{t.turnSpeed*=1.4;t.spinDecay*=0.9}},
{id:'lead_core',name:'Heavy Plating',type:'Body',rarity:'common',desc:'Mass +30%, Speed -10%',arch:{mass:1},apply:t=>{t.mass*=1.3;t.speed*=0.9}},
{id:'hollow_shell',name:'Aero Shell',type:'Body',rarity:'common',desc:'Mass -20%, Top Speed +40%',arch:{speed:1},apply:t=>{t.mass*=0.8;t.maxSpeed*=1.4;t.speed*=1.2}},
{id:'rubber_band',name:'Kinetic Bumper',type:'Body',rarity:'common',desc:'Bounce Restitution +50%',arch:{mass:1},apply:t=>{t.restitution=Math.min(1.8,t.restitution*1.5)}},
{id:'static_charge',name:'Static Charge',type:'Core',rarity:'common',desc:'Spin regen +25% when not dashing',arch:{core:1},apply:t=>{t.spinRegenMult=(t.spinRegenMult||1)*1.25}},
{id:'reinforced_rim',name:'Reinforced Rim',type:'Body',rarity:'common',desc:'Radius +12%, Mass +12%',arch:{mass:1},apply:t=>{t.radius*=1.12;t.mass*=1.12}},
{id:'low_profile',name:'Low Profile',type:'Body',rarity:'common',desc:'Radius -15%, Mass -10%',arch:{speed:1,defense:0.4},apply:t=>{t.radius*=0.85;t.mass*=0.9}},
{id:'tight_turn',name:'Tight Turn Servos',type:'Body',rarity:'common',desc:'Friction -2%, Top Speed -5%',arch:{speed:1},apply:t=>{t.friction=Utils.clamp(t.friction-0.02,0.5,0.995);t.maxSpeed*=0.95}},
{id:'twin_emitter',name:'Twin Emitter',type:'Weapon',rarity:'common',desc:'On Dash, fire 2 projectiles forward',arch:{ordnance:1},onRev:t=>{let a=Math.atan2(t.facing.y,t.facing.x);G.addProj(t,a-0.15,11,5,t.color,2);G.addProj(t,a+0.15,11,5,t.color,2)}},
{id:'rear_guard',name:'Rear Guard',type:'Weapon',rarity:'common',desc:'On Dash, fire 1 projectile backward',arch:{ordnance:1},onRev:t=>{let a=Math.atan2(-t.facing.y,-t.facing.x);G.addProj(t,a,10,6,t.color,2)}},
{id:'side_thrusters',name:'Side Thrusters',type:'Weapon',rarity:'common',desc:'On Dash, fire 2 projectiles perpendicular',arch:{ordnance:1},onRev:t=>{let a=Math.atan2(t.facing.y,t.facing.x);G.addProj(t,a+Math.PI/2,9,5,t.color,2);G.addProj(t,a-Math.PI/2,9,5,t.color,2)}},

{id:'orbit_shards',name:'Plasma Orbits',type:'Weapon',rarity:'rare',desc:'3 energy blades orbit you',arch:{sentinel:1},init:t=>{t.orbitAngle=0;t.orbitShards=3},tick:(t,dtf)=>{t.orbitAngle+=0.1*dtf}},
{id:'spin_burst',name:'Nova Burst',type:'Weapon',rarity:'rare',desc:'On Dash, fire 8 projectiles outward',arch:{ordnance:1},onRev:t=>{for(let i=0;i<8;i++)G.addProj(t,(Math.PI*2/8)*i,12,6,'#00F3FF',2)}},
{id:'edge_anchor',name:'Magnetic Anchor',type:'Body',rarity:'rare',desc:'High friction near arena edge',arch:{defense:1},tick:(t,dtf)=>{if(G.arena.shape==='oval')return;let nd=G.arenaNormalizedDist(t.pos);if(nd>0.8&&t.dashTimer<=0)t.vel=t.vel.mult(Utils.decayPow(0.85,dtf))}},
{id:'momentum_shift',name:'Kinetic Battery',type:'Body',rarity:'rare',desc:'Top Speed increases without dashing',arch:{speed:1},init:t=>{t.kbBaseMax=t.maxSpeed},tick:(t,dtf)=>{if(t.dashCooldown<=0)t.maxSpeed=Math.min((t.kbBaseMax||t.maxSpeed)*1.5,t.maxSpeed+0.05*dtf);else t.maxSpeed=t.kbBaseMax||t.maxSpeed}},
{id:'magnet_core',name:'Magnet Core',type:'Body',rarity:'rare',desc:'Pulls nearby enemies toward you',arch:{sentinel:1},tick:(t,dtf)=>{G.enemies.forEach(e=>{if(e.active&&e.pos.dist(t.pos)<180){let d=t.pos.sub(e.pos).norm();e.applyForce(d.mult(0.12*dtf))}})}},
{id:'flywheel',name:'Flywheel Tuning',type:'Core',rarity:'rare',desc:'Dash speed +15%, duration -1 frame',arch:{speed:1,core:0.4},apply:t=>{t.dashSpeedMult=(t.dashSpeedMult||1)*1.15;t.dashDuration=Math.max(4,t.dashDuration-1)}},
{id:'adrenal_drive',name:'Adrenal Drive',type:'Body',rarity:'rare',desc:'Speed improves as Dash Energy lowers',arch:{speed:1,core:0.4},tick:t=>{let low=1-(t.spin/t.maxSpin);t.adrenalSpeedBonus=low*0.35}},
{id:'second_wind',name:'Second Wind',type:'Disruption',rarity:'rare',desc:'When Dash hits 0, refill 30% once/wave',arch:{core:1,defense:0.4},init:t=>{t.secondWindReady=true},tick:t=>{if(t.spin<=0&&t.secondWindReady){t.spin=t.maxSpin*0.3;t.secondWindReady=false}}},
{id:'feint_dash',name:'Phase Shift',type:'Disruption',rarity:'rare',desc:'Dash grants extra invuln, shorter cooldown',arch:{speed:1,defense:0.4},apply:t=>{t.dashCooldownMax=Math.max(20,Math.round(t.dashCooldownMax*0.7))},onRev:t=>{t.invulnTimer=Math.max(t.invulnTimer,t.dashDuration+25)}},

// --- Build Identity ---
const RARITY_WEIGHT={common:1,rare:1.6,epic:2.3,legendary:3.2};
const BUILD_PURE={mass:'JUGGERNAUT',speed:'BLITZ RUNNER',defense:'BULWARK',ordnance:'GUNSHIP',sentinel:'AEGIS BLADE',core:'OVERCLOCKER'};
const BUILD_HYBRID={core_defense:'STASIS WARD',core_mass:'REACTOR TANK',core_ordnance:'RAILGUNNER',core_sentinel:'PULSE WARDEN',core_speed:'OVERDRIVE RACER',defense_mass:'FORTRESS',defense_ordnance:'TURRET',defense_sentinel:'GUARDIAN',defense_speed:'SKIRMISHER',mass_ordnance:'SIEGE ENGINE',mass_sentinel:'IRON WARDEN',mass_speed:'RAMMING SPEED',ordnance_sentinel:'ARSENAL',ordnance_speed:'GUNSLINGER',sentinel_speed:'WHIRLWIND'};
function getBuildIdentity(perks){
let scores={mass:0,speed:0,defense:0,ordnance:0,sentinel:0,core:0};
(perks||[]).forEach(p=>{let tags=p.arch;if(!tags)return;let w=RARITY_WEIGHT[p.rarity]||1;if(p.prereq)w*=1.35;for(let k in tags)if(scores.hasOwnProperty(k))scores[k]+=tags[k]*w});
let entries=Object.keys(scores).map(id=>({id,score:scores[id]})).filter(e=>e.score>0);
if(!entries.length)return{name:'UNSPECIALIZED',color:'#888'};
entries.sort((a,b)=>b.score-a.score);let total=entries.reduce((s,e)=>s+e.score,0);
let top=entries[0],second=entries[1]||{id:null,score:0};let topShare=top.score/total;
let meaningful=entries.filter(e=>(e.score/total)>=0.16).length;
if(topShare<0.40&&meaningful>=3)return{name:'OMNI-CHASSIS',color:'#fff'};
if(topShare>=0.68||!second.id)return{name:BUILD_PURE[top.id]||'SPECIALIST',color:'#a29bfe'};
let key=[top.id,second.id].sort().join('_');return{name:BUILD_HYBRID[key]||'HYBRID',color:'#a29bfe'}}

// --- Draft Logic ---
function getDraftCards(count,wave,ownedIds,legendaryUsed){
let excluded=new Set(ownedIds);let legendaryAllowed=wave>=10&&!legendaryUsed;
let synergyChance=wave<10?0:Utils.clamp((wave-10)/24,0,1)*0.45+0.10;
let pool=PERK_DB.filter(p=>{if(excluded.has(p.id))return false;if(G.arena.shape==='oval'&&p.id==='edge_anchor')return false;if(p.rarity==='legendary'&&!legendaryAllowed)return false;if(p.prereq){if(!excluded.has(p.prereq))return false;if(Math.random()>=synergyChance)return false}return true});
let choices=[];for(let i=0;i<count;i++){if(!pool.length)break;let rw=Math.random()+wave*0.05;let ar='common';if(rw>0.8)ar='rare';if(rw>1.3)ar='epic';if(rw>1.9&&legendaryAllowed)ar='legendary';
let vp=pool.filter(p=>{if(ar==='legendary')return true;if(ar==='epic'&&p.rarity!=='legendary')return true;if(ar==='rare'&&(p.rarity==='common'||p.rarity==='rare'))return true;return p.rarity==='common'});
if(!vp.length)vp=pool;let pick=vp[Math.floor(Math.random()*vp.length)];choices.push(pick);pool=pool.filter(p=>p.id!==pick.id)}return choices}

// --- Particle & Projectile classes ---
class Particle{
constructor(x,y,color,speed,size,glow=true){this.pos=new Vec2(x,y);let a=Math.random()*Math.PI*2;this.vel=new Vec2(Math.cos(a)*speed,Math.sin(a)*speed);this.color=color;this.size=size;this.life=1;this.decay=Utils.rand(0.03,0.08);this.glow=glow;this.active=true}
reset(x,y,color,speed,size,glow=true){this.pos=new Vec2(x,y);let a=Math.random()*Math.PI*2;this.vel=new Vec2(Math.cos(a)*speed,Math.sin(a)*speed);this.color=color;this.size=size;this.life=1;this.decay=Utils.rand(0.03,0.08);this.glow=glow;this.active=true}
update(dtf){this.pos=this.pos.add(this.vel.mult(dtf));this.life-=this.decay*dtf;if(this.life<=0)this.active=false}
draw(c){c.globalAlpha=Math.max(0,this.life);if(this.glow&&Particle.glowCount<Particle.GLOW_BUDGET){c.shadowBlur=10;c.shadowColor=this.color;Particle.glowCount++}c.beginPath();c.moveTo(this.pos.x,this.pos.y);c.lineTo(this.pos.x-this.vel.x*2,this.pos.y-this.vel.y*2);c.strokeStyle=this.color;c.lineWidth=this.size;c.stroke();c.shadowBlur=0;c.globalAlpha=1}
}
Particle.GLOW_BUDGET=25;Particle.glowCount=0;

class Projectile{
constructor(x,y,vx,vy,r,color,mass,owner){this.pos=new Vec2(x,y);this.vel=new Vec2(vx,vy);this.radius=r;this.color=color;this.mass=mass;this.owner=owner;this.life=135;this.active=true;this.pierceRemaining=0;this.knockbackMult=1;this.hitTargets=new Set()}
reset(x,y,vx,vy,r,color,mass,owner){this.pos=new Vec2(x,y);this.vel=new Vec2(vx,vy);this.radius=r;this.color=color;this.mass=mass;this.owner=owner;this.life=135;this.active=true;this.pierceRemaining=0;this.knockbackMult=1;this.hitTargets=new Set()}
update(dtf){this.pos=this.pos.add(this.vel.mult(dtf));this.life-=dtf;if(this.life<=0)this.active=false}
draw(c){c.beginPath();c.arc(this.pos.x,this.pos.y,this.radius,0,Math.PI*2);c.fillStyle=this.color;c.shadowBlur=G.isMobile?0:12;c.shadowColor=this.color;c.fill();c.shadowBlur=0}
}

// --- Top (Player/Enemy base) ---
class Top{
constructor(x,y,isPlayer=false){
this.pos=new Vec2(x,y);this.vel=new Vec2(0,0);this.radius=25.2;this.mass=4;this.restitution=1.3;
this.spin=100;this.maxSpin=100;this.spinDecay=0.05;this.spinRegenMult=1;this.speed=1.9;this.maxSpeed=21;this.friction=0.94;
this.isPlayer=isPlayer;this.color=isPlayer?'#00F3FF':'#FF00EA';this.active=true;this.perks=[];
this.invulnTimer=0;this.dashCooldown=0;this.dashCooldownMax=20;this.dashTimer=0;this.dashDuration=8;
this.dashCost=50;this.dashGraceTimer=0;this.dashGraceMax=isPlayer?30:10;this.dashEdgeGuard=0;
this.facing=new Vec2(1,0);this.currentAngle=0;this.trail=[];this.turnSpeed=1;
this.stunDurationMult=1;this.knockbackTakenMult=1;this.knockbackDealtMult=1;this.dashSpeedMult=1;
this.adrenalSpeedBonus=0;this.squash=1;this.hitFlash=0;this.dazeTimer=0;this.stunImmune=false;
this.orbitAngle=0;this.orbitShards=0;this.orbitRadiusBonus=0;this.orbitKnockbackMult=1;this.orbitDazeFrames=0;this.orbitMultiHit=false;this.orbitHitCooldown=0;
this.projPierce=0;this.projKnockbackMult=1;this.projImpactPulse=0;
this.bigHitNova=false;this.bigHitNovaCooldown=0;this.retaliationField=false;this.retaliationCooldown=0;
this.spawnInvulnTimer=0;
}
applyForce(f){this.vel=this.vel.add(f.mult(1/this.mass))}
applyPerkMods(){this.perks.forEach(p=>{if(p.apply&&!this[p.id+'_a']){p.apply(this);this[p.id+'_a']=true}if(p.init&&!this[p.id+'_i']){p.init(this);this[p.id+'_i']=true}})}
canDash(){return this.dashCooldown<=0&&this.spin>=this.dashCost}
triggerDash(dirOverride){
if(!this.canDash())return false;AudioSys.playDash(this.isPlayer);
let dir=dirOverride&&dirOverride.mag()>0.1?dirOverride.norm():this.facing;this.facing=dir;
this.spin-=this.dashCost;this.dashCooldown=this.dashCooldownMax;this.dashTimer=this.dashDuration;this.dashGraceTimer=0;
this.invulnTimer=Math.max(this.invulnTimer,this.dashDuration);
this.vel=dir.mult(this.getDashLaunchSpeed(dir));this.squash=1.4;G.screenShake=Math.max(G.screenShake,4);
G.spawnDashBurst(this);this.perks.forEach(p=>{if(p.onRev)p.onRev(this)});return true}
getDashLaunchSpeed(dir){
let ds=this.maxSpeed*1.0*(this.dashSpeedMult||1);
let safe=this.distToEdge(dir);let frames=Math.max(1,this.dashDuration);let f=this.friction;
let tf=f===1?frames:f*(1-Math.pow(f,frames))/(1-f);let cap=safe/Math.max(1,tf);
let cs=Math.max(0,Math.min(ds,cap));this.dashEdgeGuard=cs<ds?frames+8:0;return cs}
distToEdge(dir){
let center=new Vec2(W/2,H/2);let{rx,ry}=G.arenaRadii();let m=this.radius+12;
let erx=Math.max(1,rx-m),ery=Math.max(1,ry-m);
let relX=(this.pos.x-center.x)/erx,relY=(this.pos.y-center.y)/ery;
let dX=dir.x/erx,dY=dir.y/ery;let a=dX*dX+dY*dY;let b=2*(relX*dX+relY*dY);let c=relX*relX+relY*relY-1;
let disc=b*b-4*a*c;if(disc<=0||a===0)return 0;return Math.max(0,(-b+Math.sqrt(disc))/(2*a))}
keepDashInside(){
let center=new Vec2(W/2,H/2);let nd=G.arenaNormalizedDist(this.pos);if(nd<=1)return;
let outward=G.arenaOutwardNormal(this.pos);let{rx,ry}=G.arenaRadii();
let safeRx=rx-this.radius-12,safeRy=ry-this.radius-12;
let dx=(this.pos.x-center.x)/safeRx,dy=(this.pos.y-center.y)/safeRy;let d=Math.sqrt(dx*dx+dy*dy);
if(d>1){this.pos=new Vec2(center.x+(this.pos.x-center.x)/d,center.y+(this.pos.y-center.y)/d)}
let os=this.vel.dot(outward);if(os>0)this.vel=this.vel.sub(outward.mult(os));
this.dashTimer=0;this.invulnTimer=0}

// --- Physics Update ---
physicsStep(dtf){
if(!this.player)return;
// During 'dying' state, only update particles/projectiles (no player input or collision)
if(!this.player.active){
this.projectiles.forEach(p=>{if(p.active)p.update(dtf)});
this.particles.forEach(p=>{if(p.active)p.update(dtf)});
this.screenShake*=Utils.decayPow(0.8,dtf);if(this.screenShake<0.5)this.screenShake=0;
return}
// Player input - keyboard always works (not gated by isMobile)
let kbActive=this.keys['KeyW']||this.keys['ArrowUp']||this.keys['KeyS']||this.keys['ArrowDown']||this.keys['KeyA']||this.keys['ArrowLeft']||this.keys['KeyD']||this.keys['ArrowRight'];
if(kbActive){
if(this.keys['KeyW']||this.keys['ArrowUp'])this.player.applyForce(new Vec2(0,-this.player.speed*dtf));
if(this.keys['KeyS']||this.keys['ArrowDown'])this.player.applyForce(new Vec2(0,this.player.speed*dtf));
if(this.keys['KeyA']||this.keys['ArrowLeft'])this.player.applyForce(new Vec2(-this.player.speed*dtf,0));
if(this.keys['KeyD']||this.keys['ArrowRight'])this.player.applyForce(new Vec2(this.player.speed*dtf,0));
let fx=0,fy=0;if(this.keys['KeyW']||this.keys['ArrowUp'])fy=-1;if(this.keys['KeyS']||this.keys['ArrowDown'])fy=1;if(this.keys['KeyA']||this.keys['ArrowLeft'])fx=-1;if(this.keys['KeyD']||this.keys['ArrowRight'])fx=1;
if(fx||fy)this.player.facing=new Vec2(fx,fy).norm()}
else if(this.isMobile&&this.mobileDir.mag()>0.01){let dir=this.mobileDir.norm();let str=this.mobileDir.mag();this.player.facing=dir;this.player.applyForce(dir.mult(this.player.speed*0.82*str*dtf))}
else if(!this.isMobile&&this.mouse.active&&this.player){let md=this.mouse.pos.sub(this.player.pos);if(md.mag()>this.player.radius){this.player.facing=md.norm();this.player.applyForce(md.norm().mult(this.player.speed*dtf))}}
// Update entities
this.player.update(dtf);
this.enemies.forEach(e=>{if(e.active){e.update(dtf);if(e.updateAI)e.updateAI(this.player.pos,dtf)}});
this.projectiles.forEach(p=>{if(p.active)p.update(dtf)});
this.particles.forEach(p=>{if(p.active)p.update(dtf)});
// Mine update
this.mines.forEach(m=>{if(!m.active)return;m.timer+=dtf;if(m.timer>30){let targets=m.owner===this.player?this.enemies:[this.player];targets.forEach(t=>{if(t&&t.active&&t.pos.dist(m.pos)<m.triggerRadius){m.active=false;this.createNova(m.pos.x,m.pos.y,m.explosionRadius,m.power,m.owner);this.createExplosion(m.pos.x,m.pos.y,'#a29bfe')}})}});
// Collisions
this.resolveCollisions(dtf);
// Projectile hits
this.projectileHits();
// Orbit blade hits
this.orbitHits(dtf);
// Arena boundary death
this.checkArenaDeath();
// Hexagon hazard
if(this.hexagon)this.updateHexagon(dtf);
// Buzzsaw hazard
if(this.buzzsaw)this.updateBuzzsaw(dtf);
// Overtime arena shrink
this.matchTimer+=dtf;

// --- Draw ---
draw(){

// Background gradient

let shX=this.screenShake>0?Utils.rand(-this.screenShake,this.screenShake):0;
let shY=this.screenShake>0?Utils.rand(-this.screenShake,this.screenShake):0;
ctx.translate(cx+shX,cy+shY);ctx.scale(scale,scale);ctx.translate(-cx,-cy);

// Draw arena

ctx.globalAlpha=0.3;this.demoTops.forEach(t=>t.draw(ctx));ctx.globalAlpha=1;
}else if(this.state==='playing'||this.state==='dying'||this.state==='draft'||this.state==='ascension'||this.state==='paused'){

// Enemies

// Player

drawHexagon(){
let hex=this.hexagon;let cx=W/2,cy=H/2;ctx.save();ctx.translate(cx,cy);ctx.rotate(hex.angle);
let verts=[];for(let i=0;i<6;i++){let a=(Math.PI*2/6)*i;verts.push({x:Math.cos(a)*hex.radius,y:Math.sin(a)*hex.radius})}
let safe=new Set(hex.safeSides||[]);let prog=hex.telegraph>0?1-(hex.telegraph/hex.telegraphMax):0;
for(let side=0;side<6;side++){let a=verts[side],b=verts[(side+1)%6];let isSafe=hex.telegraph>0&&safe.has(side);
ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
ctx.lineWidth=isSafe?7:(hex.telegraph>0?4+prog*3:3);
ctx.strokeStyle=isSafe?'rgba(0,255,136,0.8)':(hex.telegraph>0?`rgba(255,42,42,${0.35+prog*0.65})`:'#8A2BE2');
ctx.shadowBlur=isSafe?20:(hex.telegraph>0?18+prog*20:12);ctx.shadowColor=isSafe?'#00FF88':(hex.telegraph>0?'#FF2A2A':'#8A2BE2');ctx.stroke()}
ctx.shadowBlur=0;ctx.restore()},

drawBuzzsaw(){
let saw=this.buzzsaw;if(!saw||!saw.currentPos)return;let sp=saw.currentPos;
// Telegraph line
if(saw.mode==='telegraph'){ctx.save();ctx.setLineDash(saw.aimLocked?[]:[8,8]);
let dir=saw.lockedDir||(this.player?this.player.pos.sub(saw.lungeFrom).norm():new Vec2(1,0));
let td=Math.max(this.arena.radiusX,this.arena.radiusY)*2.4;
ctx.beginPath();ctx.moveTo(sp.x,sp.y);ctx.lineTo(sp.x+dir.x*td,sp.y+dir.y*td);
ctx.strokeStyle=saw.aimLocked?'rgba(255,42,42,0.8)':'rgba(255,42,42,0.4)';ctx.lineWidth=3;ctx.stroke();ctx.setLineDash([]);ctx.restore()}
// Blade
ctx.save();ctx.translate(sp.x,sp.y);ctx.rotate(saw.spinAngle);
ctx.beginPath();let teeth=8;for(let i=0;i<teeth;i++){let a=(Math.PI*2/teeth)*i;let r1=saw.bladeRadius;let r2=saw.bladeRadius*0.7;
ctx.lineTo(Math.cos(a)*r1,Math.sin(a)*r1);ctx.lineTo(Math.cos(a+Math.PI/teeth)*r2,Math.sin(a+Math.PI/teeth)*r2)}
ctx.closePath();ctx.fillStyle='#e74c3c';ctx.shadowBlur=15;ctx.shadowColor='#e74c3c';ctx.fill();
ctx.beginPath();ctx.arc(0,0,saw.bladeRadius*0.3,0,Math.PI*2);ctx.fillStyle='#333';ctx.fill();ctx.shadowBlur=0;ctx.restore()},

drawHUD(){
if(!this.player||this.state!=='playing')return;
const ARCH_COLORS={mass:'#FF2A2A',speed:'#00F3FF',defense:'#00FF88',ordnance:'#FF00EA',sentinel:'#8A2BE2',core:'#FFF100'};
let build=getBuildIdentity(this.player.perks);
let breakdown=this.computeBuildBreakdown(this.player.perks);
ctx.save();

// === TOP-LEFT (stacked, matching original style) ===
let lx=24,ly=50;

// Pause button (thin cyan line left border accent)
ctx.fillStyle='#00F3FF';ctx.fillRect(lx-4,ly-4,3,130);

// WAVE label + number on same line
ctx.fillStyle='#00F3FF';ctx.font='bold 13px "Segoe UI",system-ui,sans-serif';ctx.textAlign='left';
ctx.fillText('WAVE',lx+6,ly+4);
ctx.fillStyle='#fff';ctx.font='bold 34px "Segoe UI",system-ui,sans-serif';
ctx.fillText(String(this.wave),lx+60,ly+8);
ly+=32;

// SHARDS
ctx.fillStyle='#ffd32a';ctx.font='bold 13px "Segoe UI",system-ui,sans-serif';
ctx.fillText('SHARDS',lx+6,ly);
ctx.fillStyle='#fff';ctx.font='bold 20px "Segoe UI",system-ui,sans-serif';
ctx.fillText(String(this.runShards),lx+78,ly);
ly+=28;

// BUILD name
ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='bold 11px "Segoe UI",system-ui,sans-serif';
ctx.fillText('BUILD',lx+6,ly);
ctx.fillStyle='#fff';ctx.font='bold 16px "Segoe UI",system-ui,sans-serif';
ctx.fillText(build.name,lx+54,ly);
ly+=8;
// Color bar showing archetype breakdown
if(breakdown.length>0){
let barY=ly+4,barW=140,barH=6;
let bx=lx+6;
for(let seg of breakdown){let sw=barW*seg.pct;ctx.fillStyle=ARCH_COLORS[seg.id]||'#888';ctx.fillRect(bx,barY,sw,barH);bx+=sw}
}

// === TOP-RIGHT ===
let rRight=W-24;let rTop=50;
// DASH CORE label
let canDash=this.player.canDash();
ctx.fillStyle=canDash?'#fff':'rgba(255,255,255,0.4)';ctx.font='bold 14px "Segoe UI",system-ui,sans-serif';ctx.textAlign='right';
ctx.fillText('DASH CORE',rRight,rTop);
// Dash bar
let barW=220,barH=16,barX=rRight-barW,barY=rTop+8;
ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(barX,barY,barW,barH);
let pct=this.player.spin/this.player.maxSpin;
let dashThreshold=this.player.dashCost/this.player.maxSpin;
// Bar color: cyan=ready, orange=on cooldown, red=not enough energy
let barColor;
if(this.player.dashCooldown>0)barColor='#FF8800';
else if(pct>=dashThreshold)barColor='#00F3FF';
else barColor='#e74c3c';
ctx.fillStyle=barColor;ctx.fillRect(barX,barY,barW*pct,barH);
// Glow when ready to dash
if(canDash){ctx.shadowBlur=8;ctx.shadowColor='#00F3FF';ctx.fillRect(barX,barY,barW*pct,barH);ctx.shadowBlur=0}
ctx.strokeStyle=canDash?'rgba(0,243,255,0.5)':'rgba(255,255,255,0.15)';ctx.lineWidth=1;ctx.strokeRect(barX,barY,barW,barH);
// Threshold marker
let threshX=barX+barW*dashThreshold;
ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(threshX,barY-3);ctx.lineTo(threshX,barY+barH+3);ctx.stroke();
// State text
ctx.font='bold 11px "Segoe UI",system-ui,sans-serif';ctx.textAlign='right';
if(this.player.dashCooldown>0){ctx.fillStyle='#FF8800';ctx.fillText('RECHARGING',rRight,barY+barH+16)}
else if(!canDash){ctx.fillStyle='#e74c3c';ctx.fillText('LOW ENERGY',rRight,barY+barH+16)}
else if(!this.isMobile){ctx.fillStyle='rgba(255,255,255,0.35)';ctx.font='11px "Segoe UI",system-ui,sans-serif';ctx.fillText('(SPACEBAR / CLICK) DASH',rRight,barY+barH+16)}

ctx.restore()},

computeBuildBreakdown(perks){
let scores={mass:0,speed:0,defense:0,ordnance:0,sentinel:0,core:0};
(perks||[]).forEach(p=>{let tags=p.arch;if(!tags)return;let w=RARITY_WEIGHT[p.rarity]||1;if(p.prereq)w*=1.35;for(let k in tags)if(scores.hasOwnProperty(k))scores[k]+=tags[k]*w});
let total=Object.values(scores).reduce((s,v)=>s+v,0);
if(total===0)return[];
return Object.keys(scores).filter(k=>scores[k]>0).sort((a,b)=>scores[b]-scores[a]).map(k=>({id:k,pct:scores[k]/total}))},

drawGameOver(){
this.goAlpha=Math.min(1,this.goAlpha+0.02);
ctx.save();ctx.fillStyle=`rgba(0,0,0,${this.goAlpha*0.7})`;ctx.fillRect(0,0,W,H);
if(this.goAlpha>=0.5){
ctx.textAlign='center';
// Title
ctx.font='bold 48px "Segoe UI",system-ui,sans-serif';ctx.fillStyle='#fff';ctx.shadowBlur=30;ctx.shadowColor='#6c5ce7';
ctx.fillText('SHATTERED',W/2,H/2-80);ctx.shadowBlur=0;
// Wave
ctx.font='24px "Segoe UI",system-ui,sans-serif';ctx.fillStyle='#a0c4ff';
ctx.fillText(`Wave ${this.wave}`,W/2,H/2-35);
// Shards
ctx.fillStyle='#ffd32a';ctx.fillText(`+${this.runShards} ◆`,W/2,H/2);
// Quip
ctx.font='italic 16px "Segoe UI",system-ui,sans-serif';ctx.fillStyle='rgba(255,255,255,0.7)';
ctx.fillText(this.goQuip||'',W/2,H/2+35);
// Buttons
this.drawButton(W/2,H/2+90,200,50,'PLAY AGAIN','goPlay');
this.drawButton(W/2,H/2+155,160,44,'MENU','goMenu');
}ctx.restore()},
drawButton(x,y,w,h,text,id){
ctx.save();let bx=x-w/2,by=y-h/2;
let grd=ctx.createLinearGradient(bx,by,bx+w,by+h);grd.addColorStop(0,'#6c5ce7');grd.addColorStop(1,'#a29bfe');
ctx.fillStyle=grd;ctx.beginPath();ctx.roundRect(bx,by,w,h,12);ctx.fill();
ctx.fillStyle='#fff';ctx.font='bold 16px "Segoe UI",system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
ctx.fillText(text,x,y);ctx.restore();
// Store button area for click detection
if(!this._buttons)this._buttons={};this._buttons[id]={x:bx,y:by,w,h}},
};

// Click handler for canvas buttons (game over)
canvas.addEventListener('click',e=>{
if(G.state!=='gameover'||!G._buttons)return;
let rect=canvas.getBoundingClientRect();let mx=(e.clientX-rect.left)*(W/rect.width);let my=(e.clientY-rect.top)*(H/rect.height);
for(let id in G._buttons){let b=G._buttons[id];if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h){
if(id==='goPlay')G.startRun(G.ascendedTier2?41:G.ascended?21:1);
if(id==='goMenu')G.showMenu()}}});
canvas.addEventListener('touchend',e=>{
if(G.state!=='gameover'||!G._buttons)return;
let touch=e.changedTouches[0];let rect=canvas.getBoundingClientRect();let mx=(touch.clientX-rect.left)*(W/rect.width);let my=(touch.clientY-rect.top)*(H/rect.height);
for(let id in G._buttons){let b=G._buttons[id];if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h){
if(id==='goPlay')G.startRun(G.ascendedTier2?41:G.ascended?21:1);
if(id==='goMenu')G.showMenu()}}});

// Handle window resize
window.addEventListener('resize',()=>{resize();if(G.state!=='playing')G.updateCameraScale()});

// Start
G.init();
</script>
