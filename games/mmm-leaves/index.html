<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Mmm! Leaves - Garfield Boys' Arcade</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atma:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body { background:#3d461b; touch-action:none;
         font-family:'Atma',system-ui,-apple-system,sans-serif;
         -webkit-user-select:none; user-select:none; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  #backBtn { position:fixed; top:9px; left:12px; z-index:9999;
    background:rgba(0,0,0,0.32); color:#f7f4e6; text-decoration:none;
    padding:5px 16px; border-radius:20px;
    font:600 15px/1.4 'Atma',system-ui,sans-serif;
    border:1px solid rgba(255,255,255,0.22);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    transition:background 0.2s; }
  #backBtn:hover { background:rgba(0,0,0,0.6); }
</style>
</head>
<body>
<a id="backBtn" href="../../index.html">&larr; Games</a>
<canvas id="c"></canvas>
<!-- no controls on purpose; the file is already encoded 6dB down -->
<audio id="theme" src="audio/mmm-leaves-theme.webm" loop preload="none" aria-hidden="true"></audio>

<script src="js/arcade-store.js"></script>
<script src="js/art.js"></script>
<script src="js/board.js"></script>
<script src="js/tracker.js"></script>
<script src="js/achievements.js"></script>
<script src="js/anim.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
