<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a2e">
<meta name="description" content="Triple Triad — collect cards and beat ten rivals in the Final Fantasy VIII card game.">
<title>Triple Triad</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0a2e;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  #game {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
  }
  .back {
    position: absolute;
    top: calc(10px + env(safe-area-inset-top));
    left: calc(12px + env(safe-area-inset-left));
    z-index: 10;
    display: flex; align-items: center; gap: 6px;
    min-height: 42px;
    padding: 10px 16px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.11);
    border: 1px solid rgba(255, 255, 255, 0.22);
    color: #fff;
    font-size: 14px; font-weight: 700;
    text-decoration: none;
    backdrop-filter: blur(4px);
    touch-action: manipulation;
  }
  .back:active { background: rgba(255, 255, 255, 0.2); }
  #boot {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #a29bfe; font-size: 15px; letter-spacing: 0.08em;
  }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <a class="back" href="../../index.html" aria-label="Back to the arcade">&larr; Games</a>
  <div id="boot">SHUFFLING&hellip;</div>

  <script src="js/data.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/match.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/game.js"></script>
  <script>
    (function () {
      var boot = document.getElementById('boot');
      if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
      window.TT.boot();
    })();
  </script>
</body>
</html>
