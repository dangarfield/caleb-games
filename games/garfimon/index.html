<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Garfimon - Garfield Boys' Arcade</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:linear-gradient(180deg,#0a0a2e,#141452,#1a1a6e); min-height:100vh;
  font-family:'Segoe UI',system-ui,sans-serif; color:#fff; overflow-x:hidden; }
#backBtn { position:fixed; top:12px; left:12px; z-index:9999;
  background:rgba(0,0,0,0.55); color:#fff; text-decoration:none;
  padding:6px 18px; border-radius:20px; font:bold 15px/1.4 'Segoe UI',system-ui,sans-serif;
  border:1px solid rgba(255,255,255,0.18);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); transition:background 0.2s; }
#backBtn:hover { background:rgba(0,0,0,0.75); }
.player-badge{position:fixed;top:12px;right:12px;z-index:9999;background:rgba(108,92,231,0.6);color:#fff;
  padding:5px 14px;border-radius:20px;font:bold 13px/1.4 'Segoe UI',system-ui,sans-serif;
  border:1px solid rgba(255,255,255,0.2);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.screen { display:flex; flex-direction:column; align-items:center; padding:55px 12px 32px; min-height:100vh; gap:12px; }
.title { font-size:clamp(2rem,8vw,3.5rem); text-shadow:0 0 20px rgba(255,200,50,0.5); text-align:center; }
.subtitle { color:#a0c4ff; font-size:1.1rem; text-align:center; }
.info-text { color:rgba(255,255,255,0.5); font-size:0.85rem; margin-top:8px; }
</style>
</head>
<body>
<a id="backBtn" href="../../index.html">&larr; Games</a>
<div id="playerBadge" class="player-badge"></div>
<div id="app"></div>
<script>
// ===== AUDIO =====
let audioCtx=null;
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function playTone(f,d,t,v,ef){const c=ensureAudio(),o=c.createOscillator(),g=c.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f,c.currentTime);if(ef)o.frequency.exponentialRampToValueAtTime(Math.max(ef,20),c.currentTime+d);g.gain.setValueAtTime(v||0.1,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);}
function sfxHit(){playTone(300,0.15,'sawtooth',0.08,150);}
function sfxDouble(){playTone(800,0.08,'square',0.1);setTimeout(()=>playTone(1200,0.12,'square',0.1),80);setTimeout(()=>playTone(1600,0.15,'sawtooth',0.12),160);}
function sfxResist(){playTone(200,0.2,'sine',0.06,100);}
function showScreenFlash(type){
  // type: 'double' or 'resist'
  const el=document.createElement('div');
  el.className='screen-flash screen-flash-'+type;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),800);
}
function sfxWin(){playTone(523,0.12,'sine',0.08);setTimeout(()=>playTone(659,0.12,'sine',0.08),120);setTimeout(()=>playTone(784,0.12,'sine',0.08),240);setTimeout(()=>playTone(1047,0.3,'sine',0.1),360);}
function sfxLose(){playTone(400,0.2,'sine',0.08,100);setTimeout(()=>playTone(200,0.4,'sine',0.06,80),200);}
function sfxReward(){playTone(880,0.1,'triangle',0.06);setTimeout(()=>playTone(1100,0.1,'triangle',0.06),100);setTimeout(()=>playTone(1320,0.2,'triangle',0.07),200);}
function sfxSelect(){playTone(600,0.06,'sine',0.04);}
function sfxBench(){playTone(440,0.1,'triangle',0.05);setTimeout(()=>playTone(660,0.15,'triangle',0.05),80);}

// ===== CONSTANTS =====
const TYPES=['Fire','Water','Grass','Lightning','Fighting','Psychic','Colorless'];
const TYPE_COLORS={Fire:'#e74c3c',Water:'#3498db',Grass:'#27ae60',Lightning:'#f1c40f',Fighting:'#d35400',Psychic:'#9b59b6',Colorless:'#bdc3c7',Darkness:'#2c3e50',Metal:'#95a5a6',Dragon:'#8e44ad',Fairy:'#fd79a8'};
const TYPE_EMOJI={Fire:'<img src="types/Fire.png" class="type-icon" alt="Fire">',Water:'<img src="types/Water.png" class="type-icon" alt="Water">',Grass:'<img src="types/Grass.png" class="type-icon" alt="Grass">',Lightning:'<img src="types/Lightning.png" class="type-icon" alt="Lightning">',Fighting:'<img src="types/Fighting.png" class="type-icon" alt="Fighting">',Psychic:'<img src="types/Psychic.png" class="type-icon" alt="Psychic">',Colorless:'<img src="types/Colorless.png" class="type-icon" alt="Colorless">',Darkness:'<img src="types/Darkness.png" class="type-icon" alt="Darkness">',Metal:'<img src="types/Metal.png" class="type-icon" alt="Metal">'};
// Type weaknesses now come directly from card data (card.weakness field)

// 3 gyms per type = 24 total
const GYMS=[];
const GYM_NAMES={
  Fire:[['Ember Gym','Blaze'],['Inferno Gym','Pyra'],['Volcano Gym','Magmus']],
  Water:[['Tidal Gym','Marina'],['Reef Gym','Coral'],['Tsunami Gym','Neptune']],
  Grass:[['Forest Gym','Thorn'],['Jungle Gym','Ivy'],['Canopy Gym','Sequoia']],
  Lightning:[['Volt Gym','Spark'],['Storm Gym','Tesla'],['Thunder Gym','Zeus']],
  Fighting:[['Boulder Gym','Rocky'],['Dojo Gym','Sensei'],['Arena Gym','Titan']],
  Psychic:[['Mystic Gym','Luna'],['Dream Gym','Oracle'],['Cosmos Gym','Nebula']],
  Colorless:[['Sky Gym','Ace'],['Wing Gym','Gale'],['Summit Gym','Atlas']]
};
TYPES.forEach((type,ti)=>{
  GYM_NAMES[type].forEach(([name,leader],gi)=>{
    GYMS.push({name,type,emoji:TYPE_EMOJI[type],leader,tier:gi,index:GYMS.length});
  });
});
const TOTAL_GYMS=GYMS.length;
// Pokédex: total is 151 (original Pokémon)
const GOAL_PER_TYPE = 151; // Total across all types (used as overall goal)

// ===== STATE (per-player profiles) =====
let currentPlayer=null; // 'caleb' or 'ezra'
let state={};

function stateKey(){return 'garfimonState_'+currentPlayer;}
function loadState(){
  if(!currentPlayer)return{collection:[],team:[],gymsBeaten:[],currentGym:0,resting:{},battleCount:0};
  try{const d=JSON.parse(localStorage.getItem(stateKey()));if(d&&d.collection){if(!d.resting)d.resting={};if(!d.battleCount)d.battleCount=0;return d;}}catch(e){}
  return{collection:[],team:[],gymsBeaten:[],currentGym:0,resting:{},battleCount:0};
}
function saveState(){if(currentPlayer)localStorage.setItem(stateKey(),JSON.stringify(state));}
function selectPlayer(name){currentPlayer=name;state=loadState();updatePlayerBadge();}
function getDisplayName(){return currentPlayer?currentPlayer.charAt(0).toUpperCase()+currentPlayer.slice(1):'';}
function updatePlayerBadge(visible){const el=document.getElementById('playerBadge');if(el){el.textContent=currentPlayer?getDisplayName():'';el.style.display=visible===false?'none':'block';}}
function isCardResting(cardId){return(state.resting&&state.resting[cardId]||0)>0;}
function restingTurns(cardId){return(state.resting&&state.resting[cardId])||0;}
function restAllUsedCards(){state.team.forEach(c=>{state.resting[c.id]=2;});state.battleCount++;state.team=[];saveState();}
function tickResting(){Object.keys(state.resting).forEach(id=>{state.resting[id]--;if(state.resting[id]<=0)delete state.resting[id];});saveState();}

// ===== CARD DATA (static from cards.json) =====
let ALL_CARDS = []; // Loaded from cards.json

async function loadCardData() {
  try {
    const res = await fetch('cards.json');
    if (!res.ok) throw new Error('Failed to load cards.json: ' + res.status);
    ALL_CARDS = await res.json();
    return true;
  } catch(e) {
    console.error(e);
    return false;
  }
}

function getCardsByType(type) { return ALL_CARDS.filter(c => c.type === type); }
function getBasicCards() { return ALL_CARDS.filter(c => c.stage === 'Basic'); }
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function getStarterCards() {
  // 6 random Basic cards from different types
  const basics = getBasicCards();
  const byType = {};
  basics.forEach(c => { if (!byType[c.type]) byType[c.type] = []; byType[c.type].push(c); });
  const types = shuffle(Object.keys(byType)).slice(0, 3);
  const cards = [];
  types.forEach(t => { cards.push(...shuffle(byType[t]).slice(0, 2)); });
  // Fill up to 6 if needed
  while (cards.length < 6) {
    const pick = basics[Math.floor(Math.random() * basics.length)];
    if (!cards.find(c => c.id === pick.id)) cards.push(pick);
  }
  return cards;
}

// ===== BATTLE ENGINE =====
function getTypeMult(attackerType, defenderCard) {
  if (defenderCard.weakness && defenderCard.weakness === attackerType) return 2;
  if (defenderCard.resistance && defenderCard.resistance === attackerType) return 0.5;
  return 1;
}

function getGymTeam(gymIndex) {
  const gym = GYMS[gymIndex];
  const tier = gym.tier; // 0,1,2
  // Pool: 50% gym type, 50% random — from appropriate HP tier
  const typeCards = ALL_CARDS.filter(c => c.type === gym.type);
  const otherCards = ALL_CARDS.filter(c => c.type !== gym.type);
  // Sort by HP
  typeCards.sort((a, b) => a.hp - b.hp);
  otherCards.sort((a, b) => a.hp - b.hp);
  // Tier slice
  function tierSlice(pool) {
    const len = pool.length; if (len < 3) return [...pool];
    const t = Math.ceil(len / 3);
    if (tier === 0) return pool.slice(0, t);
    if (tier === 1) return pool.slice(t, t * 2);
    return pool.slice(t * 2);
  }
  const typeSlice = shuffle(tierSlice(typeCards));
  const rndSlice = shuffle(tierSlice(otherCards));
  const team = [];
  for (let i = 0; i < 3; i++) {
    const useType = Math.random() < 0.5 || rndSlice.length === 0;
    const pool = useType ? typeSlice : rndSlice;
    if (pool.length > 0) team.push(pool.splice(0, 1)[0]);
    else if (typeSlice.length > 0) team.push(typeSlice.splice(0, 1)[0]);
    else team.push(ALL_CARDS[Math.floor(Math.random() * ALL_CARDS.length)]);
  }
  return team;
}

function getRewardCards(gymType) {
  const existing = new Set(state.collection.map(c => c.id));
  const typeCards = shuffle(ALL_CARDS.filter(c => c.type === gymType && !existing.has(c.id)));
  const rndCards = shuffle(ALL_CARDS.filter(c => c.type !== gymType && !existing.has(c.id)));
  const rewards = [];
  rewards.push(...typeCards.slice(0, 2));
  rewards.push(...rndCards.slice(0, 1));
  // If not enough new cards, just pick any undiscovered
  if (rewards.length < 3) {
    const any = shuffle(ALL_CARDS.filter(c => !existing.has(c.id) && !rewards.find(r => r.id === c.id)));
    rewards.push(...any.slice(0, 3 - rewards.length));
  }
  return rewards;
}

// ===== RENDERING =====
const app=document.getElementById('app');
function render(html){app.innerHTML=html;}

function cardHTML(card,opts={}){
  const color=TYPE_COLORS[card.type]||'#666';
  const sel=opts.selected?'card-selected':'';
  const resting=isCardResting(card.id);
  const restCls=resting?'card-resting':'';
  const canClick=opts.onClick && (!resting || !opts.onClick.includes('toggleTeamCard'));
  const click=canClick?`onclick="${opts.onClick}"`:'';  const img=card.image?`<img src="${card.image}" alt="${card.name}" class="card-img" loading="lazy">`:`<div class="card-img-placeholder" style="background:${color}">${card.name[0]}</div>`;
  const rare=(card.rarity==='Rare'||card.rarity==='Holo Rare')?'card-rare':'';
  const restBadge=resting?`<div class="rest-badge">💤 ${restingTurns(card.id)}</div>`:'';
  return`<div class="poke-card ${sel} ${rare} ${restCls}" ${click} data-id="${card.id}">
    ${restBadge}
    <div class="card-header" style="background:${color}"><span class="card-name">${card.name}</span><span class="card-hp">HP ${card.hp}</span></div>
    ${img}
    <div class="card-footer"><span class="card-type">${TYPE_EMOJI[card.type]||card.type}</span><span class="card-attack">⚔️ ${card.attack.name} (${card.attack.damage})</span><span class="card-weak">${card.weakness?TYPE_EMOJI[card.weakness]||card.weakness:''}</span></div>
  </div>`;
}

function undiscoveredCardHTML(type){
  const color=TYPE_COLORS[type]||'#666';
  return`<div class="poke-card card-undiscovered">
    <div class="card-header" style="background:${color}"><span class="card-name">???</span><span class="card-hp">HP ?</span></div>
    <div class="card-img-placeholder card-mystery" style="background:linear-gradient(135deg,${color}22,${color}44)"><span class="mystery-emoji">${TYPE_EMOJI[type]||'❓'}</span><span class="mystery-q">?</span></div>
    <div class="card-footer"><span class="card-attack">⚔️ ??? (?)</span><span class="card-type" style="color:${color}">${type}</span></div>
  </div>`;
}

// ===== TITLE =====
function showPlayerSelect(){
  updatePlayerBadge(false);
  render(`<div class="screen title-screen">
    <h1 class="title">⚡ Garfimon ⚡</h1>
    <p class="subtitle">Who's playing?</p>
    <div class="player-select">
      <button class="btn-player" onclick="pickPlayer('caleb')">
        <span class="player-avatar">🧢</span>
        <span class="player-name">Caleb</span>
      </button>
      <button class="btn-player" onclick="pickPlayer('ezra')">
        <span class="player-avatar">⭐</span>
        <span class="player-name">Ezra</span>
      </button>
    </div>
  </div>`);
}

function pickPlayer(name){
  selectPlayer(name);
  showTitle();
}

function showTitle(){
  if(!currentPlayer){showPlayerSelect();return;}
  updatePlayerBadge(true);
  const has=state.collection.length>0;
  const displayName=getDisplayName();
  render(`<div class="screen title-screen">
    <h1 class="title">⚡ Garfimon ⚡</h1>
    <p class="subtitle">${displayName}'s Adventure</p>
    ${has?`<button class="btn btn-primary" onclick="showGymSelect()">Continue Adventure</button>
      <button class="btn btn-secondary" onclick="showCards('pokedex')">📖 Pokédex (${state.collection.length})</button>
      <button class="btn btn-danger" onclick="confirmReset()">New Game</button>`
      :`<button class="btn btn-primary" onclick="startNewGame()">Start Adventure!</button>
      <button class="btn btn-secondary" onclick="showHowToPlay()">How to Play</button>`}
    <button class="btn btn-secondary" onclick="switchPlayer()">Switch Player</button>
    <div class="info-text">Battle ${TOTAL_GYMS} Gym Leaders using real Pokémon cards!</div>
  </div>`);
}

function switchPlayer(){currentPlayer=null;showPlayerSelect();}

function showHowToPlay(){
  render(`<div class="screen rules-screen">
    <h2>📖 How to Play</h2>
    <div class="rules-box">
      <div class="rule-section"><div class="rule-icon">🎴</div><div class="rule-text"><strong>1. Get Your Cards</strong><br>You start with 6 random Pokémon cards. Each card has HP (health), an attack with damage, and a type.</div></div>
      <div class="rule-section"><div class="rule-icon">👆</div><div class="rule-text"><strong>2. Pick Your Team</strong><br>Choose 3 cards for battle. Selected cards glow green with a ✓ tick.</div></div>
      <div class="rule-section"><div class="rule-icon">⚔️</div><div class="rule-text"><strong>3. Battle!</strong><br>Take turns attacking. Knock out all 3 of the leader's cards to win! Your bench shows on the right, theirs on the left.</div></div>
      <div class="rule-section"><div class="rule-icon">⚠️</div><div class="rule-text"><strong>4. Weaknesses (2× damage!)</strong><br>Each card has a weakness type shown in the bottom-right corner. If your card's type matches the enemy's weakness, you deal DOUBLE damage! Look at the enemy's weakness icon and pick a card of that type.</div></div>
      <div class="rule-section"><div class="rule-icon">🎁</div><div class="rule-text"><strong>5. Win = New Cards!</strong><br>Beat a Gym Leader to discover 3 new cards. Fill your Pokédex and beat all ${TOTAL_GYMS} gyms!</div></div>
    </div>
    <button class="btn btn-primary" onclick="showTitle()">Got it!</button>
  </div>`);
}

async function startNewGame(){
  render(`<div class="screen loading-screen"><div class="spinner"></div><p>Getting your starter cards...</p></div>`);
  state={collection:[],team:[],gymsBeaten:[],currentGym:0,resting:{},battleCount:0};
  if (ALL_CARDS.length === 0) {
    const ok = await loadCardData();
    if (!ok) { render(`<div class="screen"><h2>⚠️ Error</h2><p>Couldn't load card data. Make sure cards.json is available.</p><button class="btn btn-primary" onclick="showTitle()">Back</button></div>`); return; }
  }
  const starters = getStarterCards();
  state.collection = [...new Map(starters.map(c=>[c.id,c])).values()];
  state.team = [];
  saveState();
  showCardReveal(starters, 'Your Starter Cards!', 'Choose wisely for battle!', () => showGymSelect());
}
function confirmReset(){if(confirm('Start over? All cards and progress lost!')){state={collection:[],team:[],gymsBeaten:[],currentGym:0};saveState();showTitle();}}

// ===== CARD REVEAL (animated) =====
function showCardReveal(cards,title,sub,onDone){
  sfxReward();
  render(`<div class="screen reveal-screen">
    <h2 class="reveal-title">${title}</h2>
    <p class="reveal-sub">${sub}</p>
    <div class="reveal-cards">${cards.map((c,i)=>`<div class="reveal-card-wrap" style="animation-delay:${i*0.3}s">${cardHTML(c)}</div>`).join('')}</div>
    <button class="btn btn-primary reveal-done-btn" onclick="void 0" id="revealDone">Continue</button>
  </div>`);
  document.getElementById('revealDone').onclick=onDone;
}

// ===== COMBINED CARDS/POKÉDEX =====
let cardsMode='pokedex'; // 'pokedex' or 'team-select'
let cardsFilter='all';
let showDiscovered=true;
let cardSort='latest'; // 'latest','type','alpha','hp','damage'

function sortCards(cards){
  const sorted=[...cards];
  switch(cardSort){
    case 'type': sorted.sort((a,b)=>a.type.localeCompare(b.type)||b.hp-a.hp); break;
    case 'alpha': sorted.sort((a,b)=>a.name.localeCompare(b.name)); break;
    case 'hp': sorted.sort((a,b)=>b.hp-a.hp||b.attack.damage-a.attack.damage); break;
    case 'damage': sorted.sort((a,b)=>b.attack.damage-a.attack.damage||b.hp-a.hp); break;
    default: sorted.reverse(); break; // 'latest' = most recently added first
  }
  return sorted;
}

function showCards(mode,gymIdx){
  cardsMode=mode||'pokedex';
  if(cardsMode==='team-select')showDiscovered=true;
  const coll=state.collection;
  const byType={};TYPES.forEach(t=>byType[t]=[]);
  coll.forEach(c=>{const t=TYPES.includes(c.type)?c.type:'Colorless';if(!byType[t])byType[t]=[];byType[t].push(c);});
  let filtered=cardsFilter==='all'?[...coll]:coll.filter(c=>c.type===cardsFilter);
  filtered=sortCards(filtered);
  const teamIds=state.team.map(c=>c.id);

  // Undiscovered placeholders
  let undiscovered=[];
  const discoveredIds = new Set(coll.map(c=>c.id));
  const allByType={};
  ALL_CARDS.forEach(c=>{const t=TYPES.includes(c.type)?c.type:TYPES[TYPES.length-1];if(!allByType[t])allByType[t]=[];allByType[t].push(c);});
  TYPES.forEach(t=>{
    if(cardsFilter!=='all'&&cardsFilter!==t)return;
    (allByType[t]||[]).forEach(c=>{if(!discoveredIds.has(c.id))undiscovered.push(t);});
  });

  const pendingGymInfo=gymIdx!==undefined?GYMS[gymIdx]:null;
  render(`<div class="screen cards-screen">
    <h2>${cardsMode==='team-select'?'Pick Your Team (3)':'📖 Pokédex'}</h2>
    ${pendingGymInfo?`<p class="team-hint">Tip: ${pendingGymInfo.leader} uses <span style="color:${TYPE_COLORS[pendingGymInfo.type]}">${pendingGymInfo.type}</span> type!</p>`:''}
    ${cardsMode==='team-select'?`<p class="team-count">Selected: ${state.team.length} / 3</p>`:`<p class="pokedex-progress">Discovered: ${coll.length} / ${ALL_CARDS.length}</p>`}
    <div class="btn-group type-filter-group">
      <button class="btn-group-item ${cardsFilter==='all'?'active':''}" onclick="cardsFilter='all';showCards('${cardsMode}',${gymIdx})">All</button>
      ${TYPES.map(t=>{const tot=(allByType[t]||[]).length;return`<button class="btn-group-item ${cardsFilter===t?'active':''}" style="--tc:${TYPE_COLORS[t]}" onclick="cardsFilter='${t}';showCards('${cardsMode}',${gymIdx})">${TYPE_EMOJI[t]||t} <span class="btn-group-count">${(byType[t]||[]).length}/${tot}</span></button>`}).join('')}
    </div>
    <div class="toggle-row">
      ${cardsMode==='pokedex'?`<div class="toggle-group">
        <button class="toggle-item ${showDiscovered===true?'active':''}" onclick="showDiscovered=true;showCards('pokedex')">Discovered</button>
        <button class="toggle-item ${showDiscovered===false?'active':''}" onclick="showDiscovered=false;showCards('pokedex')">Undiscovered</button>
        <button class="toggle-item ${showDiscovered==='all'?'active':''}" onclick="showDiscovered='all';showCards('pokedex')">All</button>
      </div>`:''}
      <div class="toggle-group">
        <button class="toggle-item ${cardSort==='latest'?'active':''}" onclick="cardSort='latest';showCards('${cardsMode}',${gymIdx})">Latest</button>
        <button class="toggle-item ${cardSort==='type'?'active':''}" onclick="cardSort='type';showCards('${cardsMode}',${gymIdx})">Type</button>
        <button class="toggle-item ${cardSort==='alpha'?'active':''}" onclick="cardSort='alpha';showCards('${cardsMode}',${gymIdx})">A-Z</button>
        <button class="toggle-item ${cardSort==='hp'?'active':''}" onclick="cardSort='hp';showCards('${cardsMode}',${gymIdx})">HP</button>
        <button class="toggle-item ${cardSort==='damage'?'active':''}" onclick="cardSort='damage';showCards('${cardsMode}',${gymIdx})">Dmg</button>
      </div>
    </div>
    <div class="card-grid">
      ${(()=>{
        let html='';
        if(showDiscovered===true||showDiscovered==='all'){
          html+=filtered.map(c=>cardHTML(c,{selected:cardsMode==='team-select'&&teamIds.includes(c.id),onClick:cardsMode==='team-select'?`toggleTeamCard('${c.id}',${gymIdx})`:`enlargeCard('${c.id}')`})).join('');
        }
        if(showDiscovered===false||showDiscovered==='all'){
          html+=undiscovered.map(t=>undiscoveredCardHTML(t)).join('');
        }
        if(!html)html='<p class="no-cards">No cards here yet! Win gym battles to discover more.</p>';
        return html;
      })()}
    </div>

function isGymUnlocked(gymIdx){
  const gym=GYMS[gymIdx];
  if(state.gymsBeaten.includes(gymIdx))return true;
  // Tier 0: unlock sequentially — first gym always unlocked, rest need previous tier-0 beaten
  // Tier 1: all tier-0 must be beaten first, then sequential within tier-1
  // Tier 2: all tier-1 must be beaten first, then sequential within tier-2
  const tier=gym.tier;
  const gymsInTier=GYMS.filter(g=>g.tier===tier);
  const tierIdx=gymsInTier.findIndex(g=>g.index===gymIdx);
  if(tier===0){
    if(tierIdx===0)return true; // First gym always available
    return state.gymsBeaten.includes(gymsInTier[tierIdx-1].index);
  } else {
    // All previous tier must be completed
    const prevTierGyms=GYMS.filter(g=>g.tier===tier-1);
    const allPrevDone=prevTierGyms.every(g=>state.gymsBeaten.includes(g.index));
    if(!allPrevDone)return false;
    if(tierIdx===0)return true;
    return state.gymsBeaten.includes(gymsInTier[tierIdx-1].index);
  }
}

let battle=null;

async function startBattle(gymIdx){
  render(`<div class="screen loading-screen"><div class="spinner"></div><p>The Gym Leader approaches...</p></div>`);
  const gym=GYMS[gymIdx];
  if (ALL_CARDS.length === 0) await loadCardData();
  const enemyTeam = getGymTeam(gymIdx);
  if (!enemyTeam || enemyTeam.length < 3) {
    render(`<div class="screen"><h2>⚠️ Error</h2><p>Couldn't build the gym team.</p><button class="btn btn-primary" onclick="showGymSelect()">Back</button></div>`);
    return;
  }
  const playerFirst = Math.random() < 0.5;
  battle = {gymIdx, gym,
    playerTeam: state.team.map(c => ({...c, currentHp: c.hp})),
    enemyTeam: enemyTeam.map(c => ({...c, currentHp: c.hp})),
    playerIndex: 0, enemyIndex: 0, log: [], phase: 'coin-toss', animClass: '', playerFirst
  };
  sfxBench();
  showCoinToss(playerFirst);
}

function showCoinToss(playerFirst){
  render(`<div class="screen coin-toss-screen">

}

function beginBattle(){
  if(battle.playerFirst){
    battle.phase='player-turn';
  } else {
    battle.phase='enemy-turn';
    battle.log.push(`${battle.gym.leader} attacks first!`);
  }
  renderBattle();
  if(!battle.playerFirst){setTimeout(enemyAttack,800);}
}

function renderBattle(){
  updatePlayerBadge(false);

  const p=b.playerTeam[b.playerIndex],e=b.enemyTeam[b.enemyIndex];

  const eBench=b.enemyTeam.filter((_,i)=>i!==b.enemyIndex&&b.enemyTeam[i].currentHp>0);

  render(`<div class="screen battle-screen">
    <div class="battle-bg">

function playerAttack(){
  const b=battle;
  if(b.phase!=='player-turn')return;
  const p=b.playerTeam[b.playerIndex],e=b.enemyTeam[b.enemyIndex];
  const mult=getTypeMult(p.type,e);
  const dmg=Math.round(p.attack.damage*mult);
  e.currentHp-=dmg; if(mult>1){sfxDouble();showScreenFlash('double');}else if(mult<1){sfxResist();showScreenFlash('resist');}else{sfxHit();}
  let msg=`${p.name} uses ${p.attack.name} for ${dmg} dmg!`;
  if(mult>1)msg+=' ⚡ SUPER EFFECTIVE!';if(mult<1)msg+=' 🛡️ Resisted...';
  b.log.push(msg);
  b.animClass='enemy-hit';
  if(mult>1)b.animClass='enemy-double';
  if(mult<1)b.animClass='enemy-resist';
  if(e.currentHp<=0){
    b.log.push(`💥 ${e.name} is knocked out!`);
    b.animClass='enemy-ko';
    b.phase='animating';
    renderBattle();
    setTimeout(()=>{
      const next=b.enemyTeam.findIndex((c,i)=>i>b.enemyIndex&&c.currentHp>0);
      if(next>=0){b.enemyIndex=next;b.log.push(`${b.gym.leader} sends out ${b.enemyTeam[next].name}!`);sfxBench();b.phase='enemy-turn';renderBattle();setTimeout(enemyAttack,900);}
      else{b.phase='won';sfxWin();showBattleWin(b.gymIdx);}
    },800);
    return;
  }
  b.phase='enemy-turn';
  renderBattle();
  setTimeout(enemyAttack,900);
}

function enemyAttack(){
  const b=battle,p=b.playerTeam[b.playerIndex],e=b.enemyTeam[b.enemyIndex];
  const mult=getTypeMult(e.type,p);
  const dmg=Math.round(e.attack.damage*mult);
  p.currentHp-=dmg; if(mult>1){sfxDouble();showScreenFlash('double');}else if(mult<1){sfxResist();showScreenFlash('resist');}else{sfxHit();}
  let msg=`${e.name} uses ${e.attack.name} for ${dmg} dmg!`;
  if(mult>1)msg+=' ⚡ SUPER EFFECTIVE!';if(mult<1)msg+=' 🛡️ Resisted...';
  b.log.push(msg);
  b.animClass='player-hit';
  if(mult>1)b.animClass='player-double';
  if(mult<1)b.animClass='player-resist';
  if(p.currentHp<=0){
    b.log.push(`💥 ${p.name} is knocked out!`);
    b.animClass='player-ko';
    b.phase='animating';
    renderBattle();
    setTimeout(()=>{
      const next=b.playerTeam.findIndex((c,i)=>i>b.playerIndex&&c.currentHp>0);
      if(next>=0){b.playerIndex=next;b.log.push(`You send out ${b.playerTeam[next].name}!`);sfxBench();b.phase='player-turn';renderBattle();}
      else{b.phase='lost';sfxLose();b.log.push('💀 You lost...');restAllUsedCards();tickResting();renderBattle();}
    },800);
    return;
  }
  b.phase='player-turn';
  renderBattle();
}

function showBattleWin(gymIdx){
  updatePlayerBadge(false);
  const gym=GYMS[gymIdx];
  if(!state.gymsBeaten.includes(gymIdx)){state.gymsBeaten.push(gymIdx);}
  restAllUsedCards();
  tickResting();
  saveState();

  // Get 1 reward card
  const rewards = getRewardCards(gym.type).slice(0,1);
  if(rewards.length>0){
    state.collection.push(...rewards.filter(c=>!state.collection.some(x=>x.id===c.id)));
    saveState();
  }
  const card = rewards[0];
  const color = card ? (TYPE_COLORS[card.type]||'#666') : '#666';

  render(`<div class="screen battle-screen">
    <div class="battle-bg"><div class="battle-bg-left" style="background:linear-gradient(135deg,${TYPE_COLORS[gym.type]}22 0%,${TYPE_COLORS[gym.type]}55 100%)"></div><div class="battle-bg-right"></div></div>

  spawnConfetti();
}

function spawnConfetti(){
  const c=document.getElementById('confetti');if(!c)return;
  const colors=['#e74c3c','#f39c12','#2ecc71','#3498db','#9b59b6','#ffd32a','#ff6b6b','#a29bfe'];
  for(let i=0;i<60;i++){
    const d=document.createElement('div');d.className='confetti-piece';
    d.style.left=Math.random()*100+'%';
    d.style.background=colors[Math.floor(Math.random()*colors.length)];
    d.style.animationDelay=(Math.random()*0.5)+'s';
    d.style.animationDuration=(1.5+Math.random()*2)+'s';
    c.appendChild(d);
  }
}

.team-count,.pokedex-progress{color:#ffd32a;font-weight:700;font-size:0.9rem;}
.no-cards{color:rgba(255,255,255,0.4);font-style:italic;text-align:center;padding:2rem;grid-column:1/-1;}
.nav-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px;}

/* Player select */
.player-select{display:flex;gap:20px;margin:16px 0;}
.btn-player{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 36px;border-radius:16px;border:3px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.05);cursor:pointer;transition:all 0.2s;}
.btn-player:hover{transform:scale(1.05);border-color:rgba(108,92,231,0.6);background:rgba(108,92,231,0.15);}
.btn-player:active{transform:scale(0.95);}
.player-avatar{font-size:3rem;}
.player-name{font-size:1.3rem;font-weight:700;color:#fff;}

/* Gyms */
.gym-progress{color:#ffd32a;font-size:1rem;font-weight:700;}
.gym-type-list{width:100%;max-width:800px;display:flex;flex-direction:column;gap:10px;}
.gym-type-group{background:rgba(255,255,255,0.03);border-radius:10px;padding:8px 12px;}
.gym-type-header{font-weight:700;font-size:0.85rem;margin-bottom:6px;}
.gym-type-row{display:flex;gap:8px;flex-wrap:wrap;}
.gym-chip{background:#1e2a3a;border-radius:10px;padding:8px 12px;text-align:center;cursor:pointer;transition:transform 0.2s;border:2px solid rgba(255,255,255,0.1);min-width:80px;position:relative;}
.gym-chip:hover{transform:translateY(-2px);}
.gym-available{border-color:rgba(108,92,231,0.5);}
.gym-beaten{border-color:rgba(46,204,113,0.5);opacity:0.7;}
.gym-locked{opacity:0.35;cursor:not-allowed;}
.gym-chip-name{display:block;font-weight:700;font-size:0.8rem;}
.gym-chip-tier{display:block;font-size:0.6rem;}
.gym-chip-badge,.gym-chip-lock{position:absolute;top:2px;right:4px;font-size:0.7rem;}
</style>
<style>
/* Battle */
.battle-screen{padding:0;min-height:100vh;height:100vh;justify-content:center;position:relative;overflow:hidden;}
.battle-bg{position:absolute;inset:0;z-index:0;display:flex;}
.battle-bg-left{flex:1;background:linear-gradient(135deg,#1a0a2e 0%,#2d1b69 100%);clip-path:polygon(0 0,100% 0,70% 100%,0 100%);}
.battle-bg-right{flex:1;background:linear-gradient(135deg,#0a1a3e 0%,#1b4d69 100%);clip-path:polygon(25% 0,100% 0,100% 100%,0 100%);}
.battle-bg-vs{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:4rem;font-weight:900;color:rgba(255,255,255,0.04);letter-spacing:0.2em;}
.battle-header{display:flex;justify-content:space-between;width:100%;font-weight:700;font-size:1rem;padding:8px 12px 0;position:relative;z-index:1;}
.bh-enemy,.bh-player{padding:6px 14px;border-radius:8px;transition:all 0.3s;}
.bh-enemy{background:rgba(231,76,60,0.2);border:2px solid rgba(231,76,60,0.3);}
.bh-player{background:rgba(46,204,113,0.2);border:2px solid rgba(46,204,113,0.3);}
.turn-active{transform:scale(1.1);box-shadow:0 0 16px rgba(255,211,42,0.6);border-color:#ffd32a!important;animation:pulse-glow 1.5s ease-in-out infinite;}
.card-turn-glow{box-shadow:0 0 20px rgba(255,211,42,0.5),0 0 40px rgba(255,211,42,0.2)!important;border:2px solid rgba(255,211,42,0.6);animation:focus-breathe 1.5s ease-in-out infinite;}
@keyframes focus-breathe{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
.enemy-thinking{color:#ffd32a;font-weight:700;font-size:0.9rem;animation:float 1s ease-in-out infinite;}
.battle-arena{display:flex;align-items:center;justify-content:center;gap:2%;width:100%;flex:1;position:relative;z-index:1;}
.bench{display:flex;flex-direction:column;gap:6px;width:10%;flex-shrink:0;}
.bench-card{border-radius:8px;overflow:hidden;border:2px solid rgba(255,255,255,0.15);background:#1e2a3a;}
.bench-hidden .bench-card-back{width:100%;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:1.2rem;}
.bench-card-inner{position:relative;}
.bench-img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;}
.bench-img-ph{width:100%;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:rgba(255,255,255,0.4);}
.bench-hp{position:absolute;bottom:2px;right:2px;background:rgba(0,0,0,0.7);color:#2ecc71;font-size:0.6rem;font-weight:700;padding:1px 4px;border-radius:4px;}
.battle-center{flex:1;display:flex;align-items:center;justify-content:center;gap:3%;}
.active-card{background:#1e2a3a;border-radius:12px;overflow:visible;box-shadow:0 4px 16px rgba(0,0,0,0.4);width:35%;position:relative;}
.card-empty-slot{width:100%;aspect-ratio:600/825;display:flex;align-items:center;justify-content:center;font-size:3rem;opacity:0.4;}
.battle-card-inner{}
.battle-card-img{width:100%;aspect-ratio:600/825;object-fit:contain;background:#111;display:block;}
.battle-card-img-ph{width:100%;aspect-ratio:600/825;display:flex;align-items:center;justify-content:center;font-size:2.5rem;color:rgba(255,255,255,0.3);}
.battle-card-info{padding:8px;text-align:center;}
.bc-name{font-weight:700;font-size:0.9rem;}.bc-type{font-size:0.7rem;font-weight:600;}
.hp-bar{width:100%;height:8px;background:rgba(255,255,255,0.1);border-radius:4px;margin-top:4px;overflow:hidden;}
.hp-fill{height:100%;border-radius:4px;transition:width 0.4s;}
.hp-text{font-size:0.65rem;color:rgba(255,255,255,0.5);margin-top:2px;}
.vs-badge{font-size:1.8rem;font-weight:900;color:#ffd32a;text-shadow:0 0 12px rgba(255,211,42,0.6);flex-shrink:0;}
.battle-log{width:100%;background:rgba(0,0,0,0.3);border-radius:8px;padding:8px;height:54px;overflow:hidden;font-size:0.8rem;color:rgba(255,255,255,0.8);position:relative;z-index:1;text-align:center;}
.log-line{margin:2px 0;}
.battle-actions{height:56px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;}

/* Battle won overlay */
.win-reward-screen{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;gap:10px;padding:20px;}
.win-reward-badge{font-size:4rem;animation:victory-pop 0.6s ease;}
.win-reward-title{font-size:1.6rem;color:#ffd32a;text-shadow:0 0 20px rgba(255,211,42,0.6);animation:victory-title-in 0.5s ease 0.2s both;}
.win-reward-sub{color:#a0c4ff;font-size:1rem;animation:victory-title-in 0.5s ease 0.4s both;}
.win-reward-card{animation:reveal-in 0.6s ease 0.6s both;max-width:320px;width:100%;}
.win-reward-card .modal-card{box-shadow:0 8px 40px rgba(255,211,42,0.3);animation:pulse-glow 2s ease-in-out infinite;}
.win-reward-btn{animation:victory-title-in 0.5s ease 1s both;}
</style>
<style>
/* Animations */
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes wobble{0%{transform:translateX(0)}20%{transform:translateX(-8px) rotate(-2deg)}40%{transform:translateX(8px) rotate(2deg)}60%{transform:translateX(-4px) rotate(-1deg)}80%{transform:translateX(4px) rotate(1deg)}100%{transform:translateX(0)}}
@keyframes ko-out{0%{transform:scale(1);opacity:1}30%{transform:scale(1.1) rotate(5deg)}100%{transform:scale(0) rotate(-20deg) translateY(60px);opacity:0}}
@keyframes bench-slide{0%{transform:translateY(-20px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes reveal-in{0%{transform:rotateY(90deg) scale(0.8);opacity:0}60%{transform:rotateY(-10deg) scale(1.05)}100%{transform:rotateY(0) scale(1);opacity:1}}
@keyframes victory-pop{0%{transform:scale(0) rotate(-20deg);opacity:0}50%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes victory-title-in{0%{transform:translateY(30px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes confetti-fall{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes pulse-glow{0%{box-shadow:0 0 20px rgba(255,211,42,0.3)}50%{box-shadow:0 0 40px rgba(255,211,42,0.7)}100%{box-shadow:0 0 20px rgba(255,211,42,0.3)}}
@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-6px)}100%{transform:translateY(0)}}

.anim-hit{animation:wobble 0.4s ease;}
.anim-flash{animation:wobble 0.4s ease,flash-white 0.3s ease!important;}
.anim-ko{animation:ko-out 0.7s ease forwards;}
@keyframes flash-white{0%{filter:brightness(1)}15%{filter:brightness(3)}30%{filter:brightness(1)}45%{filter:brightness(2)}60%{filter:brightness(1)}}
.double-dmg-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-5deg);z-index:10;
  font-size:clamp(0.9rem,4vw,1.4rem);font-weight:900;color:#fff;text-shadow:0 0 8px #e74c3c,0 0 16px #f39c12,2px 2px 0 #000;
  background:rgba(231,76,60,0.9);padding:4px 12px;border-radius:6px;border:2px solid #ffd32a;
  white-space:nowrap;pointer-events:none;animation:double-pop 0.5s ease forwards;letter-spacing:1px;}
.resist-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(3deg);z-index:10;
  font-size:clamp(0.8rem,3.5vw,1.2rem);font-weight:900;color:#fff;text-shadow:0 0 8px #3498db,2px 2px 0 #000;
  background:rgba(52,152,219,0.9);padding:4px 12px;border-radius:6px;border:2px solid #a0c4ff;
  white-space:nowrap;pointer-events:none;animation:double-pop 0.5s ease forwards;letter-spacing:1px;}
@keyframes double-pop{0%{transform:translate(-50%,-50%) rotate(-5deg) scale(0);opacity:0}40%{transform:translate(-50%,-50%) rotate(-3deg) scale(1.3)}100%{transform:translate(-50%,-50%) rotate(-5deg) scale(1);opacity:1}}

/* Screen flash */
.screen-flash{position:fixed;inset:0;z-index:9999;pointer-events:none;animation:screen-flash-anim 0.6s ease-out forwards;}
.screen-flash-double{background:rgba(255,255,255,0.8);}
.screen-flash-resist{background:rgba(52,152,219,0.4);}
@keyframes screen-flash-anim{0%{opacity:1}100%{opacity:0}}
.anim-bench-in{animation:bench-slide 0.4s ease both;}
.spinner{width:36px;height:36px;border:4px solid rgba(255,255,255,0.2);border-top-color:#a29bfe;border-radius:50%;animation:spin 0.8s linear infinite;}
.loading-screen{justify-content:center;align-items:center;}

/* Coin toss */
.coin-toss-screen{justify-content:center;align-items:center;}
.coin-flip-anim{font-size:4rem;animation:coin-spin 0.6s ease-out;}
.coin-result{color:#ffd32a;font-size:1.5rem;margin-top:12px;animation:victory-title-in 0.4s ease 0.5s both;}
.coin-sub{color:#a0c4ff;animation:victory-title-in 0.4s ease 0.7s both;}
@keyframes coin-spin{0%{transform:rotateY(0) scale(0.5);opacity:0}50%{transform:rotateY(540deg) scale(1.2)}100%{transform:rotateY(720deg) scale(1);opacity:1}}

/* Reveal */
.reveal-screen{perspective:1000px;}
.reveal-title{color:#ffd32a;font-size:1.8rem;text-shadow:0 0 20px rgba(255,211,42,0.5);animation:victory-title-in 0.5s ease;}
.reveal-sub{color:#a0c4ff;}
.reveal-cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:600px;perspective:800px;}
.reveal-card-wrap{animation:reveal-in 0.6s ease both;}
.reveal-card-wrap .poke-card{animation:pulse-glow 2s ease-in-out infinite;max-width:160px;}
.reveal-done-btn{animation:victory-title-in 0.5s ease 1s both;}

/* Victory */
.victory-screen{position:relative;justify-content:center;overflow:hidden;}
.victory-burst{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,211,42,0.15) 0%,transparent 70%);animation:pulse-glow 2s ease-in-out infinite;}
.victory-content{position:relative;z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;}
.victory-badge{font-size:4rem;animation:victory-pop 0.6s ease;}
.victory-title{font-size:1.6rem;color:#ffd32a;text-shadow:0 0 20px rgba(255,211,42,0.6);animation:victory-title-in 0.5s ease 0.3s both;}
.victory-sub{color:#a0c4ff;animation:victory-title-in 0.5s ease 0.5s both;}
.victory-stars{font-size:1.5rem;animation:victory-title-in 0.5s ease 0.7s both;}
.victory-badges{color:rgba(255,255,255,0.6);font-size:0.85rem;animation:victory-title-in 0.5s ease 0.9s both;}
.anim-victory-btn{animation:victory-title-in 0.5s ease 1.1s both;}
.confetti-container{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1;}
.confetti-piece{position:absolute;top:-10px;width:8px;height:8px;border-radius:2px;animation:confetti-fall linear forwards;}
</style>
<style>
/* Rules */
.rules-screen{max-width:600px;margin:0 auto;}
.rules-box{background:rgba(255,255,255,0.05);border-radius:14px;padding:16px;width:100%;border:1px solid rgba(255,255,255,0.1);}
.rule-section{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.06);}
.rule-section:last-child{border-bottom:none;}
.rule-icon{font-size:1.3rem;min-width:36px;text-align:center;}
.rule-text{font-size:0.82rem;line-height:1.5;color:rgba(255,255,255,0.85);}
.rule-text strong{color:#fff;}

/* Responsive */
@media(orientation:landscape){
  .card-grid{grid-template-columns:repeat(auto-fill,minmax(140px,180px));justify-content:center;max-width:100%;}
  .screen{padding-top:46px;padding-bottom:16px;min-height:auto;}
  .battle-arena{flex-direction:row;}
  .battle-center{flex-direction:row;gap:3%;}
  .active-card{width:30%;}
  .bench{width:8%;}
}
@media(orientation:landscape) and (max-height:500px){
  .card-grid{grid-template-columns:repeat(auto-fill,minmax(90px,120px));gap:6px;}
  .btn{padding:8px 16px;font-size:0.9rem;}
  .gym-type-list{flex-direction:row;flex-wrap:wrap;}
  .gym-type-group{flex:1;min-width:180px;}
}
@media(max-width:500px) and (orientation:portrait){
  .card-grid{grid-template-columns:repeat(2,1fr);}
  .battle-arena{flex-direction:row;}
  .battle-center{flex-direction:row;gap:2%;}
  .active-card{width:38%;}
  .bench{width:12%;}
}

/* Modal */
.hidden{display:none!important;}
.card-modal{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);}
.card-modal-inner{display:flex;flex-direction:column;align-items:center;gap:16px;max-width:360px;width:100%;animation:reveal-in 0.3s ease;}
.modal-card{background:#1e2a3a;border-radius:14px;overflow:hidden;width:100%;box-shadow:0 8px 40px rgba(0,0,0,0.6);}
.modal-card-img{width:100%;aspect-ratio:600/825;object-fit:contain;display:block;background:#111;}
.modal-card-ph{width:100%;aspect-ratio:600/825;display:flex;align-items:center;justify-content:center;font-size:4rem;color:rgba(255,255,255,0.3);}
.modal-card-details{padding:14px;text-align:center;}
.modal-card-details h3{font-size:1.2rem;margin-bottom:6px;}
.modal-card-details p{font-size:0.85rem;color:rgba(255,255,255,0.7);margin:3px 0;}
.modal-card-details strong{color:#fff;}
</style>
</body>
</html>
