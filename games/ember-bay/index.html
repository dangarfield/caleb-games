<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Ember Bay - Garfield Boys' Arcade</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@24,500,1,0&amp;display=block">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
html,body{margin:0;height:100%;background:#111214;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
input{-webkit-user-select:auto}
a{color:#f2f1ec}a:hover{color:#e5e043}input[type=range]{accent-color:#e5e043}
img,a,canvas{-webkit-user-drag:none}
#wrap{position:fixed;inset:0;background:#111214;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1333px;height:690px;transform:translate(-50%,-50%);overflow:hidden;background:#1c1d1f;font-family:Archivo,sans-serif;color:#f2f1ec}
#city,#mg{position:absolute;inset:0}
#mg{display:none}
#ui{display:contents}
#back{position:absolute;top:28px;left:28px;z-index:50;height:60px;padding:0 20px 0 12px;border-radius:10px;background:#2c2d30;color:#f2f1ec;display:flex;align-items:center;gap:6px;font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.04em;box-sizing:border-box;text-decoration:none}
.ms{font-family:'Material Symbols Sharp';font-size:28px;line-height:1}
</style>
<script>document.addEventListener('contextmenu', function (e) { e.preventDefault(); });</script>
<script src="js/arcade-store.js"></script>
<script data-arcade-back>
/* arcade-back v1 (knowledge/arcade-back.md). "← Games" = the browser's back button.
   Any link whose href is exactly ../../index.html goes BACK in history when this page was opened
   from the arcade home, so home comes back as it was left (scroll position, no reload).
   Opened any other way (bookmark, direct URL, dev tool), the link just navigates as normal. */
(function () {
  document.addEventListener('click', function (e) {
    if (e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (!a || a.getAttribute('href') !== '../../index.html') return;
    var home = new URL(a.href), ref;
    try { ref = new URL(document.referrer); } catch (err) { return; }
    var dir = home.pathname.replace(/index\.html$/, '');
    if (ref.origin !== home.origin || (ref.pathname !== home.pathname && ref.pathname !== dir) || history.length < 2) return;
    e.preventDefault();
    var go = function () { location.href = home.href; };
    // Still on this page after going back (an in-game history entry) or nothing happened: go home directly.
    addEventListener('popstate', go, { once: true });
    var t = setTimeout(go, 2500);
    addEventListener('pagehide', function () { clearTimeout(t); }, { once: true });
    history.back();
  });
})();
</script>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div id="city"></div>
    <div id="mg"></div>
    <div id="ui"></div>
    <a id="back" href="../../index.html"><span class="ms">arrow_back</span>Games</a>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
