<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Bomb Squad - Garfield Boys' Arcade</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #0a0a2e;
  overflow: hidden;
  touch-action: none;
  font-family: 'Segoe UI', system-ui, sans-serif;
  color: #fff;
}
#backBtn {
  position: fixed; top: 12px; left: 12px; z-index: 9999;
  background: rgba(0,0,0,0.55); color: #fff; text-decoration: none;
  padding: 6px 18px; border-radius: 20px;
  font: bold 15px/1.4 'Segoe UI', system-ui, sans-serif;
  border: 1px solid rgba(255,255,255,0.18);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  transition: background 0.2s;
}
#backBtn:hover { background: rgba(0,0,0,0.75); }
#game-container {
  width: 100vw; height: 100vh;
  position: relative;
}
canvas { display: block; }
#overlay {
  position: fixed; inset: 0; z-index: 20;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(0,0,0,0.7); color: #fff; text-align: center;
}
#overlay.hidden { display: none !important; }
#overlay h1 {
  font-size: clamp(2rem, 8vw, 4rem);
  margin-bottom: 0.5rem;
  text-shadow: 0 0 30px rgba(231,76,60,0.6);
}
#overlay .sub {
  font-size: clamp(1rem, 3vw, 1.4rem);
  color: #a0c4ff; margin-bottom: 1.5rem;
}
#overlay .info {
  font-size: clamp(0.85rem, 2.5vw, 1.1rem);
  color: rgba(255,255,255,0.7);
  margin-bottom: 2rem; max-width: 500px;
  padding: 0 1rem; line-height: 1.5;
}
#overlay button {
  padding: 14px 40px; font-size: 1.3rem;
  border: none; border-radius: 12px;
  background: linear-gradient(135deg, #e74c3c, #c0392b);
  color: #fff; cursor: pointer; font-weight: 700;
  box-shadow: 0 4px 20px rgba(231,76,60,0.4);
  transition: transform 0.15s;
}
#overlay button:hover { transform: scale(1.05); }
#overlay button:active { transform: scale(0.95); }
#hud {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none; z-index: 10;
}
#hud.hidden { display: none !important; }
#timer-bar {
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.4); border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.1);
  padding: 8px 24px; display: flex; align-items: center; gap: 12px;
}
#timer-text {
  font: bold 24px 'Segoe UI', system-ui, sans-serif;
  min-width: 60px; text-align: center;
}
#level-info {
  font: bold 14px 'Segoe UI', system-ui, sans-serif;
  color: rgba(255,255,255,0.7);
}
#instruction-panel {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 10px;
  pointer-events: none;
}
.instruction-step {
  background: rgba(0,0,0,0.7); border-radius: 12px;
  padding: 12px 16px; display: flex; align-items: center; gap: 12px;
  border: 2px solid rgba(255,255,255,0.2);
  transition: all 0.3s;
  min-width: 180px;
}
.instruction-step.active {
  border-color: #ffd32a;
  background: rgba(255,211,42,0.2);
  transform: scale(1.1);
  box-shadow: 0 0 20px rgba(255,211,42,0.4);
}
.instruction-step.done {
  border-color: #2ecc71;
  background: rgba(46,204,113,0.2);
  opacity: 0.7;
}
.step-icon {
  width: 42px; height: 42px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
  border: 2px solid rgba(255,255,255,0.3);
}
.step-label {
  font: bold 15px 'Segoe UI', system-ui, sans-serif;
  color: #fff;
  text-shadow: 0 1px 3px rgba(0,0,0,0.5);
}
.step-tick {
  margin-left: auto; font-size: 22px; color: #2ecc71;
  display: none;
}
.instruction-step.done .step-tick { display: block; }
.player-btn {
  padding: 18px 32px; border: none; border-radius: 14px;
  background: linear-gradient(135deg, #e74c3c, #c0392b); color: #fff;
  cursor: pointer; text-align: center;
  box-shadow: 0 4px 16px rgba(231,76,60,0.4); transition: transform 0.15s;
}
.player-btn:hover { transform: scale(1.05); }
.player-btn:active { transform: scale(0.95); }
.player-btn-name { font: bold 1.3rem sans-serif; }
.player-btn-info { font: 11px sans-serif; opacity: 0.8; margin-top: 4px; }

#level-select-screen {
  position: fixed; inset: 0; z-index: 25;
  background: rgba(5,5,5,0.95); color: #fff;
  display: flex; flex-direction: column; align-items: center;
  padding: 20px; overflow-y: auto;
}
#level-select-screen.hidden { display: none !important; }
#switch-player-btn {
  position: absolute; top: 14px; right: 14px;
  padding: 8px 18px; border: none; border-radius: 8px;
  background: rgba(255,255,255,0.12); color: #fff;
  font: bold 13px sans-serif; cursor: pointer;
  border: 1px solid rgba(255,255,255,0.2);
  transition: background 0.2s;
}
#switch-player-btn:hover { background: rgba(255,255,255,0.2); }
#ls-header { text-align: center; margin: 10px 0 20px; }
#ls-player-name { font: bold 1.6rem sans-serif; color: #ffd32a; }
#ls-player-title { font: 1rem sans-serif; color: #a0c4ff; margin-top: 4px; }
#level-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
  gap: 10px; width: 100%; max-width: 900px;
}
.level-btn {
  aspect-ratio: 1; border: none; border-radius: 12px;
  font: bold 22px sans-serif; cursor: pointer; transition: transform 0.1s;
  color: #fff; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
}
.level-btn.unlocked {
  background: linear-gradient(135deg, #6c5ce7, #a29bfe);
  box-shadow: 0 3px 12px rgba(108,92,231,0.3);
}
.level-btn.locked {
  background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.25);
  cursor: not-allowed;
}
.level-btn.unlocked:hover { transform: scale(1.08); }
.level-btn .level-title {
  font-size: 8px; opacity: 0.7; text-align: center;
  max-width: 100%; overflow: hidden; white-space: nowrap;
}
#game-over-overlay {
  position: fixed; inset: 0; z-index: 30;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(0,0,0,0.8); text-align: center;
}
#game-over-overlay.hidden { display: none !important; }
#game-over-overlay h2 {
  font-size: clamp(2rem, 7vw, 3.5rem);
  margin-bottom: 1rem;
}
#game-over-overlay .result-text {
  font-size: 1.2rem; color: #a0c4ff;
  margin-bottom: 2rem;
}
#game-over-overlay button {
  padding: 14px 40px; font-size: 1.3rem;
  border: none; border-radius: 12px;
  background: linear-gradient(135deg, #6c5ce7, #a29bfe);
  color: #fff; cursor: pointer; font-weight: 700;
  box-shadow: 0 4px 20px rgba(108,92,231,0.4);
  transition: transform 0.15s;
}
#game-over-overlay button:hover { transform: scale(1.05); }
#game-over-overlay button:active { transform: scale(0.95); }
</style>
</head>
<body>
<a id="backBtn" href="../../index.html">&larr; Games</a>
<div id="game-container"></div>

<div id="hud" class="hidden">
  <div id="timer-bar">
    <span id="level-info">Level 1 - Round 1/5</span>
    <span id="timer-text">10.0</span>
  </div>
  <div id="instruction-panel"></div>
</div>

<div id="overlay">
  <h1>&#x1F4A3; Bomb Squad</h1>
  <div class="sub">Defuse the bomb before it blows!</div>
  <div class="info">Find and tap the correct components in order. Wrong tap = boom!</div>
  <div id="player-select" style="display:flex; gap:16px; margin-top:12px;">
    <button class="player-btn" data-player="Caleb">
      <div class="player-btn-name">Caleb</div>
      <div class="player-btn-info" id="caleb-info"></div>
    </button>
    <button class="player-btn" data-player="Ezra">
      <div class="player-btn-name">Ezra</div>
      <div class="player-btn-info" id="ezra-info"></div>
    </button>
  </div>
</div>

<div id="level-select-screen" class="hidden">
  <button id="switch-player-btn">Switch Player</button>
  <div id="ls-header">
    <div id="ls-player-name"></div>
    <div id="ls-player-title"></div>
  </div>
  <div id="level-grid"></div>
</div>

<div id="game-over-overlay" class="hidden">
  <h2 id="game-over-title">BOOM!</h2>
  <div class="result-text" id="game-over-text">Round failed - restarting level</div>
  <button id="retryBtn">Try Again</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
  }
}
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
